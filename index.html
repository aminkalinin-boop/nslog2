ная ставка + ожидаемая инфляция (уравнение Фишера).","Если реальная ставка 4 %, а ожидаемая инфляция 8 %, номинальная ≈ 12 %.","Номинальные процентные ставки включают инфляционную премию."],"Инфляционные ожидания":["Чего люди и фирмы ждут от будущих цен.","Инфляционные ожидания влияют на зарплаты, цены и сбережения; Банк России регулярно их измеряет.","Если все ждут роста цен, покупки делаются заранее и цены растут.","Высокие инфляционные ожидания снижают эффективность денежно-кредитной политики."],"Инфляционный разрыв":["Спрос превышает то, что экономика может произвести при полной занятости.","Инфляционный разрыв ведёт к росту цен; требует сдерживающей политики.","При перегреве экономики фирмы не успевают наращивать выпуск и повышают цены.","Наличие инфляционного разрыва обусловило ужесточение денежно-кредитной политики."],"Инфляция":["Рост цен в экономике в целом.","Измеряется ИПЦ; цель Банка России — около 4 %. Высокая инфляция снижает реальные доходы и инвестиции.","Инфляция 7 % — то, что стоило 100 руб., стоит 107.","Ускорение инфляции снизило реальные располагаемые доходы населения."],"Инфляция издержек":["Цены растут из-за подорожания ресурсов и зарплат.","Инфляция издержек: рост цен на энергию, сырьё, логистику передаётся в цены готовой продукции.","Рост тарифов на электроэнергию повышает цены пиломатериалов.","Рост издержек производства выступил фактором инфляции предложения."],"Инфляция спроса":["Цены растут, потому что спрос обгоняет производство.","Инфляция спроса возникает при избыточных деньгах и расходах.","Бум льготной ипотеки поднял цены на стройматериалы.","Стимулирование спроса без роста предложения обусловило инфляцию спроса."],"Информационные технологии":["Технологии передачи и обработки информации.","ИТ повышают производительность; цифровизация — направление 13.11 паспорта 5.2.3 (мониторинг в условиях цифровых технологий).","Электронный учёт древесины в ЛесЕГАИС — применение ИТ.","Цифровизация учета древесины повышает прозрачность рынка лесоматериалов."],"Инфраструктура":["Дороги, сети, мосты — то, что нужно всем для работы экономики.","Инфраструктура создаёт условия для бизнеса; часто финансируется государством или через ГЧП. Для ЛПК критичны лесные дороги.","Строительство лесовозной дороги открывает доступ к новым участкам.","Недостаточное развитие лесной транспортной инфраструктуры ограничивает освоение расчетной лесосеки."],"Ипотечный долговой кризис":["Кризис 2007–2008 гг. в США, когда массово перестали платить по ипотеке.","Переросл в мировой финансовый кризис; пример системного риска.","Падение цен на жильё сделало ипотечные бумаги неликвидными.","Ипотечный кризис 2007–2008 гг. перерос в глобальный финансовый кризис."],"Истощающие расходы":["Госрасходы на покупку товаров и услуг, которые напрямую используют ресурсы.","В отличие от трансфертов, «истощающие» расходы изымают ресурсы (закупки, зарплаты).","Закупка оборудования для больницы — истощающий расход.","Государственные закупки относятся к расходам, непосредственно использующим ресурсы экономики."],"Капитал":["Созданные людьми средства производства: здания, машины, оборудование.","Капитал как фактор производства (физический капитал); в статистике — основные фонды.","Лесовозы, станки и цеха ЦТАО — капитал.","Состояние основного капитала определяет производственный потенциал организации."],"Капитализм":["Система, где ресурсы в частной собственности, а решения принимают рынок и цены.","Рыночная экономика с частной собственностью, конкуренцией и свободой предпринимательства.","Россия с 1990-х перешла от плановой экономики к рыночной.","Переход к рыночной экономике изменил условия функционирования производственного сектора УИС."],"Капиталоемкий товар":["Товар, для производства которого нужно много оборудования.","Страны с большим капиталом имеют преимущество в капиталоёмких товарах.","Целлюлоза и картон — капиталоёмкая продукция.","Капиталоемкость глубокой переработки древесины ограничивает ее развитие без внешнего инвестирования."],"Капитальные активы":["Весь накопленный в стране капитал.","В России — основные фонды по полной учётной стоимости (Росстат); их износ — индикатор экономической безопасности.","Стоимость всех основных фондов обработки древесины в регионе.","Состояние основных фондов отрасли характеризуется высокой степенью износа."],"Карта кривых безразличия":["Набор кривых, каждая показывает одинаковое удовлетворение от разных наборов товаров.","Инструмент теории потребительского выбора; оптимум — касание бюджетной линии и кривой безразличия.","Покупатель одинаково доволен набором «2 кг мяса + 5 кг хлеба» и «3 кг мяса + 3 кг хлеба».","Оптимальный выбор потребителя достигается в точке касания бюджетной линии и кривой безразличия."],"Картель":["Сговор фирм о ценах или разделе рынка.","Картели запрещены ст. 11 135-ФЗ; за них предусмотрена ответственность по ст. 178 УК РФ.","Сговор участников торгов о поочерёдной «победе» — картель.","Картельные соглашения на торгах ограничивают конкуренцию и повышают цены контрактов."],"Кассовая наличность":["Наличные деньги в сейфах и кассах банка.","Часть банковских резервов; обеспечивает выдачу наличных клиентам.","Наличные в банкоматах и кассе отделения — кассовая наличность.","Кассовая наличность банков входит в состав их ликвидных активов."],"Квазигосударственный банк":["Банк, формально частный, но контролируемый государством.","В США так называют федеральные резервные банки. В России государственное участие имеют крупнейшие банки.","Банки с контрольным участием государства — российская параллель.","Банки с государственным участием занимают ведущие позиции в банковском секторе."],"Квазиобщественное, квазигосударственное благо":["Благо, которое могло бы продаваться на рынке, но его выгоднее обеспечивать государству.","Квазиобщественные блага (образование, здравоохранение, дороги) создают положительные внешние эффекты, поэтому частично финансируются бюджетом.","Платную дорогу можно построить частно, но обычно её строит государство для всех.","Квазиобщественные блага предоставляются с участием государства ввиду значительных положительных внешних эффектов."],"Кейнсианство":["Взгляды Дж. М. Кейнса: государство должно поддерживать спрос в кризис.","Кейнсианство обосновывает активную фискальную политику для борьбы с безработицей и спадом.","Во время кризиса государство увеличивает расходы на инфраструктуру, чтобы поддержать занятость.","В соответствии с кейнсианским подходом государственные расходы рассматриваются как инструмент стабилизации спроса."],"Классическая экономическая теория":["Старая теория: рынок сам быстро приходит к полной занятости.","Классики считали цены и зарплаты гибкими, а вмешательство государства излишним. Критикована Кейнсом после Великой депрессии.","Классик сказал бы: при безработице зарплаты снизятся, и работу найдут все.","Классическая теория исходит из гибкости цен и саморегулирования рынков."],"Количественная полезность":["Полезность, которую можно измерить числами.","Кардиналистский подход (устаревший); в современной теории используется порядковая полезность — ранжирование предпочтений.","«Этот обед даёт мне 10 единиц удовольствия» — количественная оценка.","Кардиналистский подход предполагает количественную измеримость полезности."],"Коллективный голос":["Профсоюз выражает мнение работников перед работодателем.","Коллективный голос позволяет решать проблемы без увольнений, снижает текучесть кадров.","Профсоюз добивается улучшения условий в цеху вместо массовых увольнений по собственному желанию.","Механизм коллективного голоса снижает текучесть кадров."],"Командная система":["Экономика, где государство владеет ресурсами и само планирует, что производить.","Плановая (командно-административная) система СССР; неэффективна из-за отсутствия ценовых сигналов.","В СССР объём выпуска мебели определялся государственным планом.","Переход от командной системы к рыночной обусловил трансформацию производственного сектора УИС."],"Комбинация ресурсов, обеспечивающая максимальную прибыль":["Сочетание ресурсов, при котором прибыль наибольшая.","Каждый ресурс используется, пока его предельный доход равен цене ресурса.","Лесопилка нанимает рабочих, пока доход от продукции последнего выше его зарплаты.","Оптимальное сочетание ресурсов определяется равенством предельного дохода и цены ресурса."],"Комбинация ресурсов, обеспечивающая наименьшие издержки":["Сочетание ресурсов, при котором заданный объём выпускается дешевле всего.","Правило минимизации издержек: предельный продукт на рубль затрат одинаков для всех ресурсов.","Замена ручного труда станком, если он даёт больше продукции на рубль затрат.","Выбор технологии осуществляется по критерию минимизации совокупных издержек."],"Коммерческий банк":["Банк, который принимает вклады и выдаёт кредиты.","В России — кредитная организация с лицензией Банка России (395-1 «О банках и банковской деятельности»).","Учреждение получает кредит на оборотные средства в коммерческом банке.","Коммерческие банки выступают основным источником заемного финансирования предприятий."],"Компания с ограниченной ответственностью":["Компания, владельцы которой рискуют только своими вкладами.","В России — ООО (14-ФЗ): участники не отвечают по долгам общества личным имуществом.","Если ООО обанкротится, участники теряют только вклад в уставный капитал.","Общество с ограниченной ответственностью является наиболее распространенной формой малого бизнеса."],"Компромисс":["Чтобы получить одно, приходится отказаться от другого.","Компромисс (trade-off) — основа экономического выбора при ограниченных ресурсах.","Больше средств на зарплату — меньше на обновление оборудования.","Распределение ограниченных ресурсов требует компромисса между текущими и инвестиционными расходами."],"Компромисс между равенством и эффективностью":["Больше равенства в доходах может снижать стимулы и эффективность.","Перераспределение через налоги уменьшает неравенство, но может ослаблять стимулы к труду и инвестициям (А. Оукен, «дырявое ведро»).","Высокие налоги на доходы снижают неравенство, но уменьшают стимулы к предпринимательству.","Социальная политика учитывает компромисс между равенством и эффективностью."],"Конгломератное слияние":["Объединение фирм из совершенно разных отраслей.","Конгломератное слияние диверсифицирует бизнес, но редко даёт синергию.","Нефтяная компания покупает сеть отелей.","Конгломератные слияния направлены преимущественно на диверсификацию рисков."],"Конгломераты":["Компании, работающие сразу в нескольких не связанных отраслях.","Конгломерат снижает зависимость от одной отрасли; в России — многоотраслевые холдинги.","Холдинг объединяет лесопереработку, агробизнес и девелопмент.","Многоотраслевые холдинги диверсифицируют риски за счет деятельности в различных отраслях."],"Конечные продукты и услуги":["Товары и услуги, купленные для окончательного использования, а не для переработки.","Только конечные товары включаются в ВВП, чтобы избежать двойного счёта.","Мебель, купленная семьёй, — конечный товар; доски, купленные мебельной фабрикой, — промежуточный.","При расчете ВВП учитываются только конечные товары и услуги."],"Конкурентный рынок труда":["Рынок труда, где много работодателей и работников и никто не диктует зарплату.","Зарплата устанавливается на уровне равновесия спроса и предложения труда.","В крупном городе много компаний конкурируют за программистов.","На конкурентном рынке труда заработная плата определяется соотношением спроса и предложения."],"Конкуренция":["Соперничество многих продавцов и покупателей.","Конкуренция стимулирует эффективность и снижение цен; защищается антимонопольным законодательством (135-ФЗ).","На рынке пиломатериалов региона работает 40 предприятий — высокая конкуренция.","Уровень конкуренции на рынке оценивается показателями концентрации."],"Конфликты из-за бриллиантов":["Алмазы, выручка от продажи которых финансирует вооружённые конфликты.","Для борьбы создан Кимберлийский процесс — система сертификации происхождения алмазов.","Сертификат Кимберлийского процесса подтверждает «бесконфликтное» происхождение.","Международная сертификация происхождения сырья снижает риски финансирования конфликтов."],"Концепция паритета":["Идея, что фермер должен покупать на свой урожай столько же, сколько в «хорошие» годы.","Обоснование ценовой поддержки аграриев в США. В России родственная тема — диспаритет цен.","Если на тонну зерна можно купить всё меньше топлива, «паритет» нарушен.","Концепция паритета цен используется для обоснования поддержки сельхозпроизводителей."],"Корпорация":["Юридическое лицо, принадлежащее акционерам.","В России аналог — акционерное общество (208-ФЗ): ограниченная ответственность, передаваемые доли, возможность привлекать капитал.","Лесопромышленный холдинг в форме ПАО.","Акционерная форма позволяет привлекать капитал на фондовом рынке."],"Корреляция":["Показатели меняются вместе — один растёт, и другой растёт (или падает).","Корреляция показывает силу и направление линейной связи (коэффициент от −1 до +1), но не доказывает причинность.","Высокая корреляция инвестиций и ВРП не означает, что одно вызывает другое.","Выявлена положительная корреляционная связь между показателями (r = 0,72)."],"Коррупция":["Использование власти ради личной выгоды.","Коррупция — угроза экономической безопасности (п. 13.13 паспорта 5.2.3); противодействие — 273-ФЗ «О противодействии коррупции».","Откат за победу в торгах — коррупция.","Противодействие коррупции в сфере закупок рассматривается как направление обеспечения экономической безопасности."],"«Косвенное» производство":["Сначала создают средства производства, а потом с их помощью производят больше товаров.","«Окольное» производство (Бём-Баверк) требует отказа от потребления сегодня ради роста в будущем.","Сначала строят сушильную камеру, потом выпускают больше качественного пиломатериала.","Инвестиции в средства производства обеспечивают рост будущего выпуска."],"Косвенные налоги на бизнес":["Налоги, которые фирмы включают в цены: НДС, акцизы, налог на имущество.","В СНС — налоги на производство и импорт; часть ВВП по доходам.","НДС в цене мебели — косвенный налог.","Косвенные налоги увеличивают конечную цену продукции."],"Коэффициент воспроизводства населения":["Уровень рождаемости, при котором население не сокращается.","Около 2,1 ребёнка на женщину в развитых странах. В России суммарный коэффициент рождаемости ниже уровня воспроизводства.","При 1,4 ребёнка на женщину население без миграции сокращается.","Суммарный коэффициент рождаемости ниже уровня простого воспроизводства населения."],"Коэффициент дискриминации":["Сколько работодатель «готов потерять», чтобы не нанимать нелюбимую группу.","Модель Г. Беккера: дискриминация обходится самому дискриминирующему.","Отказ от эффективного работника из-за предубеждений снижает прибыль.","Дискриминация на рынке труда снижает эффективность использования трудовых ресурсов."],"Коэффициент общей фертильности":["Сколько детей в среднем родит женщина за жизнь.","Суммарный коэффициент рождаемости; ключевой показатель демографии, публикуется Росстатом.","СКР 1,4 — в среднем 1,4 ребёнка на женщину.","Суммарный коэффициент рождаемости в регионе составил 1,4 (данные условные)."],"Коэффициент эластичности":["Число, показывающее, на сколько процентов меняется спрос при изменении цены на 1 %.","Эластичность > 1 — спрос эластичный, < 1 — неэластичный.","Цена выросла на 10 %, продажи упали на 20 % — эластичность 2.","Коэффициент ценовой эластичности спроса составил −1,4."],"Коэффициент юнионизации":["Доля работников в профсоюзах.","Показатель силы профсоюзного движения; в экономике труда связан с уровнем зарплат.","Если из 100 работников 20 состоят в профсоюзе — уровень юнионизации 20 %.","Уровень юнионизации в отрасли снизился."],"Краткосрочная фермерская проблема":["Резкие колебания цен и доходов фермеров из года в год.","Причины: неэластичный спрос и зависимость от урожая. Обоснование страхования и стабилизации цен.","Хороший урожай обрушил цены — доходы фермеров упали.","Краткосрочная нестабильность доходов аграриев обусловлена низкой эластичностью спроса."],"Краткосрочное конкурентное равновесие":["Цена, при которой в краткосрочном периоде продаётся весь выпуск отрасли.","Фирмы могут получать прибыль или убытки, пока не изменятся мощности.","При высоком спросе лесопилки временно получают сверхприбыль.","В краткосрочном периоде рыночное равновесие допускает экономическую прибыль."],"Краткосрочный период":["Период, когда мощности фирмы не меняются.","В краткосрочном периоде часть издержек постоянна; менять можно только загрузку.","Лесопилка может добавить смену, но не построить новый цех за месяц.","В краткосрочном периоде организация варьирует лишь переменные ресурсы."],"Кредит":["Запись в учёте, уменьшающая актив или увеличивающая источник средств.","В двойной записи кредит — противоположность дебета; в платёжном балансе — приток валюты.","Экспортная выручка отражается по кредиту текущего счёта.","Экспортные операции отражаются по кредиту счета текущих операций."],"Кредитно-денежная политика":["Действия центрального банка по управлению деньгами и ставками.","В России — денежно-кредитная политика Банка России; основной инструмент — ключевая ставка, цель — инфляция около 4 %.","Повышение ключевой ставки удорожает кредиты и сдерживает инфляцию.","Ужесточение денежно-кредитной политики увеличило стоимость заемного финансирования."],"Кредитный потенциал банковской системы":["Сколько может выдать кредитов вся банковская система.","Зависит от избыточных резервов и денежного мультипликатора.","При избыточных резервах 1 млрд и мультипликаторе 5 система может создать до 5 млрд кредитов.","Кредитный потенциал банковской системы определяется величиной избыточных резервов."],"Кредитный потенциал отдельного коммерческого банка":["Сколько может выдать кредитов один банк — не больше своих избыточных резервов.","Один банк не может «умножить» деньги сам: выданные деньги уходят в другие банки.","Банк с избыточными резервами 100 млн может выдать до 100 млн кредитов.","Кредитный потенциал отдельного банка огранич ти 1000 поддонов или 200 столов, или комбинацию между ними.","Граница производственных возможностей иллюстрирует альтернативность использования ресурсов."],"Кривая спроса":["График: сколько купят при каждой цене.","Кривая спроса обычно убывает; сдвигается при изменении доходов, вкусов, цен других товаров.","При 12 тыс. руб. за м³ — 100 м³, при 10 тыс. — 130 м³.","Кривая спроса отражает обратную зависимость объема спроса от цены."],"Кривая спроса на инвестиции":["Сколько инвестиций будет при разных процентных ставках.","Спрос на инвестиции убывает с ростом ставки.","При ставке 20 % реализуются только самые доходные проекты.","Спрос на инвестиции находится в обратной зависимости от процентной ставки."],"Кривая спроса ни импорт":["Сколько товара страна захочет ввезти при разных мировых ценах.","Импортный спрос — превышение внутреннего спроса над внутренним производством.","Чем дешевле импортная мебель, тем больше её ввозят.","Импортный спрос формируется превышением внутреннего спроса над внутренним производством."],"Кривая текущего совокупного предложения":["В самом коротком периоде фирмы меняют объём, не меняя цен.","Горизонтальная кривая: цены «заморожены» прайсами и контрактами.","В течение месяца фирма отгружает больше по прежним ценам.","В краткосрочном периоде цены сохраняют жесткость вследствие контрактных обязательств."],"Кривая Филлипса":["Связь: ниже безработица — выше инфляция (в краткосрочном периоде).","Кривая Филлипса описывает краткосрочный компромисс; в долгосрочном периоде он исчезает.","Снижение безработицы с 5 до 3 % сопровождалось ростом инфляции.","Краткосрочная связь между безработицей и инфляцией описывается кривой Филлипса."],"Курс обмена валюты":["Сколько рублей стоит единица иностранной валюты.","Курс рубля устанавливается рынком; официальный курс публикует Банк России.","Если юань стоит 12 руб., экспортёр получает 12 руб. за каждый юань выручки.","Ослабление курса рубля повысило рублевую выручку экспортеров."],"Легальный иммигрант":["Человек, ары и услуги.","Крупнейший компонент ВВП по расходам. Росстат публикует расходы домашних хозяйств на конечное потребление.","Покупка продуктов, одежды, оплата услуг — потребительские расходы.","Сокращение потребительских расходов населения ограничивает внутренний спрос."],"Личные сбережения":["То, что остаётся у семьи после налогов и расходов.","Личные сбережения — источник инвестиций; норма сбережений зависит от доходов, ставок и уверенности.","Семья с доходом 100 тыс. тратит 85, сберегает 15.","Рост нормы сбережений домохозяйств обусловлен повышением процентных ставок."],"Личный доход":["Все доходы людей: зарплаты, пенсии, пособия, проценты.","Личный доход включает трудовые доходы и трансферты; после налогов — располагаемый доход.","Зарплата плюс пособие на ребёнка — личный доход семьи.","Структура денежных доходов населения характеризуется высокой долей социальных трансфертов."],"Личный подоходный налог":["Налог с доходов граждан.","В России — НДФЛ (гл. 23 НК РФ) с прогрессивной шкалой ставок.","С зарплаты 100 тыс. руб. удерживается 13 тыс. руб. НДФЛ.","Налог на доходы физических лиц является основным источником доходов региональных бюджетов."],"Ломаная кривая спроса":["Олигополист боится менять цену: снижение подхватят все, а повышение — никто.","Модель ломаной кривой спроса объясняет жёсткость цен в олигополии.","Крупный производитель плит держит цену, хотя издержки немного выросли.","Жесткость цен на олигополистическом рынке объясняется моделью ломаной кривой спроса."],"Макроэкономика":["Наука об экономике в целом: ВВП, инфляция, безработица.","Макроэкономика изучает агрегированные показатели и государственную политику; противопоставляется микроэкономике.","Изучение причин роста инфляции в России — макроэкономика.","Макроэкономическая нестабильность выступает внешней угрозой экономической безопасности организаций."],"Маржинальный анализ":["Сравнение дополнительной выгоды и дополнительных затрат при принятии решения.","Маржинальный анализ — основа экономических 47-ФЗ (естественные монополии).","Единственный поставщик тепла в посёлке — монополист.","Монопольное положение поставщика энергоресурсов повышает затраты учреждений."],"Монопсония":["Рынок, где покупатель один.","Монопсонист может занижать цену ресурса; классический пример — единственный работодатель в моногороде. Для ЦТАО аналогичная зависимость — единственный заказчик.","Единственный лесопромышленный комбинат в посёлке диктует зарплаты.","Зависимость от единственного покупателя формирует условия монопсонии и снижает переговорную силу производителя."],"Моральный аспект проблемы риска":["Застрахованные ведут себя рискованнее, раз убытки покроет кто-то другой.","Моральный риск возникает при асимметрии информации; снижается франшизой, контролем, разделением рисков.","Если убытки ГЧП-проекта гарантирует государство, частный партнёр меньше заботится об эффективности.","Распределение рисков в ГЧП-проекте должно снижать моральный риск частного партнера."],"Мотивационные схемы оплаты":["Оплата зависит от результатов работы.","Сдельная оплата, премии, бонусы повышают производительность; в УИС — оплата труда осуждённых по нормам выработки.","Рабочий получает за каждый изготовленный поддон.","Сдельная форма оплаты труда стимулирует рост выработки."],"Мультипликатор":["Во сколько раз изменение расходов увеличивает ВВП.","Мультипликатор = 1 / (1 − предельная склонность к потреблению): расходы одних становятся доходами других.","При мультипликаторе 2 рост инвестиций на 100 млрд увеличит ВВП на 200 млрд.","Мультипликативный эффект государственных инвестиций распространяется на смежные отрасли."],"Надбавка, учитывающая изменение прожиточного минимума":["Автоматическое повышение выплат вслед за ростом цен.","Индексация защищает реальные доходы от инфляции; в России — индексация пенсий и зарплат бюджетников.","Пенсии индексируются на уровень инфляции прошлого года.","Индексация социальных выплат направлена на сохранение реальных доходов населения."],"Наклон прямой":["Насколько круто тодатель.","В России — страховые взносы (гл. 34 НК РФ) на пенсионное, медицинское и социальное страхование.","С зарплаты 100 тыс. руб. работодатель платит около 30 тыс. взносов.","Страховые взносы увеличивают совокупные затраты работодателя на оплату труда."],"Налог с продаж":["Налог при покупке в магазине.","В США — налог с продаж штатов. В России его функцию выполняет НДС.","В американском магазине к цене добавляется налог штата.","Косвенное налогообложение потребления в России осуществляется посредством НДС."],"Налоги и трансфертные платежи как антистимулы":["Высокие налоги и щедрые пособия могут ослаблять желание работать и сберегать.","Проблема дизайна социальной политики: пособия, резко исчезающие при трудоустройстве, создают «ловушку бедности».","Если при выходе на работу семья теряет пособие, стимул работать снижается.","Конструкция социальных выплат должна минимизировать антистимулы к трудоустройству."],"Налоги на производство и импорт":["Налоги, связанные с производством и ввозом товаров.","Категория СНС: НДС, акцизы, пошлины, налоги на имущество; часть ВВП по доходам.","Таможенная пошлина на импортное оборудование — налог на импорт.","Чистые налоги на производство и импорт учитываются в составе ВВП по источникам доходов."],"Налоговая льгота":["Поддержка через снижение налогов, а не через выплаты.","Налоговые льготы и расходы — форма господдержки (налоговые расходы бюджета).","Освобождение учреждений УИС от налога на имущество — налоговая льгота.","Налоговые льготы выступают инструментом государственной поддержки отдельных категорий налогоплательщиков."],"Налоговая льгота на заработанный доход":["Американский вычет, который увеличивает доходы работающих бедных.","Поощряет трудоустройство малообеспеченных. В России близкая идея — социальный налоговый вычет.","Работающая семья с низким доходом получает возврат налога.","Налоговые вычеты используются как инструмент социальной поддержки."],"Нарицательная (номинальная) стоимость":["Стоимость, написанная на деньгах или ценной бумаге.","Номинал облигации — сумма, выплачиваемая при погашении; рыночная цена может отличаться.","Облигация номиналом 1000 руб. торгуется по 950 руб.","Облигации размещены по номинальной стоимости 1000 руб."],"Нарушения (сбои, несовершенства) рыночного механизма":["Рынок сам не обеспечивает эффективного результата.","Причины: внешние эффекты, общественные блага, монополия, асимметрия информации. Обоснование вмешательства государства.","Загрязнение от производства не учитывается в цене — провал рынка.","Провалы рынка обосновывают необходимость государственного регулирования."],"Научный метод":["Способ получения знаний: наблюдение, гипотеза, проверка, вывод.","Научный метод лежит в основе диссертации: гипотеза проверяется данными, результаты воспроизводимы.","Выдвинуть гипотезу о влиянии сбыта на безопасность и проверить её регрессией.","Исследование выполнено с использованием общенаучных и специальных методов."],"Национальная администрация кредитных союзов":["Американское ведомство, контролирующее кредитные союзы.","В России надзор за кредитными кооперативами осуществляет Банк России.","Кредитный кооператив отчитывается перед Банком России.","Надзор за деятельностью кредитных потребительских кооперативов осуществляет Банк России."],"Национальное управление по трудовым отношениям":["Американский орган по трудовым спорам и выборам профсоюзов.","В России трудовые споры рассматривают комиссии по трудовым спорам и суды; надзор — Роструд.","Роструд проверяет соблюдение трудовых прав.","Государственный надзор за соблюдением трудового законодательства осуществляет Роструд."],"Национальный банк":["Американский банк с федеральной лицензией.","В России все банки лицензирует Банк России.","Любой российский банк получает лицензию Банка России.","Лицензирование банковской деятельности осуществляется Банком России."],"Национальный доход":["Все доходы от производства в стране: зарплаты, прибыль, рента, проценты.","Национальный доход рассчитывается в СНС; показывает, как распределяется созданная стоимость.","Сумма зарплат, прибылей и процентов в экономике — национальный доход.","Национальный доход характеризует доходы факторов производства."],"Национальный закон о трудовых отношениях":["Закон США 1935 г., гарантировавший право на профсоюзы и коллективные переговоры.","Основа трудовых отношений в США. В России коллективные переговоры регулируются ТК РФ.","Работники имеют право создать профсоюз и заключить коллективный договор.","Коллективные договоры регулируют социально-трудовые отношения в организации."],"Не связанные с доходом факторы потребления и сбережений":["Всё, кроме дохода, что влияет на то, сколько люди тратят и сберегают.","Богатство, ожидания, ставки, долги, налоги сдвигают функцию потребления.","Рост цен на квартиры делает владельцев «богаче» и они больше тратят.","Ожидания домохозяйств влияют на склонность к сбережению независимо от текущих доходов."],"Невозвратные издержки":["Уже потраченные деньги, которые не вернуть.","Невозвратные издержки не должны влиять на решения о будущем — важно только то, что можно изменить.","Затраты на проект цеха уже сделаны; решение о строительстве принимается по будущим затратам и выгодам.","Невозвратные издержки не учитываются при оценке целесообразности продолжения проекта."],"Невозобновляемые природные ресурсы":["Ресурсы, которые не восстанавливаются: нефть, газ, руды.","Их истощение требует рационального темпа добычи и учёта интересов будущих поколений.","Каждая добытая тонна нефти уменьшает запасы навсегда.","Зависимость экономики от невозобновляемых ресурсов создает долгосрочные угрозы экономической безопасности."],"Негибкие цены":["Цены, которые долго не меняются.","Жёсткость цен (контракты, регулирование, издержки меню) объясняет влияние спроса на выпуск в краткосрочном периоде.","Цена в годовом контракте поставки не меняется при изменении рынка.","Жесткость цен в долгосрочных контрактах снижает гибкость реагирования на рыночные изменения."],"Недиверсифицируемый риск":["Риск, от которого нельзя уйти диверсификацией — риск всего рынка.","Систематический риск (кризисы, ставки) измеряется бетой и вознаграждается премией.","Во время кризиса падают почти все акции сразу.","Систематический риск не устраняется диверсификацией портфеля."],"Независимая переменная":["Переменная-причина, влияющая на другую.","В регрессии — объясняющая переменная (X).","Цена (X) влияет на объём продаж (Y).","В качестве независимых переменных модели приняты показатели износа, концентрации сбыта и кадрового обеспечения."],"Независимые профсоюзы":["Профсоюзы США вне крупнейшего объединения.","В России также существуют профсоюзы вне ФНПР (например, КТР).","Отраслевой профсоюз, не входящий в ФНПР.","Независимые профсоюзы представляют интересы отдельных профессиональных групп."],"Независимые товары":["Товары, цены и спрос на которые никак не связаны.","Перекрёстная эластичность близка к нулю.","Цена на хлеб не влияет на спрос на пиломатериалы.","Спрос на продукцию не зависит от цен товаров, не являющихся ни заменителями, ни дополнениями."],"Незапланированное изменение запасов":["Запасы выросли или уменьшились не по плану фирмы.","Незапланированный рост запасов — сигнал падения спроса; фирмы сокращают выпуск.","На складе копится непроданная мебель — спрос упал.","Незапланированный рост запасов готовой продукции свидетельствует о снижении спроса."],"Незапланированные инвестиции":["Разница между фактическими и запланированными инвестициями (в основном из-за запасов).","В кейнсианской модели — механизм приспособления выпуска к спросу.","Из-за падения продаж запасы выросли — это незапланированные инвестиции.","Рост незапланированных инвестиций в запасы предшествует сокращению производства."],"Неинвестиционная сделка":["Покупки, которые не создают новый капитал: акции, облигации, подержанные вещи.","Такие сделки меняют собственника, но не увеличивают капитал экономики; не входят в инвестиции ВВП.","Покупка акций на бирже не является инвестицией в смысле ВВП.","Финансовые операции с ранее выпущенными активами не учитываются в составе инвестиций."],"Неисключаемость":["Нельзя помешать тем, кто не платит, пользоваться благом.","Неисключаемость порождает проблему «безбилетника»; поэтому общественные блага финансирует государство.","Маяк светит всем кораблям, заплатили они или нет.","Неисключаемость общественных благ обусловливает их бюджетное финансирование."],"Неистощающие расходы":["Госрасходы, которые не покупают ресурсы: пенсии, пособия.","Трансферты перераспределяют доходы, а не создают спрос на ресурсы напрямую.","Выплата пенсии — неистощающий расход.","Социальные трансферты перераспределяют доходы без непосредственного использования ресурсов."],"Неконкурирующие группы":["Группы работников, которые не конкурируют друг с другом из-за разной квалификации.","Объясняет устойчивые различия в зарплатах профессий.","Врач и сварщик не конкурируют за одни рабочие места.","Сегментация рынка труда по квалификации обусловливает устойчивые различия в оплате труда."],"Нелегальный иммигрант":["Человек, живущий в стране без законного разрешения.","Нелегальная миграция создаёт теневую занятость и налоговые потери.","Работник без разрешения на работу трудится неофициально.","Нелегальная занятость мигрантов сокращает налоговую базу."],"Неограниченная ответственность":["Владелец отвечает по долгам фирмы всем личным имуществом.","Характерна для индивидуальных предпринимателей; повышает риск для владельца.","ИП отвечает по долгам бизнеса своей квартирой и машиной.","Неограниченная ответственность индивидуального предпринимателя повышает риски ведения бизнеса."],"Неоклассическая экономическая теория":["Теория: рынки быстро приспосабливаются, а неожиданности лишь временно отклоняют экономику.","Новая классическая школа (рациональные ожидания) скептична к активной стабилизационной политике.","Если люди ожидают инфляцию, стимулирование не повлияет на занятость.","Согласно новой классической теории, ожидаемая политика не влияет на реальные показатели."],"Неполное использование ресурсов":["Ресурсы используются не полностью или не по назначению.","Неполная занятость: работники трудятся ниже квалификации или неполное время; мощности простаивают.","Осуждённые-инженеры работают разнорабочими.","Неполное использование квалификации осужденных снижает эффективность их трудовой адаптации."],"Непредвиденная инфляция":["Цены выросли сильнее, чем ожидали.","Непредвиденная инфляция перераспределяет доходы: выигрывают должники, проигрывают кредиторы и получатели фиксированных доходов.","Фиксированная цена контракта теряет реальную стоимость при неожиданной инфляции.","Непредвиденная инфляция снизила реальную стоимость долгосрочных контрактов."],"Непредсказуемость законов Вселенной":["Взгляд, что результаты в жизни определяются случайностью, а не усилиями.","Противоположность экономическому взгляду на стимулы; такие установки снижают мотивацию к труду и инвестициям.","Если человек считает, что всё решает удача, он мало вкладывает в обучение.","Социально-психологические установки влияют на трудовую активность."],"Непроцентные параметры инвестиций":["Всё, кроме процентной ставки, что влияет на инвестиции.","Ожидания прибыли, налоги, технологии, издержки, загрузка мощностей сдвигают спрос на инвестиции.","Санкции и неопределённость снижают инвестиции даже при низких ставках.","Неопределенность внешнеэкономических условий сдерживает инвестиционную активность."],"Неравенство доходов":["Доходы распределены неравномерно.","Измеряется коэффициентом Джини и коэффициентом фондов (Росстат). Высокое неравенство — фактор социальной напряжённости.","Коэффициент Джини 0,40 указывает на значительное неравенство.","Неравенство доходов населения характеризуется коэффициентом Джини 0,40 (данные условные)."],"Неразменные бумажные деньги":["Деньги, которые ценны потому, что так установило государство.","Фидуциарные деньги не обеспечены золотом; их ценность держится на доверии и законе.","Рубль — фидуциарная валюта.","Современные деньги являются фидуциарными."],"Нераспределенные прибыли корпораций":["Прибыль, которую компания оставила себе, а не выплатила акционерам.","Нераспределённая прибыль — источник самофинансирования инвестиций.","Холдинг направляет 60 % прибыли на модернизацию вместо дивидендов.","Нераспределенная прибыль является основным источником финансирования инвестиций."],"Нереализованные ожидания":["Ожидания не сбылись.","Расхождение ожиданий и реальности ведёт к пересмотру планов, изменению запасов и выпуска.","Фирма ждала роста продаж, но спрос упал — запасы растут.","Несоответствие фактического спроса ожидаемому обусловило корректировку производственных планов."],"Несовершенная конкуренция":["Любой рынок, кроме совершенной конкуренции.","Включает монополию, олигополию, монополистическую конкуренцию; фирмы имеют рыночную власть.","Рынок плит с тремя крупными производителями — несовершенная конкуренция.","Региональный рынок характеризуется несовершенной конкуренцией."],"Несостоятельность в координации":["Люди не могут договориться о выгодном всем варианте.","Провал координации: каждый ждёт действий других. Решение — институты, ГЧП, программы.","Никто не строит лесную дорогу, хотя она нужна всем арендаторам.","Провал координации обосновывает участие государства в создании общей инфраструктуры."],"Нестрахуемый риск":["Риск, который невозможно застраховать.","Непредсказуемые события без статистики (изменения законов, войны) не страхуются.","Изменение экспортных правил нельзя застраховать.","Нестрахуемые риски требуют формирования внутренних резервов организации."],"Нетарифные барьеры":["Ограничения торговли, кроме пошлин: квоты, стандарты, лицензии.","Нетарифные барьеры — инструмент протекционизма; в ЕАЭС регулируются ЕЭК.","Требования фитосанитарного сертификата ограничивают экспорт древесины.","Нетарифные барьеры ограничивают доступ российской продукции на зарубежные рынки."],"Неценовая конкуренция":["Конкуренция качеством, рекламой, сервисом вместо цены.","Характерна для дифференцированных рынков; снижает ценовые войны.","Производитель мебели предлагает бесплатную доставку и сборку.","Неценовые методы конкуренции повышают лояльность покупателей."],"Неэластичное предложение":["Предложение слабо реагирует на цену.","Эластичность предложения < 1: производство трудно быстро нарастить (например, из-за мощностей).","Цены выросли на 20 %, а выпуск — только на 5 %.","Предложение продукции лесопиления неэластично в краткосрочном периоде."],"Неэластичный спрос":["Спрос слабо реагирует на цену.","Эластичность спроса < 1: повышение цены увеличивает выручку. Характерно для товаров первой необходимости.","Цена на хлеб выросла на 10 %, а покупки упали на 2 %.","Неэластичный спрос позволяет производителю перекладывать рост издержек на покупателей."],"Низкокачественные ипотечные кредиты":["Ипотека для ненадёжных заёмщиков под высокий процент.","Субстандартные кредиты стали причиной кризиса 2007–2008 гг.","Кредиты людям без подтверждённого дохода массово перестали возвращать.","Кредитование ненадежных заемщиков повышает системные риски финансового сектора."],"Низшая точка спада":["Самая низкая точка экономического спада.","Дно цикла, после которого начинается оживление.","Выпуск перестал падать и начал расти — пройдено дно.","Прохождение нижней точки спада обусловило восстановление деловой активности."],"Низший предел цены":["Минимальная цена, установленная государством выше рыночной.","Ведёт к излишкам; примеры — гарантированные закупочные цены, МРОТ.","Минимальная закупочная цена на зерно поддерживает доходы аграриев.","Установление минимальных цен приводит к формированию излишков продукции."],"НИОКР":["Научные исследования и опытно-конструкторские разработки.","НИОКР — источник инноваций; статистика Росстата «Затраты на исследования и разработки».","Разработка новой технологии сушки древесины — НИОКР.","Низкий уровень затрат на НИОКР ограничивает инновационное развитие отрасли."],"Нововведение":["Внедрение нового продукта, технологии или способа организации.","Инновация — практическое применение изобретения; направление 7 паспорта 5.2.3.","Запуск производства клееного бруса — нововведение.","Инновационная активность организаций отрасли остается низкой."],"Новое предприятие":["Молодая компания с новым продуктом.","Стартап — инновационный бизнес с высоким риском, финансируемый венчурным капиталом.","Команда запускает сервис для учёта древесины через смартфон.","Стартапы выступают источником инноваций в традиционных отраслях."],"Номинальная заработная плата":["Зарплата в рублях без учёта цен.","Номинальная зарплата; реальная учитывает инфляцию.","Зарплата выросла с 50 до 55 тыс. руб. — номинальный рост 10 %.","Номинальная заработная плата выросла на 10 %, реальная — на 2 %."],"Номинальная процентная ставка":["Процентная ставка без учёта инфляции.","Номинальная ставка ≈ реальная + ожидаемая инфляция.","Вклад под 16 % при инфляции 8 % даёт реальную доходность около 7,4 %.","Номинальная процентная ставка включает инфляционную премию."],"Номинальный валовой внутренний продукт":["ВВП в ценах того же года.","Номинальный ВВП растёт и из-за цен, и из-за объёмов; для реального роста его дефлируют.","ВВП вырос с 150 до 170 трлн руб. — номинальный рост.","Номинальный ВРП вырос преимущественно за счет ценового фактора."],"Номинальный доход":["Доход в деньгах без учёта инфляции.","Номинальный доход; для оценки благосостояния нужен реальный доход.","Доход вырос на 10 %, но инфляция 9 % — реальный рост около 1 %.","Реальный доход рассчитан путем корректировки номинального дохода на индекс потребительских цен."],"Норма выручки":["Сколько процентов в год приносит вложение.","Норма доходности = чистый доход / вложения; сравнивается со стоимостью капитала.","Вложили 10 млн, получаем 1,5 млн в год — 15 %.","Норма доходности проекта превышает средневзвешенную стоимость капитала."],"Нормальная прибыль":["Минимальная прибыль, чтобы владельцу было выгодно оставаться в бизнесе.","Нормальная прибыль = альтернативные издержки собственных ресурсов; входит в экономические издержки.","Если владелец мог бы заработать 1 млн в другом месте, нормальная прибыль — 1 млн.","Экономическая прибыль определяется превышением выручки над издержками с учетом нормальной прибыли."],"Нормальный товар":["Товар, который покупают больше при росте доходов.","Эластичность спроса по доходу положительна; большинство товаров нормальные.","С ростом доходов люди покупают больше мебели.","Спрос на продукцию деревообработки положительно реагирует на рост доходов населения."],"Нормативная экономика":["Часть экономики с оценками «как должно быть».","Нормативные суждения («нужно поддержать отрасль») отличаются от позитивных («субсидия увеличила выпуск на 10 %»).","«Государство должно поддержать ЛПК» — нормативное утверждение.","Разграничение позитивного и нормативного анализа обеспечивает объективность исследования."],"Обесценение доллара":["Доллар дешевеет относительно других валют.","Обесценение валюты удешевляет экспорт страны и удорожает импорт.","За доллар дают меньше рублей — доллар обесценился относительно рубля.","Обесценение национальной валюты повышает ценовую конкурентоспособность экспорта."],"Облигация":["Долговая бумага: заёмщик обещает вернуть долг и платить проценты.","В России — корпоративные облигации, ОФЗ, региональные облигации; регулируются 39-ФЗ.","Компания выпускает облигации на 1 млрд руб. под 14 % на три года.","Облигационные займы выступают инструментом долгосрочного финансирования."],"Обменный курс с управляемыми колебаниями":["Курс формирует рынок, но центральный банк иногда вмешивается.","Управляемое плавание — промежуточный режим между фиксированным и свободным курсом.","Центральный банк сглаживает резкие скачки курса.","Режим управляемого плавания сочетает рыночное курсообразование и интервенции."],"Обобщение":["Общий вывод из многих фактов.","Обобщение — этап научного исследования; обоснованное обобщение требует представительной выборки.","По данным 31 учреждения сделан вывод о тенденции в отрасли.","Обобщение результатов анализа позволило выявить устойчивые закономерности."],"Обратная дискриминация":["Преимущества одной группы воспринимаются как дискриминация другой.","Дискуссионное понятие в экономике труда (квоты при найме).","Квоты для одной группы уменьшают шансы других.","Политика квотирования порождает дискуссию об обратной дискриминации."],"Обратная зависимость":["Когда один показатель растёт, другой падает.","Отрицательная связь; коэффициент корреляции меньше нуля.","Чем выше цена, тем меньше спрос.","Между концентрацией сбыта и уровнем безопасности выявлена обратная зависимость."],"Обратный поток":["Мигранты возвращаются на родину.","Обратная миграция возвращает накопленный опыт и капитал в страну происхождения.","Специалисты возвращаются из-за рубежа с опытом работы.","Обратная миграция способствует переносу знаний и технологий."],"Обучение в ходе действия":["Опыт делает работу быстрее и дешевле.","Кривая обучения: по мере накопления опыта удельные издержки снижаются.","Бригада выпускает поддоны быстрее через полгода работы.","Эффект обучения снижает трудоемкость производства."],"Общественное (социальное) благо (товар)":["Благо, которым пользуются все одновременно и от которого нельзя отгородить.","Общественные блага (оборона, правопорядок) неисключаемы и неконкурентны; их финансирует государство.","Национальная оборона защищает всех граждан одинаково.","Общественные блага финансируются за счет бюджетных средств."],"Общественные инвестиции":["Вложения государства в дороги, школы, больницы.","Государственные инвестиции создают инфраструктуру и стимулируют частные вложения.","Строительство дороги к лесному району — общественная инвестиция.","Государственные инвестиции в инфраструктуру повышают инвестиционную привлекательность региона."],"Объединенный экономический комитет":["Экономический комитет Конгресса США.","Анализирует экономическую политику. В России эту роль выполняют профильные комитеты Государственной Думы.","Комитет по бюджету рассматривает проект закона о бюджете.","Экономическая политика обсуждается в профильных комитетах законодательного органа."],"Объем продукции страны":["Весь выпуск страны за год.","Совпадает с ВВП; измеряется в текущих и сопоставимых ценах.","Объём выпуска экономики вырос на 3 %.","Объем выпуска национальной экономики в сопоставимых ценах увеличился."],"Обязательные резервы":["Резервы, которые банк обязан держать по закону.","В России — обязательные резервы в Банке России; норматив — инструмент денежно-кредитной политики.","При нормативе 4,5 % банк с депозитами 100 млрд хранит 4,5 млрд в резервах.","Норматив обязательных резервов устанавливается Банком России."],"Ограниченная ответственность":["Владелец рискует только тем, что вложил.","Ограниченная ответственность ООО и АО снижает риск и стимулирует предпринимательство.","Участник ООО теряет только долю, но не личное имущество.","Ограниченная ответственность участников снижает барьеры предпринимательской деятельности."],"Одновременное потребление":["Благо, которым могут пользоваться многие сразу без ущерба друг другу.","Неконкурентность потребления — признак общественного блага.","Телепередачу смотрят миллионы одновременно.","Неконкурентность потребления характерна для общественных благ."],"Одноразовая игра":["Игра, которая разыгрывается один раз.","В одноразовой игре сотрудничество труднее, чем в повторяющейся.","Одноразовая сделка с незнакомым поставщиком — повышенный риск обмана.","В условиях одноразового взаимодействия стимулы к сотрудничеству ослабевают."],"Ожидаемая инфляция":["Инфляция, которую все ожидали.","Ожидаемая инфляция закладывается в цены, ставки и контракты; её перераспределительные эффекты меньше.","Банки закладывают ожидаемые 8 % инфляции в ставки кредитов.","Ожидаемая инфляция учитывается при индексации контрактных цен."],"Ожидаемая норма чистой прибыли":["Какую прибыль в процентах фирма рассчитывает получить от вложения.","Сравнивается с процентной ставкой: инвестиция выгодна, если ожидаемая доходность выше.","Ожидаемая доходность 18 % при ставке кредита 14 % — проект выгоден.","Ожидаемая норма доходности проекта превышает стоимость заемных средств."],"Ожидания":["Что люди и фирмы думают о будущем.","Ожидания влияют на потребление, инвестиции, цены; измеряются индексами потребительских настроений и деловой активности.","Пессимизм бизнеса сокращает инвестиции.","Негативные ожидания предпринимателей сдерживают инвестиционную активность."],"Олигополия":["Рынок, где несколько крупных фирм.","Олигополия характеризуется взаимозависимостью решений, барьерами входа и неценовой конкуренцией.","Рынок целлюлозы России с несколькими крупными производителями.","Рынок продукции глубокой переработки древесины характеризуется олигополистической структурой."],"Олигополия, не базирующаяся на сговоре":["Олигополия, где фирмы не сговариваются.","Фирмы действуют независимо, но учитывают реакцию соперников.","Производители плит конкурируют, не договариваясь о ценах.","Отсутствие сговора усиливает конкуренцию на олигополистическом рынке."],"Операции на открытом рынке":["Центральный банк покупает или продаёт гособлигации, чтобы изменить количество денег.","Операции на открытом рынке — инструмент денежно-кредитной политики; в России используются операции репо и депозитные аукционы.","Покупка облигаций центральным банком добавляет банкам ликвидности.","Операции на открытом рынке используются для управления ликвидностью банковского сектора."],"Оптимальное ослабление внешнего эффекта":["Снижать загрязнение до уровня, где польза от очистки равна её стоимости.","Оптимум — не «ноль загрязнения», а равенство предельных выгод и издержек очистки.","Очистка стоков комбината выгодна, пока экологический эффект выше затрат.","Оптимальный уровень снижения негативного воздействия определяется равенством предельных затрат и выгод."],"Оптимальный объем расходов на НИОКР":["Сколько выгодно тратить на исследования: пока ожидаемая отдача выше стоимости денег.","Оптимум НИОКР — где ожидаемая доходность последнего проекта равна процентной ставке. здух в посёлке.","Отрицательные внешние эффекты производства компенсируются платой за негативное воздействие на окружающую среду."],"Отрицательный разрыв ВВП":["Экономика производит меньше, чем могла бы.","Отрицательный разрыв выпуска — фактический ВВП ниже потенциального; сопровождается безработицей.","В кризис загрузка мощностей падает, ВВП ниже потенциала.","Отрицательный разрыв выпуска свидетельствует о неполном использовании производственного потенциала."],"Отрицательный самоотбор":["Эмигрируют в основном менее успешные.","Концепция о составе мигрантов: иногда уезжают те, кто меньше преуспел дома.","Из страны с высоким равенством доходов уезжают люди с низкой квалификацией.","Качественный состав миграционных потоков влияет на рынок труда принимающей страны."],"Отрицательный эффект масштаба":["Слишком большая фирма начинает работать дороже на единицу продукции.","Отрицательный эффект масштаба: сложность управления, бюрократия.","Холдинг разросся, и согласование решений заняло месяцы.","Чрезмерная централизация управления обусловливает отрицательный эффект масштаба."],"Отсутствие мобильности":["Люди не могут или не хотят переезжать ради работы.","Низкая мобильность рабочей силы усиливает региональные различия в безработице.","Жители моногорода не переезжают, хотя работы нет.","Низкая территориальная мобильность рабочей силы сохраняет межрегиональные диспропорции занятости."],"Отсутствие соперничества":["Пользование благом одним человеком не мешает другим.","Неконкурентность — признак общественного блага.","Прогноз погоды доступен всем одновременно.","Неконкурентность потребления обусловливает общественный характер блага."],"Отчаявшиеся работники":["Люди перестали искать работу, потому что отчаялись её найти.","Они не считаются безработными по методологии МОТ, из-за чего официальная безработица может занижать проблему.","Житель депрессивного посёлка больше не ходит в центр занятости.","Наличие отчаявшихся работников занижает официальный уровень безработицы."],"Офи ют должен выравнивать цены одинаковых товаров в разных странах.","ППС используется для сравнения ВВП стран; «индекс Биг-Мака» — популярная иллюстрация.","По ППС ВВП России значительно больше, чем по рыночному курсу.","Межстрановые сопоставления проведены по паритету покупательной способности."],"Партнерство":["Бизнес, которым владеют несколько человек без создания компании.","В России аналоги — полное и коммандитное товарищество (ГК РФ); встречаются редко.","Два мастера ведут общий бизнес как товарищество.","Товарищества имеют ограниченное распространение ввиду неограниченной ответственности участников."],"Пассив":["Долги и обязательства.","В бухгалтерском балансе пассив — источники средств: капитал и обязательства.","Кредиты банка и долги поставщикам — обязательства организации.","Рост кредиторской задолженности в структуре пассивов снижает финансовую устойчивость."],"Пассивно управляемые фонды":["Фонды, которые просто повторяют индекс.","Пассивное управление — низкие комиссии и доходность рынка.","Фонд на индекс Мосбиржи.","Пассивное инвестирование обеспечивает доходность на уровне рынка при низких издержках."],"Патент":["Исключительное право на изобретение на время.","В России — патенты по части четвёртой ГК РФ, выдаёт Роспатент; срок для изобретения — 20 лет.","Патент на технологию сушки запрещает конкурентам её копировать.","Результаты исследования защищены патентом Российской Федерации."],"Перевод денег":["Деньги, которые мигранты отправляют домой.","Денежные переводы — существенная часть доходов ряда стран СНГ.","Мигрант из Таджикистана пересылает часть зарплаты семье.","Трансграничные переводы мигрантов оказывают влияние на платежный баланс."],"Переговоры о заключении коллективного договора":["Переговоры профсоюза и работодателя о зарплате и условиях труда.","В России — коллективный договор по ТК РФ (гл. 6–7).","Коллективный договор фиксирует индексацию зарплаты и график отпусков.","Коллективный договор регулирует социально-трудовые отношения в организации." ии.","Участие в прибыли мотивирует работников и увязывает оплату с результатами.","Бригаде выплачивается 5 % годовой прибыли цеха.","Участие работников в прибыли повышает их заинтересованность в результатах деятельности."],"Плата за обслуживание":["Врачу платят за каждую услугу.","Стимулирует рост объёма услуг, иногда избыточных.","Чем больше анализов назначено, тем больше доход клиники.","Оплата за каждую услугу стимулирует увеличение объема медицинской помощи."],"Платежи, не связанные с доходом":["Элементы стоимости продукции, не являющиеся доходом: амортизация и косвенные налоги.","Используются при переходе от ВВП к национальному доходу.","Амортизация и НДС входят в цену, но не являются доходом факторов.","При расчете национального дохода из ВВП исключается потребление основного капитала."],"Платежный баланс страны":["Сводная таблица всех операций страны с остальным миром.","Платёжный баланс включает счёт текущих операций и финансовый счёт; в России составляет Банк России.","Экспорт, импорт, инвестиции, кредиты — всё отражается в платёжном балансе.","По данным платежного баланса Банка России, сальдо счета текущих операций положительное."],"Повторный счет":["Одну и ту же стоимость посчитали несколько раз.","При расчёте ВВП учитывается только конечная продукция или добавленная стоимость, чтобы избежать двойного счёта.","Нельзя складывать стоимость брёвен, досок и мебели из этих досок.","Для исключения повторного счета ВВП рассчитывается по добавленной стоимости."],"Повторяющаяся игра":["Игра, которая повторяется много раз.","Повторение делает сотрудничество выгоднее: важна репутация.","Постоянный поставщик не обманывает, чтобы не потерять будущие заказы.","Долгосрочное взаимодействие с контрагентами снижает риски недобросовестного поведения."],"Повышение курса доллара":["Доллар дорожает относительно других валют.","Удорожание валюты делает импорт дешевле, а экспорт — дороже.","За доллар стали давать больше рублей.","Укрепление доллара снижает конкурентоспособность твует о перегреве экономики."],"Показатель концентрации":["Доля рынка нескольких крупнейших фирм.","Показатели концентрации CR3, CR4 используются для оценки конкуренции (также применяется ФАС).","Четыре крупнейших производителя контролируют 70 % рынка — CR4 = 70 %.","Коэффициент концентрации CR4 свидетельствует о высокой концентрации рынка."],"Показатель концентрации четырех фирм":["Доля продаж четырёх крупнейших фирм отрасли.","CR4 > 40 % — признак олигополии.","Четыре фирмы делают 60 % продаж фанеры.","Значение CR4 указывает на олигополистическую структуру рынка."],"Покупательная способность":["Сколько можно купить на свои деньги.","Покупательная способность падает при инфляции; реальные доходы отражают её изменение.","При инфляции 10 % на ту же зарплату можно купить меньше.","Снижение покупательной способности населения ограничивает потребительский спрос."],"Полезность":["Удовлетворение от потребления товара.","Полезность — основа теории потребительского выбора.","Тёплая куртка зимой приносит большую полезность.","Потребительский выбор определяется стремлением к максимизации полезности."],"Политика «дешевых» денег":["Центральный банк снижает ставки и увеличивает деньги в экономике.","Мягкая денежно-кредитная политика стимулирует кредит и спрос.","Снижение ключевой ставки удешевляет кредиты.","Смягчение денежно-кредитной политики стимулирует инвестиционную активность."],"Политика «дорогих» денег":["Центральный банк повышает ставки, чтобы сдержать инфляцию.","Жёсткая денежно-кредитная политика удорожает кредит и охлаждает спрос.","Банк России поднимает ключевую ставку до 21 % для борьбы с инфляцией.","Жесткая денежно-кредитная политика ограничивает доступность заемного финансирования."],"Политический деловой цикл":["Власти стимулируют экономику перед выборами, а потом затягивают пояса.","Гипотеза политического цикла деловой активности.","Рост социальных выплат накануне выборов.","Гипотеза политического делового цикла связывает колебания экономики с электоральным циклом."],"Полная занятость":["Все, кто хочет работать, работают, кроме естественной безработицы.","Полная занятость — безработица на естественном уровне; фактический ВВП равен потенциальному.","Безработица 3 % при естественном уровне 4 % — выше полной занятости.","Экономика функционирует в условиях, близких к полной занятости."],"Полный объем производства":["Максимально возможный выпуск при эффективном использовании ресурсов.","Экономика находится на границе производственных возможностей.","Все мощности загружены и используются эффективно.","Достижение полного объема производства требует эффективного использования ресурсов."],"Положительная экстерналия":["Польза от производства или потребления, которую получают посторонние.","Положительные экстерналии (образование, лесовосстановление) рынок недопроизводит; нужна поддержка.","Обучение осуждённых профессии снижает рецидив — выигрывает всё общество.","Положительные внешние эффекты трудовой адаптации осужденных обосновывают ее государственную поддержку."],"Положительное сальдо баланса движения капиталов":["В страну приходит больше капитала, чем уходит.","Положительное сальдо финансового счёта — чистый приток инвестиций и займов.","Иностранные инвестиции превышают вложения резидентов за рубежом.","Положительное сальдо движения капитала свидетельствует о притоке инвестиций."],"Пороговый выпуск":["Объём выпуска, при котором нет ни прибыли, ни убытка.","Точка безубыточности = постоянные издержки / (цена − переменные издержки на единицу).","При постоянных затратах 1 млн руб. и маржинальной прибыли 200 руб. с поддона нужно продать 5000 поддонов.","Точка безубыточности производства составляет 5000 единиц продукции в год."],"Пороговый доход":["Доход, при котором семья тратит всё, ничего не сберегая.","В функции потребления — точка, где потребление равно располагаемому доходу.","При доходе 40 тыс. семья тратит все 40 тыс.","При доходах ниже порогового уровня домохозяйства расходуют сбережения."],"Порочный круг бедности":["Бедность воспроизводит сама себя: нет сбережений — нет инвестиций — нет роста.","Порочный круг бедности развивающихся стран; разрывается внешними инвестициями, образованием, институтами.","Низкие доходы не позволяют копить на обучение детей.","Разрыв порочного круга бедности требует внешних инвестиций и развития человеческого капитала."],"Портфель":["Набор ценных бумаг и других вложений.","Инвестиционный портфель диверсифицируется для снижения риска.","Портфель из ОФЗ, акций и золота.","Диверсификация портфеля снижает специфический риск инвестора."],"Порядковая полезность":["Полезность, которую можно только сравнивать («лучше/хуже»), а не измерять.","Ординалистский подход — основа кривых безразличия.","«Набор А лучше набора Б», без точных чисел.","Ординалистский подход исходит из сравнительной оценки предпочтений."],"Пособие в натуральной форме":["Помощь от государства вещами и услугами.","Натуральные трансферты (льготное жильё, питание) — альтернатива денежным пособиям.","Бесплатное питание школьников.","Трансферты в натуральной форме обеспечивают целевое использование помощи."],"Постоянная норма прибыли при росте масштабов бизнеса":["Производство растёт пропорционально вложениям.","Постоянная отдача от масштаба: средние издержки не меняются при расширении.","Удвоили мощности — удвоился выпуск при тех же удельных затратах.","Постоянная отдача от масштаба характерна для производств с тиражируемой технологией."],"Постоянные альтернативные издержки":["Жертва одним товаром ради другого всегда одинакова.","Граница производственных возможностей — прямая линия, когда ресурсы одинаково пригодны для обоих товаров.","Каждые 10 поддонов стоят одного стола, сколько бы их ни делали.","Постоянные альтернативные издержки предполагают однородность ресурсов."],"Постоянные издержки":["Затраты, которые не зависят от объёма производства.","Аренда, амортизация, оклады управленцев; при низкой загрузке повышают себестоимость единицы.","Охрана и отопление цеха оплачиваются независимо от выпуска.","Высокая доля постоянных затрат при низкой загрузке мощностей повышает себестоимость продукции."],"Постоянный ресурс":["Ресурс, количество которого нельзя быстро изменить.","В краткосрочном периоде фиксированы здания и оборудование.","Площадь цеха не увеличить за неделю.","Ограниченность постоянных ресурсов определяет максимальный выпуск в краткосрочном периоде."],"Потенциальная конкуренция":["Возможность появления новых конкурентов.","Даже угроза входа сдерживает цены действующих фирм (теория состязательных рынков).","Если барьеры низкие, монополист не может сильно завышать цену.","Потенциальная конкуренция ограничивает рыночную власть действующих производителей."],"Потенциальный выпуск":["Сколько экономика может произвести при полной занятости.","Потенциальный ВВП определяется трудом, капиталом и технологиями; оценивается Банком России и Минэкономразвития.","Если ВВП выше потенциального — растёт инфляция.","Фактический ВВП превышает оценки потенциального выпуска."],"Потери эффективности от налогов":["Потери для общества из-за того, что налог сокращает производство и покупки.","Избыточное налоговое бремя («треугольник Харбергера»): часть выгодных сделок не совершается.","Высокий акциз сокращает продажи сильнее, чем пополняет бюджет.","Избыточное налоговое бремя снижает общественное благосостояние."],"Потеря эффективности":["Общество теряет выгоду, потому что производят слишком мало или слишком много.","Потери мёртвого груза возникают при монополии, налогах, регулировании цен.","Монополист выпускает меньше, чем нужно обществу.","Монопольное ценообразование приводит к потере эффективности."],"Потолок цены, ценовой максимум":["Максимальная цена, установленная государством ниже рыночной.","Ведёт к дефициту и очередям; пример — регулирование цен на отдельные товары.","Фиксированная низкая цена на хлеб приводит к пустым полкам.","Установление предельных цен ниже равновесного уровня приводит к товарному дефициту."],"Потребительские товары":["Товары для людей, а не для производства.","Потребительские товары удовлетворяют личные нужды; противоположность средствам производства.","Мебель для дома — потребительский товар.","Спрос на потребительские товары определяется доходами населения."],"Потребительский избыток":["Выгода покупателя: разница между тем, сколько он готов заплатить, и ценой.","Потребительский излишек — мера благосостояния покупателей.","Готов заплатить 20 тыс., купил за 15 тыс. — излишек 5 тыс.","Снижение цен увеличивает потребительский излишек."],"Потребительское равновесие":["Набор покупок, при котором удовольствие максимально при данном доходе.","Равновесие достигается, когда предельная полезность на рубль одинакова для всех товаров.","Семья распределяет бюджет так, что лишний рубль нигде не принесёт больше пользы.","Равновесие потребителя достигается при равенстве взвешенных предельных полезностей."],"Потребление основного капитала":["Износ основного капитала за год.","В СНС — потребление основного капитала; в бухучёте — амортизация.","Станок за 10 млн руб. со сроком 10 лет изнашивается на 1 млн в год.","Потребление основного капитала превышает объем инвестиций, что свидетельствует о сужении воспроизводства."],"«Правило 70»":["Число лет удвоения = 70 / годовой темп роста (в %).","Удобное правило для быстрых оценок роста и инфляции.","При росте 7 % в год показатель удвоится за 10 лет.","При сохранении темпов роста 3,5 % объем удвоится примерно за 20 лет."],"Правило максимизации полезности":["Тратить так, чтобы последний рубль на каждый товар давал одинаковую пользу.","Правило максимизации полезности: MU₁/P₁ = MU₂/P₂.","Если рубль на хлеб даёт больше, чем на сладости, выгоднее купить больше хлеба.","Оптимальный потребительский выбор соответствует правилу равенства предельных полезностей на рубль расходов."],"Правило равенства предельного дохода и предельных издержек, правило MR = МС":["Производить, пока доход от следующей единицы не меньше затрат на неё.","Правило максимизации прибыли для любой рыночной структуры.","Выпускать ещё один поддон, пока его цена выше затрат на него.","Оптимальный объем выпуска определяется условием равенства предельного дохода и предельных издержек."],"Правило разумного подхода":["Наказывать не размер компании, а вредное поведение.","Принцип антитрестовской практики США; близок к российскому подходу оценки злоупотребления доминированием.","Крупная фирма без злоупотреблений не нарушает закон.","Оценка антиконкурентного поведения проводится с учетом его фактических последствий."],"Правило Тейлора":["Формула, по которой центральный банк задаёт ставку в зависимости от инфляции и разрыва выпуска.","Правило Дж. Тейлора — ориентир денежно-кредитной политики при таргетировании инфляции.","Если инфляция выше цели, правило предписывает поднять ставку сильнее.","Динамика ключевой ставки в целом соответствует правилу Тейлора."],"Право старшинства, учет трудового стажа при продвижении по службе":["Преимущество при повышении и сохранении работы тем, кто дольше работает.","Принцип старшинства снижает текучесть, но может мешать продвижению талантливых.","При сокращении первыми увольняют работников с наименьшим стажем.","Учет стажа при продвижении снижает текучесть кадров."],"Предельная (приростная, маржинальная) норма замещения":["Сколько одного товара человек готов отдать за ещё единицу другого.","Предельная норма замещения — наклон кривой безразличия.","Готов отдать 2 кг яблок за 1 кг груш.","Предельная норма замещения характеризует готовность потребителя заменять одно благо другим."],"Предельная (приростная, маржинальная) выгода":["Дополнительная польза от ещё одной единицы.","Решения принимаются сравнением предельной выгоды и предельных издержек.","Второй кофе приносит меньше радости, чем первый.","Предельная выгода от расширения программы снижается по мере ее масштабирования."],"Предельная склонность к потреблению":["Какую часть прибавки дохода люди тратят.","MPC определяет величину мультипликатора; обычно 0,6–0,9.","Из прибавки 10 тыс. руб. семья тратит 8 тыс. — MPC = 0,8.","Предельная склонность к потреблению определяет эффект мультипликатора."],"Предельная склонность к сбережению":["Какую часть прибавки дохода люди откладывают.","MPS = 1 − MPC.","Из прибавки 10 тыс. руб. отложили 2 тыс. — MPS = 0,2.","Рост предельной склонности к сбережению снижает мультипликатор расходов."],"Предельная ставка налогообложения":["Налог с каждого следующего заработанного рубля.","Предельная ставка определяет стимулы; при прогрессивной шкале растёт с доходом.","Доход свыше порога облагается по повышенной ставке НДФЛ.","Повышение предельной ставки налога снижает стимулы к росту доходов."],"Предельные (приростные, маржинальные) издержки":["Сколько стоит произвести ещё одну единицу.","Предельные издержки определяют оптимальный выпуск (правило MR = MC).","Ещё один кубометр досок стоит 9 тыс. руб. — это предельные издержки.","Предельные издержки производства возрастают при приближении к пределу мощностей."],"Предельные издержки на ресурс":["Во сколько обходится ещё одна единица ресурса.","На конкурентном рынке равна цене ресурса; фирма нанимает, пока предельный продукт в деньгах не ниже этой величины.","Нанять ещё одного рабочего стоит 60 тыс. руб. в месяц.","Фирма увеличивает использование ресурса до равенства его предельной доходности и предельных затрат."],"Предельный (приростный, маржинальный) продукт":["Сколько дополнительной продукции даёт ещё одна единица ресурса.","Предельный продукт убывает при фиксированных факторах (закон убывающей отдачи).","Третий рабочий у пилорамы добавил 5 м³ в смену.","Предельный продукт труда снижается при неизменной технической базе."],"Предельный доход, получаемый от продукта":["Сколько дополнительного дохода приносит ещё одна единица ресурса.","MRP = предельный продукт × цена продукции; определяет спрос фирмы на ресурс.","Рабочий добавляет 5 м³ в день по 15 тыс. руб. — 75 тыс. руб. дохода.","Спрос на труд определяется предельным доходом от продукта труда."],"Предложение":["Сколько товара продавцы готовы про д рубль переходит из рук в руки.","Скорость обращения V = номинальный ВВП / денежная масса (MV = PY).","ВВП 150 трлн, М2 100 трлн — скорость 1,5.","Снижение скорости обращения денег отражает рост спроса на ликвидность."],"Скрытые (условно-расчетные) издержки":["Доход, от которого владелец отказывается, используя своё имущество в своём бизнесе.","Неявные (альтернативные) издержки не видны в бухучёте, но учитываются в экономической прибыли.","Предприниматель работает в своём цеху и не получает зарплату, которую мог бы заработать.","Экономическая прибыль учитывает неявные издержки использования собственных ресурсов."],"Слияние":["Две фирмы становятся одной.","Слияния бывают горизонтальными, вертикальными и конгломератными; контролируются ФАС.","Слияние двух производителей фанеры.","Сделки слияния подлежат антимонопольному контролю."],"Сложный процент":["Проценты начисляются и на ранее начисленные проценты.","Основа расчёта будущей стоимости и дисконтирования.","100 тыс. под 10 % через 2 года — 121 тыс., а не 120.","Расчет будущей стоимости выполнен по формуле сложного процента."],"Случай закрытия предприятия":["Когда выгоднее остановить производство, чем работать.","Если цена ниже средних переменных издержек, фирма минимизирует убытки остановкой.","Если выручка не покрывает даже сырьё и зарплату, цех останавливают.","Производство экономически нецелесообразно при цене ниже средних переменных издержек."],"Снижение валютного курса":["Валюта страны дешевеет.","Ослабление валюты поддерживает экспортёров и удорожает импорт.","Рубль ослаб — импортное оборудование подорожало.","Ослабление рубля повысило стоимость импортного оборудования."],"Собственная выгода, заинтересованность":["Каждый стремится к своей выгоде.","Личный интерес (А. Смит) через рынок ведёт к общественной пользе при конкуренции.","Фирма снижает издержки ради прибыли — и цены для покупателей падают.","Личный интерес экономических агентов является движущей силой рыночного механизма."],"Собственный капитал":["Активы минус долги.","Собственный капитал (чистые активы); в балансе — раздел «Капитал и резервы».","Активы 100 млн, обязательства 60 млн — собственный капитал 40 млн.","Доля собственного капитала в структуре пассивов снизилась."],"Совершенно конкурентный рынок труда":["Много работодателей и работников, никто не влияет на зарплату.","Зарплата равна предельному продукту труда в деньгах.","Рынок неквалифицированного труда крупного города.","На конкурентном рынке труда ставка заработной платы определяется рынком."],"Совершенно неэластичное предложение":["Продавцы не меняют объём, как бы ни менялась цена.","Вертикальная кривая предложения; пример — уникальный ресурс.","Количество земли в городе фиксировано.","Предложение уникального ресурса совершенно неэластично."],"Совершенно неэластичный спрос":["Покупатели берут одно и то же количество при любой цене.","Вертикальная кривая спроса; пример — жизненно необходимые лекарства.","Инсулин диабетик купит при любой цене.","Спрос на жизненно необходимые товары близок к совершенно неэластичному."],"Совершенно эластичное предложение":["Продавцы готовы продать любой объём по одной цене.","Горизонтальная кривая предложения.","Небольшой производитель может продать сколько угодно по рыночной цене.","Предложение малой фирмы на конкурентном рынке совершенно эластично."],"Совершенно эластичный спрос":["При малейшем повышении цены покупатели уходят полностью.","Горизонтальная кривая спроса — характерна для фирмы на совершенно конкурентном рынке.","Если фермер поднимет цену зерна выше рыночной, никто не купит.","Фирма на конкурентном рынке сталкивается с совершенно эластичным спросом."],"Совет управляющих":["Руководство Федеральной резервной системы США.","В России аналог — Совет директоров Банка России, принимающий решения по ключевой ставке.","Совет директоров Банка России повысил ключевую ставку.","Решения по ключевой ставке принимает Совет директоров Банка России."],"Совместные платежи":["Часть медицинских расходов, которую платит сам авнительное преимущество.","1 стол = 10 поддонов.","Соотношение альтернативных издержек определяет направление специализации."],"Социальная защита":["Американская система пенсионного страхования.","Финансируется налогом на фонд оплаты труда. В России — пенсионное страхование через Социальный фонд.","Пенсия по старости в США.","Пенсионное обеспечение финансируется за счет страховых взносов."],"Социально оптимальная цена":["Цена, при которой ресурсы используются наиболее эффективно для общества.","Равна предельным издержкам; ориентир регулирования монополий.","Регулятор устанавливает тариф на уровне предельных издержек.","Социально оптимальная цена обеспечивает эффективное распределение ресурсов."],"Социальное регулирование":["Регулирование условий производства: безопасность, экология, права потребителей.","Касается всех отраслей (охрана труда, экология), в отличие от отраслевого.","Требования пожарной безопасности в цехах.","Социальное регулирование устанавливает требования к безопасности производства."],"Спекуляция":["Покупка ради перепродажи дороже.","Спекуляция переносит товары во времени и пространстве, но может усиливать колебания цен.","Трейдер закупает древесину зимой, чтобы продать летом дороже.","Спекулятивные операции усиливают волатильность цен."],"Специализация":["Сосредоточение на том, что получается лучше.","Специализация повышает производительность; основа торговли.","ЦТАО специализируется на поддонах и таре.","Специализация производства повышает его эффективность."],"Спрос":["Сколько покупатели хотят и могут купить при разных ценах.","Спрос — вся функция; сдвигается под влиянием неценовых факторов.","Таблица спроса на пиломатериалы по ценам.","Спрос на продукцию определяется ценой и неценовыми факторами."],"Спрос на деньги для совершения сделок":["Деньги для текущих покупок.","Трансакционный спрос зависит от номинального дохода.","С ростом зарплат растут и суммы на картах для расходов.","Трансакционный спрос на деньги растет вместе с номинальным ВВП." function mergeRec(a,b){if(!a)return b||null;if(!b)return a;const h=[...(a.hist||[]),...(b.hist||[])];const seen=new Set();const hist=h.filter(x=>{const k=x.s+"/"+x.n+"/"+x.d+"/"+(x.ts||"");if(seen.has(k))return false;seen.add(k);return true}).sort((x,y)=>(x.ts||0)-(y.ts||0)).slice(-20);
 return{best:Math.max(a.best||0,b.best||0),att:Math.max(a.att||0,b.att||0,hist.length),last:hist.length?hist[hist.length-1].s:a.last,n:a.n||b.n,hist}}

 for(const k in o.lessons||{})P.lessons[k]=mergeRec(P.lessons[k],o.lessons[k]);

 }catch(e){}}

(async()=>{

 r.hist=r.hist||[];r.hist.push({s,n,d:today(),ts:Date.now()});r.hist=r.hist.slice(-20);r.att=(r.att||0)+1;r.last=s;r.n=n;r.best=Math.max(r.best||0,s);store[id]=r;save();return r}

};

function quizStart(el,qs,cfg){const Q=qs.map(q=>Object.assign({},q,{opts:shuffle(q.opts)}));let i=0,score=0,answered=false;const wrong=[];
 function draw(){const q=Q[i];answered=false;
  el.innerHTML=`<div class="card" style="display:grid;gap:16px">
  <div class="qhead"><span class="chip acc">Вопрос ${i+1} из ${Q.length}</span><div class="bar"><i style="width:${pct(i,Q.length)}%"></i></div><span class="chip num">${score} верно</span></div>

  <div class="q">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o,j)=>`<button class="opt" data-j="${j}"><span class="k">${"АБВГ"[j]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
  <div id="fb"></div></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.j));
 }
 function pick(j){if(answered)return;answered=true;const q=Q[i];const ok=!!q.opts[j].ok;if(ok)score++;else wrong.push(q);
  el.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(q.opts[k].ok)b.classList.add("right");else if(k===j)b.classList.add("wrong")});
  el.querySelector("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Верно.":"Неверно."}</b> ${esc(q.e||"")}${q.term?`<div style="margin-top:6px"><b>${esc(q.term[0])}</b> — ${esc(q.term[1])}</div>`:""}</div>
   <div class="row" style="margin-top:12px"><button class="btn pri" id="nq">${i<Q.length-1?"Следующий вопрос →":"Завершить тест"}</button></div>`;
  const nq=el.querySelector("#nq");nq.onclick=()=>{i++;if(i<Q.length)draw();else finish()};nq.focus();

  el.innerHTML=`<div class="card" style="display:grid;gap:16px">

   ${wrong.length?`<div><h4>Разбор ошибок</h4>${wrong.map(q=>`<div class="pair" style="grid-template-columns:1fr"><div>${q.ctx&&!q.ctxLabel?`<span class="bad">${esc(q.ctx)}</span><br>`:esc(q.q)+(q.ctxLabel?" "+esc(q.ctx):"")+"<br>"}<span class="good">${esc(q.opts.find(o=>o.ok).t)}</span></div></div>`).join("")}</div>`:""}
   <div class="row"><button class="btn pri" id="again">Пройти заново</button>${cfg.next||""}</div></div>`;
