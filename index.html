аваться (восстанавливать себя), если их добывают в умеренных количествах."},{"t":"Возрастающая отдача","en":"increasing returns","d":"увеличение объема продукции фирмы на большую процентную долю, чем процентное повышение исходных ресурсов."},{"t":"Возрастающая предельная отдача","en":"increasing marginal returns","d":"увеличение предельного продукта за счет одного из применяемых ресурсов по мере последовательного введения в производство дополнительных единиц этого ресурса."},{"t":"Война цен","en":"price war","d":"повторяющееся и долговременное снижение цен на продукцию фирм олигополистической отрасли, посредством которого каждая фирма устанавливает цены ниже уровня конкурентов, рассчитывая увеличить объемы своих продаж и доходов за их счет. «Воля к развитию» (will to develop) (материал интернетглавы) — сильное стремление обеспечить экономический рост, которое побуждает заменять старые способы ведения хозяйства новыми."},{"t":"Временная помощь нуждающимся семьям","en":"Temporary Assistance to Needy Families, TANF","d":"программа, финансируемая в основном региональными (штатами) и частично федеральными органами власти в Соединенных Штатах, предусматривающая предоставление финансовой помощи семьям с низкими доходами; ограничивает время получения этого пособия и определяет требования по поиску работы."},{"t":"Временное предпочтение","en":"time preference","d":"склонность людей из-за нетерпения истратить и потребить что-то в настоящем вместо того, чтобы сберечь это в надежде израсходовать и потребить в будущем; по силе это желание у разных людей разное."},{"t":"Всемирная торговая организация","en":"World Trade Organization, WTO","d":"организация, насчитывающая государства-члена (по состоянию на г.), которая отслеживает выполнение заключенных торговых соглашений, разрешает возникающие по поводу этих соглашений споры и проводит форумы по различным аспектам мировой торговли."},{"t":"Всемирный банк","en":"World bank","d":"банк, который предоставляет (и гарантирует) займы развивающимся странам для увеличения их капитальных активов и обеспечения экономического роста."},{"t":"Встроенный стабилизатор","en":"built-in stabilizer","d":"механизм, способствующий увеличению дефицита государственного бюджета (или сокращению его чистых налоговых поступлений) в период рецессии и росту его чистых налоговых поступлений (или сокращению его дефицита) в период инфляции без того, чтобы в это вмешивались регулирующие (экономическую) политику механизмы; одним из таких механизмов является налоговая система."},{"t":"ВТО","en":"","d":"см. Всемирная торговая организация."},{"t":"Выгода перелива","en":"spillover benefit","d":"выгода, получаемая безвозмездно не людьми, участвующими в производстве и потреблении продукта, а третьей стороной (обществом в целом). Например, пчеловод получает выгоду такого рода оттого, что фермер, живущий по соседству, засевает свои поля клевером."},{"t":"Выгоды от торговли","en":"gains from trade","d":"дополнительный выпуск продукции, который получают торгующие стороны от специализации производства и обмена своих товаров и услуг."},{"t":"Выплата государственного долга","en":"retiring the public debt","d":"сокращение размера государственного долга путем выплаты денег владельцам государственных ценных бумаг при наступлении срока их погашения."},{"t":"Выплаты для выравнивания циклических колебаний","en":"countercyclical payments","d":"денежные субсидии, выплачиваемые фермерам, когда рыночная цена на отдельные виды зерновых падает ниже целевых показателей. Размер платежей определяется на основе предыдущих объемов производства; эти деньги фермеры получают независимо от размеров текущего урожая."},{"t":"Выравнивающие различия в оплате труда","en":"compensating differences","d":"различия в размерах заработной платы, которые устанавливаются работникам разных профессий для компенсации неденежных различий в условиях труда."},{"t":"Вычет","en":"deductible","d":"сумма покрытия, которую вносит застрахованное лицо (например, расходы на медицинское обслуживание) до того, как ее начнет выплачивать страховая компания."},{"t":"Г А Т Т","en":"","d":"см. Генеральное соглашение о тарифах и торговле."},{"t":"Генеральное соглашение о тарифах и торговле","en":"General Agreement on Tariff's and Trade, GATT","d":"заключенное в г. соглашение между 23 государствами, в соответствии с которым каждое из них предоставило другим равный и недискриминационный режим торговли, сократило на основе многосторонних договоренностей тарифы и со временем устранило импортные квоты. Сегодня это соглашение подписало большинство стран мира; теперь называется Всемирной торговой организацией (ВТО)."},{"t":"Гибкие цены","en":"flexible prices","d":"цены продуктов, которые могут свободно повышаться и понижаться при изменении спроса и предложения продукта."},{"t":"Гибкий валютный курс","en":"flexible exchange rate","d":"курс обмена валюты, который определяется спросом и предложением иностранных денег на мировом рынке и который может свободно повышаться или понижаться (плавать)."},{"t":"Гиперинфляция","en":"hyperinflation","d":"очень быстрый рост уровня цен."},{"t":"Гипотеза","en":"hypothesis","d":"возможное объяснение причинно-следственной связи, требующее экспериментальной проверки."},{"t":"Гипотеза естественного уровня безработицы","en":"natural rate hypothesis","d":"гипотеза долговременной стабильности экономики при естественном уровне безработицы, уровень безработицы в условиях отсутствия циклической безработицы, когда в экономике производится объем продукции, равный потенциальному; уровень безработицы, при котором фактическая инфляция равна ожидаемой."},{"t":"Гипотеза противодействия администрации","en":"managerial-opposition hypothesis","d":"объяснение относительного упадка профсоюзного движения в США возросшим и более агрессивным сопротивлением, оказываемым ему администрацией компаний."},{"t":"Гипотеза структурных изменений","en":"structural-change hypothesis","d":"гипотеза, объясняющая относительный спад профсоюзного движения в США структурными изменениями в экономике и в составе рабочей силы."},{"t":"Голосование долларом","en":"dollar votes","d":"«голоса» (в виде расходов), которые фактически отдают потребители и предприниматели за производство различных видов потребительских товаров и товаров производственного назначения, когда они покупают их на рынках соответствующих товаров и ресурсов."},{"t":"Гомогенная олигополия","en":"homogeneous oligopoly","d":"олигополия, в которой фирмы производят стандартизированные товары."},{"t":"Горизонтальное слияние","en":"horizontal merger","d":"слияние в одну структуру двух фирм, производящих и продающих в одном географическом регионе одинаковую продукцию."},{"t":"Государственные закупки","en":"government purchases","d":"денежные платежи органов власти, за которые государство получает товары или услуги текущего производства; расходы всех государств на конечные товары и услуги."},{"t":"Государственный долг","en":"public debt","d":"общий размер задолженности федерального правительства владельцам государственных ценных бумаг, равный сумме прошлых бюджетных дефицитов минус бюджетные доходы (профициты)."},{"t":"Государственный сектор","en":"public sector","d":"часть экономики страны, полностью контролируемая органами власти."},{"t":"Граница потребительского бюджета","en":"budget constraint","d":"предел, который ограничивает способность потребителя приобретать товары и услуги размером его дохода (а также уровнем цен на товары и услуги)."},{"t":"График инвестиций","en":"investment schedule","d":"кривая или график, показывающие объем планируемых фирмами инвестиций при различных уровнях реального ВВП."},{"t":"График потребления","en":"consumption schedule","d":"график, показывающий динамику расходов домохозяйств на потребительские товары при разных уровнях располагаемого дохода (дохода после уплаты налогов)."},{"t":"График сбережений","en":"saving schedule","d":"график, показывающий объем планируемых домохозяйствами сбережений (т.е. средств, не предназначенных для расходов на покупку потребительских товаров) при разных уровнях располагаемого дохода (дохода после уплаты налогов)."},{"t":"График совокупных расходов","en":"aggregate expenditures schedule","d":"график или кривая, показывающие общий объем расходов на производство конечных товаров и услуг при разных уровнях ВВП."},{"t":"График спроса","en":"demand schedule","d":"См. Спрос."},{"t":"Движение за единый налог","en":"single-tax movement","d":"политические усилия последователей Генри Джорджа (1839— 1897), призывавшего установить единый налог на стоимость земли и исключить все другие налоги."},{"t":"Движение за справедливую торговлю","en":"fair trade movement","d":"усилия групп людей в странах с высоким доходом, направленные на то, чтобы работники, занимающиеся выращиванием сельскохозяйственных культур в странах с низким доходом, получали достаточно высокую заработную плату и при производстве своих товаров работали в соответствии со стандартами труда; при таком подходе товары этих производителей будут продвигаться потребителям в государствах с высоким доходом под маркой «справедливой торговли»; усилия этих групп направлены на то, чтобы убедить потребителей покупать именно такие товары, а не субституты."},{"t":"Двойное налогообложение","en":"double taxation","d":"обложение налогом как чистого дохода (прибыли) корпораций, так и выплачиваемых из него дивидендов, когда они превра щаются в личный доход домохозяйств."},{"t":"Двусторонняя монополия","en":"bilateral monopoly","d":"рынок, на котором единственному продавцу (монополии) противостоит единственный покупатель (монопсония)."},{"t":"Дебет","en":"debit","d":"запись на бухгалтерском счете, свидетельствующая о том, что стоимость актива (например, иностранной валюты, являющейся собственностью гражданина данной страны) снизилась."},{"t":"Девальвация","en":"devaluation","d":"уменьшение законодательно установленной стоимости валюты."},{"t":"Дезинфляция","en":"disinflation","d":"снижение темпов роста инфляции."},{"t":"Действительная (внутренняя) стоимость","en":"intrinsic value","d":"рыночная стоимость металла в монете."},{"t":"Дело Alcoa","en":"Alcoa case","d":"рассмотренное в г. в федеральных судах дело фирмы Alcoa, по которому суды постановили, что обладание монопольной властью, независимо от того, насколько рационально эта власть используется, является нарушением антитрестовских законов; суды тем самым отвергли правило разумного подхода, примененное в деле U.S. Steel."},{"t":"Дело Microsoft","en":"Microsoft case","d":"антитрестовский иск от г., в ходе которого Microsoft была признана виновной в нарушении положений закона Шермана, так как прибегла к ряду незаконных действий, предназначенных для сохранения ее монополии в области информационных систем для персональных компьютеров; в качестве наказания компании было запрещено использовать в своей практике ряд конкретных действий."},{"t":"Дело Standard Oil","en":"Standard Oil case","d":"антитрестовское дело, закончившееся в г., в котором компания Standard Oil была признана виновной в нарушении закона Шермана, так как незаконно монополизировала нефтяную отрасль. В качестве наказания компания была разделена на несколько конкурирующих друг с другом фирм."},{"t":"Дело U.S. Steel","en":"U.S. Steel case","d":"возбужденное федеральным правительством против корпорации U.S. Steel антитрестовское дело, по которому суд в г. постановил, что закону противоречат лишь необоснованные ограничения торговли, а размеры фирмы и обладание монопольной властью само по себе не являются нарушением антитрестовских законов."},{"t":"Деловая фирма","en":"business firm","d":"см. Фирма."},{"t":"Демографы","en":"demographers","d":"ученые, изучающие популяции людей и их характеристики."},{"t":"Демпинг","en":"dumping","d":"продажа товаров ниже их себестоимости в другой стране или ниже внутренних цен, установившихся в этой стране."},{"t":"Денежный доход","en":"money income","d":"см. Номинальный доход."},{"t":"Денежный капитал","en":"money capital","d":"имеющиеся в распоряжении деньги для закупки инвестиционных товаров (капитала)."},{"t":"Денежный мультипликатор","en":"monetary multiplier","d":"увеличение избыточных резервов, на которые банковская система может увеличивать объем чековых депозитов и тем самым расширять предложение денег через предоставление новых займов (или покупку ценных бумаг); численно равен единице, деленной на размер резервных требований."},{"t":"Денежный рынок","en":"money market","d":"рынок, на котором процентную ставку (или уровень процентных ставок) в данной стране определяют спрос на деньги и предложение денег."},{"t":"Деньги","en":"money","d":"любой предмет, который продавцы обычно принимают в обмен на свои товары и услуги."},{"t":"Депозитные учреждения","en":"depository institutions","d":"фирмы, принимающие денежные вклады (деньги) от предприятий и отдельных лиц: коммерческие банки, ссудосберегательные ассоциации, взаимно-сберегательные банки и кредитные союзы."},{"t":"Депозитный счет денежного рынка","en":"money market deposit account, MMDA","d":"счет в банке или сберегательном учреждении, на который начислены проценты и собираются средства вкладчиков для приобретения различных краткосрочных инструментов денежного рынка."},{"t":"Детерминанта валютного курса","en":"exchange rate determinant","d":"любой фактор, помимо курса обмена валют, определяющий спрос и предложение на рынке иностранной валюты."},{"t":"Детерминанты предложения","en":"determinants of supply","d":"факторы, помимо цены, влияющие на предложение товаров или услуг."},{"t":"Детерминанты совокупного предложения","en":"determinants of aggregate supply","d":"такие факторы, как цены производственных ресурсов, производительность и законодательно-правовая среда, способные повлиять на расположение кривой совокупного предложения, если их параметры изменятся."},{"t":"Детерминанты совокупного спроса","en":"determinants of aggregate demand","d":"такие факторы, как потребление, инвестиции, расходы органов власти и чистый экспорт, способные повлиять на расположение кривой совокупного спроса, если их параметры изменятся."},{"t":"Детерминанты спроса","en":"determinants of demand","d":"факторы, помимо цены, влияющие на спрос на товары или услуги."},{"t":"Дефицит международного платежного баланса","en":"international balance of payments deficit","d":"см. Дефицит платежного баланса."},{"t":"Дефицит платежного баланса","en":"balance of payments deficit","d":"пассивное сальдо (отрицательная сумма) баланса счета текущих операций и баланса счета движения капитала за год."},{"t":"Дефицит счета движения капиталов","en":"capital account defi cit","d":"негативное сальдо по балансу счета движения капиталов."},{"t":"Дефицит счета движения капиталов и финансов","en":"capital and financial account deficit","d":"отрицательная сумма на счете движения капиталов и финансов в международном платежном балансе страны."},{"t":"Дефицит, нехватка","en":"shortage","d":"сумма, на которую объем спроса на продукт превышает объем предложения этого продукта при определенной (ниже равновесной) цене."},{"t":"Дефлирование","en":"deflating","d":"расчет реального валового внутреннего продукта путем уменьшения стоимости ВВП, произведенного в году, когда уровень цен был выше, чем в базовом году."},{"t":"Дефляция","en":"deflation","d":"снижение общего (среднего) уровня цен в экономике страны."},{"t":"Дефолт","en":"default","d":"ситуация, при которой заемщики перестают выплачивать деньги за полученный кредит или после завершения срока действия займа не возвращают первоначальную сумму, которую они получили."},{"t":"Диверсификация","en":"diversification","d":"стратегия инвестиро вания в большое число инвестиций, чтобы сократить общий риск всего инвестиционного портфеля."},{"t":"Диверсифицируемый риск","en":"diversifiable risk","d":"инвестиционный риск, который инвесторы могут снизить, воспользовавшись диверсификацией, также называется идиосинкратическим риском."},{"t":"Дивиденды","en":"dividends","d":"выплаты корпорацией всей или части прибыли владельцам акций (или корпорации)."},{"t":"Дилемма регулирования","en":"dilemma of regulation","d":"проблема, с которой сталкивается регулирующее ведомство, устанавливая монополисту допустимую законом максимальную цену. С одной стороны, если общественно оптимальная цена окажется ниже средних совокупных затрат (то это либо приведет фирму к банкротству, либо потребует ее субсидирования); с другой стороны, цена, обеспечивающая фирме справедливую норму прибыли, не позволяет в полной мере добиваться эффективного распределения ресурсов."},{"t":"Динамичность дохода","en":"income mobility","d":"степень и масштабы, при которых получатели доходов переходят из одной части таблицы распределения доходов в другую через определенное время."},{"t":"Дискреционная фискальная политика","en":"discretionary fiscal policy","d":"осуществляемое Конгрессом США преднамеренное изменение налогов (налоговых ставок) и объема правительственных расходов с целью обеспечения полной занятости, стабильности цен и экономического роста."},{"t":"Дискриминация","en":"discrimination","d":"практика более жесткого обращения с отдельными людьми и группами при найме на работу, ограниченного предоставления доступа к конкретным рабочим местам, обучении и повышении квалификации, продвижении по службе, установлении уровня оплаты или условий труда, несмотря на то, что они имеют равную квалификацию, уровень об разования, трудовые навыки и опыт, как и остальные работники."},{"t":"Дискриминация в выборе профессии","en":"occupational discrimination","d":"произвольные ограничения, преграждающие конкретным группам работников доступ к более желательным для них и более высокооплачиваемым рабочим местам."},{"t":"Дискриминация в оплате труда","en":"wage discrimination","d":"установление более низкой заработной платы представителям определенных групп в сравнении с привилегированными работниками за одинаковую работу."},{"t":"Дискриминация в сфере человеческого капитала","en":"humancapital discrimination","d":"лишение представителей определенных групп возможности получения образования и квалификации, повышения производительности их труда."},{"t":"Дискриминация на рынке труда","en":"labor market discrimination","d":"см. Дискриминация."},{"t":"Дискриминация при найме на работу","en":"employment discrimination","d":"предпочтение определенных групп работников при найме на работу, продвижении по службе, назначении на должности."},{"t":"Дифференциация заработной платы","en":"wage differential","d":"разница между заработной платой, получаемой одним работником или группой работников, и заработной платой, получаемой другим работником или другой группой работников."},{"t":"Дифференциация продукта","en":"product differentiation","d":"стратегия фирмы, согласно которой продукт одной из фирм отличается от конкурирующего продукта дизайном, сопутствующим обслуживанием, качеством, размеще нием или другими свойствами (кроме цены)."},{"t":"Дифференцированная олигополия","en":"differentiated oligopoly","d":"олигополия, в которой фирмы производят дифференци рованный товар."},{"t":"Дифференцированный товар","en":"differentiate product","d":"продукт, который по физическим или иным параметрам отличается от аналогичных продуктов, производимых другими фирмами; продукт, который покупатели предпочитают приобрести у одного продавца, несмотря на то, что цены у всех продавцов одинаковые."},{"t":"Диффузия","en":"diffusion","d":"распространение инновации путем широкомасштабной имитации."},{"t":"Добавленная стоимость","en":"value added","d":"стоимость проданного фирмой продукта минус стоимость изделий (материалов), купленных и использованных фирмой для его производства."},{"t":"Добавочное пособие малоимущим","en":"Supplement Security Income, SSI","d":"финансируемая из федерального бюджета США и организованная федеральным правительством программа, предоставляющая одинаковый минимальный доход для престарелых, слепых и инвалидов, которые не получают пособий по программе страхования по старости, по случаю потери кормильца и нетрудоспособ Глоссарий ности, а также по программе страхования от безработицы."},{"t":"Добровольные экспортные ограничения","en":"voluntary export restrictions","d":"добровольное ограничение странами или фирмами объема своего экспорта в определенные страны с целью предотвращения введения этими странами торговых барьеров."},{"t":"Долговременное конкурентное равновесие","en":"long-run competitive equilibrium","d":"цена, при которой фирма, действующая в условиях совершенной конкуренции, в долговременном периоде не получает экономическую прибыль и не несет убытки, а общие объемы спроса и предложения равны при определенном уровне цен; цена, равная минимальным долговременным средним совокупным издержкам производства продукта."},{"t":"Долговременный тренд","en":"secular trend","d":"долгосрочная тенденция; изменение некоторых переменных в течение многолетнего периода."},{"t":"Долгосрочный период","en":"long run","d":"1) в микроэкономике период, достаточно длительный, чтобы позволить производителям товара изменить количество всех используемых ими ресурсов; период, в котором все ресурсы и издержки являются переменными, т.е. никакие ресурсы и издержки не являются постоянными; 2) в макроэкономике достаточно длительный период времени, в течение которого номинальная заработная плата и цены других ресурсов изменяются в ответ на изменение уровня цен в стране."},{"t":"Долгосрочная вертикальная кривая Филлипса","en":"long-run vertical Phillips Curve","d":"кривая Филлипса после того как номинальные заработные платы скорректированы с учетом темпов инфляции; линия, идущая прямо вверх в точке, соответствующей естественному уровню безра ботицы."},{"t":"Долгосрочная фермерская проблема","en":"long-run farm prob lem","d":"тенденция превращения сельского хозяйства в сужающуюся отрасль с ростом технологического прогресса и расширение в связи с этим предложения в сравнении с неэластичным и медленным ростом спроса."},{"t":"Доминирующая стратегия","en":"dominant strategy","d":"в теории игр вариант, который лучше любого альтернативного, независимо от того, что делает другая сторона."},{"t":"Домохозяйство","en":"household","d":"экономическая единица, состоящая из одного или более лиц, которая снабжает экономику ресурсами и использует полученные за них доходы для приобретения товаров и услуг, удовлетворяющих материальные потребности человека."},{"t":"Дополнительные выплаты","en":"fringe benefits","d":"вознаграждение, помимо заработной платы, которое получают работники от своих работодателей, включающее пенсии, пособия по медицинскому и стоматологическому страхованию, оплату очередных отпусков и оплату отпусков по болезни."},{"t":"Дополнительные платежи","en":"surplus payments","d":"платежи владельцам ресурсов, которые не обоснованы необходимостью гарантировать получение ресурсов, например земельная рента."},{"t":"Дополняющие ресурсы","en":"complementary resources","d":"производственные исходные составляющие, используемые совместно с другими ресурсами в производственном процессе; ресурсы, в отношении которых снижение цены одного из них ведет к увеличению спроса на другой."},{"t":"Допущение ceteris paribus","en":"ceteris paribus assumption","d":"см. Допущение «при прочих равных условиях»."},{"t":"Допущение «при прочих равных условиях»","en":"other things equal assumption","d":"допущение, что все другие переменные, за исключением рассматриваемых, остаются неизменными."},{"t":"Достоверная угроза","en":"credible threat","d":"б теории игр заявление одной стороны о своих намерениях, вредных для другой стороны, которое другая сторона рассматривает как достоверное; часто такое заявление формулируется в виде условия: «Если вы сделаете это, мы ответим тем-то и тем-то»."},{"t":"Дохийский раунд","en":"Doha Round","d":"самые последние и по состоянию на г. незавершенные торговые переговоры членов Всемирной торговой организации; названы по г. Доха, Катар, где этот раунд переговоров начался."},{"t":"Доход","en":"income","d":"поступление денег (или увеличение покупательной способности) на единицу времени в результате использования человеческих ресурсов или собственности."},{"t":"Доход в виде процентов","en":"interest income","d":"доход, получаемый теми, кто обеспечивает экономику капиталом."},{"t":"Доход на душу населения","en":"per capita income","d":"совокупный доход страны, приходящийся на одного человека; средняя величина дохода населения страны."},{"t":"Доход собственника","en":"proprietor’s income","d":"чистый доход владельцев фирм неинкорпорированного типа (индивидуальных собственников и партнерств)."},{"t":"Доходный метод определения ВВП","en":"income approach","d":"метод измерения валового внутреннего продукта посредством суммирования всех доходов, созданных в производстве конечных товаров и услуг."},{"t":"Евро","en":"euro","d":"общая денежная единица, используемая в 15 европейских странах (по состоянию на г.) в зоне евро, в которую входят Австрия, Бельгия, Финляндия, Франция, Германия, Греция, Ирландия, Италия, Люксембург, Нидерланды, Португалия, Испания, Кипр, Словения и Мальта."},{"t":"Европейский союз","en":"European Union, EU","d":"ассоциация 25 европейских государств, созданная для ликвидации ранее введенных между ними таможенных тарифов и импортных квот и установления общих таможенных тарифов на ввоз товаров из зоны необъединенных государств. Цель союза — добиться свободного движения рабочей силы и капитала между странами-участницами, а также выработать общую экономическую политику."},{"t":"Единица учета","en":"unit of account","d":"стандартная единица, с помощью которой может быть установлена цена и сравниваться стоимость товаров и услуг; одна из трех функций денег."},{"t":"Единичная эластичность","en":"unit elasticity","d":"состояние спроса или предложения, когда коэффициент эластичности равен единице; процент изменения величины спроса или предложения равен проценту изменения цены."},{"t":"Естественная монополия","en":"natural monopoly","d":"отрасль, в которой эффект масштаба столь велик, что продукт может быть произведен одной фирмой при более низких средних совокупных издержках, чем если бы его производством занималась не одна, а несколько фирм."},{"t":"Естественный уровень безработицы","en":"natural rate of unemploym ent","d":"уровень безработицы при полной занятости. такой уровень безработицы, который устанавливается при отсутствии циклической безработицы и когда экономика достигает уровня потенциального выпуска; уровень безработицы, при котором реальная инфляция равна ожидаемой."},{"t":"Жалованье","en":"wages","d":"доход людей, поставляющих экономике свой труд."},{"t":"Жесткие цены","en":"sticky prices","d":"см. Негибкие цены."},{"t":"Забастовка","en":"strike","d":"приостановка работы организованной группой работников (профсоюзом)."},{"t":"Зависимая переменная","en":"dependent variable","d":"переменная, изменяющаяся в результате изменения какой-либо другой (независимой) переменной; эффект или следствие."},{"t":"Закон возрастающих альтернативных издержек","en":"law of increasing opportunity costs","d":"зависимость, показывающая, что по мере увеличения производства продукта альтернативные издержки производства каждой новой единицы продукта возрастают."},{"t":"Закон Клейтона","en":"Clayton A ct","d":"федеральный антитрестовский закон г., усиливающий положения закона Шермана путем объявления незаконными некоторых специфических методов деятельности фирм."},{"t":"Закон о гражданских правах 1964 г.","en":"Civil Rights Act of 1964","d":"Раздел VII закона запрещает дискриминацию при найме, продвижении по службе и назначении компенсации (заработной платы) работникам по признаку расы, цвета кожи, религиозных убеждений, пола или национальной принадлежности."},{"t":"Закон о занятости 1946 г.","en":"Employment Act of 1946","d":"федеральный закон, обязавший федеральное правительство поддерживать экономическую стабильность (высокий уровень занятости, стабильные цены, экономический рост); этим законом учреждены Экономический совет при президенте и Объединенный экономический комитет Конгресса США, а также введена практика представления президентом ежегодных экономических докладов Конгрессу."},{"t":"Закон о личной ответственности","en":"Personal Responsibility Act","d":"закон от г., согласно которому были отменены действовавшие до этого в течение 60 лет гарантии денежной помощи бедным семьям, независимо от того, работают или нет взрослые члены семьи; закон установил возрастное ограничение в 5 лет на получение пособий по программе «Временная помощь нуждающимся семьям» (TANF) и потребовал, чтобы трудоспособные взрослые в такой семье работали не менее двух лет для получения права на продолжение государственной помощи."},{"t":"Закон о помощи в профессиональной адаптации","en":"Trade Adjustment Assistance Act","d":"закон, принятый в г. в США, предусматривающий предоставление помощи наличными деньгами, в получении образования и профессиональной подготовки, субсидии при получении медицинских услуг, страхование заработной платы (для людей в возрасте 50 лет и старше). Условия этого закона распространяются на тех, кто оказался без работы в результате вытеснения национальных продуктов импортными или перемещения предприятия, на котором они работали, из США в другую страну."},{"t":"Закон о праве на труд","en":"Right-to-work law","d":"принятое в 22 штатах США законодательство, запрещающее в этих штатах требовать от работника вступления в профсоюз в качестве условия сохранения им рабочего места на данном предприятии; объявляет вне закона «цеховые профсоюзы»."},{"t":"Закон о продуктах питания, сохранении ресурсов и энергии от 2008 г.","en":"Food, Conservation, and Energy Act of 2008","d":"закон о фермерском хозяйстве, предусматривающий предоставление в более широких масштабах уже действующих в прошлом сельскохозяйственных субсидий трех видов: прямые выплаты, выплаты для выравнивания циклических колебаний и маркетинговые займы. Закон о равной оплате труда г. (Equal Pay Act of 1963) — федеральный закон США, запрещающий применять разную оплату труда в отношении мужчин и женщин, если они делают одинаковую работу и если эта работа требует одинаковых навыков, усилий и ответственности и выполняется в одинаковых условиях."},{"t":"Закон о свободе фермерской деятельности","en":"Freedom of Farm Act","d":"закон, принятый в г. с целью полного пересмотра сельскохозяйственной политики США за последние 60 лет, отменил ценовую поддержку и распределение земли под пшеницу, зерновые, ячмень, овес, сорго, рожь, хлопчатник и рис."},{"t":"Закон о соглашениях о взаимной торговле 1934 г.","en":"Reciprocal Trade Agreements Act of 1934","d":"федеральный закон, предоставивший президенту право заключать с другими странами соглашения и снижать таможенные пошлины США на величину до 50% при условии, что эти страны снижают таможенные пошлины на американские товары; закон также предусматривал включение в эти соглашения статьи о режиме наибольшего благоприятствования."},{"t":"Закон о тарифах Смута","en":"","d":"Холи (Smoot-Hawley Tariff Act) — закон, принятый в г.; установил очень высокие таможенные пошлины; преследовал цель сократить импорт и стимулировать рост внутренней экономики, однако в ответ на это другие страны также установили тарифы."},{"t":"Закон о Федеральной комиссии по торговле","en":"Federal Trade Commission A ct","d":"федеральный закон от г., согласно которому была учреждена Федеральная комиссии по торговле."},{"t":"Закон Оукена","en":"Okun’s law","d":"обобщение, гласящее, что превышение текущего уровня безработицы на 1% над уровнем безработицы при полной занятости ресурсов увеличивает отставание реального ВВП от потенциального ВВП страны на 2,0%."},{"t":"Закон предложения","en":"law of supply","d":"принцип, согласно которому при прочих равных условиях рост цены продукции влечет за собой рост предложения, и наоборот."},{"t":"Закон Селлера","en":"","d":"Кефовера (Celler-Kefauver A ct) — федеральный закон от г., внесший поправку к закону Клейтона, запрещающую фирме приобретать активы другой фирмы, если это приводит к ослаблению конкуренции."},{"t":"Закон спроса","en":"law of demand","d":"принцип, согласно которому при прочих равных условиях повышение цен на товары сокращает спрос на них и, наоборот, снижение цен повышает спрос."},{"t":"Закон Сэя","en":"S a y’s Law","d":"макроэкономический принцип (не нашедший подтверждения), согласно которому производство товаров и услуг (предложение) создает равный спрос на них."},{"t":"Закон убывающей отдачи","en":"law of diminishing returns","d":"ситуация, когда последовательно к постоянным ресурсам добавляется одно и то же количество переменного ресурса и сверх какого-то определенного уровня предельный продукт, полученный из переменного ресурса, начинает все больше сокращаться."},{"t":"Закон убывающей предельной полезности","en":"law of diminishing marginal utility","d":"по мере того как потребитель уве личивает потребление товара или услуги, предельная полезность каждой дополнительной единицы товара или услуги сокращается."},{"t":"Закон Уилера","en":"","d":"Ли (Wheeler-Lea Act) — федеральный закон г., внесший в Закон о Федеральной комиссии по торговле поправку, которая запрещает нечестные и обманные действия или практику в торговле (недобросовестную рекламу, искажение сведений о товарах), и предоставил Комиссии по торговле право проводить соответствующее расследование."},{"t":"Закон Шермана","en":"Sherman Act","d":"федеральный антитрестовский закон г., который провозгласил уголовны ми преступлениями монополию и вступление в сговор с целью ограничения торговли."},{"t":"Законное средство платежа","en":"legal lender","d":"юридически узаконенная валюта (банкноты и монеты) страны; все средства, которые должны приниматься в уплату за долг, хотя кредиторы могут установить конкретную форму оплаты, например только «наличными» либо только «по чеку или кредитной карте»."},{"t":"Закрытая экономика","en":"closed economy","d":"страна, не экспортирующая и не импортирующая товары и услуги."},{"t":"Запланированные инвестиции","en":"planned investment","d":"средства, которые фирмы планируют или намереваются инвестировать."},{"t":"Запретительное предписание","en":"cease-and-desist order","d":"распоряжение суда или правительственного ведомства (комиссии или министерства), обязывающее корпорацию или конкретное лицо прекратить специфический вид хозяйственной деятельности."},{"t":"Заработная плата","en":"wage","d":"цена за труд (использование трудовых услуг) за единицу времени (час, день и т.д.)."},{"t":"Заработок","en":"earnings","d":"денежный доход, получаемый работником; равен ставке заработной платы, умноженной на количество отработанного времени."},{"t":"Затратный метод определения ВВП","en":"expenditures approach","d":"метод измерения внутреннего валового продукта посредством суммирования всех затрат на производство конечных товаров и услуг."},{"t":"Затраты «на меню», или на переоценку","en":"menu costs","d":"нежелание фирм снижать цены в периоды рецессии (если они считают, что экономический спад будет краткосрочным) из-за расходов, которые потребуются на изменение цен и информирование об этом заинтересованных лиц. Термин пришел из ресторанов, где возникают дополнительные затраты, если надо напечатать новое меню."},{"t":"Защитная медицина","en":"defensive medicine","d":"рекомендации врачей о прохождении дополнительных тестов и процедур, которые с точки зрения медицины или экономически предназначены для защиты себя от последующих исков по поводу неправильного лечения."},{"t":"Защитная пошлина","en":"protective tariff","d":"пошлина (тариф), установленная с целью защиты внутренних производителей товара (или услуг) от конкуренции иностранных производителей."},{"t":"Земельная реформа","en":"land reform","d":"набор приемов, разработанный для более эффективного распределения прав собственности на землю в развивающихся странах; в каждой стране эти приемы могут быть своими и могут предусматривать самые разные подходы — от покупки правительством крупных поместий земли и раздела этих участков на небольшие фермы до консолидации крошечных участков, чтобы по лучить более эффективно действующие частные фермы."},{"t":"Землеемкий товар","en":"land-intensive commodity","d":"продукт, на производство которого требуется относительно боль шое количество земли (естественных ресурсов)."},{"t":"Земля","en":"land","d":"природные ресурсы (даровые блага природы), которые могут быть использованы для производства товаров и услуг."},{"t":"Золотой стандарт","en":"gold standard","d":"историческая международная валютная система, в соответствии с которой каждая страна выражала стоимость своих денежных единиц в определенном количестве золота, поддержи вала неизменное соотношение своего золотого запаса и массы денег в обращении и допускала свободный ввоз и вывоз золота."},{"t":"Игра с нулевой суммой","en":"zero-sum game","d":"в теории игр игра, при которой выигрыши (+) и убытки (—) в сумме дают ноль; выигрыш одной стороны равен проигрышу другой."},{"t":"Игра с одновременно осуществляемыми ходами","en":"simultaneous game","d":"в теории игр игра, при которой обе стороны выбирают свои стратегии и реализуют их одновременно."},{"t":"Игра с отрицательной суммой","en":"negative sum game","d":"в теории игр игра, при которой выигрыши (+) и потери (—) при сложении дают сумму меньше нуля; проигрыш одной стороны превышает выигрыш другой."},{"t":"Игра с положительной суммой","en":"positive-sum game","d":"в теории игр игра, при которой выигрыши (+) и потери (—) при сложении дают сумму выше нуля; проигрыш одной стороны ниже выигрыша другой."},{"t":"Игра с последовательно осуществляемыми ходами","en":"sequential game","d":"в теории игр игра, при которой стороны делают свои ходы по очереди, когда одна сторона, сделав первый ход, ждет хода другой стороны и т.д. Избыток — см. Излишек."},{"t":"Избыточная производственная мощность","en":"excess capacity","d":"часть заводских ресурсов, которые не используются, когда на рынке несовершенной конкуренции фирмы производят меньше, чем могли бы при минимальных совокупных средних затратах."},{"t":"Избыточные резервы","en":"excess reserves","d":"сумма, на которую фактические резервы банка или сберегательного учреждения превышают его обязательные резервы-, фактические резервы за вычетом обязательных резервов."},{"t":"Издержки добычи","en":"extraction cost","d":"все затраты, связанные с добычей природного ресурса и его подготовкой к последующей продаже."},{"t":"Издержки использования","en":"user cost","d":"альтернативные издержки добычи и продажи невозобновляемых ресурсов в настоящее время, вместо добычи и продажи в будущем; приведенная стоимость снижения будущих доходов, что происходит из-за того, что невозобновляемые ресурсы добываются и продаются сейчас, а не в буду щем."},{"t":"Издержки на рабочую силу в единице продукции","en":"unit labor cost","d":"затраты на рабочую силу в расчете на единицу продукции; равны ставке номинальной заработной платы, деленной на среднюю выработку работника."},{"t":"Издержки перелива","en":"spillover costs","d":"издержки производ ства продукта, которые несут не производители и потребители, а третья сторона без всякого их возмещения. Например, производитель ядохимикатов слил часть их в реку, в результате погибла рыба и, следовательно, пострадали люди, занимающиеся спортивной рыбалкой."},{"t":"Излишек","en":"surplus","d":"сумма, на которую объем предложения продукта превышает объем спроса на него при определенной (выше равновесной) цене."},{"t":"Излишек международного платежного баланса","en":"international balance-of-payments surplus","d":"см. Активное сальдо платежного баланса."},{"t":"Излишек счета движения капиталов и финансов","en":"capital and financial account deficit","d":"положительная сумма на счете движения капиталов и финансов в международном платежном балансе страны."},{"t":"Изменение запрашиваемого количества","en":"change in quantity demanded","d":"изменение количества продукта, которое потребители готовы и способны купить в результате изменения цены этого продукта."},{"t":"Изменение предложения","en":"change in supply","d":"изменение количества предложения товаров или услуг при любом уровне цен; смещение кривой предложения влево или вправо."},{"t":"Изменение предоставляемого количества","en":"change in quantity supplied","d":"изменение количества продукта, которое производители готовы и способны предложить на продажу в результате изменения цены этого продукта."},{"t":"Изменение спроса","en":"change in demand","d":"изменение количества спроса на товары или услуги при любом уровне цен; смещение кривой спроса влево или вправо."},{"t":"Изобретение","en":"invention","d":"открытие нового продукта или процесса благодаря воображению, нестандартному мышлению и экспериментированию, а также первое доказательство того, что эта новинка работоспособна."},{"t":"Изъятие, утечка","en":"leakage","d":"1) потенциальные расходы, изъятые из потока «доходы — расходы»: сбережения, налоговые платежи и импорт-, 2) изъятие средств, сокращающее кредитные возможности системы коммерческих банков."},{"t":"Иммиграция","en":"immigration","d":"приток людей в страну из другой страны. Иммигранты могут бьггь законными и незаконными."},{"t":"Иммобильность","en":"","d":"см. Отсутствие мобильности."},{"t":"Импорт","en":"imports","d":"расходы частных лиц, фирм и органов власти данной страны на приобретение товаров и услуг, произведенных в других странах."},{"t":"Импортная квота","en":"import quota","d":"вводимое страной ограничение объема (или общей стоимости) ввозимого из других стран товара в течение определенного периода."},{"t":"Импортная конкуренция","en":"import competition","d":"конкуренция, с которой сталкиваются фирмы одной страны, когда ей противостоят товары и услуги производителей из других стран."},{"t":"Импортная сделка","en":"import transaction","d":"закупка товаров или услуг, сокращающая количество иностранной валюты у отдельных лиц, фирм и правительства данной страны."},{"t":"Имущественный налог","en":"","d":"см. Налог на имущество."},{"t":"Инвестиции в человеческий капитал","en":"human-capital investment","d":"любые затраты, предпринятые для повышения образования, квалификации, улучшения здоровья работников или усиления мобильности рабочей силы и, таким образом, увеличения дохода от инвестиций."},{"t":"Инвестиции, инвестирование","en":"investment","d":"затраты на производство и накопление средств производства и увеличение материальных запасов."},{"t":"Инвестиционные банки","en":"investment bank","d":"фирмы, помогающие корпорациям и органам власти получать деньги при продаже акций и облигаций; также предоставляют консалтинговые услуги при корпоративных слияниях и поглощениях и услуги и рекомендации брокерского характера."},{"t":"Инвестиционные товары, средства производства","en":"capital goods, investment goods","d":"см. Капитал."},{"t":"Индекс Герфиндаля","en":"Herfindahl index","d":"показатель уровня концентрации и конкуренции в отрасли; рассчитывается как сумма квадратов долей рынка отдельных фирм."},{"t":"Индекс паритета","en":"parity ratio","d":"отношение цен на продукцию фермеров к ценам, по которым они приобретают несельскохозяйственную продукцию; служит основой для политики поддержания цен; измеряется в про центах."},{"t":"Индекс потребительских цен","en":"consumer price index, CPI","d":"индекс для измерения уровня цен некоторой определенной потребительской корзины, состоящей из основных потребительских товаров и услуг, которые покупает средний статистический потребитель."},{"t":"Индекс цен","en":"price index","d":"индекс, показывающий динамику изменения цены потребительской корзины во времени."},{"t":"Индексные фонды","en":"index funds","d":"взаимные фонды, которые выбирают акции или облигации для своих портфелей так, чтобы они точно соответствовали акционному или облигационному индексу (набору акций или облигаций, который, как считается, отражает общую динамику конкретной категории инвестиций), например Standard & Poor's 500 Index или Russel 3000."},{"t":"Индивидуальная частная фирма","en":"sole proprietorship","d":"неинкорпорированная фирма, которой владеет и управляет одно лицо."},{"t":"Индивидуальное предложение","en":"individual supply","d":"кривая предложения или график предложения отдельного продавца."},{"t":"Индивидуальный спрос","en":"individual demand","d":"кривая спроса или график спроса одного покупателя."},{"t":"Индустрия финансовых услуг","en":"financial service industry","d":"широкая категория, включающая фирмы, которые предоставляют финансовые продукты и услуги и помогают домохозяйствам и организациям бизнеса получать про центы, дивиденды, доходы от прироста капитала, стра ховаться от убытков и планировать свое обеспечении после выхода на пенсию. Среди участников этой ин дустрии можно выделить коммерческие банки, сберегательные учреждения, пенсионные фонды и страховые компании."},{"t":"Инновационный продукт","en":"product innovation","d":"развитие и продажа нового или усовершенствованного продукта (или услуги)."},{"t":"Инновация процесса","en":"process innovation","d":"разработка и применение нового или усовершенствованного способа производства или метода распределения продукции (или услуг)."},{"t":"Иностранная конкуренция","en":"foreign competition","d":"см. Импортная конкуренция."},{"t":"Инфлирование","en":"inflating","d":"исчисление реального ВВП путем увеличения денежной стоимости номинального ВВП, произведенного в году, когда цены были ниже, чем в базовом."},{"t":"Инфляционная премия","en":"inflation premium","d":"часть номинальной процентной ставки, отражающая ожидаемый уровень инфляции."},{"t":"Инфляционные ожидания","en":"inflationary expectations","d":"пред положения работников, фирм и потребителей о том, что в будущем возникнет значительная инфляция."},{"t":"Инфляционный разрыв","en":"inflationary expenditure gap","d":"величина, на которую кривая совокупных расходов должна сместиться вниз, чтобы номинальный В В П соответствовал уровню неинфляционного ВВП, произведенного при полной занятости ресурсов."},{"t":"Инфляция","en":"inflation","d":"повышение общего уровня цен в экономике."},{"t":"Инфляция издержек","en":"cost-push inflation","d":"повышение уровня цен (инфляция), возникающее в результате роста затрат, заработной платы и цен на сырье (и, соответственно, роста единичных зат рат), сопровождаемое сокращением совокупного (валового) продукта."},{"t":"Инфляция спроса","en":"demand-pull inflation","d":"повышение уровня цен (инфляция), вызываемое превышением спроса над предложением при данном уровне цен, вызванное увеличением совокупного спроса."},{"t":"Информационные технологии","en":"information technology","d":"новые и более эффективные методы доставки и получения информации при помощи компьютеров, факс-аппаратов, беспроводных телефонов и Интернета."},{"t":"Инфраструктура","en":"infrastructure","d":"капитальные сооружения, используемые гражданами и фирмами, обычно предоставляемые органами власти (автомагистрали, мосты, городские транспортные системы, водоочистные сооружения, муниципальные системы водоснабжения и аэропорты)."},{"t":"Ипотечный долговой кризис","en":"mortgage debt crisis","d":"период, начавшийся в конце г., когда тысячи домовла дельцев отказались платить по ипотечным кредитам, столкнувшись с комбинацией более высоких ипотечных процентных ставок и снижением цен на дома."},{"t":"Истощающие расходы","en":"exhaustive expenditures","d":"правительственные расходы, приводящие к непосредственному использованию экономических ресурсов и поглощению правительством товаров и услуг, произведенных из этих ресурсов; закупки, осуществляемые органами власти."},{"t":"Капитал","en":"capital","d":"ресурсы, созданные в результате производственной деятельности и используемые для производства товаров и услуг; товары, которые непосредственно не удовлетворяют потребностей человека: инвестиционные товары, средства производства."},{"t":"Капитализм","en":"capitalism","d":"экономическая система, в которой материальные ресурсы являются частной собственностью, а рынки и цены используются для направления и координации экономической деятельности."},{"t":"Капитализм свободной конкуренции","en":"laissez-fair capitalism","d":"см. Капитализм."},{"t":"Капиталоемкий товар","en":"capital-intensive commodity","d":"продукт, в производстве которого применяется относительно большое количество капитала."},{"t":"Капитальные активы","en":"capital stock","d":"весь капитал данной страны."},{"t":"Карта кривых безразличия","en":"indiffrence тар","d":"совокупность кривых безразличия, каждая из которых представляет разную степень полезности; все эти кривые вместе характеризуют предпочтения потребителя."},{"t":"Картель","en":"cartel","d":"формальное, совершенное в письменном виде или устное соглашение между фирмами отрасли об установлении цен на продукт, об объеме производства этих фирм либо о географическом разделе рынка для продаж продукции."},{"t":"Кассовая наличность","en":"vault cash', till money","d":"деньги, которые банк держит в своих сейфах и кассах."},{"t":"Квазигосударственный банк","en":"quasi-public bank","d":"банк, являющийся частной собственностью, но контролируемый правительством (обществом); федеральные резервные банки."},{"t":"Квазиобщественное, квазигосударственное благо","en":"quasipublic good","d":"товар или услуга, на которые может распространяться принцип исключения, но которые обеспечивают такие большие выгоды перелива, что правительство поощряет их производство для предотвращения неэффективности распределения ресурсов."},{"t":"Кейнсианство","en":"Keynesianism","d":"философские, идеологические взгляды и аналитические подходы, представленные в кейнсианской экономической теории."},{"t":"Классическая экономическая теория","en":"classical economics","d":"макроэкономическая теория, принятая многими экономистами до начала 1930-х гг., согласно которой капиталистическая экономика является саморегулирующейся и полностью использует свои ресурсы."},{"t":"Количественная полезность","en":"cardinal utility","d":"удовлетворение (полезность), которое можно измерить при помощи количественных числительных (1, 2, 3...), в отношении которых действуют все математические свойства чисел, такие как сложение, вычитание, умножение и деление."},{"t":"Коллективный голос","en":"collective voice","d":"функция, выполняемая профсоюзом от имени своих членов, когда он заявляет о своих проблемах администрации, предъявляет жалобы и добивается надлежащего решения этих проблем и удовлетворения жалоб."},{"t":"Командная система","en":"command system","d":"метод организации экономики, при которой собственность на ресурсы является общественной, а органы власти используют централизованное экономическое планирование для руководства и координирования экономических видов деятельности; командная экономика."},{"t":"Комбинация ресурсов, обеспечивающая максимальную прибыль","en":"profit-maximizing combination of resources","d":"количество каждого ресурса, которое фирма должна использовать, чтобы ее прибыль была максимальной или убытки минимальными; комбинация ресурсов, при которой предельный продукт в денежной форме каждого ресурса равен предельным издержкам на ресурс (его цене, если ресурс используется на конкурентном рынке)."},{"t":"Комбинация ресурсов, обеспечивающая наименьшие издержки","en":"least-cost combination of resources","d":"определенное количество каждого ресурса, которое фирма должна использовать для производства какого-либо объема продукции с наименьшими издержками; комбинация ресурсов, при которой отношение между предельным продуктом ресурса и предельными издержками на ресурс (его ценой, если ресурс используется на конкурентном рынке) одинаково для последнего доллара, затраченного на каждый применяемый ресурс."},{"t":"Коммерческий банк","en":"commercial bank","d":"фирма, занятая в банковском деле (принимает вклады, чековые вклады и предоставляет ссуды)."},{"t":"Коммунизм","en":"communism","d":"см. Командная система."},{"t":"Компания с ограниченной ответственностью","en":"lim ited-liability company","d":"компания, чьи владельцы защищены тем, что несут лишь ограниченную ответственность."},{"t":"Компромисс","en":"tradeoff","d":"отказ (жертва) от нескольких или даже от всех целей, товаров или услуг для достижения других целей, получения других товаров или услуг."},{"t":"Компромисс между равенством и эффективностью","en":"equality versus efficiency tradeoff","d":"снижение экономической эффективности, которое может сопровождать сужение неравенства доходов: предубеждение, согласно которому для достижения экономической эффективности необходимо некоторое неравенство доходов."},{"t":"Конгломератное слияние","en":"conglomerate merger","d":"слияние фирмы одной отрасли с фирмой другой отрасли (не являющейся ни поставщиком, ни клиентом, ни конкурентом) или региона."},{"t":"Конгломераты","en":"conglomerates","d":"фирмы, производящие товары и услуги в двух или более независимых отраслях."},{"t":"Конечные продукты и услуги","en":"final goods and services","d":"товары и услуги, купленные с целью их конечного использования, а не для перепродажи, переработки или дальнейшего использования в производственном процессе."},{"t":"Конкурентный рынок труда","en":"competitive labor market","d":"рынок, на котором большое количество фирм (без его вора между собой) предъявляют спрос на большое число работников, не являющихся членами профсоюза конкретных профессий."},{"t":"Конкуренция","en":"competition","d":"присутствие на рынке большого числа независимых покупателей и продавцов и возможность для покупателей и продавцов свободно входить на рынок и покидать его."},{"t":"Контроль обменного курса","en":"foreign exchange control","d":"см. Валютный контроль."},{"t":"Конфликты из-за бриллиантов","en":"conflict diamonds","d":"бриллианты, которые добываются и продаются участниками военных действий в Африке как способ получить денежные средства, необходимые им для ведения своих военных операций."},{"t":"Концепция паритета","en":"parity concept","d":"концепция, предполагающая, что данный реальный объем сельскохозяйственной продукции должен позволить фермеру из года в год приобретать одно и то же количество несельскохозяйственных товаров и услуг."},{"t":"Корпорация","en":"corporation","d":"юридическое лицо, получившее лицензию властей штата или федерального правительства и обособленное от индивидов, чьей собственностью корпорация является."},{"t":"Корреляция","en":"correlation","d":"систематическая и обусловленная связь между двумя рядами данных (двумя видами явлений); наличие корреляции само по себе не указывает на наличие причинной связи."},{"t":"Коррупция","en":"corruption","d":"злоупотребление полномочиями органа власти, предоставленными ее представителю, который стремится получить частную выгоду; в том числе получение платежей от отдельных лиц или компаний, чтобы те смогли добиться преимуществ за счет получения правительственных контрактов, избежать действия регулирующих норм, устанавливаемых правительством, или получить инсайдерскую информацию о предстоящих изменениях в политике."},{"t":"«Косвенное» производство","en":"roundabout production","d":"строительство и использование сооружений и капитального оборудования с целью поддержания производства потребительских товаров."},{"t":"Косвенные налоги на бизнес","en":"indirect business taxes","d":"налог с продаж, акцизный сбор, налог на имущество, оплата лицензий на ведение хозяйственной и производственной деятельности, а также различные тарифы, которые фирмы включают в издержки производства продукта и перекладывают (целиком или частично) на покупателя путем повышения цены продукта."},{"t":"Коэффициент воспроизводства населения","en":"replacement rate","d":"коэффициент рождаемости, необходимый для компенсации смертности людей в стране, чтобы поддерживать постоянной (без учета иммиграции) численность популяции. Для большинства стран коэффициент воспроизводства равен приблизительно 2,1 рождений в расчете на женщину за весь срок ее жизни."},{"t":"Коэффициент дискриминации","en":"discrimination coefficient","d":"мера стоимости или убытки из-за предубеждения; денежное выражение стоимости решения работодателя, которую он готов заплатить, когда нанимает того, кого предпочитает, а не другого работника."},{"t":"Коэффициент общей фертильности","en":"total fertility rate","d":"среднее общее число детей, которое женщина, как ожидается, родит за всю ее жизнь."},{"t":"Коэффициент эластичности","en":"elasticity coefficient","d":"результат деления процента изменения величины спроса (или предложения) на процент изменения цены товара."},{"t":"Коэффициент юнионизации","en":"unionization rate","d":"процент конкретной популяции работников, являющихся членами профсоюза; другими словами, процент работников, которых профсоюзы представляют при заключении коллективного договора."},{"t":"Краткосрочная фермерская проблема","en":"short-run farm problem","d":"резкие годовые колебания цен на продукцию и, соответственно, доходов фермеров."},{"t":"Краткосрочное конкурентное равновесие","en":"short-run competitive equilibrium","d":"цена, по которой общее количество продукта чисто (совершенно) конкурентной отрасли, предлагаемого в пределах кратковременного периода, равно общему количеству продукции, на которую предъявляется спрос, при одновременном равенстве этой цены средним переменным издержкам производства продукта или их превышении."},{"t":"Краткосрочный период","en":"short run","d":"1) в микроэкономике период, в течение которого производители продукта в состоянии изменить (использовать) какую-то часть применяемых ресурсов, но не все; период, в течение которого часть ресурсов (обычно предприятия) представляет собой основные средства, а другая часть — оборотные средства; 2) в макроэкономике период, в течение которого номинальная заработная плата и цены на другие ресурсы не меняются в ответ на изменение уровня цен."},{"t":"Кредит","en":"credit","d":"запись на бухгалтерском счете, свидетельствующая о том, что стоимость актива (например, иностранной валюты, являющейся собственностью гражданина данной страны) возросла."},{"t":"Кредитно-денежная политика","en":"monetary policy","d":"изменение предложения денег, производимое центральным банком с целью воздействия на ставку процента и достижения неинфляционного объема производства совокуйю го продукта при условии полной занятости."},{"t":"Кредитный потенциал банковской системы","en":"lending potential of the banking system","d":"сумма, на которую система коммерческих банков может увеличить предложение денег в обращении путем предоставления новых займов гражданам и фирмам (или приобретения у них ценных бумаг); сумма, равная избыточным резервам системы коммерческих банков, умноженным на величину денежного мультипликатора."},{"t":"Кредитный потенциал отдельного коммерческого банка","en":",lending potential of an individual commercial bank","d":"сумма, на которую отдельный коммерческий банк может без риска увеличить предложение денег в обращении путем предоставления новых займов гражданам и фирмам (или приобретения у них ценных бумаг); сумма, равная избыточным резервам этого коммерческого банка."},{"t":"Кредитный союз","en":"credit union","d":"ассоциация лиц, объединенных общими интересами (например, работники и служащие одной фирмы или члены одного профсоюза), которая продает своим членам акции (принимает от них вклады) и предоставляет им ссуды."},{"t":"Кривая безразличия","en":"indifference curve","d":"кривая, показывающая различные комбинации двух продуктов, имеющих одинаковое потребительское значение или ту же полезность для потребителя."},{"t":"Кривая долгосрочного совокупного предложения","en":"long-run aggregate supply curve","d":"применительно к макроэкономике, это кривая совокупного предложения, показывающая, что при смещении кривых совокупного спроса меняется цена, а реальный объем продукции остается неизменным; вертикальная кривая предложения, предполагающая полностью гибкие цены."},{"t":"Кривая краткосрочного предложения","en":"short-run supply curve","d":"кривая предложения, показывающая количество продукта фирмы из чисто конкурентной отрасли, предлагаемого для продажи по разным ценам в краткосрочном периоде; часть кривой краткосрочных предельных издержек фирмы, которая лежит выше кривой средних переменных издержек."},{"t":"Кривая краткосрочного предложения конкурентной отрасли","en":"competitive industry’s short-run supply curve","d":"горизонтальное смещение кривых краткосрочного предложения фирм в условиях отрасли с совершенной конкуренцией, кривая, показывающая общее количество продукции, которое фирмы одной отрасли предложат на рынках по разным ценам в течение краткосрочного периода."},{"t":"Кривая краткосрочного совокупного предложения","en":"short-run aggregate supply curve","d":"кривая совокупного предложения в периоде, в течение которого цены на ресурсы (в частности, номинальная заработная плата) остаются постоянными, а общий уровень цен изменяется."},{"t":"Кривая Лаффера","en":"Laffer curve","d":"кривая, показывающая связь между налоговыми ставками и объемом налоговых поступлений, выявляющая такую налоговую ставку (от нулевой до 100%), при которой налоговые поступления достигают максимума."},{"t":"Кривая Лоренца","en":"Lorenz curve","d":"кривая, которую можно использовать для иллюстрации распределения дохода в экономике; когда данную кривую используют с этой целью, суммарный процент семей (получателей доходов) измеряется по оси абсцисс, а суммарный процент доходов — по оси ординат."},{"t":"Кривая ожидаемой нормы доходности","en":"expected rate of return curve","d":"связанная с исследованиями и разработками (НИОКР) кривая, показывающая ожидаемый выигрыш в прибыли как процент от затрат на НИОКР от дополнительных средств, затрачиваемых на НИОКР."},{"t":"Кривая предложения","en":"supply curve","d":"кривая, показывающая объем предложения товаров или услуг."},{"t":"Кривая предложения экспорта","en":"export supply curve","d":"снижающаяся кривая, показывающая объем продукта, который будут экспортировать национальные фирмы при определенном уровне мировых цен, превышающем уровень внутренней цены продукта."},{"t":"Кривая производственных возможностей","en":"production possibilities curve","d":"кривая, показывающая различные комбинации двух товаров или услуг, которые могут быть произведены в условиях полной занятости и полного объема продукции в экономике с постоянными запасами ресурсов и неизменной технологией."},{"t":"Кривая спроса","en":"demand curve","d":"кривая (график), показывающая, какое количество определенного товара или услуги покупатели готовы приобрести, т.е. каков спрос."},{"t":"Кривая спроса на инвестиции","en":"investment-demand curve","d":"кривая (график), показывающая динамику процентной ставки (по оси ординат) и объем инвестиций при разных реальных процентных ставках (по оси абсцисс)."},{"t":"Кривая спроса ни импорт","en":"import demand curve","d":"снижающаяся кривая, где отражается объем продукции, который будет импортироваться при конкретном уровне мировых цен, если они ниже внутренних цен на определенный вид продукта."},{"t":"Кривая текущего совокупного предложения","en":"immediate-short-run aggregate supply curve","d":"кривая совокупного предложения, показывающая, что при смещении кривых совокупного спроса меняется реальный объем продукции, но ценовой уровень остается прежним; горизонтальная кривая совокупного предложения, вызванная негибким ценовым уровнем."},{"t":"Кривая Филлипса","en":"Phillips curve","d":"кривая, показывающая связь между уровнем безработицы (по оси абсцисс) и годовым темпом роста уровня цен (по оси ординат)."},{"t":"Курс обмена валюты","en":"rate of exchange","d":"цена, уплачиваемая в собственной валюте за единицу иностранной валюты; курс, по которому валюта одной страны обменивается на валюту другой страны."},{"t":"Легальный иммигрант","en":"legal immigrant","d":"лицо, легально прибывающее в страну с целью проживания."},{"t":"Ликвидность","en":"liquidity","d":"активы, которые можно быстро и легко превратить в наличные деньги без потери или при небольшой потере их покупательной способности. Самым высоколиквидным активом являются деньги."},{"t":"Линия рынка ценных бумаг","en":"Security M arket Line, SM L","d":"линия, которая показывает среднюю ожидаемую норму доходности по всем финансовым инвестициям при каждом уровне недиверсифицируемого риска, измеряемого бетой."},{"t":"Линия с наклоном в 45°, биссектриса","en":"45-degree line","d":"прямая, указывающая на равенство стоимости ВВП (по оси абсцисс) и совокупных расходов (по оси ординат)."},{"t":"Лицензирование работников","en":"occupational licensure","d":"законы правительств или местных органов власти, требу ющие, чтобы работник соответствовал определенным требованиям и получал от специального бюро разрешение на определенную профессию."},{"t":"Личное распределение дохода","en":"personal distribution of income","d":"способ распределения получаемого в стране личного или располагаемого дохода (после уплаты налогов) между различными категориями доходополучателей или домохозяйств."},{"t":"Личные потребительские расходы","en":"personal consumption expenditures","d":"расходы домохозяйств на потребительские товары, товары длительного и кратковременного пользования и услуги."},{"t":"Личные сбережения","en":"personal saving","d":"личный доход домохозяйств минус налог на него и минус расходы на личное потребление: часть располагаемого дохода (после уплаты налогов), которая не израсходована на потребительские товары."},{"t":"Личный доход","en":"personal income, РГ","d":"доход, часть которого заработана, а другая часть не заработана, находящийся в распоряжении граждан до уплаты личного подоходного налога."},{"t":"Личный подоходный налог","en":"personal income tax","d":"налог, которым облагается подлежащий налогообложению доход отдельных лиц, домохозяйств и неинкорпорированных фирм. Локаут — см. Массовые увольнения."},{"t":"Ломаная кривая спроса","en":"kinked demand curve","d":"кривая спроса, который был бы желателен для олигополиста, не участвующего в сговоре; такая кривая спроса основана на допущении, что соперничающие фирмы присоединятся к решению о снижении цен, но не последуют решению о повышении цен."},{"t":"Макроэкономика","en":"macroeconomics","d":"раздел экономической науки, исследующий экономику как целое, а также ее важнейшие составляющие: домохозяйство, компании и государственный сектор, использующие для этого общие (совокупные) экономические показатели."},{"t":"Маржинальный анализ","en":"marginal analysis","d":"подход, при котором для принятия решений производители проводят сравнение предельных («дополнительных») доходов и предельных издержек."},{"t":"Массовые увольнения","en":"lockout","d":"действия фирмы, запрещающие работникам вернуться на свои рабочие места до подписания нового коллективного договора; средство переноса расходов (утраченной заработной платы) на профсоюзы в переговорах по поводу заключения коллективного договора."},{"t":"МВФ","en":"IMF","d":"см. Международный валютный фонд."},{"t":"Межвременной выбор","en":"intertemporal choice","d":"выбор между преимуществами, получаемыми в один временной период, и выигрышем, достигаемым в более поздний временной период; сравнение, которое отдельные люди и общество в целом должны делать, чтобы сократить текущее потребление, что необходимо для финансирования текущих инвестиций и достижения более высоких уровней будущих потреблений, которые могут обеспечить эти нынешние инвестиции."},{"t":"Международная стоимость доллара","en":"international value of the dollar","d":"цена, которую надо заплатить в иностранной валюте для получения американского доллара."},{"t":"Международные валютные резервы","en":"international monetary reserves","d":"иностранные валюты и другие активы, например золото, которые страна может использовать для покрытия дефицита платежного баланса."},{"t":"Международный валютный рынок","en":"foreign exchange market","d":"рынок, на котором валюта одной страны может быть использована для приобретения (обмена) на валюту другой страны."},{"t":"Международный валютный фонд","en":"International Monetary Fund, IMF","d":"международная ассоциация государств, образовавшаяся после Второй мировой войны для предоставления займов в иностранной валюте странам с временным дефицитом платежного баланса (это практиковалось лишь до начала 1970-х гг.) и для осуществления мер по поддержанию валютных курсов. Сегодня МВФ в основном предоставляет займы странам, которым угрожает дефолт по государственным и частным займам."},{"t":"Межотраслевая конкуренция","en":"interindustry competition","d":"конкуренция между продукцией, производимой фирмами одной отрасли, и продукцией, производимой фирмами другой отрасли (или других отраслей)."},{"t":"Метод сопоставления расходов и объема производства","en":"expenditures-output approach","d":"см. Метод сопоставления совокупных расходов и внутреннего продукта."},{"t":"Метод сопоставления совокупных расходов и внутреннего продукта","en":"aggregate expenditures-domestic output approach","d":"выявление равновесного ВВП путем определения объема реального ВВП, при котором совокупные расходы равны внутреннему продукту."},{"t":"Механизм добровольного увольнения","en":"exit mechanism","d":"уход работника с одного места работы и поиск им другого с целью улучшения условий найма."},{"t":"Механизм устных контактов","en":"voice mechanism","d":"форма общения работников с предпринимателем через посредничество профсоюза с целью улучшения условий труда и удовлетворения жалоб."},{"t":"Микроэкономика","en":"microeconomics","d":"раздел экономической науки, исследующий такие обособленные экономические единицы, как отрасли, фирмы, домохозяйства, а также отдельные рынки, конкретные цены и конкретные товары и услуги."},{"t":"Минимальная заработная плата","en":"minimum wage","d":"самая низкая заработная плата (ее ставка), которую предприниматели на законных основаниях выплачивают за час работы."},{"t":"Минимальный эффективный размер","en":"minimum efficient scale, M ES","d":"наименьший объем продукции, при кото ром фирма в состоянии минимизировать свои долгосрочные средние издержки."},{"t":"Мировая цена","en":"world price","d":"цена мирового рынка на товар или услугу, определяемая на основе соотношения мирового спроса и предложения."},{"t":"Многонациональная корпорация","en":"multinational corporation","d":"фирма, которая владеет производственными подразделениями в других странах, производит и продает свою продукцию за границей."},{"t":"Модель вытеснения при выборе профессии","en":"crowding model of occupational discrimination","d":"модель рынков рабочей силы, согласно которой из-за дискриминации в выборе профессии женщины и чернокожие не допускаются к не которым профессиям и вынуждены концентрироваться в ограниченном числе других профессий, в результате чего в них образуется чрезмерное предложение рабочей силы (по сравнению со спросом), обусловливающее там низкую заработную плату и низкие доходы."},{"t":"Модель избирателя-центриста","en":"median-voter modeГ","d":"концепция, согласно которой в условиях действия прин ципа большинства избиратель-центрист (медианный) обладает решающей возможностью определять исход выборов."},{"t":"Модель кругооборота","en":"circular flow model","d":"движение (поток) ресурсов от домохозяйств в направлении фирм и продуктов — от фирм в направлении домашних хозяйств."},{"t":"Модель предпочтения дискриминации","en":"taste-for-discimina - tion model","d":"теория дискриминации, согласно кото Глоссарий рой дискриминация представляет собой предпочтение, за которое работодатель готов заплатить."},{"t":"Молчаливый сговор","en":"tacit collusion","d":"применяемый олигополией, основанной на тайном сговоре, метод установления цен, объема продукции для каждой фирмы, не вступившей в прямой (открытый) сговор; распространенным примером молчаливого сговора служит ценовое лидерство."},{"t":"Монетаризм","en":"monetarism","d":"макроэкономические воззрения, в соответствии с которыми изменения совокупного объема продукта и уровень цен изменяются в зависимости от изменений предложения денег, опирается на монетарное правило."},{"t":"Монетарное правило","en":"monetary rule","d":"правило, сформулированное сторонниками монетаризма, масса денег в обращении должна ежегодно увеличиваться темпами, равными потенциальному темпу роста реального ВВП, и устойчиво возрастать темпом от 3 до 5%. См. также Правило Тейлора."},{"t":"Монополистическая конкуренция","en":"monopolistic competi tion","d":"рынок, на котором многие фирмы продают диф ференцированный продукт, рынок, доступ на который относительно свободен; рынок, на котором фирма обладает известным контролем над ценой продажи производимого ею товара и действует значительная неценовая конкуренция."},{"t":"Монополия","en":"monopoly","d":"рынок, на котором число продавцов столь незначительно, что каждый из них способен повлиять на общий объем предложения и цену товара или услуги. См. также Чистая (абсолютная) монополия."},{"t":"Монопсония","en":"monopsony","d":"рынок, на котором есть лишь один покупатель товара, услуги или ресурса."},{"t":"Моральный аспект проблемы риска","en":"moral hazard prob lem","d":"вероятность того, что индивиды или организации могут изменить свое поведение так, что оно перестанет соответствовать условиям контракта или соглашения. Например, банк, чьи депозиты застрахованы от убытков, может осуществлять рискованные инвестиции и выдавать рискованные кредиты."},{"t":"Мотивационные схемы оплаты","en":"incentive p a y plan","d":"схема компенсации, согласно которой оплата труда работника непосредственно связана с выпуском продукции. Такие схемы обычно включают тарифные ставки, премии, опционы на акции, комиссионные и долю в прибыли."},{"t":"Мультипликатор","en":"multiplier","d":"отношение изменения равновесного ВВП к изменению объема инвестиций или любого другого компонента кривой совокупных р а сходов или совокупного спроса, число, на которое следует умножить изменение любого компонента совокупных расходов или совокупного спроса, чтобы получить результирующее изменение равновесного ВВП."},{"t":"Мультипликатор чекового депозита","en":"checkable-deposit multiplier","d":"см. Денежный мультипликатор."},{"t":"Н ДС","en":"","d":"см. Налог на добавленную стоимость."},{"t":"Надбавка, учитывающая изменение прожиточного минимума","en":"cost-of-living adjustment, COLA","d":"автоматическое увеличение доходов (заработной платы) работников в условиях, когда экономика находится в состоянии инфляции, гарантированное соответствующей статьей в коллективном договоре с предпринимателем."},{"t":"Наклон прямой","en":"slope of a line","d":"отношение изменения по вертикали (повышения или понижения) к изменению по горизонтали (отрезка) при передвижении между двумя точками на линии; восходящий наклон линии положителен и отражает прямую связь между двумя переменными; нисходящий наклон линии отрицателен и отражает обратную связь между двумя переменными."},{"t":"Накопление капитала внутри страны","en":"domestic capital formation","d":"пополнение запасов капитала страны путем накопления и инвестирования части произведенной в ней продукции."},{"t":"Налог","en":"tax","d":"принудительная выплата правительству домохозяйством или фирмой денег (или передача товаров и услуг), в обмен на которую домохозяйство или фирма непосредственно не получают никаких товаров или услуг."},{"t":"Налог на добавленную стоимость","en":"value-added tax, VAT","d":"налог на разницу между стоимостью проданных фирмой товаров и стоимостью товаров, купленных фирмой у других фирм для производства продукта."},{"t":"Налог на имущество","en":"prorerty tax","d":"налог на собственность (капитал, земля, акции, облигации и другие акт ивы), которой владеют фирмы и домохозяйства."},{"t":"Налог на прибыль корпораций","en":"corporate income tax","d":"налог на чистый доход (прибыль) корпораций."},{"t":"Налог на фонд заработной платы","en":"payroll tax","d":"налог на нанимателей рабочей силы, составляющий определенный процент всей или части суммы выплаченных ими заработной платы и жалованья, а также налог на работников, составляющий определенный процент всей или части суммы получаемых ими заработной платы и жалованья."},{"t":"Налог с продаж","en":"sales tax","d":"налог, которым облагаются покупки (в розничной торговле) большой группы товаров."},{"t":"Налоги и трансфертные платежи как антистимулы","en":"tax-transfer disincentives","d":"ослабление стимулов к труду, сбережениям, инвестированию, инновациям и риску, которое, как утверждают, является следствием высоких предельных налоговых ставок и программ трансфертных платежей."},{"t":"Налоги на производство и импорт","en":"taxes on production and import","d":"категория счета национального дохода, включающая такие составляющие, как налоги на продажи, акцизы, налоги на собственность бизнеса, лицен зионные платежи и пошлины, фирмы рассматривают их как издержки производства продукта и перекладывают (полностью или частично) на покупателей, устанавливая на свои товары более высокие цены."},{"t":"Налоговая льгота","en":"tax subsidy","d":"субсидирование путем установления благоприятных условий налогообложения; например, платежи нанимателя рабочей силы на страхование здоровья работников вычитаются из федеральных налогов на доходы и заработную плату."},{"t":"Налоговая льгота на заработанный доход","en":"earned income tax credit","d":"федеральная льгота в виде возврата части налога, предоставляемая семьям с низкими доходами с целью привлечения их к участию в рабочей силе."},{"t":"Нарицательная (номинальная) стоимость","en":"face value","d":"обозначенная на монете или бумажных деньгах стоимость, выраженная в долларах или центах."},{"t":"Нарушения (сбои, несовершенства) рыночного механизма","en":"market failure","d":"неспособность рыночного механизма обеспечить такое распределение ресурсов, которое в наилучшей степени соответствовало бы потребностям общества. Это выражается, в частности, в недостаточном или избыточном вложении ресурсов в произвол-: ство тех или иных товаров и услуг под воздействием эффектов перелива или проблем доступа к информации, а также в трудностях, связанных с обеспечением ресурсами производства общественных товаров."},{"t":"Научный метод","en":"scientific method","d":"процедура система тического поиска знания, включающего наблюдение фактов и формулирование и тестирование гипотез с целью разработки теорий, принципов и законов."},{"t":"Национальная администрация кредитных союзов","en":"N ational Credit Union Adminiistration, NCUA","d":"агентство федерального уровня, страхующее депозитные обязательства (до тыс. долл. на один счет) кредитных союзов."},{"t":"Национальное управление по трудовым отношениям","en":"N ational Labor Relations Board, NLRB","d":"управление, учрежденное на основе Национального закона о трудовых отношениях от г. и уполномоченное расследовать нечестную практику в трудовых отношениях, издавать предписания о прекращении незаконных действий и про водить голосование среди работников и служащих для определения того, желают ли они, чтобы их интересы представлял профсоюз."},{"t":"Национальный банк","en":"National bank","d":"коммерческий банк, имеющий лицензию правительства США."},{"t":"Национальный доход","en":"national income","d":"общий доход, полученный поставщиками ресурсов за их вклад в производство валового внутреннего продукта; равен ВВП за вычетом платежей, не связанных с доходом, и чистого дохода, заработанного в США иностранцами."},{"t":"Национальный закон о трудовых отношениях","en":"закон Вагнера) от 1935 г. (National Labor Relations Act, Wagner Act, 1935","d":"основной федеральный закон (с учетом корректировок), регулирующий трудовые отношения в США; определил основные права профсоюзов и администрации; определил и запретил нечестные действия профсоюзов и администрации в трудовых отношениях; учредил Национальное управление по трудовым отношениям."},{"t":"Не связанные с доходом факторы потребления и сбережений","en":"nonincome determinants of consumption and saving","d":"все факторы, кроме уровня ВВП, влияющие на объем потребительских расходов и сбережений. «Невидимая рука» (invisible hand) — стремление фирм и поставщиков ресурсов получить наибольшую выгоду на конкурентных рынках с целью наилучшего обеспечения интересов общества в целом."},{"t":"Невозвратные издержки","en":"sunk cost","d":"понесенн
