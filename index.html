ые затраты, которые не могут быть возвращены."},{"t":"Невозобновляемые природные ресурсы","en":"nonrenewable natu ral resources","d":"такие составляющие природы, как нефть, природный газ и металлы, которые либо действительно имеют постоянное предложение, либо возобновляются так медленно, что фактически их предложение является постоянным, если рассматривать его в перспективе жизни людей."},{"t":"Негибкие цены","en":"inflexible prices","d":"цены продуктов, которые не меняются, по крайней мере в течение какого-то времени), при изменении спроса или предложения; также называются твердыми, или жесткими, ценами."},{"t":"Недиверсифицируемый риск","en":"nondiversifiable risk","d":"инвестиционный риск, который инвесторы не способны снизить при помощи диверсификации; также называется системным риском."},{"t":"Недискреционная фискальная политика","en":"nondiscretionary fiscal policy","d":"см. Встроенный стабилизатор."},{"t":"Независимая переменная","en":"independent variable","d":"переменная, вызывающая изменение какой-либо другой (зависимой) переменной."},{"t":"Независимые профсоюзы","en":"independent unions","d":"профсоюзы США, организационно не связанные с AFL-CIO."},{"t":"Независимые товары","en":"independent goods","d":"товары или услуги, между ценами и спросом на которые нет связи, например, когда цена на один товар повышается или снижается, а спрос на другой товар остается неизменным."},{"t":"Незанятость ресурсов","en":"","d":"см. Безработица."},{"t":"Незапланированное изменение запасов","en":"unplanned changes in inventories","d":"изменения запасов, которые фирмы не планировали; изменения запасов, произошедшие из-за неожиданных повышений или снижений совокупных расходов."},{"t":"Незапланированные инвестиции","en":"unplanned investment","d":"фактический объем инвестиций минус запланированные инвестиции, увеличение или сокращение товарноматериальных запасов фирм, являющееся следствием превышения объема производства над объемом продаж."},{"t":"Неинвестиционная сделка","en":"noninvestment transaction","d":"расходы на приобретение акций, облигаций или подержанных средств производства."},{"t":"Неисключаемость","en":"nonexcludability","d":"неспособность не допустить неплательщиков («зайцев») к получению выгод от некоторых товаров; свойство, характерное для общественного товара."},{"t":"Неистощающие расходы","en":"nonexhaustive expenditure","d":"расходы органов власти, непосредственно не влекущие за собой использование экономических ресурсов или производство товаров или услуг. См. Трансфертные платежи органов власти."},{"t":"Неконкурирующие группы","en":"noncompeting groups","d":"группы работников, не борющиеся друг с другом за место ра боты внутри страны в силу того, что мастерство и ква лификация работников одной группы существенно от личаются от мастерства и квалификации работников других групп."},{"t":"Нелегальный иммигрант","en":"illegal immigrant","d":"лицо, незаконно въезжающее в страну с целью проживания в ней."},{"t":"Неограниченная ответственность","en":"unlimited liability","d":"отсутствие какого-либо предела убытков, которые отдельное лицо (обычно владелец компании) может понести и которые оно по закону должно взять на себя."},{"t":"Неоклассическая экономическая теория","en":"new classical economics","d":"теория, согласно которой непредвиденные изменения уровня цен способны породить макроэкономическую нестабильность в кратковременном периоде; в долговременном периоде экономика сохраняет стабильность при производстве внутреннего продукта, обеспечивающем полную занятость ресурсов благодаря тому, что цены и заработная плата автоматически корректируют отклонения от полной занятости ресурсов; неинфляционное производство."},{"t":"Неполная занятость","en":"","d":"см. Неполное использование ресурсов."},{"t":"Неполное использование ресурсов","en":"underemployment","d":"1) неспособность экономики произвести максимальное количество товаров и услуг из используемых ресурсов; неспособность экономики обеспечить полный объем производства, 2) ситуация, когда работники заняты на таких работах, где требуется более низкий уровень образования и профессиональной подготовки, чем у них имеется."},{"t":"Непредвиденная инфляция","en":"unanticipated inflation","d":"повышение уровня цен (инфляция) выше, чем ожидалось."},{"t":"Непредсказуемость законов Вселенной","en":"capricious universe view","d":"точка зрения ряда людей, считающих, что полученные ими экономические результаты в первую очередь определяют судьба и внешние события, а не упорный труд и предпринимательский подход."},{"t":"Непроцентные параметры инвестиций","en":"noninterest deter minants of investment","d":"все параметры, влияющие на уровень инвестиционных расходов, кроме ставки процента."},{"t":"Неравенство доходов","en":"income inequality","d":"неравное распределение совокупного произведенного в стране дохода между отдельными лицами или семьями."},{"t":"Неразменные бумажные деньги","en":"fiat money","d":"все, что государство законодательно установило в качестве средства платежа, или денег."},{"t":"Нераспределенные прибыли корпораций","en":"undistributed corporate profits","d":"прибыли корпораций после уплаты налогов, не распределенные в форме дивидендов между акционерами; сбережения корпораций и других частных фирм; также называются нераспределенными доходами."},{"t":"Нереализованные ожидания","en":"unfulfilled expectations","d":"ситуации, при которых домохозяйства и организации бизнеса ожидали одного, но вместо этого видят, что случилось что-то другое; нереализованные прогнозы или планы, связанные с будущими экономическими условиями или результатами."},{"t":"Несовершенная конкуренция","en":"imperfect competition","d":"все рынки, за исключением тех, на которых действует совершенная конкуренция, включая монополии, монополистическую конкуренцию и олигополию."},{"t":"Несостоятельность в координации","en":"coordination failure","d":"ситуация, в которой люди не могут достигнуть взаимовыгодных целей, поскольку не в состоянии каким-либо образом скоординировать свои действия; возможная причина макроэкономической нестабильности."},{"t":"Нестрахуемый риск","en":"uninsurable risk","d":"неконтролируемое и непредсказуемое событие, которое может повлечь за собой убытки; страховые компании не хотят страховать такие убытки."},{"t":"Нетарифные барьеры","en":"nontariff barriers","d":"все виды барьеров (за исключением протекционистских тари фов), которые вводят государства с целью воспрепятствовать торговле между странами: импортные квоты, специальные лицензии, необоснованные стандарты на качество товаров, бюрократическая волокита при осуществлении таможенных процедур."},{"t":"Неценовая конкуренция","en":"nonprice competition","d":"применяемые фирмами способы выделения своего продукта; к этим способам относятся конкуренция в области дифференциации продуктов и реклама."},{"t":"Неэластичное предложение","en":"inelastic supply","d":"коэффициент эластичности предложения продукта или ресурса меньше единицы; процентное изменение цены продукта больше процентного изменения объема предложения."},{"t":"Неэластичный спрос","en":"inelastic demand","d":"коэффициент эластичности спроса на продукт или ресурс меньше единицы; процентное изменение цены продукта больше процентного изменения спроса."},{"t":"Низкокачественные ипотечные кредиты","en":"subprime mortgage loan","d":"кредиты с высокой процентной ставкой, предоставляемые покупателям домов, у которых кредитный риск выше среднего."},{"t":"Низшая точка спада","en":"trough","d":"точка бизнес-цикла, при которой бизнес-активность достигает временного минимума; точка, в которой рецессия заканчивается и начинается экспансия (восстановление)."},{"t":"Низший предел цены","en":"price floor","d":"минимальная цена, установленная правительством и превышающая равновесную цену."},{"t":"НИОКР","en":"R&D","d":"научно-исследовательские и опытноконструкторские разработки с целью продвижения технического прогресса."},{"t":"Нововведение","en":"innovation","d":"запуск в производство нового продукта, внедрение нового производственного метода или применение новой формы организации бизнеса."},{"t":"Новое предприятие","en":"startup (firm)","d":"новая фирма, нацеленная на создание и внедрение на рынок нового продукта либо разрабатывающая новое производство или метод распределения (торговли)."},{"t":"Номинальная заработная плата","en":"nominal wage","d":"количество денег, получаемое работником за единицу рабочего времени (час, день и т.д.)."},{"t":"Номинальная процентная ставка","en":"nominal interest rate","d":"ставка процента, выраженная в долларах по текущему курсу, включая инфляционную премию."},{"t":"Номинальный валовой внутренний продукт","en":"nominal gross domestic output","d":"ВВП, выраженный в текущих ценах на момент измерения (без поправок на инфляцию)."},{"t":"Номинальный доход","en":"nominal income","d":"количество денег, полученных отдельными лицами или группами лиц в течение определенного периода."},{"t":"Норма выручки","en":"rate of return","d":"приток чистого дохода, деленный на стоимость инвестиций или затраты на R&D; выражается в виде процента."},{"t":"Нормальная прибыль","en":"normal profit","d":"платежи, которые должна осуществлять фирма, чтобы приобрести и удержать человека, обладающего предпринимательской способностью-, минимальная плата (доход) за предпринимательскую способность, стимулирующая ее применение в предпринимательской деятельности фирмы."},{"t":"Нормальный товар","en":"normal good","d":"товар или услуга, которые потребитель готов покупать в большем (меньшем) количестве при постоянной цене, когда его доход увеличивается (сокращается)."},{"t":"Нормативная экономика","en":"normative economics","d":"направление экономической науки, основанное на оценочных суждениях людей относительно того, какой должна быть экономика; трактует проблемы экономических целей и их достижения средствами экономической политики."},{"t":"Обесценение валюты","en":"currency depreciation","d":"см. Повышение обменного курса."},{"t":"Обесценение доллара","en":"depreciation of the dollar","d":"понижение курса доллара по отношению к другой валюте, когда за доллар дают меньшее количество иностранной валюты и, следовательно, иностранных товаров."},{"t":"Облигация","en":"bond","d":"финансовый инструмент, при помощи которого заемщик (фирма или орган власти) обязуется выплатить основную сумму долга и проценты по кредиту к определенной дате в будущем."},{"t":"Обменный курс","en":"rate of exchange","d":"см. Курс обмена валюты."},{"t":"Обменный курс с управляемыми колебаниями","en":"managed floating exchange rate","d":"обменный курс валюты, которому разрешается меняться («плавать») в результате изменения предложения валюты и спроса на нее, иногда он контролируется (регулируется) правительством путем покупки и продажи конкретной валюты."},{"t":"Обобщение","en":"generalization","d":"утверждение о характере связи между двумя или более совокупностями фактов."},{"t":"Обратная дискриминация","en":"reverse discrimination","d":"концепция, специальные преференции, сопровождающие программу позитивных действий, представляют собой дискриминационные действия в отношении других людей."},{"t":"Обратная зависимость","en":"inverse relationship","d":"два ряда переменных, изменяющихся в противоположных направлениях; например, цена продукта и величина спроса."},{"t":"Обратный поток","en":"backflow","d":"возвращение работников в страны, из которых они первоначально эмигрировали."},{"t":"Обучение в ходе действия","en":"learning by doing","d":"повышение производительности и снижение общих средних издержек благодаря приобретению знаний, навыков и умений за счет неоднократного выполнения одной и той же задачи; источник получения экономии за счет масштаба."},{"t":"Общественное (социальное) благо (товар)","en":"public good","d":"неделимый товар или услуга, которому присущи свойства неисключаемости и отсутствия соперничества, производство которого обеспечивается государством."},{"t":"Общественные инвестиции","en":"public investments","d":"расходы органов власти на общественный капитал (такой, как дороги, шоссе, мосты, системы массовой перевозки людей и предприятия, связанные с генерированием и поставками электричества) и человеческий капитал (такие, как образование, профессиональная подготовка и здравоохранение)."},{"t":"Объединенный экономический комитет","en":"Joint Economic Committee, JEQ","d":"комитет, состоящий из сенаторов и членов палаты представителей, занимающийся исследованиями экономических проблем национального масштаба."},{"t":"Объем продукции страны","en":"domestic output","d":"валовой (или чистый) внутренний продукт; общий объем готовых товаров и услуг, выпущенных в стране."},{"t":"Обязательные резервы","en":"required reserves","d":"установленный законом резерв, который должны иметь банки или сберегательные учреждения на счетах в федеральном р е зервном банке (или в виде кассовой наличности), чтобы отвечать резервным требованиям, устанавливается в виде процента к объему их чековых депозитов."},{"t":"Ограниченная ответственность","en":"limited liability","d":"ограничение максимального размера потерь заранее установленным пределом, которые могут понести владельцы (акционеры) корпорации; максимальная сумма потерь равна сумме, уплаченной ими за свой пакет акций."},{"t":"Одновременное потребление","en":"simultaneous consumption","d":"способность продукта удовлетворять одновременно интересы большого числа потребителей."},{"t":"Одноразовая игра","en":"one-time game","d":"в теории игр игра, при которой стороны выбирают свои оптимальные стратегии в ходе единственного временного периода, не рассматривая возможного взаимодействия в последующие временные периоды."},{"t":"Однородная олигополия","en":"","d":"см. Гомогенная олигополия."},{"t":"Ожидаемая инфляция","en":"anticipated inflation","d":"повышение уровня цен, равного ожидавшемуся темпу прироста инфляции."},{"t":"Ожидаемая норма чистой прибыли","en":"expected rate of return","d":"прирост годовой прибыли, которую фирма рассчитывает получить путем приобретения капитала (или участия в научно-исследовательских разработках), выражается в процентном отношении к затратам на инвес тиционную деятельность (или научные исследования и разработки)."},{"t":"Ожидания","en":"expectations","d":"представления потребителей и фирм о том, какие условия сложатся в будущем."},{"t":"Олигополия","en":"oligopoly","d":"рынок, на котором несколько фирм продают стандартизованные или дифференцированные продукты, рынок, доступ на который другим фирмам затруднен и на котором контроль над ценами на продукцию ограничен взаимозависимостью фирм (за исключением тех случаев, когда имеется сговор) и на котором обычно действует сильная неценовая конкуренция."},{"t":"Олигополия, не базирующаяся на сговоре","en":"noncollusive oligopoly","d":"олигополия, в которой фирмы не действуют совместно и в сговоре с целью установления цен и объема производства каждой фирмы."},{"t":"Операции на открытом рынке","en":"open-market operations","d":"скупка и продажа ценных бумаг правительства США федеральными резервными банками с целью проведения кредитно-денежной политики."},{"t":"Оптимальное ослабление внешнего эффекта","en":"optimal reduction of an externality","d":"снижение силы отрицательной экстерналии, например загрязнения окружающей сре ды до такого уровня, при котором предельные выгоды от ослабления и предельные издержки на его осуществление становятся равными."},{"t":"Оптимальный объем расходов на НИОКР","en":"optimal amount of R&D","d":"количество средств, выделяемых на НИОКР, при котором предельные выгоды от НИОКР и предельные издержки на НИОКР становятся равными."},{"t":"Организация по поддержанию здоровья","en":"health maintenance organization, НМО","d":"организация, осуществляющая контакты с работодателями, страховыми компаниями, профессиональными союзами и правительственными союзами для обеспечения возможности поддержания здоровья их работников или иных застрахованных пользователей."},{"t":"Организация приоритетного провайдера","en":"preferred provider organization, РРО","d":"врачи и больницы, согласившиеся предоставлять медицинскую помощь тем, кто приобрел страховку на условиях, урегулированных со страховщиком."},{"t":"Организация стран — экспортеров нефти (ОПЕК)","en":"OPEC","d":"картель, состоящий в настоящее время из 11 стран — производителей нефти (Алжир, Индонезия, Иран, Ирак, Кувейт, Ливия, Нигерия, Катар, Саудовская Аравия, Венесуэла и Объединенные Арабские Эмираты) с целью контроля за ценами, по которым они продают сырую нефть ее импортерам, и объемом осуществляемого членами ОПЕК экспорта нефти; картель стран, на долю которых приходится около 60% мирового экспорта нефти."},{"t":"Основной капитал","en":"","d":"см. Капитальные активы."},{"t":"Открытая экономика","en":"open economy","d":"экономика страны, которая осуществляет экспорт и импорт товаров и услуг. «Открытое» предприятие (open shop) — предприятие, которое принимает на работу как членов профсоюза, так и работников, не являющихся членами профсоюза (и не обязанных вступать в него)."},{"t":"Отраслевое регулирование","en":"industrial regulation","d":"устаревший или более традиционный вид регулирования, основанный на том, что правительство контролирует цены на продукцию и услуги отдельных отраслей; вид регулирования, противоположный социальному регулированию."},{"t":"Отраслевой профсоюз","en":"industrial union","d":"профсоюз, принимающий в свои ряды всех работников, занятых в определенной отрасли (или в определенной фирме)."},{"t":"Отрасль","en":"industry","d":"группа фирм (одна или более), производящих идентичные или схожие продукты."},{"t":"Отрасль с возрастающими издержками","en":"increasing-cost industry","d":"отрасль, расширение производства в которой обусловлено вступлением в нее новых фирм и повышением в связи с этим цен на потребляемые ресурсы, а следовательно, и ростом издержек производства компаний этой отрасли."},{"t":"Отрасль с постоянными издержками","en":"constant-cost industry","d":"отрасль, в которой расширение производства вследствие появления в ней новых фирм не оказывает влияния на цены потребляемых ресурсов, а следова тельно, и на кривую издержек производства."},{"t":"Отрасль с сокращающимися издержками","en":"decreasing-cost industry","d":"отрасль, расширение производства в кото рой обусловлено вступлением в нее новых фирм и снижением в связи с этим цен на потребляемые ресурсы, а следовательно, и снижением издержек производства компаний этой отрасли."},{"t":"Отрицательная зависимость","en":"negative relationship","d":"см. Обратная зависимость."},{"t":"Отрицательная экстерналия","en":"negative externality","d":"издержки производства продукта, которые несут не производители и потребители, а третья сторона без всякого их возмещения. Например, производитель ядохимикатов слил часть их в реку, в результате погибла рыба и, следовательно, пострадали люди, занимающиеся спортивной рыбалкой."},{"t":"Отрицательный разрыв ВВП","en":"negative GDP gap","d":"ситуация, при которой фактический валовой внутренний продукт меньше потенциального."},{"t":"Отрицательный самоотбор","en":"negative self-selection","d":"применительно к международной миграции концепция, согласно которой те люди, которые решают переехать в другую страну, имеют более низкие возможности по зарплате в своей стране, чем люди с аналогичными навыками и умениями, отказывающиеся от иммиграции."},{"t":"Отрицательный эффект масштаба","en":"diseconomies of scale","d":"факторы, которые в долгосрочной перспективе увеличивают средние совокупные издержки производства по мере того, как фирма расширяет размеры своего предприятия (объем производства)."},{"t":"Отсутствие мобильности","en":"immobility","d":"неспособность или нежелание работника переменить один географический район на другой, одну профессию на другую либо низкооплачиваемую работу на работу с более высокой оплатой."},{"t":"Отсутствие соперничества","en":"nonrivalry","d":"концепция, согласно которой выгоды одного человека от конкретного товара не снижают выгоды от этого товара, доступные другим людям; свойство, характерное для общественного товара."},{"t":"Отчаявшиеся работники","en":"discouraged workers","d":"работники, которые вышли из состава рабочей силы, потому что не смогли найти работу."},{"t":"Официальные резервы","en":"official reserves","d":"иностранная валюта во владении центрального банка страны."},{"t":"Офшоринг","en":"offshoring","d":"практика перевода работ, в про шлом выполнявшихся американскими работниками, в другие страны."},{"t":"Оценка по показателю общей (совокупной) выручки (total","en":"","d":"revenue test) — анализ, имеющий целью определить, обладает ли спрос эластичностью в интервале между двумя любыми ценами; спрос обладает эластичностью, если общий доход продавцов товара двигается в направлении, противоположном движению цен; спрос будет неэластичным, когда он движется в том же направлении, что и изменение цен; спрос будет обладать единой эластичностью, если он не будет меняться при изменении цен."},{"t":"Ошибка категории post hoc, ergo propter hoc","en":"post hoc, ergo propter hoc fallacy","d":"неверное утверждение, что если одно событие предшествует другому, то первое событие вызывает второе."},{"t":"Ошибка переноса частного на общее","en":"fallacy of composition","d":"некорректный ход рассуждения, согласно кото рому то, что справедливо для одной ситуации, верно и для всех остальных."},{"t":"Парадокс голосования","en":"paradox of voting","d":"ситуация, при которой голосование на основе принципа большинства не обеспечивает выявление действительной структуры предпочтений общества относительно предложения общественных товаров или услуг."},{"t":"Паритет покупательной способности","en":"purchasing power parity","d":"концепция, согласно которой обменные курсы национальных валют равны их покупательной способности; обменные курсы любых двух валют отражают разницу уровней цен двух конкретных стран."},{"t":"Партнерство","en":"partnership","d":"неинкорпорированная (неакционированная) фирма, которой владеют и управляют два лица или более."},{"t":"Пассив","en":"liability","d":"обязательство, выраженное в денежных единицах; задолженность фирмы или отдельного лица."},{"t":"Пассивно управляемые фонды","en":"passively managed funds","d":"взаимные фонды, чьи портфели регулярно не корректируются менеджером фонда в попытке добиться более высокой отдачи. После того как первоначальный портфель выбран, он остается неизменным, и поэтому инвесторы получают те результаты, которые такой неменяющийся портфель им впоследствии обеспечивает. Примером пассивно управляемого фонда можно назвать индексный фонд."},{"t":"Патент","en":"patent","d":"исключительное право изобретателя производить и продавать новый продукт или устройство в течение установленного периода времени (20 лет) после подачи заявки на выдачу патента."},{"t":"Перевод денег","en":"remittances","d":"отправка денег иммигрантами членам семьи и другим людям, проживающим в тех странах, откуда эти иммигранты уехали."},{"t":"Переговоры о заключении коллективного договора","en":"collec tive bargaining","d":"переговоры о заключении договора между профсоюзами и фирмами или представителями органа власти."},{"t":"Передаваемые индивидуальные квоты","en":"individual transferable quotas, ITQ","d":"ограничение, устанавливаемое правительством или комиссией, отвечающей за рыболовство, на общее количество или общий вид отдельных видов рыбы, которую отдельный рыбак может выловить во время конкретного периода; рыбаки, имеющие права на такие квоты, могут продавать их все или частично другим рыбакам."},{"t":"Перекрестная эластичность спроса","en":"cross elasticity of demand","d":"отношение процентного изменения спроса на один товар к процентному изменению цены на какойлибо другой товар. Положительное значение величины означает, что эти товары являются взаимозаменяемыми (субститутами), отрицательное значение показывает, что они взаимодополняющие."},{"t":"Переменные издержки","en":"variable costs","d":"издержки, общая величина которых возрастает, когда фирма увеличивает объем своего производства, и сокращается, когда она сокращает выпуск."},{"t":"Перенос профессиональных навыков и умений","en":"skill transferability","d":"легкость, с которой люди могут перемещать свои трудовые способности с одной работы, из региона или страны на другую работу, в регион или страну. «Переплетающиеся» директораты (interlocking directorate) — ситуация, когда член или члены совета директоров одной корпорации одновременно являются членами совета директоров другой конкурирующей корпорации; такая ситуация противоречит закону Клейтона."},{"t":"Перераспределение налогового бремени","en":"tax incidence","d":"ситуация, при которой отдельный человек или группа лиц прекращают выплачивать налог."},{"t":"Переходный период естественного движения населения","en":"demographic transition","d":"идея, что после того, как развивающаяся страна добивается более высоких стандартов жизни, рост популяции замедляется, так как ее жители начинают считать, что предельные издержки на содержание детей начинают превышать предельные выгоды этого."},{"t":"Плавающий валютный курс","en":"floating exchange rate","d":"см. Гибкий валютный курс."},{"t":"План разделения прибылей","en":"profit sharing plan","d":"компенсационные меры, благодаря которым работники получают часть своей оплаты в форме доли прибыли (если таковая имеется) своих работодателей."},{"t":"Плата за обслуживание","en":"fee for service","d":"в индустрии здравоохранения дополнительная плата врачам за каждый прием пациента или проведение медицинской процедуры, если все это не предусмотрено в условиях, определяющих размер годовой заработной платы врача."},{"t":"Платежи, не связанные с доходом","en":"nonincome charges","d":"потребление средств производства и косвенные налоги на предприятия; суммы, вычитаемые из ВВП (наряду с чистым доходом от зарубежных факторов производства) при расчете национального дохода."},{"t":"Платежный баланс","en":"balance of payments","d":"см. Платежный баланс страны."},{"t":"Платежный баланс страны","en":"international balance of p a y ments","d":"сводный баланс сделок, заключенных в течение данного года между отдельными лицами, фирмами и правительственными ведомствами одной страны с такими же представителями других стран."},{"t":"Платежный дефицит","en":"payments deficit","d":"см. Дефицит платежного баланса."},{"t":"Повторный счет","en":"multiple counting","d":"неправильное включение стоимости промежуточных продуктов в расчет валового внутреннего продукта, учет одного и того же товара или услуги более одного раза."},{"t":"Повторяющаяся игра","en":"repeated game","d":"в теории игр игра, которая осуществляется снова, иногда сразу же после завершения предыдущей игры."},{"t":"Повышение валютного курса","en":"currency appreciation","d":"см. Повышение обменного курса."},{"t":"Повышение курса доллара","en":"appreciation of the dollar","d":"увеличение стоимости доллара по отношению к валюте другой страны, позволяющее приобрести за доллар большее количество иностранной валюты и за счет этого большее количество иностранных товаров."},{"t":"Повышение обменного курса","en":"exchange rate appreciation","d":"увеличение стоимости национальной валюты на рынках иностранных валют; снижение обменных курсов иностранных валют."},{"t":"Повышение предложения","en":"increase in supply","d":"рост предложения товара или услуг при любой цене; сдвиг кривой предложения вправо."},{"t":"Повышение спроса","en":"increase in demand","d":"рост спроса на товар или услугу при любой цене; сдвиг кривой спроса вправо. «Погоня за рентой (прибылью)» (rent-seeking behavior) — стремление добиться с помощью органа власти передачи дохода (или богатства) поставщику ресурса, частному предприятию или потребителю, получаемого за чужой счет или за счет общества."},{"t":"Позитивная связь","en":"positive relationship","d":"прямая связь между двумя переменными."},{"t":"Позитивная экономика","en":"positive economics","d":"анализ фактов или данных с целью выведения научных обобщений экономического поведения субъектов экономики."},{"t":"Позитивные действия","en":"affirmative actions","d":"политические мероприятия и программы, цель которых — увеличить занятость женщин и обеспечить им и представителям меньшинств возможность продвигаться по службе."},{"t":"Позитивный разрыв ВВП","en":"positive GDP gap","d":"ситуация, при которой фактический валовой внутренний продукт превосходит потенциальный."},{"t":"Показатель концентрации","en":"concentration ratio","d":"процентная доля четырех (или иного числа) крупнейших продавцов в общем объеме продаж данной отрасли."},{"t":"Показатель концентрации четырех фирм","en":"four-firm concentration ratio","d":"процент общих продаж в отрасли, приходящихся на первые четыре фирмы в этой отрасли."},{"t":"Покупательная способность","en":"purchasing power","d":"количество товаров и услуг, которые может приобрести человек в объеме своего денежного дохода."},{"t":"Полезность","en":"utility","d":"способность товара или услуги удовлетворять потребности; удовлетворение или удовольствие, получаемое потребителем от потребления товара или услуги (или от потребления набора товаров и услуг)."},{"t":"Политика «дешевых» денег","en":"easy money policy","d":"меры со стороны Федеральной резервной системы, направленные на увеличение массы (предложения) денег в обращении с целью снизить процентную ставку и увеличить реальный ВВП."},{"t":"Политика «дорогих» денег","en":"tight money policy","d":"сокращение или ограничение роста массы (предложения) денег в стране с целью снизить или остановить инфляцию."},{"t":"Политический деловой цикл","en":"political business cycle","d":"приписываемая Конгрессу склонность дестабилизировать экономику путем снижения налогов и увеличения расходов органов власти в период избирательной кампании и путем повышения налогов и сокращения расходов органов власти после выборов."},{"t":"Полная занятость","en":"full employment","d":"1) использование всех пригодных и доступных ресурсов для производства удовлетворяющих потребности товаров и услуг; 2) такой уровень занятости, когда уровень безработицы равен ее уровню при полной занятости ресурсов в экономике; когда существует лишь фрикционная и структурная безработица, но отсутствует циклическая безработица (и когда реальный ВВП равен потенциальному)."},{"t":"Полный объем производства","en":"full production","d":"максимальное количество или стоимость товаров и услуг, которое может быть произведено из используемых в экономике ресурсов; может быть получен, когда реализовано эффективное производство и эффективное р а с пределение имеющихся ресурсов."},{"t":"Положительная экстерналия","en":"positive externality","d":"выгода, получаемая безвозмездно не людьми, участвующими в производстве и потреблении продукта, а третьей стороной (обществом в делом). Например, пчеловод получает выгоду такого рода от того, что фермер, живущий по соседству, засевает свои поля клевером. Также называется преимуществом перелива, или выгодой перелива."},{"t":"Положительное сальдо баланса движения капиталов","en":"capital account surplus","d":"положительное сальдо баланса счета движения капитала."},{"t":"Положительное сальдо бюджета","en":"","d":"см. Бюджетный избыток."},{"t":"Пороговый выпуск","en":"break-even output","d":"уровень производства, при котором общие расходы и общие доходы конкурирующих фирм равны; объем выпуска, не приносящий ни экономической прибыли, ни убытков; объем производства, приносящий только нормальную прибыль."},{"t":"Пороговый доход","en":"break-even income","d":"располагаемый доход (после уплаты налогов), который домохозяйства рассчитывают израсходовать целиком на потребительские товары и услуги, ничего не откладывая на будущее; заработанный доход, при котором выплаты пособий в рамках программ поддержания уровня доходов сводятся к нулю."},{"t":"Порочный круг бедности","en":"vicious circle of poverty","d":"главы) — общая для ряда развивающихся стран проблема, заключающаяся в том, что низкий доход на душу населения не позволяет осуществлять сбережения и инвестиции в масштабах, необходимых для достижения приемлемых темпов экономического роста."},{"t":"Портфель","en":"portfolio","d":"конкретный набор акций, облигаций или других финансовых инвестиций, имеющихся у отдельного лица или взаимного фонда."},{"t":"Порядковая полезность","en":"ordinal utility","d":"удовлетворение, измеряемое при помощи процесса, когда потребители сравнивают и ранжируют продукты (или комбинации продуктов) с учетом своих предпочтений; при этом их не просят указывать конкретную величину удовлетворения, получаемого от продукта."},{"t":"Пособие в натуральной форме","en":"in-kind transfer","d":"распределение органами власти товаров и услуг среди частных лиц, в обмен на которые оно не получает других товаров и услуг из текущего производства; трансфертные платежи органов власти в натуральной, а не денежной форме; также называется неденежными трансфертами товаров и услуг."},{"t":"Пособие по безработице","en":"unemployment compensation","d":"см. Страхование по безработице."},{"t":"Постоянная норма прибыли при росте масштабов бизнеса","en":"constant returns of scale","d":"неменяющиеся средние общие издержки производства продукта по мере того, как фирма в долгосрочной перспективе расширяет размеры своего предприятия (увеличивает объем продукции)."},{"t":"Постоянные альтернативные издержки","en":"constant opportunity costs","d":"альтернативные издержки, которые остаются неизменными по каждой дополнительной единице, когда потребитель (или общество) переносит закупки (производство) с одного продукта на другой вдоль прямолинейной бюджетной линии (кривой производственных возможностей)."},{"t":"Постоянные издержки","en":"fixed costs","d":"затраты, величина которых в целом не изменяется, когда фирма меняет объем выпускаемой продукции; стоимость постоянных ресурсов."},{"t":"Постоянный ресурс","en":"fixed resource","d":"любой применяемый фирмой ресурс, количество которого она не может изменить в течение короткого времени."},{"t":"Потенциальная конкуренция","en":"potential competition","d":"возможность вступления новых фирм в отрасль, которая обеспечивает уже действующим в ней фирмам высокую экономическую прибыль."},{"t":"Потенциальный выпуск","en":"potential output","d":"реально возможный объем выпуска (ВВП) при полном использовании всех имеющихся ресурсов."},{"t":"Потери эффективности от налогов","en":"efficiency loss of а tax","d":"экономические потери общества, вызванные сокращением поступлений налогов в связи с сокращением производства и потребления облагаемого налогом продукта ниже экономически эффективного уровня."},{"t":"Потеря эффективности","en":"efficiency loss","d":"сокращение суммы излишков потребителя и производителя из-за недостаточного или избыточного выделения ресурсов на производство какого-то товара или услуги."},{"t":"Потолок цены, ценовой максимум","en":"price ceiling","d":"установленная на законных основаниях максимальная цена на товар или услугу."},{"t":"Потребительские товары","en":"consumer goods","d":"товары и услуги, непосредственно удовлетворяющие потребности человека."},{"t":"Потребительский избыток","en":"consumer surplus","d":"разница между тем, что желал бы заплатить потребитель (или потребители) за дополнительную единицу продукта или услуги и его рыночной ценой; эквивалентен треуголь нику, лежащему ниже кривой спроса и выше графика рыночных цен."},{"t":"Потребительское равновесие","en":"consumer equilibrim","d":"теория предельной полезности, комбинация товаров, п о купаемых на основе предельной полезности (MU), и цены (Р), при которой достигается максимально общая п о лезность; комбинация товаров X и Y, при которой MUX/ Рх = MUу / Ру."},{"t":"Потребление основного капитала","en":"consumption of fixed capital","d":"оценка размера (стоимости) основного ка п и т ала, необходимого для создания валового внутреннего продукта, также называется аморт изацией. «Почти деньги» (п еаг-т оп еу) — финансовые активы, самые важные среди которых — краткосрочные сберегательные депозит ы, срочные депозит ы, краткосрочные государственные ценные бумаги и сберегательные о б лигации; не являясь средством обращ ения, они могут быть быстро превращены в деньга."},{"t":"Пошлина","en":"","d":"см. Тариф."},{"t":"«Правило 70»","en":"rule of 70","d":"метод определения числа лет, в течение которых отдельные параметры могут повыситься вдвое при заданном годовом проценте. Например, чтобы определить, за сколько лет удвоится уровень цен, число 70 делится на годовой уровень инфляции."},{"t":"Правило максимизации полезности","en":"utility-maximizing rule","d":"для получения наибольш ей полезности потребитель должен так распределить свой денеж ный доход, чтобы последний доллар, израсходованный на каждый товар или услугу, приносил равную предельную полез ность."},{"t":"Правило равенства предельного дохода и предельных издержек, правило MR = МС","en":"MR = МС rule","d":"подход, при котором фирма стремится максимизировать свои прибыли (или минимизировать убытки), добиваясь такого уровня производства, при котором ее предельный доход и предельные издерж ки сравниваются; при этом цена продукта равна или выше средних переменных зат рат."},{"t":"Правило разумного подхода","en":"rule of reason","d":"провозгла шенное и примененное в Деле U.S. Steal правило, гласящее, что антитрестовское законодательство следует применять только к тем фирмам и контрактам, кото рые чрезмерно ограничивают торговлю, и что размер фирмы и обладание монопольной властью сами по себе не вступают в противоречие с законом."},{"t":"Правило Тейлора","en":"Taylor rule","d":"современное кредитноденежное правило, предложенное экономистом Джоном Тейлором (John Taylor), которое показывает, насколько именно Федеральная резервная система должна изменить процентные ставки в ответ на расхождения реального ВВП и потенциального и отклонение фактических темпов инфляции от целевых."},{"t":"Право старшинства, учет трудового стажа при продвижении по службе","en":"seniority","d":"стаж работы данного работника, превышающий стаж других работников на этом же предприятии; право, применяемое при решении вопроса о том, каких работников увольнять, когда работы недостаточно, и о том, кого снова принимать на работу, когда вновь требуется рабочая сила."},{"t":"Прайм-рейт","en":"","d":"см. Базовая процентная ставка."},{"t":"Предельная (приростная, маржинальная) норма замещения","en":"marginal rate of substitution","d":"предельная степень готовности потребителя заменить один товар (из данного товарного ассортимента) другим товаром или услугой и при этом получить равное удовлетворение (или получить ту же общую полезность); норма замещения равна наклону кривой безразличия в каждой ее точке."},{"t":"Предельная (приростная, маржинальная) выгода","en":"marginal benefit","d":"дополнительная выгода от потребления еще одной единицы какого-либо товара или услуги; изменение валовой выгоды после потребления еще одной единицы."},{"t":"Предельная склонность к потреблению","en":"marginal propensity to consume","d":"доля расходов на потребительские товары при любом изменении располагаемого дохода (после уплаты налогов); равна изменению в потреблении, деленному на изменение располагаемого дохода (после уплаты налогов)."},{"t":"Предельная склонность к сбережению","en":"marginal propensity to save","d":"доля сбережений в любом изменении р а с полагаемого дохода домохозяйства (после уплаты налогов); равна изменению объема сбережений, деленному на изменение располагаемого дохода (после уплаты налогов)."},{"t":"Предельная ставка налогообложения","en":"marginal tax rate","d":"доля дополнительного (облагаемого налогом) дохода, которую приходится выплачивать в виде налогов."},{"t":"Предельная цена","en":"ceiling price","d":"см. Потолок цены, ценовой максимум."},{"t":"Предельные (приростные, маржинальные) издержки","en":"marginal costs","d":"прирост издержек производства дополнительной единицы продукта; равны изменению совокупных издержек, деленному на изменение объема продукции (а в краткосрочном периоде — изменению полных переменных издержек, деленному на изменение объема продукции)."},{"t":"Предельные издержки на ресурс","en":"marginal resource cost","d":"прирост совокупных издержек на ресурс, когда фирма использует дополнительную единицу этого ресурса (количество всех других используемых ресурсов остается постоянным); равны изменению совокупных издержек на ресурс, деленному на изменение количества используемого ресурса."},{"t":"Предельный (приростный, маржинальный) продукт","en":"marginal product","d":"дополнительный продукт, произведенный при использовании дополнительной единицы ресурса (количество всех других используемых ресурсов остается постоянным); равен изменению общего объема продукции, деленному на изменение количества использованного ресурса."},{"t":"Предельный доход, получаемый за счет повышения производительности труда","en":"marginal revenue productivity","d":"см. Предельный доход, получаемый от продукта."},{"t":"Предельный доход, получаемый от продукта","en":"marginal revenue product","d":"изменение общего дохода фирмы, когда она использует дополнительную единицу какого-то ресурса (количество всех других используемых ресурсов остается неизменным); равен изменению общего объема дохода, деленному на изменение количества используемого ресурса."},{"t":"Предложение","en":"supply","d":"график, показывающий объем товаров или услуг, которые предложит по различным ценам продавец (продавцы) на протяжении определенного периода."},{"t":"Предложение в долгосрочном периоде","en":"long-run supply","d":"график или кривая, показывающие цены, по которым отрасль, действующая в условиях совершенной (чистой) конкуренции, будет в долгосрочной перспективе предлагать на рынке разные количества производимого ею продукта."},{"t":"Предложение денег, масса денег в обращении","en":"money supply","d":"в узком определении —M l, а в более широком определении — М2. См. М \\ и М2."},{"t":"Предпринимательская способность","en":"entrepreneurial ability","d":"способности человека использовать определенное сочетание ресурсов для производства продукта, принимать нетривиальные решения, предлагать новые подходы и идти на риск."},{"t":"Предприятие","en":"plant","d":"физически существующая структура (включая землю и капитал), выполняющая одну или более функцию в производстве, изготовлении и продаже товаров и услуг."},{"t":"Предприятие коммунального хозяйства","en":"public utility","d":"фирма, производящая жизненно важную продукцию или услугу в данном регионе, получившая от правительства исключительное право выступать единственным поставщиком этой продукции или услуги и регулируемая правительством во избежание злоупотребления с ее стороны монопольной властью."},{"t":"Предприятие с «закрытым» профсоюзом","en":"closed shop","d":"предприятие, принимающее на работу только членов профсоюза."},{"t":"Предприятие с «представительским» профсоюзом","en":"agency shop","d":"место работы, где работодатель может нанимать либо членов профсоюза, либо работников, не являющихся членами профсоюза, но последние должны либо выплачивать профсоюзу взносы, либо жертвовать эквивалентную сумму благотворительному учреждению."},{"t":"Преимущество первопроходца","en":"fist-mover advantage","d":"в теории игр выигрыш, получаемый стороной, которая первая начинает действовать в игре с последовательно осуществляемыми ходами."},{"t":"Премия (надбавка) за риск","en":"risk premium","d":"процентная ставка, превышающая безрисковую процентную ставку, которая должна выплачиваться за компенсацию кредитору или инвестору за риск."},{"t":"Прерогативы администрации","en":"managerial prerogatives","d":"оговариваемый в коллективных договорах между профсоюзами и фирмами круг решений, право принимать которые принадлежит только администрации фирмы."},{"t":"Равновесие потребителя (при анализе кривой безразличия)","en":"","d":"комбинация покупаемых товаров, при которой максимально общая полезность позволяет потребителям д о биться самой высокой кривой безразличия при заданной бюджетной линии (или бюджетного ограничения) этого потребителя."},{"t":"Прибыль","en":"profit","d":"доход тех, кто предлагает экономике свои предпринимательские способности (см. Нормальная прибыль)', совокупные доходы минус совокупные затраты. См. Экономическая прибыль."},{"t":"Приведенная стоимость","en":"present value","d":"Нынешняя стоимость какого-то количества денег, которые будут получены в будущем."},{"t":"Принудительный контракт, соглашение","en":"tying contract","d":"требование, навязываемое покупателю продавцом, обязывающее его купить ряд других товаров у того же продавца; практика, запрещенная законом Клейтона."},{"t":"Принцип налогообложения получаемых благ","en":"benefits-received principle","d":"концепция, согласно которой лица, получающие от государства какие-то блага в виде товаров и услуг, должны платить налоги, необходимые для финансирования их производства."},{"t":"Принцип платежеспособности","en":"ability-to-pay principle","d":"концепция, согласно которой с тех, кто имеет больший доход (или большее богатство), следует взимать больший налог, чем с тех, у кого доход (или богатство) меньше."},{"t":"Принцип сопоставления предельного дохода с предельными издержками","en":"marginal-revenue — marginal-cost a p proach","d":"метод определения объема продукции, при котором экономическая прибыль максимальна (или убытки минимальны), путем сравнения предельной выручки от дополнительных единиц продукции с предельными издержками их производства."},{"t":"Принцип сравнительного преимущества","en":"principle of comparative advantage","d":"идея, что отдельный человек (регион или нация) выиграет, если специализируется на производстве товаров, в отношении которых его собственные издержки ниже, чем альтернативные издержки партнера по совершению сделок, а затем обменяет часть своих продуктов, на которых он специализируется, на нужные продукты, изготовленные другими."},{"t":"Приращение капитала","en":"capital gain","d":"прирост капитала, получаемый в результате продажи ценных бумаг, движимой и недвижимой собственности по более высоким ценам, чем те, по которым они были куплены."},{"t":"Причинная обусловленность","en":"causation","d":"причинноследственная связь: одно или несколько событий порождают или влекут за собой другое событие."},{"t":"Проблема «зайца»","en":"free-rider problem","d":"невозможность для потенциальных поставщиков экономически жела тельного, но неделимого товара или услуги получить за них плату с тех, кто извлекает выгоду из указанного товара или услуги, из-за того, что принцип исключаемости в данном случае неприменим."},{"t":"Проблема изменения климата","en":"climate-change problem","d":"проблема, вызванная повышением общемировых температур, что, как считает большинство экспертов, вызвано, по крайней мере частично, увеличением количества углекислого газа и других парниковых газов, создаваемых как побочные продукты в ходе экономической деятельности людей."},{"t":"Проблема неблагоприятного выбора","en":"adverse selection problem","d":"проблема, возникающая тогда, когда одна из сторон, заключающих контракт, обладает информацией, неизвестной другой стороне, что приводит к неоправданным издержкам для первой. Например, медицинские страховки чаще всего покупают люди с самым плохим здоровьем, которые не сообщают страховым компаниям о состоянии своего здоровья. Проблема «принципал — агент» (principal-agent problem) — конфликт интересов, который возникает, когда агенты (работники или менеджеры) преследуют собственные цели в ущерб цели принципалов (акционеров)."},{"t":"Проблема экономии","en":"economizing problem","d":"необходимость выбора, обусловленная тем, что материальные потребности общества безграничны, но имеющиеся ресурсы для производства товаров и услуг, которые удовлетворяют эти потребности, ограничены (редки)."},{"t":"Программа льготного медицинского страхования","en":"M edicare","d":"федеральная программа в США, финансируемая за счет налогов на заработную плату и предусматривающая: 1) обязательное страхование престарелых на случай лечения в стационаре; 2) добровольное недорогое страхование, обеспечивающее престарелым компенсацию расходов на оплату амбулаторного лечения."},{"t":"Программа маркетинговых займов","en":"marketing loan program","d":"федеральная программа субсидий фермам, по которой некоторые фермеры могут получить заем (условия которого рассчитываются на основе единицы произведенной фермой продукции) от правительственного органа-кредитора, а затем, в зависимости от цены на урожай, либо вернуть заем плюс процентный платеж за него, либо отдать кредитору свой урожай по схеме форфейтинга."},{"t":"Программа медицинской помощи неимущим","en":"Medicaid","d":"федеральная программа в США, оказывающая помощь штатам в финансировании медицинских расходов отдельных лиц, подпадающих под действие двух других программ: Дополнительных пособий малоимущим (SSI) и Временной помощи нуждающимся семьям (TANF)."},{"t":"Программа продовольственных талонов","en":"food stamp program","d":"действующая в США программа, позволяющая лицам с низкими доходами приобретать со скидкой от розничной цены или получать бесплатно купоны, кото рые в розничных магазинах можно обменять на продовольственные товары."},{"t":"Программа распределения посевных площадей","en":"acreage-allotment program","d":"правительственная программа, действовавшая в США до г. и определявшая общую площадь земли, предназначенной для производства различных видов сельскохозяйственной продукции, и распределяющая эту землю между индивидуальными фермерами, для которых ограничение обрабатываемой площади установленным для них пределом становится обязательным условием получения дотаций к ценам на свою продукцию."},{"t":"Программа социального обеспечения","en":"Social Security program","d":"см. Страхование по старости, по случаю потери кормильца и нетрудоспособности."},{"t":"Программа установления ограничений и разрешения на торговлю правами на загрязнение","en":"cap-and-trade programme","d":"стратегия правительства, используемая для сокращения вредных выбросов или загрязнений, для чего устанавливаются ограничения на общую сумму выбрасываемых загрязняющих веществ, а затем фирмы могут покупать и продавать права на выброс определенного количества в пределах общих установленных ограничений."},{"t":"Программы адресной помощи","en":"entitlement programs","d":"правительственные программы, например социального страхования, продовольственных талонов, Medicare и M edicaid, гарантирующие определенный уровень трансфертных платежей всем гражданам, отвечающим критериям этих программ."},{"t":"Программы государственной помощи","en":"public assistance programs","d":"государственные программы выплаты пособий лицам, не способным зарабатывать себе на жизнь (инвалиды или люди с крайне низкими доходами, дети на иждивении родителей); эти программы финансируются из общих налоговых поступлений, а пособия рассматриваются как государственная благотворительность (но не как заработанный доход)."},{"t":"Программы социального страхования","en":"social insurance programs","d":"программы выплат, позволяющие заместить некоторые потери в доходах, когда люди выходят на пенсию или временно теряют работу; эти программы финансируются из налогов на заработную плату и рассматриваются в качестве заработанного дохода (а не благотворительности)."},{"t":"Программы социальной помощи","en":"welfare programs","d":"см. Программы государственной помощи."},{"t":"Прогрессивный налог","en":"progressive tax","d":"налог, средняя ставка которого возрастает по мере увеличения дохода налогоплательщика и снижается по мере сокращения этого дохода."},{"t":"Продукты питания","en":"food product","d":"сельскохозяйственная продукция после ее обработки, которая продается в магазинах и ресторанах. Примеры: хлеб, мясо, рыба, цыплята, свинина, лук, арахисовое масло и зерна для завтрака."},{"t":"Продукция ферм","en":"farm commodities","d":"сельскохозяйственные продукты, такие как зерно, молоко, скот, фрукты и овощи, которые обычно продаются перерабатывающим предприятиям как сырье для производства продуктов питания."},{"t":"Производительность","en":"productivity","d":"показатель среднего объема продукта или реальной продукции на единицу затраченных ресурсов. Например, производительность труда может быть измерена путем деления количества реально произведенной продукции на часы работы."},{"t":"Производительность труда","en":"labor productivity","d":"общий объем продукции, деленный на количество затраченного на его производство труда; средний продукт труда или выработка одного работника за один час."},{"t":"Производный спрос","en":"derived demand","d":"спрос на сырье и материалы, зависящий от спроса на продукты, которые из этого сырья и материалов можно изготовить."},{"t":"Производственная эффективность","en":"","d":"см. Эффективность производства."},{"t":"Производственный потенциал","en":"","d":"см. Потенциальный выпуск."},{"t":"Промежуточный продукт","en":"intermediate goods","d":"товары, покупаемые для перепродажи, первичной обработки или изготовления из них конечного изделия."},{"t":"Промышленно развитые страны","en":"industrially advanced countries","d":"страны с высоким уровнем доходов, как Соединенные Штаты, Канада, Япония и страны Западной Европы, которые обеспечили развитие рыночной экономики, основанной на накоплении большой массы технически передового основного капитала и наличии квалифицированной рабочей силы."},{"t":"Пропорциональный налог","en":"proportional tax","d":"налог, средняя ст авка которого остается неизменной при увеличении или сокращении дохода налогоплательщика."},{"t":"Простой мультипликатор","en":"simple multiplier","d":"мультипликатор в экономической модели, которая отличается отсутствием чистых налоговых поступлений правительства, отсутствием импорта, а также тем, что инвестиции не зависят от уровня дохода; равен единице, деленной на предельную склонность к сбережениям."},{"t":"Профессиональная сегрегация","en":"occupational segregation","d":"вытеснение женщин или представителей меньшинств в менее желательные и низкодоходные виды занятости."},{"t":"Профицит","en":"","d":"см. Бюджетный избыток."},{"t":"Профсоюз","en":"labor union","d":"группа работников, объединившаяся в организацию для защиты своих интересов и улучшения своего положения (повышения заработной платы, сокращения рабочего времени, улучшения условий труда и т.д.). «Профсоюзное» предприятие (цех) (union shop) — предприятие, на которое предприниматель нанимает работников, либо уже являющихся членами профсоюза, либо нечленов профсоюза, обязующихся в течение определенного срока вступить в него (в противном случае они теряют работу)."},{"t":"Профсоюзы с ограниченным доступом","en":"exclusive unionism","d":"применяемая некоторыми профсоюзами практика ограничения предложения рабочей силы путем недопущения вступления в них новых членов с целью увеличения заработной платы уже состоящих в них работников; практика, обычно применяемая цеховыми профсоюзами."},{"t":"Профсоюзы, охватывающие всех работников предприятия или отрасли","en":"inclusive unionism","d":"практика включать всех работников, занятых в отрасли, в члены профсоюза."},{"t":"Процедура разрешения трудовых споров","en":"grievance procedure","d":"используемые профсоюзом и фирмой методы улаживания конфликтов, возникающих в период действия заключенного ими коллективного договора."},{"t":"Процент","en":"interest","d":"плата за использование денег (или заемных средств)."},{"t":"Процентная норма доходности","en":"percent rate of return","d":"выигрыши или убытки в процентах относительно цены покупки экономической или финансовой инвестиции за какой-то период времени."},{"t":"Процентная ставка по федеральным фондам","en":"federalfunds rate","d":"процентная ставка, установленная для банков, кредитующих друг друга, и других депозитных институтов для получения суточных кредитов по избыточным ресурсам."},{"t":"Прямая зависимость","en":"direct relationship","d":"связь между двумя переменными, которые изменяются в одном и том же направлении, например между ценой продукта и объемом его предложения."},{"t":"Прямая торговых возможностей","en":"trading possibilities line","d":"линия, показывающая различные комбинации двух товаров, которые экономика в состоянии приобрести (потребить), когда она специализируется на производстве одного товара и торгует им (экспортирует), чтобы приобрести другой."},{"t":"Прямые иностранные инвестиции","en":"direct foreign investment","d":"сооружение новых заводов (или приобретение действующих мощностей) в конкретной стране корпорацией другой страны."},{"t":"Прямые шатежи","en":"direct payments","d":"денежные субсидии, выплачиваемые фермерам на основе предыдущих уровней производства; их размер не зависит от текущей цены зерновых и текущего объема производства."},{"t":"Пункт H-1B","en":"H-1B provision","d":"B (H l-B provision) — положение иммиграционного законодательства США, в соответствии с которым каждый год 65 тыс. высококвалифицированным работникам в отдельных видах занятости, таких как наука, НИОКР или компьютерное программирование, разрешается приезжать и работать на законных основаниях в Соединенных Штатах в течение шести лет."},{"t":"Пустая угроза","en":"empty threat","d":"в теории игр заявление одной стороны о своих намерениях, вредных для другой стороны, которое эта другая сторона не рассматривает как серьезное, так как не считает, что эта угроза будет реализована; сравните ее с достоверной угрозой."},{"t":"Рабочая сила","en":"labor force","d":"обшее число лиц в возрасте от 16 лет и старше, работающих или безработных, за исключением содержащихся в психиатрических больницах и исправительных учреждениях, которые ищут работу."},{"t":"Равновесие Нэша","en":"Nash equilibrium","d":"в теории игр результат, при котором ни одна из сторон не хочет от него отказываться; результат, который после достижения остается стабильным и сохраняющимся в течение длительного времени."},{"t":"Равновесная мировая цена","en":"equilibrium world price","d":"цена продукта, сделки с которым совершаются и в других странах, выравнивающая количество продукта, запрашиваемого импортерами, с количеством, поставляемым экспортерами; эта цена определяется пересечением кривой предложения экспорта и кривой спроса импорта."},{"t":"Равновесная позиция","en":"equilibrium position","d":"в модели кривой безразличия комбинация двух товаров, при которых потребитель добивается максимальной для себя полезности (достигает самой высокой из достижимых кривых безразличия), учитывая ограниченный размер, который он может истратить (бюджетные ограничения)."},{"t":"Равновесная цена","en":"equilibrium price","d":"цена на конкурентном рынке, при которой объемы спроса и предложения равны; цена, при которой нет ни дефицита, ни избытка товаров и услуг; цена, которая не обнаруживает тенденцию к росту или снижению."},{"t":"Равновесное количество","en":"equilibrium quantity","d":"1) величина спроса и предложения при равновесной цене на конкурентном рынке; 2) объем выпуска, максимизирующий прибыль фирмы."},{"t":"Равновесный ВВП","en":"equilibrium GDP","d":"см. Равновесный реальный внутренний продукт."},{"t":"Равновесный реальный внутренний продукт","en":"equilibrum real domestic product","d":"такая величина валового внутреннего продукта, при которой общий объем произведенных конечных товаров и услуг (реальное внутреннее производство) равен объему потребленных товаров и услуг (совокупные расходы)', реальный внутренний продукт, при котором кривая совокупного спроса пересекает кривую совокупного предложения."},{"t":"Равновесный уровень цен","en":"equilibrium price level","d":"уровень цен, при котором кривая совокупного спроса пересекает кривую совокупного предложения."},{"t":"Развивающиеся страны","en":"developing countries","d":"многие страны Африки, Азии и Южной Америки, экономика которых характеризуется отсутствием инвестиционных товаров, передовых технологий, низким уровнем грамотности, массовой безработицей, высоким уровнем прироста населения и занятостью рабочей силы, в основном в сельскохозяйственном секторе."},{"t":"Разделение труда","en":"division of labor","d":"разделение труда, требующегося для производства продукта, на ряд отдельных операций, выполняемых разными работниками; специализация работников."},{"t":"Разделение функций собственности и управления","en":"separation of ownership and control","d":"различие между группой лиц, владеющих корпорацией (держателей акций), и группой лиц, управляющих ею (директоров и руководящего персонала)."},{"t":"Разменная монета","en":"token money","d":"см. Символические деньги."},{"t":"Разрыв в ВВП","en":"GDP gap","d":"потенциальный В ВП минус реальный ВВП, разность может быть как положительной (позитивный разрыв ВВП), так и отрицательной (отрицательный разрыв ВВП)."},{"t":"Располагаемый доход","en":"disposable income","d":"личный доход за вычетом индивидуальных налогов; доход, который может быть использован для расходов на личное потребление и личные сбережения."},{"t":"Распределительная (регулирующая) функция цен","en":"rationing function of prices","d":"способность рыночных сил на конкурентном рынке уравновесить спрос и предложение, а также нейтрализовать дефицит и избыток товаров путем изменения цен."},{"t":"Растущая отрасль","en":"expanding industry","d":"отрасль, фирмы которой получают экономическую прибыль, и поэтому по мере вступления в нее новых фирм объем производства может расти."},{"t":"Расходы перелива","en":"external cost","d":"см. Отрицательная экстерналия."},{"t":"Расходы, превышающие доход","en":"dissaving","d":"расходы на потребительские товары и услуги, превышающие располагаемый доход; сумма, на которую личные расходы превышают располагаемые личные доходы."},{"t":"Рациональное поведение","en":"rational behavior","d":"человеческое поведение, основанное на сравнении предельных из Глоссарий держек и предельных выгод; поведение, направленное на получение максимальной общей полезности."},{"t":"Реальная заработная плата","en":"real wage","d":"количество товаров и услуг, которое рабочий может купить на свою номинальную заработную плату, покупательная способность номинальной заработной платы."},{"t":"Реальная процентная ставка","en":"real interest rate","d":"процентная ставка в постоянном денежном выражении (с поправкой на инфляцию)', равна номинальной процентной ставке, уменьшенной с учетом ожидаемого уровня инфляции."},{"t":"Реальный валовой внутренний продукт","en":"real gross domestic product","d":"ВВП с поправкой на инфляцию (изменение уровня цен); ВВП за данный год, деленный на ценовой индекс ВВП за этот же год, измеряемый в десятичных пунктах."},{"t":"Реальный доход","en":"real income","d":"количество товаров и услуг, которое отдельное лицо или группа лиц могут купить на свой номинальный доход в течение определенного периода; номинальный доход с поправкой на инфляцию (изменение уровня цен)."},{"t":"Реальный капитал","en":"real capital","d":"см. Капитал."},{"t":"Регрессивный налог","en":"regressive tax","d":"налог, средняя ставка которого уменьшается (повышается) по мере увеличения (уменьшения) дохода налогоплательщика."},{"t":"Регулирование внешней торговли","en":"trade controls","d":"введение пошлин, экспортных субсидий, импортных квот и другие меры, которые может принимать страна для сокращения импорта и расширения экспорта."},{"t":"Регулирующая (управляющая) функция цен","en":"guiding function of prices","d":"способность изменений цен повлечь за собой изменение величины спроса на продукты и ресурсы, а также на объемы их предложения."},{"t":"Регулирующее ведомство","en":"regulatory agency","d":"создаваемое федеральным правительством или правительством штата ведомство, агентство, комиссия или управление для контроля в интересах общества за устанавливаемыми естественной монополией ценами и предоставляемыми ею услугами или выпуском продукции."},{"t":"Редкость ресурсов","en":"scarce resources","d":"нехватка (ограниченность) земли, капитала, труда и предпринимательской способности для удовлетворения безграничных материальных потребностей людей."},{"t":"Режим наибольшего благоприятствования","en":"most-favorednation state, MFN","d":"статья в торговом соглашении США с другой страной, предусматривающая, что экспорт этой страны в США будет облагаться самым низкими пошлинами с момента предоставления этого статуса или позже."},{"t":"Резервная норма","en":"reserve ratio","d":"см. Резервное требование."},{"t":"Резервное требование","en":"reserve requirement","d":"установленный минимальный процент чековых депозитов, который банк или сберегательное учреждение должны иметь в качестве депозитов в федеральном резервном банке своего региона или в виде наличных денег в кассе."},{"t":"Резкое сокращение популяции рыб / морепродуктов","en":"fishery collapse","d":"быстрое снижение популяции вида рыбы из-за того, что данный вид вылавливается быстрее, чем он может себя воспроизводить."},{"t":"Реклама","en":"advertising","d":"деятельность продавца, связанная с информированием потенциальных покупателей о своем продукте."},{"t":"Рентный доход","en":"rental income","d":"доход лиц, обеспечивающих экономику земельным ресурсом."},{"t":"Ресурс","en":"resource","d":"природная, человеческая или произведенная составляющая, помогающая выпускать товары или услуги; агент или фактор производства."},{"t":"Ресурсы-субституты","en":"substitute resources","d":"исходные составляющие, необходимые для производства, которые можно использовать вместо других исходных составляющих в производственном процессе; ресурсы, в отношении которых повышение цены одного из них приводит к повышению спроса на другие."},{"t":"Рефинансирование государственного долга","en":"refinancing the public debt","d":"выплата правительством США владельцам государственных ценных бумаг с наступившим сроком погашения денег, полученных от продажи новых ценных бумаг, либо обмен погашенных ценных бумаг на новые."},{"t":"Рецессионный разрыв","en":"recessionary expenditure gap","d":"величина, на которую должен возрасти (сместиться вверх) график (кривая) совокупных расходов, чтобы повысить реальный ВВП до неинфляционного уровня полной занятости."},{"t":"Рецессия","en":"recession","d":"период снижения реального ВВП, во время которого происходит снижение реального дохода и рост безработицы."},{"t":"Риск","en":"risk","d":"неопределенность в отношении фактических будущих доходов от конкретной финансовой или экономической инвестиции."},{"t":"Род занятий","en":"occupation","d":"категория деятельности или задач, решаемых группой работников, получающих за это плату, или независимым служащим. Примеры: менеджеры, медсестры, фермеры, повара."},{"t":"Рост производительности","en":"productivity growth","d":"изменение в процентном исчислении производительности в одном периоде по отношению к другому."},{"t":"Ростовщические законы","en":"usury laws","d":"законы штатов, устанавливающие минимальную ставку процента для получения ссуды."},{"t":"Рынок","en":"m arket","d":"институт или механизм, который сводит вместе покупателей (предъявителей спроса) и продавцов (поставщиков) конкретного товара или услуги."},{"t":"Рынок прав на экстерналии (рынок внешних эффектов)","en":"market for externality rights","d":"рынок, на котором фирмы могут приобрести права на загрязнение окружающей среды; цена на такие права определяется спросом и совершенно неэластичным предложением прав, объемом загрязнения, которое может ассимилировать окружающая среда."},{"t":"Рынок продуктов, товарный рынок","en":"product market","d":"рынок, на котором домохозяйства покупают, а фирмы продают произведенные ими продукты."},{"t":"Рынок ресурсов","en":"resource market","d":"рынок, на котором домохозяйства продают, а фирмы покупают ресурсы или услуги."},{"t":"Рыночная система","en":"market system","d":"все образующие рыночную экономику рынки продуктов и ресурсов и действующие между ними связи; механизм, позволяющий распределять редкие экономические ресурсы по складывающимся на этих рынках ценам, обеспечивать информацию о решениях, принимаемых потребителями, фирмами и поставщиками ресурсов, и согласовывать эти решения."},{"t":"Рыночная экономика","en":"m arket economy","d":"экономика, в которой структуру распределения ресурсов определяют только индивидуальные решения потребителей, поставщиков ресурсов и частных фирм; рыночная система."},{"t":"Рыночный период","en":"market period","d":"период, в течение которого производители продукта не в состоянии изменить объем производства в ответ на изменение цены продукта; период, когда предложение совершенно неэластично."},{"t":"Рыночный портфель","en":"m arket portfolio","d":"портфель, содержащий каждый актив (каждую акцию и каждую облигацию), доступный на финансовых рынках. Такой портфель используется для расчета беты (показателя степени рискованности) конкретных акций, облигаций и взаимных фондов."},{"t":"Рыночный спрос","en":"market demand","d":"см. Валовой спрос."},{"t":"Сальдо счета движения капиталов и финансов","en":"balance on capital and financial account","d":"сумма счета движения капиталов и финансового счета."},{"t":"Самоотбор","en":"self-selection","d":"применительно к международной миграции идея, что люди, которые решили переехать, обычно имеют более высокий стимул добиться экономического выигрыша или в большей степени готовы пожертвовать нынешним потреблением ради будущего потребления, чем люди с аналогичными навыками и умениями, выбравшие вариант остаться дома."},{"t":"Сбалансированный годовой бюджет","en":"annually balanced budget","d":"бюджет, в котором поддерживается равенство правительственных расходов и налоговых поступлений в течение года."},{"t":"Сберегательное учреждение","en":"thrift institution","d":"ссудосберегательная ассоциация, взаимно-сберегательный банк или кредитный союз."},{"t":"Сберегательный вклад","en":"saving deposit","d":"приносящий процент вклад (депозит), с которого средства обычно можно снять в любой момент."},{"t":"Сберегательный счет","en":"savings account","d":"вклад в коммерческий банк или сберегательное учреждение, на который вкладчик получает процент; обычно используется для сбережения денег, а не для обслуживания повседневных операций; часть предложения денег М2."},{"t":"Сбережения","en":"saving","d":"располагаемый доход (после уплаты налогов), не израсходованный на приобретение потребительских товаров; равен располагаемому доходу (после уплаты налогов) минус личные потребительские расходы."},{"t":"Сбой (нарушения, несовершенства) в деятельности органа власти","en":"government failure","d":"неэффективность в распределении ресурсов, вызванная проблемами действий государственного сектора (органов власти), в первую очередь из-за давления групп особых интересов, старающихся получить ренту, близорукого политического поведения, ограниченного выбора или выбора пакетного характера, а также из-за неэффективности бюрократического характера."},{"t":"Сверхдолгосрочный период","en":"very long period","d":"период, на протяжении которого может измениться технология, а фирмы могут предложить новые продукты."},{"t":"Свобода выбора","en":"freedom of choice","d":"свободные права собственников материальных ресурсов расходовать их по своему усмотрению, работников заняться любым видом труда, на который они способны, а потребителей использовать свои доходы на цели, которые они сочтут предпочтительными (наилучшими)."},{"t":"Свобода предпринимательства","en":"freedom of enterprise","d":"свободное право частных фирм использовать экономические ресурсы для производства товаров по собственному выбору и продавать произведенные товары на рынках, которые они сами выбрали."},{"t":"Свобода торговли","en":"free trade","d":"отсутствие ограничений в виде искусственных (т.е. установленных государством) барьеров на ведение торговли между частными лицами и фирмами в странах."},{"t":"Сговор","en":"collusion","d":"ситуация, когда фирмы действуют согласованно (в сговоре) с целью установить цену и объем производимого каждой из них продукта или иным образом ограничить конкуренцию."},{"t":"Сдерживающая (рестрикционная) фискальная политика","en":"contractionary fiscal policy","d":"сокращение совокупного спроса и за счет этого снижение темпов инфляции в результате уменьшения расходов органов власти на закупки товаров и услуг, увеличения чистого объема налоговых поступлений или комбинация этих двух факторов."},{"t":"СЕА","en":"","d":"см. Экономический совет при президенте (США)."},{"t":"Североамериканское соглашение о свободной торговле, НАФТА","en":"North American Free Trade Agreement, NAFTA","d":"соглашение, заключенное в г. между Канадой, Мексикой и США сроком действия 15 лет, в результате которого появилась зона свободной торговли."},{"t":"Сезонные колебания","en":"seasonal variations","d":"повышение или снижение в пределах одного года уровня экономической активности из-за смены сезонов."},{"t":"Сетевые эффекты","en":"network effects","d":"повышение полезности продукта для каждого пользователя, в том числе и всех прежних, при увеличении числа пользователей."},{"t":"Символические деньги","en":"token money","d":"банкноты или монеты, на которых указана определенная сумма, не имеющая никакого отношения к стоимости бумаги или металла, использованных для их производства; в отношении валюты, находящейся в обращении, — деньги, у которых номинальная стоимость выше товарной стоимости."},{"t":"Система коммерческих банков","en":"commercial banking system","d":"совокупность всех коммерческих банков и сберегательных учреждений."},{"t":"Система лечения на основе групп сходных диагнозов","en":"idiagnosis-related group system","d":"выплаты врачам и больницам по программе Medicare, при которой состояние пациента и его потребности описываются в виде сотен тщательно детализированных категорий."},{"t":"Система национального медицинскою страхования","en":"N ational health insurance","d":"программа федерального правительства, которая содержит базовый пакет страхования здоровья всех граждан; не предусматривает прямых выплат, при этом расходы на ее создание и поддержание становятся минимальными. Финансирование предполагается осуществлять за счет общегосударственных налоговых поступлений."},{"t":"Система поддержания уровня доходов","en":"income-maintenance system","d":"совокупность правительственных программ, предназначенных для ликвидации бедности и сокращения неравенства в распределении доходов."},{"t":"Скорость (обращения денег)","en":"velocity (of money)","d":"число, указывающее, сколько раз в году доллар, находящийся в обращении, расходуется на приобретение конечных товаров и услуг; номинальный ВВП, деленный на количество денег в обращении."},{"t":"Скрытые (условно-расчетные) издержки","en":"implicit cost","d":"денежные доходы, которыми жертвует фирма — владелец ресурсов для собственного производства товаров, а не для продажи другим потребителям: равны доходу, который могли бы принести эти ресурсы при наиболее выгодном альтернативном их применении, включают и нормальный доход."},{"t":"Слияние","en":"merger","d":"слияние (комбинация) двух (или более) фирм в одну."},{"t":"Сложный процент","en":"compound interest","d":"накопление со временем денег на инвестиционном или приносящем проценты счете, когда новые проценты начисляются на прежние проценты, которые со счета не снимаются."},{"t":"Случай закрытия предприятия","en":"shutdown case","d":"обстоятельства, когда фирма будет нести убытки, превышающие ее постоянные затраты, если она станет производить даже незначительный объем продукции; ситуация, когда фирма вынуждена прекратить деятельность, если цена, по которой она может продавать свою продукцию, ниже средних переменных издержек."},{"t":"Снижение валютного курса","en":"exchange rate depreciation","d":"уменьшение стоимости валюты страны на иностранных валютных рынках: снижение обменного курса валюты по отношению к иностранным валютам."},{"t":"Собственная выгода, заинтересованность","en":"self-interest","d":"цели, которые каждая фирма, каждый владелец собственности, работник, потребитель считают для себя наилучшими и которых стремятся достичь."},{"t":"Собственный капитал","en":"net worth","d":"совокупные активы минус совокупные пассивы фирмы или отдельного лица, доля владельцев фирмы в общем объеме ее активов."},{"t":"Совершенно конкурентный рынок труда","en":"purely competitive labor m arket","d":"рынок, на котором большое число работников с примерно одинаковой квалификацией, не являющихся членами профсоюза, предлагают свой труд большому числу работодателей, ни один из которых не может самостоятельно определять размер заработной платы на этом рынке."},{"t":"Совершенно неэластичное предложение","en":"perfectly inelastic supply","d":"ситуация, при которой изменение цены продукта или ресурса не влечет за собой изменения величины предложения товара; величина предложения одинакова при любых ценах; кривая предложения представлена в виде вертикального графика."},{"t":"Совершенно неэластичный спрос","en":"perfectly inelastic demand","d":"ситуация, при которой изменение цены не влечет за собой изменения величины спроса на товар; величина спроса одинакова при любых ценах; кривая спроса представлена в виде вертикального графика."},{"t":"Совершенно эластичное предложение","en":"perfectly elastic supply","d":"ситуация, при которой продавцы готовы предложить такое количество товара или ресурса, какое покупатели готовы купить по неизменной цене; кривая предложения представлена в виде горизонтального графика."},{"t":"Совершенно эластичный спрос","en":"perfectly elastic demand","d":"ситуация, при которой изменение величины спроса на товар или ресурс не требует изменения цены товара; ситуация, при которой покупатели готовы покупать весь имеющийся на рынке товар по неизменной цене; кривая спроса представлена в виде горизонтального графика."},{"t":"Совет управляющих","en":"Board of Governors","d":"группа из семи человек, осуществляющая надзор и контроль за функционированием денежной и банковской системы США; официальное название — Совет управляющих Федеральной резервной системы."},{"t":"Совместные платежи","en":"copayment","d":"определенный процент расходов (например, на оплату медицинских услуг), который застрахованное лицо обязуется вносить по договору страхования, в то время как страхователь обязуется вносить остальную часть."},{"t":"Совокупная полезность","en":"total utility","d":"совокупное удовлетворение, получаемое от потребления некоторого продукта или комбинации продуктов."},{"t":"Совокупное предложение","en":"aggregate supply","d":"график или кривая, показывающие общее количество товаров и услуг, которое может быть предложено (произведено) при разных уровнях цен."},{"t":"Совокупные (валовые) издержки","en":"total cost","d":"сумма постоянных и переменных издержек."},{"t":"Совокупные расходы","en":"aggregate expenditures","d":"общая сумма расходов на готовые товары и услуги в экономике в целом."},{"t":"Совокупный (валовой) продукт","en":"total product","d":"общий объем конкретного товара (или услуги), произведенного фирмой (или группой фирм, или экономикой в целом)."},{"t":"Совокупный доход","en":"total revenue","d":"количество долларов, вырученных фирмой (или фирмами) от продажи товара; равно общей сумме расходов на приобретение товара, произведенного фирмой (или фирмами); равно количеству проданного товара (на который предъявлен спрос), умноженному на цену, по которой он продан."},{"t":"Совокупный разрешенный вылов","en":"total allowable catch, ТАС","d":"ограничение, устанавливаемое правительством или комиссией, отвечающей за рыболовство, об общем количестве рыбы или веса рыбы, который рыбаки совместно могут добыть в конкретный период времени."},{"t":"Совокупный спрос","en":"","d":"совокупное предложение (модель) (,aggregate demand — aggregate supply model) — макроэкономическая модель, в которой показатели совокупного спроса и совокупного предложения используются для определения и объяснения уровня цен и реального внутреннего продукта."},{"t":"Совокупный спрос на деньги","en":"total demand for money","d":"сумма спроса на деньги для совершения сделок и спроса на деньги как на активы."},{"t":"Совпадение спроса и предложения","en":"coincidence of wants","d":"товар или услуга, которые один трейдер желает приобрести, а другой трейдер хочет продать, а также товар или услуга, которые второй трейдер желает приобрести, а перв
