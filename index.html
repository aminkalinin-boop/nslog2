бочим местам."},{"t":"Дискриминация в оплате труда","en":"wage discrimination","d":"установление более низкой заработной платы представителям определенных групп в сравнении с привилегированными работниками за одинаковую работу."},{"t":"Дискриминация в сфере человеческого капитала","en":"humancapital discrimination","d":"лишение представителей определенных групп возможности получения образования и квалификации, повышения производительности их труда."},{"t":"Дискриминация на рынке труда","en":"labor market discrimination","d":"см. Дискриминация."},{"t":"Дискриминация при найме на работу","en":"employment discrimination","d":"предпочтение определенных групп работников при найме на работу, продвижении по службе, назначении на должности."},{"t":"Дифференциация заработной платы","en":"wage differential","d":"разница между заработной платой, получаемой одним работником или группой работников, и заработной платой, получаемой другим работником или другой группой работников."},{"t":"Дифференциация продукта","en":"product differentiation","d":"стра тегия фирмы, согласно которой продукт одной из фирм отличается от конкурирующего продукта дизайном, сопутствующим обслуживанием, качеством, размеще нием или другими свойствами (кроме цены)."},{"t":"Дифференцированная олигополия","en":"differentiated oligopoly","d":"олигополия, в которой фирмы производят дифференци рованный товар."},{"t":"Дифференцированный товар","en":"differentiate product","d":"продукт, который по физическим или иным параметрам отличается от аналогичных продуктов, производимых другими фирмами; продукт, который покупатели предпочитают приобрести у одного продавца, несмотря на то, что цены у всех продавцов одинаковые."},{"t":"Диффузия","en":"diffusion","d":"распространение инновации путем широкомасштабной имитации."},{"t":"Добавленная стоимость","en":"value added","d":"стоимость проданного фирмой продукта минус стоимость изделий (материалов), купленных и использованных фирмой для его производства."},{"t":"Добавочное пособие малоимущим","en":"Supplement Security Income, SSI","d":"финансируемая из федерального бюджета США и организованная федеральным правительством программа, предоставляющая одинаковый минимальный доход для престарелых, слепых и инвалидов, которые не получают пособий по программе страхования по старости, по случаю потери кормильца и нетрудоспособ Глоссарий 971 ности, а также по программе страхования от безработицы."},{"t":"Добровольные экспортные ограничения","en":"voluntary export restrictions","d":"добровольное ограничение странами или фирмами объема своего экспорта в определенные страны с целью предотвращения введения этими странами торговых барьеров."},{"t":"Долговременное конкурентное равновесие","en":"long-run competitive equilibrium","d":"цена, при которой фирма, действующая в условиях совершенной конкуренции, в долговременном периоде не получает экономическую прибыль и не несет убытки, а общие объемы спроса и предложения равны при определенном уровне цен; цена, равная минимальным долговременным средним совокупным издержкам производства продукта."},{"t":"Долговременный тренд","en":"secular trend","d":"долгосрочная тенденция; изменение некоторых переменных в течение многолетнего периода."},{"t":"Долгосро чный период","en":"long run","d":"1) в микроэкономике период, достаточно длительный, чтобы позволить про изводителям товара изменить количество всех исполь зуемых ими ресурсов; период, в котором все ресурсы и издержки являются переменными, т.е. никакие ресурсы и издержки не являются постоянными; 2) в макроэкономике достаточно длительный период времени, в течение которого номинальная заработная плата и цены других ресурсов изменяются в ответ на изменение уровня цен в стране."},{"t":"Долгосрочная вертикальная кривая Филлипса (long","en":"","d":"run vertical Phillips Curve) — кривая Филлипса после того как номинальные заработные платы скорректированы с учетом темпов инфляции; линия, идущая прямо вверх в точке, соответствующей естественному уровню безра ботицы."},{"t":"Долгосрочная фермерская проблема (long","en":"","d":"run farm prob lem) — тенденция превращения сельского хозяйства в сужающуюся отрасль с ростом технологического про гресса и расширение в связи с этим предложения в срав нении с неэластичным и медленным ростом спроса."},{"t":"Доминирующая стратегия","en":"dominant strategy","d":"в теории игр вариант, который лучше любого альтернативного, независимо от того, что делает другая сторона."},{"t":"Домохозяйство","en":"household","d":"экономическая единица, состоящая из одного или более лиц, которая снабжает экономику ресурсами и использует полученные за них доходы для приобретения товаров и услуг, удовлетворяющих материальные потребности человека."},{"t":"Дополнительные выплаты","en":"fringe benefits","d":"вознаграждение, помимо заработной платы, которое получают работники от своих работодателей, включающее пенсии, пособия по медицинскому и стоматологическому страхованию, оплату очередных отпусков и оплату отпусков по болезни."},{"t":"Дополнительные платежи","en":"surplus payments","d":"платежи владельцам ресурсов, которые не обоснованы необходимостью гарантировать получение ресурсов, например земельная рента."},{"t":"Дополняющие ресурсы","en":"complementary resources","d":"производственные исходные составляющие, используемые совместно с другими ресурсами в производственном процессе; ресурсы, в отношении которых снижение цены одного из них ведет к увеличению спроса на другой."},{"t":"Допущение ceteris paribus","en":"ceteris paribus assumption","d":"см. Допущение «при прочих равных условиях»."},{"t":"Допущение «при прочих равных условиях»","en":"other things equal assumption","d":"допущение, что все другие переменные, за исключением рассматриваемых, остаются неизменными."},{"t":"Достоверная угроза","en":"credible threat","d":"б теории игр заявление одной стороны о своих намерениях, вредных для другой стороны, которое другая сторона рассматривает как достоверное; часто такое заявление формулируется в виде условия: «Если вы сделаете это, мы ответим тем-то и тем-то»."},{"t":"Дохийский раунд","en":"Doha Round","d":"самые последние и по состоянию на 2008 г. незавершенные торговые переговоры членов Всемирной торговой организации; названы по г. Доха, Катар, где этот раунд переговоров начался."},{"t":"Доход","en":"income","d":"поступление денег (или увеличение покупательной способности) на единицу времени в результате использования человеческих ресурсов или собственности."},{"t":"Доход в виде процентов","en":"interest income","d":"доход, получаемый теми, кто обеспечивает экономику капиталом."},{"t":"Доход на душу населения","en":"per capita income","d":"совокупный доход страны, приходящийся на одного человека; средняя величина дохода населения страны."},{"t":"Доход собственника","en":"proprietor’s income","d":"чистый доход владельцев фирм неинкорпорированного типа (индивидуальных собственников и партнерств)."},{"t":"Доходный метод определения В В П","en":"income approach","d":"метод измерения валового внутреннего продукта посредством суммирования всех доходов, созданных в производстве конечных товаров и услуг."},{"t":"Евро","en":"euro","d":"общая денежная единица, используемая в 15 европейских странах (по состоянию на 2008 г.) в зоне евро, в которую входят Австрия, Бельгия, Финляндия, Франция, Германия, Греция, Ирландия, Италия, Люксембург, Нидерланды, Португалия, Испания, Кипр, Словения и Мальта."},{"t":"Европейский союз","en":"European Union, EU","d":"ассоциация 25 европейских государств, созданная для ликвидации ранее введенных между ними таможенных тарифов и импортных квот и установления общих таможенных тарифов на ввоз товаров из зоны необъединенных государств. Цель союза —добиться свободного движения рабочей силы и капитала между странами-участницами, а также выработать общую экономическую политику."},{"t":"Единица учета","en":"unit of account","d":"стандартная единица, с помощью которой может быть установлена цена и сравниваться стоимость товаров и услуг; одна из трех функций денег."},{"t":"Единичная эластичность","en":"unit elasticity","d":"состояние спроса или предложения, когда коэффициент эластичности равен единице; процент изменения величины спроса или предложения равен проценту изменения цены."},{"t":"Естественная монополия","en":"natural monopoly","d":"отрасль, в которой эффект масштаба столь велик, что продукт может быть произведен одной фирмой при более низких средних совокупных издержках, чем если бы его производством занималась не одна, а несколько фирм."},{"t":"Естественный уровень безработицы","en":"natural rate of unemploym ent","d":"уровень безработицы при полной занятости'. такой уровень безработицы, который устанавливается при отсутствии циклической безработицы и когда экономика достигает уровня потенциального выпуска; уровень безработицы, при котором реальная инфляция равна ожидаемой."},{"t":"Жалованье","en":"wages","d":"доход людей, поставляющих экономике свой труд."},{"t":"Жесткие цены","en":"sticky prices","d":"см. Негибкие цены."},{"t":"Забастовка","en":"strike","d":"приостановка работы организованной группой работников (профсоюзом)."},{"t":"Зависимая переменная","en":"dependent variable","d":"переменная, изменяющаяся в результате изменения какой-либо другой (независимой) переменной; эффект или следствие."},{"t":"Закон возрастающих альтернативных издержек","en":"law of increasing opportunity costs","d":"зависимость, показывающая, что по мере увеличения производства продукта альтернативные издержки производства каждой новой единицы продукта возрастают."},{"t":"Закон Клейтона","en":"Clayton A ct","d":"федеральный антитрестовский закон 1914 г., усиливающий положения закона Шермана путем объявления незаконными некоторых специфических методов деятельности фирм."},{"t":"Закон о гражданских правах 1964 г.","en":"Civil Rights Act of 1964","d":"Раздел VII закона запрещает дискриминацию при найме, продвижении по службе и назначении компенсации (заработной платы) работникам по признаку расы, цвета кожи, религиозных убеждений, пола или национальной принадлежности."},{"t":"Закон о занятости 1946 г.","en":"Employment Act of 1946","d":"федеральный закон, обязавший федеральное правительство поддерживать экономическую стабильность (высокий уровень занятости, стабильные цены, экономический рост); этим законом учреждены Экономический совет при президенте и Объединенный экономический комитет Конгресса США, а также введена практика представления президентом ежегодных экономических докладов Конгрессу."},{"t":"Закон о личной ответственности","en":"Personal Responsibility Act","d":"закон от 1996 г., согласно которому были отменены действовавшие до этого в течение 60 лет гарантии денежной помощи бедным семьям, независимо от того, работают или нет взрослые члены семьи; закон установил возрастное ограничение в 5 лет на получение пособий по программе «Временная помощь нуждающимся семьям» ( TANF) и потребовал, чтобы трудоспособные взрослые в такой семье работали не менее двух лет для получения права на продолжение государственной помощи."},{"t":"Закон о помощи в профессиональной адаптации","en":"Trade Adjustment Assistance Act","d":"закон, принятый в 2002 г. в США, предусматривающий предоставление помощи наличными деньгами, в получении образования и профессиональной подготовки, субсидии при получении медицинских услуг, страхование заработной платы (для людей в возрасте 50 лет и старше). Условия этого закона распространяются на тех, кто оказался без работы в результате вытеснения национальных продуктов импортными или перемещения предприятия, на котором они работали, из США в другую страну."},{"t":"Закон о праве на труд (Right","en":"","d":"to-work law) — принятое в 22 штатах США законодательство, запрещающее в этих штатах требовать от работника вступления в профсоюз в качестве условия сохранения им рабочего места на данном предприятии; объявляет вне закона «цеховые профсоюзы»."},{"t":"Закон о продуктах питания, сохранении ресурсов и энергии от 2008 г.","en":"Food, Conservation, and Energy Act of 2008","d":"закон о фермерском хозяйстве, предусматривающий предоставление в более широких масштабах уже действующих в прошлом сельскохозяйственных субсидий трех видов: прямые выплаты, выплаты для выравнивания циклических колебаний и маркетинговые займы. Закон о равной оплате труда 1963 г. (Equal Pay Act of 1963) — федеральный закон США, запрещающий применять разную оплату труда в отношении мужчин и женщин, если они делают одинаковую работу и если эта работа требует одинаковых навыков, усилий и ответственности и выполняется в одинаковых условиях."},{"t":"Закон о свободе фермерской деятельности","en":"Freedom of Farm Act","d":"закон, принятый в 1996 г. с целью полного 973 пересмотра сельскохозяйственной политики США за последние 60 лет, отменил ценовую поддержку и распределение земли под пшеницу, зерновые, ячмень, овес, сорго, рожь, хлопчатник и рис."},{"t":"Закон о соглашениях о взаимной торговле 1934 г.","en":"Reciprocal Trade Agreements Act of 1934","d":"федеральный закон, предоставивший президенту право заключать с другими странами соглашения и снижать таможенные пошлины США на величину до 50% при условии, что эти страны снижают таможенные пошлины на американские товары; закон также предусматривал включение в эти соглашения статьи о режиме наибольшего благоприятствования."},{"t":"Закон о тарифах Смута","en":"","d":"Холи (Smoot-Hawley Tariff Act) — закон, принятый в 1930 г.; установил очень высокие таможенные пошлины; преследовал цель сократить импорт и стимулировать рост внутренней экономики, однако в ответ на это другие страны также установили тарифы."},{"t":"Закон о Федеральной комиссии по торговле","en":"Federal Trade Commission A ct","d":"федеральный закон от 1914 г., согласно которому была учреждена Федеральная комиссии по торговле."},{"t":"Закон Оукена","en":"Okun’s law","d":"обобщение, гласящее, что превышение текущего уровня безработицы на 1% над уровнем безработицы при полной занятости ресурсов увеличивает отставание реального ВВП от потенциального ВВП страны на 2,0%."},{"t":"Закон предложения","en":"law of supply","d":"принцип, согласно которому при прочих равных условиях рост цены продукции влечет за собой рост предложения, и наоборот."},{"t":"Закон Селлера","en":"","d":"Кефовера (Celler-Kefauver A ct) — федеральный закон от 1950 г., внесший поправку к закону Клейтона, запрещающую фирме приобретать активы другой фирмы, если это приводит к ослаблению конкуренции."},{"t":"Закон спроса","en":"law of demand","d":"принцип, согласно которому при прочих равных условиях повышение цен на товары сокращает спрос на них и, наоборот, снижение цен повышает спрос."},{"t":"Закон Сэя","en":"S a y’s Law","d":"макроэкономический принцип (не нашедший подтверждения), согласно которому производство товаров и услуг (предложение) создает равный спрос на них."},{"t":"Закон убывающей отдачи","en":"law of diminishing returns","d":"ситуация, когда последовательно к постоянным ресурсам добавляется одно и то же количество переменного ресурса и сверх какого-то определенного уровня предельный продукт, полученный из переменного ресурса, начинает все больше сокращаться."},{"t":"Закон убывающей предельной полезности","en":"law of diminishing marginal utility","d":"по мере того как потребитель уве личивает потребление товара или услуги, предельная полезность каждой дополнительной единицы товара или услуги сокращается."},{"t":"Закон Уилера","en":"","d":"Ли ( Wheeler-Lea Act) — федеральный закон 1938 г., внесший в Закон о Федеральной комиссии по торговле поправку, которая запрещает нечестные и обманные действия или практику в торговле (недобросовестную рекламу, искажение сведений о товарах), и предоставил Комиссии по торговле право проводить соответствующее расследование."},{"t":"Закон Шермана","en":"Sherman Act","d":"федеральный антитрестовский закон 1890 г., который провозгласил уголовны ми преступлениями монополию и вступление в сговор с целью ограничения торговли."},{"t":"Законное средство платежа","en":"legal lender","d":"юридически узаконенная валюта (банкноты и монеты) страны; все средства, которые должны приниматься в уплату за долг, хотя кредиторы могут установить конкретную форму оплаты, например только «наличными» либо только «по чеку или кредитной карте»."},{"t":"Закрытая экономика","en":"closed economy","d":"страна, не экспортирующая и не импортирующая товары и услуги."},{"t":"Запланированные инвестиции","en":"planned investment","d":"сред ства, которые фирмы планируют или намереваются инвестировать."},{"t":"Запретительное предписание (cease","en":"","d":"and-desist order) — распоряжение суда или правительственного ведомства (комиссии или министерства), обязывающее корпорацию или конкретное лицо прекратить специфический вид хозяйственной деятельности."},{"t":"Заработная плата","en":"wage","d":"цена за труд (использование трудовых услуг) за единицу времени (час, день и т.д.)."},{"t":"Заработок","en":"earnings","d":"денежный доход, получаемый работником; равен ставке заработной платы, умноженной на количество отработанного времени."},{"t":"Затратный метод определения ВВП","en":"expenditures approach","d":"метод измерения внутреннего валового продукта посредством суммирования всех затрат на производство конечных товаров и услуг."},{"t":"Затраты «на меню», или на переоценку","en":"menu costs","d":"нежелание фирм снижать цены в периоды рецессии (если они считают, что экономический спад будет краткосрочным) из-за расходов, которые потребуются на изменение цен и информирование об этом заинтересованных лиц. Термин пришел из ресторанов, где возникают дополнительные затраты, если надо напечатать новое меню."},{"t":"Защитная медицина","en":"defensive medicine","d":"рекомендации врачей о прохождении дополнительных тестов и процедур, которые с точки зрения медицины или экономически предназначены для защиты себя от последующих исков по поводу неправильного лечения."},{"t":"Защитная пошлина","en":"protective tariff","d":"пошлина (тариф), установленная с целью защиты внутренних производителей товара (или услуг) от конкуренции иностранных производителей."},{"t":"Земельная реформа (материал интернет","en":"","d":"главы) (land reform) —набор приемов, разработанный для более эффективного распределения прав собственности на землю в развивающихся странах; в каждой стране эти приемы могут быть своими и могут предусматривать самые разные подходы —от покупки правительством крупных поместий земли и раздела этих участков на небольшие фермы до консолидации крошечных участков, чтобы по лучить более эффективно действующие частные фермы."},{"t":"Землеемкий товар (land","en":"","d":"intensive commodity) — продукт, на производство которого требуется относительно боль шое количество земли (естественных ресурсов)."},{"t":"Земля","en":"land","d":"природные ресурсы (даровые блага природы), которые могут быть использованы для производства товаров и услуг."},{"t":"Золотой стандарт","en":"gold standard","d":"историческая международная валютная система, в соответствии с которой каждая страна выражала стоимость своих денежных единиц в определенном количестве золота, поддержи вала неизменное соотношение своего золотого запаса и массы денег в обращении и допускала свободный ввоз и вывоз золота."},{"t":"Игра с нулевой суммой (zero","en":"","d":"sum game) — в теории игр игра, при которой выигрыши (+) и убытки (—) в сумме дают ноль; выигрыш одной стороны равен проигрышу другой."},{"t":"Игра с одновременно осуществляемыми ходами","en":"simultaneous game","d":"в теории игр игра, при которой обе стороны выбирают свои стратегии и реализуют их одновременно."},{"t":"Игра с отрицательной суммой","en":"negative sum game","d":"в теории игр игра, при которой выигрыши (+) и потери (—) при сложении дают сумму меньше нуля; проигрыш одной стороны превышает выигрыш другой."},{"t":"Игра с положительной суммой (positive","en":"","d":"sum game) — в теории игр игра, при которой выигрыши (+) и потери (—) при сложении дают сумму выше нуля; проигрыш одной стороны ниже выигрыша другой."},{"t":"Игра с последовательно осуществляемыми ходами","en":"sequential game","d":"в теории игр игра, при которой стороны делают свои ходы по очереди, когда одна сторона, сделав первый ход, ждет хода другой стороны и т.д. Избыток —см. Излишек."},{"t":"Избыточная производственная мощность","en":"excess capacity","d":"часть заводских ресурсов, которые не используются, когда на рынке несовершенной конкуренции фирмы производят меньше, чем могли бы при минимальных совокупных средних затратах."},{"t":"Избыточные резервы","en":"excess reserves","d":"сумма, на которую фактические резервы банка или сберегательного учреждения превышают его обязательные резервы-, фактические резервы за вычетом обязательных резервов."},{"t":"Издержки добычи","en":"extraction cost","d":"все затраты, связанные с добычей природного ресурса и его подготовкой к последующей продаже."},{"t":"Издержки использования","en":"user cost","d":"альтернативные издержки добычи и продажи невозобновляемых ресурсов в настоящее время, вместо добычи и продажи в будущем; приведенная стоимость снижения будущих доходов, что происходит из-за того, что невозобновляемые ресурсы добываются и продаются сейчас, а не в буду щем."},{"t":"Издержки на рабочую силу в единице продукции","en":"unit labor cost","d":"затраты на рабочую силу в расчете на единицу продукции; равны ставке номинальной заработной платы, деленной на среднюю выработку работника."},{"t":"Издержки перелива","en":"spillover costs","d":"издержки производ ства продукта, которые несут не производители и потребители, а третья сторона без всякого их возмещения. Например, производитель ядохимикатов слил часть их в реку, в результате погибла рыба и, следовательно, пострадали люди, занимающиеся спортивной рыбалкой."},{"t":"Излишек","en":"surplus","d":"сумма, на которую объем предложения продукта превышает объем спроса на него при определенной (выше равновесной) цене."},{"t":"Излишек международного платежного баланса (international balance","en":"","d":"of-payments surplus) — см. Активное сальдо платежного баланса. «Изменение для достижения победы» (Change to Win) — созданная на нежестких основаниях федерация американских профсоюзов, включающая работников сервисных отраслей и водителей грузовиков; в целом насчитывает 6 млн работников."},{"t":"Излишек счета движения капиталов и финансов","en":"capital and financial account deficit","d":"положительная сумма на счете движения капиталов и финансов в международном платежном балансе страны."},{"t":"Изменение запрашиваемого количества","en":"change in quantity demanded","d":"изменение количества продукта, которое потребители готовы и способны купить в результате изменения цены этого продукта."},{"t":"Изменение предложения","en":"change in supply","d":"изменение количества предложения товаров или услуг при любом уровне цен; смещение кривой предложения влево или вправо."},{"t":"Изменение предоставляемого количества","en":"change in quantity supplied","d":"изменение количества продукта, которое 975 производители готовы и способны предложить на продажу в результате изменения цены этого продукта."},{"t":"Изменение спроса","en":"change in demand","d":"изменение количества спроса на товары или услуги при любом уровне цен; смещение кривой спроса влево или вправо."},{"t":"Изобретение","en":"invention","d":"открытие нового продукта или процесса благодаря воображению, нестандартному мышлению и экспериментированию, а также первое доказательство того, что эта новинка работоспособна."},{"t":"Изъятие, утечка","en":"leakage","d":"1) потенциальные расходы, изъятые из потока «доходы —расходы»: сбережения, налоговые платежи и импорт-, 2) изъятие средств, сокращающее кредитные возможности системы коммерческих банков."},{"t":"Иммиграция","en":"immigration","d":"приток людей в страну из другой страны. Иммигранты могут бьггь законными и незаконными."},{"t":"Иммобильность","en":"","d":"см. Отсутствие мобильности."},{"t":"Импорт","en":"imports","d":"расходы частных лиц, фирм и органов власти данной страны на приобретение товаров и услуг, произведенных в других странах."},{"t":"Импортная квота","en":"import quota","d":"вводимое страной ограничение объема (или общей стоимости) ввозимого из других стран товара в течение определенного периода."},{"t":"Импортная конкуренция","en":"import competition","d":"конкуренция, с которой сталкиваются фирмы одной страны, когда ей противостоят товары и услуги производителей из других стран."},{"t":"Импортная сделка","en":"import transaction","d":"закупка товаров или услуг, сокращающая количество иностранной валюты у отдельных лиц, фирм и правительства данной страны."},{"t":"Имущественный налог","en":"","d":"см. Налог на имущество."},{"t":"Инвестиции в человеческий капитал (human","en":"","d":"capital investment) — любые затраты, предпринятые для повышения образования, квалификации, улучшения здоровья работников или усиления мобильности рабочей силы и, таким образом, увеличения дохода от инвестиций."},{"t":"Инвестиции, инвестирование","en":"investment","d":"затраты на производство и накопление средств производства и увеличение материальных запасов."},{"t":"Инвестиционные банки","en":"investment bank","d":"фирмы, помогающие корпорациям и органам власти получать деньги при продаже акций и облигаций; также предоставляют консалтинговые услуги при корпоративных слияниях и поглощениях и услуги и рекомендации брокерского характера."},{"t":"Инвестиционные товары, средства производства","en":"capital goods, investment goods","d":"см. Капитал."},{"t":"Индекс Герфиндаля","en":"Herftnduhle index","d":"показатель уровня концентрации и конкуренции в отрасли; рассчитывается как сумма квадратов долей рынка отдельных фирм."},{"t":"Индекс паритета","en":"parity ratio","d":"отношение цен на продукцию фермеров к ценам, по которым они приобретают несельскохозяйственную продукцию; служит основой для политики поддержания цен; измеряется в про центах."},{"t":"Индекс потребительских цен","en":"consumer price index, CPI","d":"индекс для измерения уровня цен некоторой определенной потребительской корзины, состоящей из 300 основных потребительских товаров и услуг, которые покупает средний статистический потребитель."},{"t":"Индекс цен","en":"price index","d":"индекс, показывающий динамику изменения цены потребительской корзины во времени."},{"t":"Индексные фонды","en":"index funds","d":"взаимные фонды, которые выбирают акции или облигации для своих портфелей так, чтобы они точно соответствовали акционному или облигационному индексу (набору акций или облигаций, который, как считается, отражает общую динамику конкретной категории инвестиций), например Standard & Poor’s 500 Index или Russel 3000."},{"t":"Индивидуальная частная фирма","en":"sole proprietorship","d":"неинкорпорированная фирма, которой владеет и управляет одно лицо."},{"t":"Индивидуальное предложение","en":"individual supply","d":"кривая предложения или график предложения отдельного продавца."},{"t":"Индивидуальный спрос","en":"individual demand","d":"кривая спроса или график спроса одного покупателя."},{"t":"Индустрия финансовых услуг","en":"financial service industry","d":"широкая категория, включающая фирмы, которые предоставляют финансовые продукты и услуги и помогают домохозяйствам и организациям бизнеса получать про центы, дивиденды, доходы от прироста капитала, стра ховаться от убытков и планировать свое обеспечении после выхода на пенсию. Среди участников этой ин дустрии можно выделить коммерческие банки, сберега тельные учреждения, пенсионные фонды и страховые компании."},{"t":"Инновационный продукт","en":"product innovation","d":"развитие и продажа нового или усовершенствованного продукта (или услуги)."},{"t":"Инновация процесса","en":"process innovation","d":"разработка и применение нового или усовершенствованного способа производства или метода распределения продукции (или услуг)."},{"t":"Иностранная конкуренция","en":"foreign competition","d":"см. Импортная конкуренция."},{"t":"Инфлирование","en":"inflating","d":"исчисление реального ВВП путем увеличения денежной стоимости номинального ВВП, произведенного в году, когда цены были ниже, чем в базовом."},{"t":"Инфляционная премия","en":"inflation premium","d":"часть номинальной процентной ставки, отражающая ожидаемый уровень инфляции."},{"t":"Инфляционные ожидания","en":"inflationary expectations","d":"пред положения работников, фирм и потребителей о том, что в будущем возникнет значительная инфляция."},{"t":"Инфляционный разрыв","en":"inflationary expenditure gap","d":"величина, на которую кривая совокупных расходов должна сместиться вниз, чтобы номинальный В В П соответствовал уровню неинфляционного ВВП, произведенного при полной занятости ресурсов."},{"t":"Инфляция","en":"inflation","d":"повышение общего уровня цен в экономике."},{"t":"Инфляция издержек","en":"cost-push inflation","d":"повышение уровня цен (инфляция), возникающее в результате роста затрат, заработной платы и цен на сырье (и, соответственно, роста единичных зат рат ) , сопровождаемое сокращением совокупного (валового) продукта."},{"t":"Инфляция спроса (demand","en":"","d":"pull inflation) — повышение уровня цен (инфляция), вызываемое превышением спроса над предложением при данном уровне цен, вызванное увеличением совокупного спроса."},{"t":"Информационные технологии","en":"information technology","d":"новые и более эффективные методы доставки и получения информации при помощи компьютеров, факс-аппаратов, беспроводных телефонов и Интернета."},{"t":"Инфраструктура","en":"infrastructure","d":"капитальные сооружения, используемые гражданами и фирмами, обычно предоставляемые органами власти (автомагистрали, мосты, городские транспортные системы, водоочистные сооружения, муниципальные системы водоснабжения и аэропорты)."},{"t":"Ипотечный долговой кризис","en":"mortgage debt crisis","d":"пери од, начавшийся в конце 2007 г., когда тысячи домовла дельцев отказались платить по ипотечным кредитам, столкнувшись с комбинацией более высоких ипотечных процентных ставок и снижением цен на дома."},{"t":"Истощающие расходы","en":"exhaustive expenditures","d":"правительственные расходы, приводящие к непосредственному использованию экономических ресурсов и поглощению правительством товаров и услуг, произведенных из этих ресурсов; закупки, осуществляемые органами власти."},{"t":"Капитал","en":"capital","d":"ресурсы, созданные в результате производственной деятельности и используемые для производства товаров и услуг; товары, которые непосредственно не удовлетворяют потребностей человека: инвестиционные товары, средства производства."},{"t":"Капитализм","en":"capitalism","d":"экономическая система, в которой материальные ресурсы являются частной собственностью, а рынки и цены используются для направления и координации экономической деятельности."},{"t":"Капитализм свободной конкуренции (laissez","en":"","d":"fair capitalism) — см. Капитализм."},{"t":"Капиталоемкий товар (capital","en":"","d":"intensive commodity) —продукт, в производстве которого применяется относительно большое количество капитала."},{"t":"Капитальные активы","en":"capital stock","d":"весь капитал данной страны."},{"t":"Карта кривых безразличия","en":"indiffrence тар","d":"совокупность кривых безразличия, каждая из которых представляет разную степень полезности; все эти кривые вместе характеризуют предпочтения потребителя."},{"t":"Картель","en":"cartel","d":"формальное, совершенное в письменном виде или устное соглашение между фирмами отрасли об установлении цен на продукт, об объеме производства этих фирм либо о географическом разделе рынка для продаж продукции."},{"t":"Кассовая наличность","en":"vault cash', till money","d":"деньги, которые банк держит в своих сейфах и кассах."},{"t":"Квазигосударственный банк (quasi","en":"","d":"public bank) — банк, являющийся частной собственностью, но контролируемый правительством (обществом); федеральные резервные банки."},{"t":"Квазиобщественное, квазигосударственное благо","en":"quasipublic good","d":"товар или услуга, на которые может распространяться принцип исключения, но которые обеспечивают такие большие выгоды перелива, что правительство поощряет их производство для предотвращения неэффективности распределения ресурсов."},{"t":"Кейнсианство","en":"Keynesianism","d":"философские, идеологические взгляды и аналитические подходы, представленные в кейнсианской экономической теории."},{"t":"Классическая экономическая теория","en":"classical economics","d":"макроэкономическая теория, принятая многими экономистами до начала 1930-х гг., согласно которой капиталистическая экономика является саморегулирующейся и полностью использует свои ресурсы."},{"t":"Количественная полезность","en":"cardinal utility","d":"удовлетворение (полезность), которое можно измерить при помощи количественных числительных (1, 2, 3...), в отношении которых действуют все математические свойства чисел, такие как сложение, вычитание, умножение и деление."},{"t":"Коллективный голос","en":"collective voice","d":"функция, выполняемая профсоюзом от имени своих членов, когда он заявляет о своих проблемах администрации, предъявляет жалобы и добивается надлежащего решения этих проблем и удовлетворения жалоб. 977"},{"t":"Командная система","en":"command system","d":"метод организации экономики, при которой собственность на ресурсы является общественной, а органы власти используют централизованное экономическое планирование для руководства и координирования экономических видов деятельности; командная экономика."},{"t":"Комбинация ресурсов, обеспечивающая максимальную прибыль (profit","en":"","d":"maximizing combination of resources) — количество каждого ресурса, которое фирма должна использовать, чтобы ее прибыль была максимальной или убытки минимальными; комбинация ресурсов, при которой предельный продукт в денежной форме каждого ресурса равен предельным издержкам на ресурс (его цене, если ресурс используется на конкурентном рынке)."},{"t":"Комбинация ресурсов, обеспечивающая наименьшие издержки (least","en":"","d":"cost combination of resources) — определен ное количество каждого ресурса, которое фирма должна использовать для производства какого-либо объема продукции с наименьшими издержками; комбинация ресурсов, при которой отношение между предельным продуктом ресурса и предельными издержками на ресурс (его ценой, если ресурс используется на конкурентном рынке) одинаково для последнего доллара, затраченного на каждый применяемый ресурс."},{"t":"Коммерческий банк","en":"commercial bank","d":"фирма, занятая в банковском деле (принимает вклады, чековые вклады и предоставляет ссуды)."},{"t":"Коммунизм","en":"communism","d":"см. Командная система."},{"t":"Компания с ограниченной ответственностью (lim ited","en":"","d":"liability company) —компания, чьи владельцы защищены тем, что несут лишь ограниченную ответственность."},{"t":"Компромисс","en":"tradeoff","d":"отказ (жертва) от нескольких или даже от всех целей, товаров или услуг для достижения других целей, получения других товаров или услуг."},{"t":"Компромисс между равенством и эффективностью","en":"equality versus efficiency tradeoff","d":"снижение экономической эффективности, которое может сопровождать сужение неравенства доходов: предубеждение, согласно которому для достижения экономической эффективности необходимо некоторое неравенство доходов."},{"t":"Конгломератное слияние","en":"conglomerate merger","d":"слияние фирмы одной отрасли с фирмой другой отрасли (не являющейся ни поставщиком, ни клиентом, ни конкурентом) или региона."},{"t":"Конгломераты","en":"conglomerates","d":"фирмы, производящие товары и услуги в двух или более независимых отраслях."},{"t":"Конечные продукты и услуги","en":"final goods and services","d":"товары и услуги, купленные с целью их конечного использования, а не для перепродажи, переработки или дальнейшего использования в производственном процессе."},{"t":"Конкурентный рынок труда","en":"competitive labor market","d":"рынок, на котором большое количество фирм (без его вора между собой) предъявляют спрос на большое число работников, не являющихся членами профсоюза конкретных профессий."},{"t":"Конкуренция","en":"competition","d":"присутствие на рынке большого числа независимых покупателей и продавцов и возможность для покупателей и продавцов свободно входить на рынок и покидать его."},{"t":"Контроль обменного курса {foreign exchange control)","en":"","d":"см. Валютный контроль."},{"t":"Конфликты из","en":"","d":"за бриллиантов {conflict diamonds) — бриллианты, которые добываются и продаются участниками военных действий в Африке как способ получить денежные средства, необходимые им для ведения своих военных операций."},{"t":"Концепция паритета {parity concept)","en":"","d":"концепция, предполагающая, что данный реальный объем сельскохозяйственной продукции должен позволить фермеру из года в год приобретать одно и то же количество несельскохозяйственных товаров и услуг."},{"t":"Корпорация","en":"corporation","d":"юридическое лицо, получившее лицензию властей штата или федерального правительства и обособленное от индивидов, чьей собственностью корпорация является."},{"t":"Корреляция","en":"correlation","d":"систематическая и обусловленная связь между двумя рядами данных (двумя видами явлений); наличие корреляции само по себе не указывает на наличие причинной связи."},{"t":"Коррупция","en":"corruption","d":"злоупотребление полномочиями органа власти, предоставленными ее представителю, который стремится получить частную выгоду; в том числе получение платежей от отдельных лиц или компаний, чтобы те смогли добиться преимуществ за счет получения правительственных контрактов, избежать действия регулирующих норм, устанавливаемых правительством, или получить инсайдерскую информацию о предстоящих изменениях в политике."},{"t":"«Косвенное» производство","en":"roundabout production","d":"строительство и использование сооружений и капитального оборудования с целью поддержания производства потребительских товаров."},{"t":"Косвенные налоги на бизнес","en":"indirect business taxes","d":"налог с продаж, акцизный сбор, налог на имущество, оплата лицензий на ведение хозяйственной и производственной деятельности, а также различные тарифы, которые фирмы включают в издержки производства продукта и перекладывают (целиком или частично) на покупателя путем повышения цены продукта."},{"t":"Коэффициент воспроизводства населения","en":"replacement rate","d":"коэффициент рождаемости, необходимый для компенсации смертности людей в стране, чтобы поддерживать постоянной (без учета иммиграции) числен ность популяции. Для большинства стран коэффициент воспроизводства равен приблизительно 2,1 рождений в расчете на женщину за весь срок ее жизни."},{"t":"Коэффициент дискриминации","en":"discrimination coefficient","d":"мера стоимости или убытки из-за предубеждения; денежное выражение стоимости решения работодателя, которую он готов заплатить, когда нанимает того, кого предпочитает, а не другого работника."},{"t":"Коэффициент общей фертильности","en":"total fertility rate","d":"среднее общее число детей, которое женщина, как ожидается, родит за всю ее жизнь."},{"t":"Коэффициент эластичности","en":"elasticity coefficient","d":"результат деления процента изменения величины спроса (или предложения) на процент изменения цены товара."},{"t":"Коэффициент юнионизации","en":"unionization rate","d":"процент конкретной популяции работников, являющихся членами профсоюза; другими словами, процент работников, которых профсоюзы представляют при заключении коллективного договора."},{"t":"Краткосрочная фермерская проблема","en":"short-run farm problem","d":"резкие годовые колебания цен на продукцию и, соответственно, доходов фермеров."},{"t":"Краткосрочное конкурентное равновесие (short","en":"","d":"run competitive equilibrium) — цена, по которой общее количество продукта чисто (совершенно) конкурентной отрасли, предлагаемого в пределах кратковременного периода, равно общему количеству продукции, на которую предъявляется спрос, при одновременном равенстве этой цены средним переменным издержкам производства продукта или их превышении."},{"t":"Краткосрочный период","en":"short run","d":"1) в микроэкономике период, в течение которого производители продукта в состоянии изменить (использовать) какую-то часть применяемых ресурсов, но не все; период, в течение которого часть ресурсов (обычно предприятия) представляет собой основные средства, а другая часть —оборотные средства; 2) в макроэкономике период, в течение которого номинальная заработная плата и цены на другие ресурсы не меняются в ответ на изменение уровня цен."},{"t":"Кредит","en":"credit","d":"запись на бухгалтерском счете, свидетельствующая о том, что стоимость актива (например, иностранной валюты, являющейся собственностью гражданина данной страны) возросла."},{"t":"Кредитно","en":"","d":"денежная политика (monetary policy) — изменение предложения денег, производимое центральным банком с целью воздействия на ставку процента и достижения неинфляционного объема производства совокуйю го продукта при условии полной занятости."},{"t":"Кредитный потенциал банковской системы","en":"lending potential of the banking system","d":"сумма, на которую система коммерческих банков может увеличить предложение де нег в обращении путем предоставления новых займов гражданам и фирмам (или приобретения у них ценных бумаг); сумма, равная избыточным резервам системы коммерческих банков, умноженным на величину денежного мультипликатора."},{"t":"Кредитный потенциал отдельного коммерческого банка","en":",lending potential of an individual commercial bank","d":"сумма, на которую отдельный коммерческий банк может без риска увеличить предложение денег в обращении путем предоставления новых займов гражданам и фирмам (или приобретения у них ценных бумаг); сумма, равная избыточным резервам этого коммерческого банка."},{"t":"Кредитный союз","en":"credit union","d":"ассоциация лиц, объединенных общими интересами (например, работники и служащие одной фирмы или члены одного профсоюза), которая продает своим членам акции (принимает от них вклады) и предоставляет им ссуды."},{"t":"Кривая безразличия","en":"indifference curve","d":"кривая, показывающая различные комбинации двух продуктов, имеющих одинаковое потребительское значение или ту же полезность для потребителя."},{"t":"Кривая долгосрочного совокупного предложения (long","en":"","d":"run aggregate supply curve) — применительно к макроэкономике, это кривая совокупного предложения, показывающая, что при смещении кривых совокупного спроса меняется цена, а реальный объем продукции остается неизменным; вертикальная кривая предложения, предполагающая полностью гибкие цены."},{"t":"Кривая краткосрочного предложения (short","en":"","d":"run supply curve) — кривая предложения, показывающая количество продукта фирмы из чисто конкурентной отрасли, предлагаемого для продажи по разным ценам в краткосрочном периоде ; часть кривой краткосрочных предельных издержек фирмы, которая лежит выше кривой средних переменных издержек."},{"t":"Кривая краткосрочного предложения конкурентной отрасли (competitive industry’s short","en":"","d":"run supply curve) — горизонтальное смещение кривых краткосрочного предложения фирм в условиях отрасли с совершенной конкуренцией', кривая, показывающая общее количество продукции, которое фирмы одной отрасли предложат на рынках по разным ценам в течение краткосрочного периода."},{"t":"Кривая краткосрочного совокупного предложения (short","en":"","d":"run aggregate supply curve) — кривая совокупного предложения в периоде, в течение которого цены на ресурсы (в частности, номинальная заработная плата) остаются постоянными, а общий уровень цен изменяется."},{"t":"Кривая Лаффера","en":"Laffer curve","d":"кривая, показывающая связь между налоговыми ставками и объемом налоговых поступлений, выявляющая такую налоговую ставку (от нулевой до 100%), при которой налоговые поступления достигают максимума. 979"},{"t":"Кривая Лоренца","en":"Lorenz curve","d":"кривая, которую можно использовать для иллюстрации распределения дохода в экономике; когда данную кривую используют с этой целью, суммарный процент семей (получателей доходов) измеряется по оси абсцисс, а суммарный процент доходов —по оси ординат."},{"t":"Кривая ожидаемой нормы доходности","en":"expected rate of return curve","d":"связанная с исследованиями и разработками (НИОКР) кривая, показывающая ожидаемый выигрыш в прибыли как процент от затрат на НИОКР от дополнительных средств, затрачиваемых на НИОКР."},{"t":"Кривая предложения","en":"supply curve","d":"кривая, показывающая объем предложения товаров или услуг."},{"t":"Кривая предложения экспорта","en":"export supply curve","d":"снижающаяся кривая, показывающая объем продукта, который будут экспортировать национальные фирмы при определенном уровне мировых цен, превышающем уровень внутренней цены продукта."},{"t":"Кривая производственных возможностей","en":"production possibilities curve","d":"кривая, показывающая различные комбинации двух товаров или услуг, которые могут быть произведены в условиях полной занятости и полного объема продукции в экономике с постоянными запасами ресурсов и неизменной технологией."},{"t":"Кривая спроса","en":"demand curve","d":"кривая (график), показывающая, какое количество определенного товара или услуги покупатели готовы приобрести, т.е. каков спрос."},{"t":"Кривая спроса на инвестиции (investment","en":"","d":"demand curve) — кривая (график), показывающая динамику процентной ставки (по оси ординат) и объем инвестиций при разных реальных процентных ставках (по оси абсцисс)."},{"t":"Кривая спроса ни импорт","en":"import demand curve","d":"снижающаяся кривая, где отражается объем продукции, который будет импортироваться при конкретном уровне мировых цен, если они ниже внутренних цен на определенный вид продукта."},{"t":"Кривая текущего совокупного предложения (immediate","en":"","d":"short-run aggregate supply curve) — кривая совокупного предложения, показывающая, что при смещении кривых совокупного спроса меняется реальный объем продукции, но ценовой уровень остается прежним; горизонтальная кривая совокупного предложения, вызванная негибким ценовым уровнем."},{"t":"Кривая Филлипса","en":"Phillips curve","d":"кривая, показывающая связь между уровнем безработицы (по оси абсцисс) и годовым темпом роста уровня цен (по оси ординат)."},{"t":"Курс обмена валюты","en":"rate of exchange","d":"цена, уплачиваемая в собственной валюте за единицу иностранной валюты; курс, по которому валюта одной страны обменивается на валюту другой страны."},{"t":"Легальный иммигрант","en":"legal immigrant","d":"лицо, легально прибывающее в страну с целью проживания."},{"t":"Ликвидность","en":"liquidity","d":"активы, которые можно быстро и легко превратить в наличные деньги без потери или при небольшой потере их покупательной способности. Самым высоколиквидным активом являются деньги."},{"t":"Линия рынка ценных бумаг","en":"Security M arket Line, SM L","d":"линия, которая показывает среднюю ожидаемую норму доходности по всем финансовым инвестициям при каждом уровне недиверсифицируемого риска, измеряемого бетой."},{"t":"Линия с наклоном в 45°, биссектриса","en":"45-degree line","d":"прямая, указывающая на равенство стоимости ВВП (по оси абсцисс) и совокупных расходов (по оси ординат)."},{"t":"Лицензирование работников","en":"occupational licensure","d":"законы правительств или местных органов власти, требу ющие, чтобы работник соответствовал определенным требованиям и получал от специального бюро разрешение на определенную профессию."},{"t":"Личное распределение дохода","en":"personal distribution of income","d":"способ распределения получаемого в стране личного или располагаемого дохода (после уплаты налогов) между различными категориями доходополучателей или домохозяйств."},{"t":"Личные потребительские расходы","en":"personal consumption expenditures","d":"расходы домохозяйств на потребительские товары, товары длительного и кратковременного пользования и услуги."},{"t":"Личные сбережения","en":"personal saving","d":"личный доход домохозяйств минус налог на него и минус расходы на личное потребление: часть располагаемого дохода (после уплаты налогов), которая не израсходована на потребительские товары."},{"t":"Личный доход","en":"personal income, РГ","d":"доход, часть которого заработана, а другая часть не заработана, находящийся в распоряжении граждан до уплаты личного подоходного налога."},{"t":"Личный подоходный налог","en":"personal income tax","d":"налог, которым облагается подлежащий налогообложению доход отдельных лиц, домохозяйств и неинкорпорированных фирм. Локаут —см. Массовые увольнения."},{"t":"Ломаная кривая спроса","en":"kinked demand curve","d":"кривая спроса, который был бы желателен для олигополиста, не участвующего в сговоре; такая кривая спроса основана на допущении, что соперничающие фирмы присоединятся к решению о снижении цен, но не последуют решению о повышении цен."},{"t":"Макроэкономике","en":"macroeconomics","d":"раздел экономической науки, исследующий экономику как целое, а также ее важнейшие составляющие: домохозяйство, компании и государственный сектор, использующие для этого общие (совокупные) экономические показатели."},{"t":"Маржинальный анализ","en":"marginal analysis","d":"подход, при котором для принятия решений производители проводят сравнение предельных («дополнительных») доходов и предельных издержек."},{"t":"Массовые увольнения","en":"lockout","d":"действия фирмы, запрещающие работникам вернуться на свои рабочие места до подписания нового коллективного договора; средство переноса расходов (утраченной заработной платы) на профсоюзы в переговорах по поводу заключения коллективного договора."},{"t":"МВФ","en":"IMF","d":"см. Международный валютный фонд."},{"t":"Межвременной выбор","en":"intertemporal choice","d":"выбор между преимуществами, получаемыми в один временной период, и выигрышем, достигаемым в более поздний временной период; сравнение, которое отдельные люди и общество в целом должны делать, чтобы сократить текущее потребление, что необходимо для финансирования текущих инвестиций и достижения более высоких уровней будущих потреблений, которые могут обеспечить эти нынешние инвестиции."},{"t":"Международная стоимость доллара","en":"international value of the dollar","d":"цена, которую надо заплатить в иностранной валюте для получения американского доллара."},{"t":"Международные валютные резервы","en":"international monetary reserves","d":"иностранные валюты и другие активы, например золото, которые страна может использовать для покрытия дефицита платежного баланса."},{"t":"Международный валютный рынок","en":"foreign exchange market","d":"рынок, на котором валюта одной страны может быть использована для приобретения (обмена) на валюту другой страны."},{"t":"Международный валютный фонд","en":"International Monetary Fund, IMF","d":"международная ассоциация государств, образовавшаяся после Второй мировой войны для предоставления займов в иностранной валюте странам с временным дефицитом платежного баланса (это практиковалось лишь до начала 1970-х гг.) и для осуществления мер по поддержанию валютных курсов. Сегодня МВФ в основном предоставляет займы странам, которым угрожает дефолт по государственным и частным займам."},{"t":"Межотраслевая конкуренция","en":"interindustry competition","d":"конкуренция между продукцией, производимой фирмами одной отрасли, и продукцией, производимой фирмами другой отрасли (или других отраслей)."},{"t":"Метод сопоставления расходов и объема производства (expenditures","en":"","d":"output approach) — см. Метод сопоставления совокупных расходов и внутреннего продукта."},{"t":"Метод сопоставления совокупных расходов и внутреннего продукта (aggregate expenditures","en":"","d":"domestic output approach) — выявление равновесного ВВП путем определения объема реального ВВП, при котором совокупные расходы равны внутреннему продукту."},{"t":"Механизм добровольного увольнения","en":"exit mechanism","d":"уход работника с одного места работы и поиск им другого с целью улучшения условий найма."},{"t":"Механизм устных контактов","en":"voice mechanism","d":"форма общения работников с предпринимателем через посредничество профсоюза с целью улучшения условий труда и удовлетворения жалоб."},{"t":"Микроэкономике","en":"microeconomics","d":"раздел экономической науки, исследующий такие обособленные экономические единицы, как отрасли, фирмы, домохозяйства, а также отдельные рынки, конкретные цены и конкретные товары и услуги."},{"t":"Минимальная заработная плата","en":"minimum wage","d":"самая низкая заработная плата (ее ставка), которую предприниматели на законных основаниях выплачивают за час работы."},{"t":"Минимальный эффективный размер","en":"minimum efficient scale, M ES","d":"наименьший объем продукции, при кото ром фирма в состоянии минимизировать свои долгосрочные средние издержки."},{"t":"Мировая цена","en":"world price","d":"цена мирового рынка на товар или услугу, определяемая на основе соотношения мирового спроса и предложения."},{"t":"Многонациональная корпорация","en":"multinational corporation","d":"фирма, которая владеет производственными подразделениями в других странах, производит и продает свою продукцию за границей."},{"t":"Модель вытеснения при выборе профессии","en":"crowding model of occupational discrimination","d":"модель рынков рабочей силы, согласно которой из-за дискриминации в выборе профессии женщины и чернокожие не допускаются к не которым профессиям и вынуждены концентрироваться в ограниченном числе других профессий, в результате чего в них образуется чрезмерное предложение рабо чей силы (по сравнению со спросом), обусловливающее там низкую заработную плату и низкие доходы."},{"t":"Модель избирателя","en":"","d":"центриста (median-voter modeГ) — концепция, согласно которой в условиях действия прин ципа большинства избиратель-центрист (медианный) обладает решающей возможностью определять исход выборов."},{"t":"Модель кругооборота","en":"circular flow model","d":"движение (поток) ресурсов от домохозяйств в направлении фирм и продуктов — от фирм в направлении домашних хозяйств."},{"t":"Модель предпочтения дискриминации (taste","en":"","d":"for-discimina - tion model) — теория дискриминации, согласно кото Глоссарий 981 рой дискриминация представляет собой предпочтение, за которое работодатель готов заплатить."},{"t":"Молчаливый сговор","en":"tacit collusion","d":"применяемый олигополией, основанной на тайном сговоре, метод установления цен, объема продукции для каждой фирмы, не вступившей в прямой (открытый) сговор; распространенным примером молчаливого сговора служит ценовое лидерство."},{"t":"Монетаризм","en":"monetarism","d":"макроэкономические воззрения, в соответствии с которыми изменения совокупного объема продукта и уровень цен изменяются в зависимости от изменений предложения денег', опирается на монетарное правило."},{"t":"Монетарное правило","en":"monetary rule","d":"правило, сформулированное сторонниками монетаризма', масса денег в обращении должна ежегодно увеличиваться темпами, равными потенциальному темпу роста реального ВВП, и устойчиво возрастать темпом от 3 до 5%. См. также Правило Тейлора."},{"t":"Монополистическая конкуренция","en":"monopolistic competi tion","d":"рынок, на котором многие фирмы продают диф ференцированный продукт', рынок, доступ на который относительно свободен; рынок, на котором фирма обладает известным контролем над ценой продажи производимого ею товара и действует значительная неценовая конкуренция."},{"t":"Монополия","en":"monopoly","d":"рынок, на котором число продавцов столь незначительно, что каждый из них способен повлиять на общий объем предложения и цену товара или услуги. См. также Чистая (абсолютная) м онополия."},{"t":"Монопсония","en":"monopsony","d":"рынок, на котором есть лишь один покупатель товара, услуги или ресурса."},{"t":"Моральный аспект проблемы риска","en":"moral hazard prob lem","d":"вероятность того, что индивиды или организации могут изменить свое поведение так, что оно перестанет соответствовать условиям контракта или соглашения. Например, банк, чьи депозиты застрахованы от убыт ков, может осуществлять рискованные инвестиции и выдавать рискованные кредиты."},{"t":"Мотивационные схемы оплаты","en":"incentive p a y plan","d":"схема компенсации, согласно которой оплата труда ра ботника непосредственно связана с выпуском продук ции. Такие схемы обычно включают тарифные ставки, премии, опционы на акции, комиссионные и долю в прибыли."},{"t":"Мультипликатор","en":"multiplier","d":"отношение изменения равновесного ВВП к изменению объема инвестиций или любого другого компонента кривой совокупных р а сходов или совокупного спроса', число, на которое следует умножить изменение любого компонента совокупных расходов или совокупного спроса, чтобы получить результирующее изменение равновесного ВВП."},{"t":"Мультипликатор чекового депозита (checkable","en":"","d":"deposit multiplier) — см. Денежный мультипликатор."},{"t":"Н ДС","en":"","d":"см. Налог на добавленную стоимость."},{"t":"Надбавка, учитывающая изменение прожиточного минимума (cost","en":"","d":"of-living adjustment, COLA) — автоматическое увеличение доходов (заработной платы) работников в условиях, когда экономика находится в состоянии инфляции, гарантированное соответствующей статьей в коллективном договоре с предпринимателем."},{"t":"Наклон прямой","en":"slope of a line","d":"отношение изменения по вертикали (повышения или понижения) к изменению по горизонтали (отрезка) при передвижении между двумя точками на линии; восходящий наклон линии положителен и отражает прямую связь между двумя переменными; нисходящий наклон линии отрицателен и отражает обратную связь между двумя переменными."},{"t":"Накопление капитала внутри страны","en":"domestic capita! formation","d":"пополнение запасов капитала страны путем накопления и инвестирования части произведенной в ней продукции."},{"t":"Налог","en":"tax","d":"принудительная выплата правительству домохозяйством или фирмой денег (или передача товаров и услуг), в обмен на которую домохозяйство или фирма непосредственно не получают никаких товаров или услуг."},{"t":"Налог на добавленную стоимость","en":"value-added tax, VAT","d":"налог на разницу между стоимостью проданных фирмой товаров и стоимостью товаров, купленных фирмой у других фирм для производства продукта."},{"t":"Налог на имущество","en":"prorerty tax","d":"налог на собственность (капитал, земля, акции, облигации и другие акт ивы), которой владеют фирмы и домохозяйства."},{"t":"Налог на прибыль корпораций","en":"corporate income tax","d":"налог на чистый доход (прибыль) корпораций."},{"t":"Налог на фонд заработной платы","en":"payroll tax","d":"налог на нанимателей рабочей силы, составляющий определенный процент всей или части суммы выплаченных ими заработной платы и жалованья, а также налог на работников, составляющий определенный процент всей или части суммы получаемых ими заработной платы и жалованья."},{"t":"Налог с продаж","en":"sales tax","d":"налог, которым облагаются покупки (в розничной торговле) большой группы товаров."},{"t":"Налоги и трансфертные платежи как антистимулы","en":"tax-transfer disincentives","d":"ослабление стимулов к труду, сбережениям, инвестированию, инновациям и риску, которое, как утверждают, является следствием высоких предельных налоговых ставок и программ трансферт ных платежей."},{"t":"Налоги на производство и импорт","en":"taxes on production and import","d":"категория счета национального дохода, включающая такие составляющие, как налоги на продажи, акцизы, налоги на собственность бизнеса, лицен зионные платежи и пошлины', фирмы рассматривают их как издержки производства продукта и перекладывают (полностью или частично) на покупателей, устанавливая на свои товары более высокие цены."},{"t":"Налоговая льгота","en":"tax subsidy","d":"субсидирование путем установления благоприятных условий налогообложения; например, платежи нанимателя рабочей силы на страхование здоровья работников вычитаются из федеральных налогов на доходы и заработную плату."},{"t":"Налоговая льгота на заработанный доход","en":"earned income tax credit","d":"федеральная льгота в виде возврата части налога, предоставляемая семьям с низкими доходами с целью привлечения их к участию в рабочей силе."},{"t":"Нарицательная","en":"номинальная) стоимость (face value","d":"обозначенная на монете или бумажных деньгах стоимость, выраженная в долларах или центах."},{"t":"Нарушения","en":"сбои, несовершенства) рыночного механизма (market failure","d":"неспособность рыночного механизма обеспечить такое распределение ресурсов, которое в наилучшей степени соответствовало бы потребностям общества. Это выражается, в частности, в недостаточном или избыточном вложении ресурсов в произвол-: ство тех или иных товаров и услуг под воздействием эффектов перелива или проблем доступа к информации, а также в трудностях, связанных с обеспечением ресурсами производства общественных товаров."},{"t":"Научный метод","en":"scientific method","d":"процедура система тического поиска знания, включающего наблюдение фактов и формулирование и тестирование гипотез с целью разработки теорий, принципов и законов."},{"t":"Национальная администрация кредитных союзов","en":"N ational Credit Union Adminiistration, NCUA","d":"агентство федерального уровня, страхующее депозитные обязательства (до 100 тыс. долл. на один счет) кредитных союзов."},{"t":"Национальное управление по трудовым отношениям","en":"N ational Labor Relations Board, NLRB","d":"управление, учрежденное на основе Национального закона о трудовых отношениях от 1935 г. и уполномоченное расследовать нечестную практику в трудовых отношениях, издавать предписания о прекращении незаконных действий и про водить голосование среди работников и служащих для определения того, желают ли они, чтобы их интересы представлял профсоюз."},{"t":"Национальный банк","en":"National bank","d":"коммерческий банк, имеющий лицензию правительства США."},{"t":"Национальный доход","en":"national income","d":"общий доход, полученный поставщиками ресурсов за их вклад в производство валового внутреннего продукта ; равен ВВП за вычетом платежей, не связанных с доходом, и чистого дохода, заработанного в США иностранцами."},{"t":"Национальный закон о трудовых отношениях","en":"закон Вагнера) от 1935 г. (National Labor Relations Act, Wagner Act, 1935","d":"основной федеральный закон (с учетом корректировок), регулирующий трудовые отношения в США; определил основные права профсоюзов и администрации; определил и запретил нечестные действия профсоюзов и администрации в трудовых отношениях; учредил Национальное управление по трудовым отношениям."},{"t":"Не связанные с доходом факторы потребления и сбережений","en":"nonincome determinants of consumption and saving","d":"все факторы, кроме уровня ВВП, влияющие на объем потребительских расходов и сбережений. «Невидимая рука» (invisible hand) — стремление фирм и поставщиков ресурсов получить наибольшую выгоду на конкурентных рынках с целью наилучшего обеспечения интересов общества в целом."},{"t":"Невозвратные издержки","en":"sunk cost","d":"понесенные затраты, которые не могут быть возвращены."},{"t":"Невозобновляемые природные ресурсы","en":"nonrenewable natu ral resources","d":"такие составляющие природы, как нефть, природный газ и металлы, которые либо действительно имеют постоянное предложение, либо возобновляются так медленно, что фактически их предложение является постоянным, если рассматривать его в перспективе жизни людей."},{"t":"Негибкие цены","en":"inflexible prices","d":"цены продуктов, которые не меняются, по крайней мере в течение какого-то времени), при изменении спроса или предложения; также называются твердыми, или жесткими, ценами."},{"t":"Недиверсифицируемый риск","en":"nondiversifiable risk","d":"инвестиционный риск, который инвесторы не способны снизить при помощи диверсификации; также называется системным риском."},{"t":"Недискреционная фискальная политика","en":"nondiscretionary fiscal policy","d":"см. Встроенный стабилизатор."},{"t":"Независимая переменная","en":"independent variable","d":"переменная, вызывающая изменение какой-либо другой (зависимой) переменной."},{"t":"Независимые профсоюзы","en":"independent unions","d":"профсоюзы США, организационно не связанные с AFL-CIO. 983"},{"t":"Независимые товары","en":"independent goods","d":"товары или услуги, между ценами и спросом на которые нет связи, например, когда цена на один товар повышается или снижается, а спрос на другой товар остается неизменным."},{"t":"Незанятость ресурсов","en":"","d":"см. Безработица."},{"t":"Незапланированное изменение запасов","en":"unplanned changes in inventories","d":"изменения запасов, которые фирмы не планировали; изменения запасов, произошедшие из-за неожиданных повышений или снижений совокупных расходов."},{"t":"Незапланированные инвестиции","en":"unplanned investment","d":"фактический объем инвестиций минус запланированные инвестиции', увеличение или сокращение товарноматериальных запасов фирм, являющееся следствием превышения объема производства над объемом продаж."},{"t":"Неинвестиционная сделка","en":"noninvestment transaction","d":"расходы на приобретение акций, облигаций или подержанных средств производства."},{"t":"Неисключаемость","en":"nonexcludability","d":"неспособность не допустить неплательщиков («зайцев») к получению выгод от некоторых товаров; свойство, характерное для общественного товара."},{"t":"Неистощающие расходы","en":"nonexhaustive expenditure","d":"расходы органов власти, непосредственно не влекущие за собой использование экономических ресурсов или производство товаров или услуг. См. Трансфертные платежи органов власти."},{"t":"Неконкурирующие группы","en":"noncompeting groups","d":"группы работников, не борющиеся друг с другом за место ра боты внутри страны в силу того, что мастерство и ква лификация работников одной группы существенно от личаются от мастерства и квалификации работников других групп."},{"t":"Нелегальный иммигрант","en":"illegal immigrant","d":"лицо, незаконно въезжающее в страну с целью проживания в ней."},{"t":"Неограниченная ответственность","en":"unlimited liability","d":"отсутствие какого-либо предела убытков, которые отдельное лицо (обычно владелец компании) может понести и которые оно по закону должно взять на себя."},{"t":"Неоклассическая экономическая теория","en":"new classical economics","d":"теория, согласно которой непредвиденные изменения уровня цен способны породить макроэкономическую нестабильность в кратковременном периоде; в долговременном периоде экономика сохраняет стабильность при производстве внутреннего продукта, обеспечивающем полную занятость ресурсов благодаря тому, что цены и заработная плата автоматически корректируют отклонения от полной занятости ресурсов; неинфляционное производство."},{"t":"Неполная занятость","en":"","d":"см. Неполное использование р е сурсов."},{"t":"Неполное использование ресурсов","en":"underemployment","d":"1) неспособность экономики произвести максимальное количество товаров и услуг из используемых ресурсов; неспособность экономики обеспечить полный объем производства', 2) ситуация, когда работники заняты на таких работах, где требуется более низкий уровень образования и профессиональной подготовки, чем у них имеется."},{"t":"Непредвиденная инфляция","en":"unanticipated inflation","d":"повышение уровня цен (инфляция) выше, чем ожидалось."},{"t":"Непредсказуемость законов Вселенной (материал интер","en":"","d":"нет-главы) (capricious universe view) —точка зрения ряда людей, считающих, что полученные ими экономические результаты в первую очередь определяют судьба и внешние события, а не упорный труд и предпринимательский подход."},{"t":"Непроцентные параметры инвестиций","en":"noninterest deter minants of investment","d":"все параметры, влияющие на уровень инвестиционных расходов, кроме ставки процента."},{"t":"Неравенство доходов","en":"income inequality","d":"неравное распределение совокупного произведенного в стране дохода между отдельными лицами или семьями."},{"t":"Неразменные бумажные деньги","en":"fiat money","d":"все, что государство законодательно установило в качестве средства платежа, или денег."},{"t":"Нераспределенные прибыли корпораций","en":"undistributed corporate profits","d":"прибыли корпораций после уплаты налогов, не распределенные в форме дивидендов между акционерами; сбережения корпораций и других частных фирм; также называются нераспределенными доходами."},{"t":"Нереализованные ожидания","en":"unfulfilled expectations","d":"ситуации, при которых домохозяйства и организации бизнеса ожидали одного, но вместо этого видят, что случилось что-то другое; нереализованные прогнозы или планы, связанные с будущими экономическими условиями или результатами."},{"t":"Несовершенная конкуренция","en":"imperfect competition","d":"все рынки, за исключением тех, на которых действует совершенная конкуренция', включая монополии, монополистическую конкуренцию и олигополию."},{"t":"Несостоятельность в координации","en":"coordination failure","d":"ситуация, в которой люди не могут достигнуть взаимовыгодных целей, поскольку не в состоянии каким-либо образом скоординировать свои действия; возможная причина макроэкономической нестабильности."},{"t":"Нестрахуемый риск","en":"uninsurable risk","d":"неконтролируемое и непредсказуемое событие, которое может повлечь за собой убытки; страховые компании не хотят страховать такие убытки."},{"t":"Нетарифные барьеры","en":"nontariff barriers","d":"все виды барьеров (за исключением протекционистских тари фов), которые вводят государства с целью воспрепятствовать торговле между странами: импортные квоты, специальные лицензии, необоснованные стандарты на качество товаров, бюрократическая волокита при осуществлении таможенных процедур."},{"t":"Неценовая конкуренция","en":"nonprice competition","d":"применяемые фирмами способы выделения своего продукта; к этим способам относятся конкуренция в области дифференциации продуктов и реклама."},{"t":"Неэластичное предложение","en":"inelastic supply","d":"коэффициент эластичности предложения продукта или ресурса меньше единицы; процентное изменение цены продукта больше процентного изменения объема предложения."},{"t":"Неэластичный спрос","en":"inelastic demand","d":"коэффициент эластичности спроса на продукт или ресурс меньше единицы; процентное изменение цены продукта больше процентного изменения спроса."},{"t":"Низкокачественные ипотечные кредиты","en":"subprime mortgage loan","d":"кредиты с высокой процентной ставкой, предоставляемые покупателям домов, у которых кредитный риск выше среднего."},{"t":"Низшая точка спада","en":"trough","d":"точка бизнес-цикла, при которой бизнес-активность достигает временного минимума; точка, в которой рецессия заканчивается и начинается экспансия (восстановление)."},{"t":"Низший предел цены","en":"price floor","d":"минимальная цена, установленная правительством и превышающая равновесную цену."},{"t":"НИОКР","en":"R&D","d":"научно-исследовательские и опытноконструкторские разработки с целью продвижения технического прогресса."},{"t":"Нововведение","en":"innovation","d":"запуск в производство нового продукта, внедрение нового производственного метода или применение новой формы организации бизнеса."},{"t":"Новое предприятие","en":"startup (firm)","d":"новая фирма, нацеленная на создание и внедрение на рынок нового продукта либо разрабатывающая новое производство или метод распределения (торговли)."},{"t":"Номинальная заработная плата","en":"nominal wage","d":"количество денег, получаемое работником за единицу рабочего времени (час, день и т.д.)."},{"t":"Номинальная процентная ставка","en":"nominal interest rate","d":"ставка процента, выраженная в долларах по текущему курсу, включая инфляционную премию."},{"t":"Номинальный валовой внутренний продукт","en":"nominal gross domestic output","d":"ВВП, выраженный в текущих ценах на момент измерения (без поправок на инфляцию)."},{"t":"Номинальный доход","en":"nominal income","d":"количество денег, полученных отдельными лицами или группами лиц в течение определенного периода."},{"t":"Норма выручки","en":"rate of return","d":"приток чистого дохода, деленный на стоимость инвестиций или затраты на R&D; выражается в виде процента."},{"t":"Нормальная прибыль","en":"normal profit","d":"платежи, которые должна осуществлять фирма, чтобы приобрести и удержать человека, обладающего предпринимательской способностью-, минимальная плата (доход) за предпринимательскую способность, стимулирующая ее применение в предпринимательской деятельности фирмы."},{"t":"Нормальный товар","en":"norma! good","d":"товар или услуга, которые потребитель готов покупать в большем (меньшем) количестве при постоянной цене, когда его доход увеличивается (сокращается)."},{"t":"Нормативная экономике","en":"normative economics","d":"направление экономической науки, основанное на оценочных суждениях людей относительно того, какой должна быть экономика; трактует проблемы экономических целей и их достижения средствами экономической политики."},{"t":"Обесценение валюты","en":"currency depreciation","d":"см. Повышение обменного курса."},{"t":"Обесценение доллара","en":"depreciation of the dollar","d":"понижение курса доллара по отношению к другой валюте, когда за доллар дают меньшее количество иностранной валюты и, следовательно, иностранных товаров."},{"t":"Облигация","en":"bond","d":"финансовый инструмент, при помощи которого заемщик (фирма или орган власти) обязуется выплатить основную сумму долга и проценты по кредиту к определенной дате в будущем."},{"t":"Обменный курс","en":"rate of exchange","d":"см. Курс обмена в а люты."},{"t":"Обменный курс с управляемыми колебаниями","en":"managed floating exchange rate","d":"обменный курс валюты, которому разрешается меняться («плавать») в результате изменения предложения валюты и спроса на нее, иногда он контролируется (регулируется) правительством путем покупки и продажи конкретной валюты."},{"t":"Обобщение","en":"generalization","d":"утверждение о характере связи между двумя или более совокупностями фактов."},{"t":"Обратная дискриминация","en":"reverse discrimination","d":"концепция, специальные преференции, сопровождающие программу позитивных действий, представляют собой дискриминационные действия в отношении других людей."},{"t":"Обратная зависимость","en":"inverse relationship","d":"два ряда переменных, изменяющихся в противоположных направлениях; например, цена продукта и величина спроса."},{"t":"Обратный поток","en":"backflow","d":"возвращение работников в страны, из которых они первоначально эмигрировали. 985"},{"t":"Обучение в ходе действия","en":"learning by doing","d":"повышение производительности и снижение общих средних издержек благодаря приобретению знаний, навыков и умений за счет неоднократного выполнения одной и той же задачи; источник получения экономии за счет масштаба."},{"t":"Общественное","en":"социальное) благо (товар) (public good","d":"неделимый товар или услуга, которому присущи свойства неисключаемости и отсутствия соперничества, производство которого обеспечивается государством."},{"t":"Общественные инвестиции","en":"public investments","d":"расходы органов власти на общественный капитал (такой, как дороги, шоссе, мосты, системы массовой перевозки людей и предприятия, связанные с генерированием и поставками электричества) и человеческий капитал (такие, как образование, профессиональная подготовка и здравоохранение)."},{"t":"Объединенный экономический комитет","en":"Joint Economic Committee, JEQ","d":"комитет, состоящий из сенаторов и членов палаты представителей, занимающийся исследованиями экономических проблем национального масштаба."},{"t":"Объем продукции страны","en":"domestic output","d":"валовой (или чистый) внутренний продукт; общий объем готовых товаров и услуг, выпущенных в стране."},{"t":"Обязательные резервы","en":"required reserves","d":"установленный законом резерв, который должны иметь банки или сберегательные учреждения на счетах в федеральном р е зервном банке (или в виде кассовой наличности), чтобы отвечать резервным требованиям', устанавливается в виде процента к объему их чековых депозитов."},{"t":"Ограниченная ответственность","en":"limited liability","d":"ограничение максимального размера потерь заранее установленным пределом, которые могут понести владельцы (акционеры) корпорации; максимальная сумма по терь равна сумме, уплаченной ими за свой пакет акций."},{"t":"Одновременное потребление","en":"simultaneous consumption","d":"способность продукта удовлетворять одновременно интересы большого числа потребителей."},{"t":"Одноразовая игра (one","en":"","d":"time game) — в теории игр игра, при которой стороны выбирают свои оптимальные стратегии в ходе единственного временного периода, не рассматривая возможного взаимодействия в последующие временные периоды."},{"t":"Однородная олигополия","en":"","d":"см. Гомогенная олигополия."},{"t":"Ожидаемая инфляция","en":"anticipated inflation","d":"повышение уровня цен, равного ожидавшемуся темпу прироста инфляции."},{"t":"Ожидаемая норма чистой прибыли","en":"expected rate of return","d":"прирост годовой прибыли, которую фирма рассчитывает получить путем приобретения капитала (или участия в научно-исследовательских разработках), выражается в процентном отношении к затратам на инвес тиционную деятельность (или научные исследования и разработки)."},{"t":"Ожидания","en":"expectations","d":"представления потребителей и фирм о том, какие условия сложатся в будущем."},{"t":"Олигополия","en":"oligopoly","d":"рынок, на котором несколько фирм продают стандартизованные или дифференцированные продукты, рынок, доступ на который другим фирмам затруднен и на котором контроль над ценами на продукцию ограничен взаимозависимостью фирм (за исключением тех случаев, когда имеется сговор) и на котором обычно действует сильная неценовая конкуренция."},{"t":"Олигополия, не базирующаяся на сговоре","en":"noncollusive oligopoly","d":"олигополия, в которой фирмы не действуют совместно и в сговоре с целью установления цен и объема производства каждой фирмы."},{"t":"Операции на открытом рынке (open","en":"","d":"market operations) — скупка и продажа ценных бумаг правительства США федеральными резервными банками с целью проведения кредитно-денежной политики."},{"t":"Оптимальное ослабление внешнего эффекта","en":"optimal reduction of an externality","d":"снижение силы отрицательной экстерналии, например загрязнения окружающей сре ды до такого уровня, при котором предельные выгоды от ослабления и предельные издержки на его осуществление становятся равными."},{"t":"Оптимальный объем расходов на НИОКР","en":"optimal amount of R&D","d":"количество средств, выделяемых на НИОКР, при котором предельные выгоды от НИОКР и предельные издержки на НИОКР становятся равными."},{"t":"Организация по поддержанию здоровья","en":"health maintenance organization, НМО","d":"организация, осуществляющая контакты с работодателями, страховыми компаниями, профессиональными союзами и правительственными союзами для обеспечения возможности поддержания здоровья их работников или иных застрахованных пользователей."},{"t":"Организация приоритетного провайдера","en":"preferred provider organization, РРО","d":"врачи и больницы, согласившиеся предоставлять медицинскую помощь тем, кто приобрел страховку на условиях, урегулированных со страховщиком."},{"t":"Организация стран","en":"","d":"экспортеров нефти."},{"t":"Организация стран — экспортеров нефти (ОПЕК)","en":"OPEC","d":"картель, состоящий в настоящее время из 11 стран — производителей нефти (Алжир, Индонезия, Иран, Ирак, Кувейт, Ливия, Нигерия, Катар, Саудовская Аравия, Венесуэла и Объединенные Арабские Эмираты) с целью контроля за ценами, по которым они продают сырую нефть ее импортерам, и объемом осуществляемого членами ОПЕК экспорта нефти; картель стран, на долю которых приходится около 60% мирового экспорта нефти."},{"t":"Основной капитал","en":"","d":"см. Капитальные активы."},{"t":"Открытая экономика","en":"open economy","d":"экономика страны, которая осуществляет экспорт и импорт товаров и услуг. «Открытое» предприятие (open shop) — предприятие, которое принимает на работу как членов профсоюза, так и работников, не являющихся членами профсоюза (и не обязанных вступат
