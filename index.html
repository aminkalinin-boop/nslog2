// ---------- results ----------
function vResults(v){const st=r=>r?(passed(r)?'<span class="chip ok">зачтено</span>':'<span class="chip warn">не зачтено</span>'):'<span class="chip">—</span>';
 const cyc=c=>{const f=P.cycles[c.id];return`<h4>${clab(c)}${c.id==="R"?"":" · "+esc(c.title)} — ${cycleDone(c)}/${c.lessons.length}</h4><div class="tblwrap"><table class="tbl"><tr><th>№</th><th>Урок</th><th>Лучший</th><th>Последний</th><th>Попыток</th><th>Статус</th></tr>
 ${c.lessons.map(l=>{const r=P.lessons[l.id];return`<tr><td class="num">${l.idx+1}</td><td><a href="#lesson-${l.id}">${esc(l.title)}</a></td><td class="num">${r?r.best+"/"+r.n:"—"}</td><td class="num">${r?r.last+"/"+r.n:"—"}</td><td class="num">${r?r.att:0}</td><td>${st(r)}</td></tr>`}).join("")}
 <tr><td></td><td><a href="#final-${c.id}"><b>Итоговый тест цикла</b></a></td><td class="num">${f?f.best+"/"+f.n:"—"}</td><td class="num">${f?f.last+"/"+f.n:"—"}</td><td class="num">${f?f.att:0}</td><td>${st(f)}</td></tr></table></div>
 ${f&&f.hist?`<div class="hist">${f.hist.map(h=>`<span class="chip ${pct(h.s,h.n)>=PASS?"ok":""}">${h.d}: ${h.s}/${h.n}</span>`).join("")}</div>`:""}`};
 const avg=P.para.length?(P.para.reduce((a,x)=>a+x.score,0)/P.para.length).toFixed(1):null;
 v.innerHTML=`<div class="eyebrow">Прогресс</div><h1>Мои результаты</h1>
 <div class="stats"><div class="stat"><b class="num">${allPassedLessons()}/${TOTAL_L}</b><span>уроков пройдено</span></div><div class="stat"><b class="num">${CYCLES.filter(c=>passed(P.cycles[c.id])).length}/5</b><span>циклов завершено</span></div><div class="stat"><b class="num">${P.para.length}</b><span>абзацев проверено</span></div><div class="stat"><b class="num">${avg??"—"}</b><span>средняя оценка абзацев</span></div></div>
 ${CYCLES.map(cyc).join("")}${cyc(STYLE_CYCLE)}
 <h4>Мой абзац</h4>${P.para.length?`<div class="hist">${P.para.map(h=>`<span class="chip ${h.score>=7?"ok":h.score>=4?"warn":""}">${h.d}: ${h.score}/10</span>`).join("")}</div>`:`<p style="margin:0"><a href="#paragraph">Проверьте первый абзац</a>, чтобы видеть динамику.</p>`}
 <h4>Нормативный квест</h4><div class="row">${QUEST.map(s=>`<a class="chip" href="#station-${s.id}">${esc(s.title.split(" ")[0])} ${"★".repeat(P.quest[s.id]||0)||"—"}</a>`).join("")}</div>
 <h4>Тренажёр оборотов</h4><p style="margin:0">Верных ответов: ${P.turns.ok||0} из ${P.turns.tries||0}.</p>
 <h4>Глоссарий</h4><p style="margin:0">Изучено терминов: ${Object.keys(P.terms).length} из ${realTerms().length}.</p>${Object.keys(P.gtests||{}).length?`<div class="hist" style="margin-top:6px">${Object.entries(P.gtests).map(([L,r])=>`<span class="chip ${passed(r)?"ok":"warn"}">${L==="ALL"?"смешанный":L}: ${r.best}/${r.n}</span>`).join("")}</div>`:""}
 ${transferHtml()}
 <h4>Сброс</h4><div id="rs"><button class="btn" id="reset">Сбросить все результаты</button></div>`;
 v.querySelector("#reset").onclick=()=>{v.querySelector("#rs").innerHTML=`<div class="confirm">Удалить все результаты без возможности восстановления? <button class="btn pri" id="yes" style="background:var(--bad);border-color:var(--bad)">Да, сбросить</button><button class="btn" id="no">Отмена</button></div>`;
  v.querySelector("#no").onclick=()=>vResults(v);
  v.querySelector("#yes").onclick=()=>{P=blank();saveLocal();if(dbRef)dbRef.set({p:JSON.stringify(P),at:Date.now()}).catch(()=>{});render()}};
 wireTransfer(v);
}

// ---------- стиль руководителя ----------
let sTab="portrait";
function vStyle(v){const c=STYLE_CYCLE;const d=cycleDone(c),f=P.cycles.R,t=cycleTried(c);
 v.innerHTML=`<div class="eyebrow">Научный руководитель · Родионов А. В.</div><h1>Стиль руководителя</h1>
 <p class="lead">Как пишет ваш научный руководитель: разбор 48 его работ (28 сольных и 20 совместных со Скибой, Седых и Крутем), реальные формулы из статей, 7 уроков по 10 случаев на вашей теме и практикум «Пишу как руководитель».</p>
 <div class="row"><span class="chip ${d===7?"ok":d?"warn":""}">уроки ${d}/7</span>${f?`<span class="chip ${passed(f)?"ok":"warn"}">итоговый тест ${f.best}/${f.n}</span>`:""}<span class="chip">практикум ${Object.keys(P.moves||{}).length}/${STYLE_MOVES.length}</span></div>
 <div class="tabs"><button data-t="portrait" class="${sTab==="portrait"?"on":""}">Портрет стиля</button><button data-t="lessons" class="${sTab==="lessons"?"on":""}">Уроки (7)</button><button data-t="quotes" class="${sTab==="quotes"?"on":""}">Цитатник</button><button data-t="practice" class="${sTab==="practice"?"on":""}">Практикум</button></div>
 <div id="sbody"></div>`;
 v.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{sTab=b.dataset.t;vStyle(v)});
 const el=v.querySelector("#sbody");
 if(sTab==="portrait"){el.innerHTML=`<div class="card" style="display:grid;gap:10px"><h4 style="margin:0">Корпус</h4><p style="margin:0">${STYLE_STATS.corpus}</p>
  <div class="tblwrap"><table class="tbl num"><tr><th>Показатель</th><th>Сольные</th><th>Со Скибой</th><th>С Седых</th><th>С Крутем</th></tr>${STYLE_STATS.rows.map(r=>`<tr>${r.map((x,i)=>i?`<td>${x}</td>`:`<td style="font-family:var(--f-body)">${x}</td>`).join("")}</tr>`).join("")}</table></div></div>
  <div class="prose">${STYLE_PORTRAIT}</div><div class="row"><button class="btn pri" id="toL">К урокам стиля →</button></div>`;
  el.querySelector("#toL").onclick=()=>{sTab="lessons";vStyle(v)}}
 else if(sTab==="lessons"){el.innerHTML=`<div class="lgrid">${c.lessons.map(lTile).join("")}</div>
  <div class="final"><div><b>Итоговый тест по стилю</b><div style="font-size:14px;color:var(--muted)">20 вопросов по всем урокам блока. ${t<7?`Откроется после тестов всех уроков (сейчас ${t}/7).`:"Доступен."}</div></div><a class="btn pri" href="#final-R">${t<7?"Посмотреть":"Пройти"}</a></div>`}
 else if(sTab==="quotes"){const ks=[...new Set(STYLE_QUOTES.map(q=>q.k))];
  el.innerHTML=`<p class="note">Дословные фрагменты из работ архива. Используйте как образцы конструкций, а не как готовый текст: в своей работе формулируйте своими словами на своём материале.</p>
  ${ks.map(k=>`<h4>${esc(k)}</h4>${STYLE_QUOTES.filter(q=>q.k===k).map(q=>`<blockquote class="quote">«${esc(q.q)}»<small>${esc(q.s)}</small></blockquote>`).join("")}`).join("")}`}
 else practiceView(el)}
function practiceView(el){let drafts={};try{drafts=JSON.parse(localStorage.getItem("nslog523-moves")||"{}")}catch(e){}
 el.innerHTML=`<p class="lead" style="font-size:15px">Восемь ходов статьи в манере руководителя. Напишите свой вариант на своей теме, сравните с образцом${OFFLINE?"":" или проверьте с Claude"}.</p>
 <div class="moves">${STYLE_MOVES.map((m,i)=>`<div class="card move" data-m="${m.id}" style="display:grid;gap:10px">
  <div class="row" style="justify-content:space-between"><b>${i+1}. ${esc(m.t)}</b>${P.moves[m.id]?`<span class="chip ok">сделано</span>`:""}</div>
  <div class="formula">${esc(m.f)}</div>
  <label for="mv-${m.id}" style="font-size:14px;color:var(--muted)">${esc(m.task)}</label>
  <textarea id="mv-${m.id}" style="min-height:90px">${esc(drafts[m.id]||"")}</textarea>
  <div class="row"><button class="btn" data-a="model">Показать образец</button><button class="btn pri" data-a="check">Проверить с Claude</button></div>
  <div class="mres"></div></div>`).join("")}</div>`;
 el.querySelectorAll(".move").forEach(card=>{const m=STYLE_MOVES.find(x=>x.id===card.dataset.m);const ta=card.querySelector("textarea"),out=card.querySelector(".mres");
  ta.oninput=()=>{drafts[m.id]=ta.value;try{localStorage.setItem("nslog523-moves",JSON.stringify(drafts))}catch(e){}};
  card.querySelector('[data-a="model"]').onclick=()=>{out.innerHTML=`<div class="prew">${esc(m.model)}</div><div class="sync" style="margin-top:6px">Образец на теме экономической безопасности ЛПК УИС; фамилии и цифры в квадратных скобках — места для ваших данных.</div>`;if(ta.value.trim().length>20&&!P.moves[m.id]){P.moves[m.id]=1;save()}};
  const cb=card.querySelector('[data-a="check"]');
  cb.onclick=async()=>{const txt=ta.value.trim();if(txt.length<20){out.innerHTML=`<div class="fb no">Сначала напишите свой вариант (хотя бы одно предложение).</div>`;return}
   const s=await getSample();if(!s){if(OFFLINE){out.innerHTML=onlineBox("style",txt,"Проверка работает через Claude")+`<div class="prew" style="margin-top:8px">${esc(m.model)}</div>`;wireOnline(out,txt);return}out.innerHTML=`<div class="fb no">Проверка с Claude недоступна в этом окне. Откройте образец для сравнения.</div>`;return}
   cb.disabled=true;out.innerHTML=`<span class="spin"></span> Claude сравнивает с манерой руководителя…`;
   try{const r=await s.json(`Ты — опытный научный редактор. Аспирант учится писать в манере своего научного руководителя. Профиль стиля руководителя:
${STYLE_PROFILE}

Ход статьи: «${m.t}». Формула руководителя: ${m.f}
Образец на теме аспиранта: «${m.model}»
Вариант аспиранта: «${txt}»

Оцени, насколько вариант передаёт манеру руководителя и соответствует нормам научного стиля. Не требуй совпадения с образцом и условных цифр. Не хвали за ошибки из списка «НЕ копировать».
Ответь строго JSON: {"score": целое 0-10, "verdict": "одно предложение", "hits": ["какие приёмы руководителя удались, до 3"], "fix": ["что изменить, до 4"], "improved": "вариант аспиранта, доработанный в манере руководителя"}`,{modelTier:"quick"});
    out.innerHTML=`<div class="card" style="display:grid;gap:8px;background:var(--surface2);border:0"><div class="score"><b class="num" style="font-size:34px">${esc(r.score)}/10</b><span>${esc(r.verdict||"")}</span></div>
     ${(r.hits||[]).length?`<div><h4 style="margin-top:0">Удалось</h4><ul style="margin:0;padding-left:18px">${r.hits.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
     ${(r.fix||[]).length?`<div><h4 style="margin-top:0">Доработать</h4><ul style="margin:0;padding-left:18px">${r.fix.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
     ${r.improved?`<div><h4 style="margin-top:0">В манере руководителя</h4><div class="prew">${esc(r.improved)}</div></div>`:""}</div>`;
    P.moves[m.id]=Math.max(P.moves[m.id]||0,+r.score||1);save();
   }catch(e){out.innerHTML=`<div class="fb no">${sampleErr(e)}</div>`}
   cb.disabled=false}})}

// ---------- перенос результатов ----------
function exportCode(withExpl){const o={v:1,p:P};if(withExpl)o.e=EXPL;const j=JSON.stringify(o);return"NSLOG1:"+btoa(unescape(encodeURIComponent(j)))}
function importCode(code){code=code.trim();if(!code.startsWith("NSLOG1:"))throw new Error("format");const o=JSON.parse(decodeURIComponent(escape(atob(code.slice(7)))));
 merge(JSON.stringify(o.p));migrate();if(o.e){Object.assign(EXPL,o.e);try{localStorage.setItem("nslog523-expl",JSON.stringify(EXPL))}catch(e){}}save();return o}
function transferHtml(){return`<h4>Перенос результатов между версиями</h4>
 <div class="card" style="display:grid;gap:10px">
 <p style="margin:0;font-size:14.5px">${OFFLINE?"Офлайн-версия хранит результаты только на этом устройстве. Чтобы объединить их с онлайн-версией, скопируйте код и вставьте его в онлайн-версии в разделе «Мои результаты» (и наоборот).":"Онлайн-версия синхронизирует результаты с аккаунтом. Чтобы перенести их в офлайн-версию на телефоне, скопируйте код и вставьте его там в разделе «Мои результаты» (и наоборот)."} Результаты объединяются: лучшие баллы и все попытки сохраняются.</p>
 <label class="row" style="gap:8px;font-size:14px"><input type="checkbox" id="xexpl" checked> Включить лекции по терминам (${Object.keys(EXPL).length})</label>
 <div class="row"><button class="btn pri" id="xcopy">Скопировать код результатов</button></div>
 <textarea id="xcode" placeholder="Вставьте сюда код из другой версии (начинается с NSLOG1:)" style="min-height:70px;font-family:var(--f-mono);font-size:12px"></textarea>
 <div class="row"><button class="btn" id="ximp">Объединить с этими результатами</button></div><div id="xres"></div></div>`}
function wireTransfer(v){const cp=v.querySelector("#xcopy");cp.onclick=async()=>{const code=exportCode(v.querySelector("#xexpl").checked);try{await navigator.clipboard.writeText(code);cp.textContent="Код скопирован"}catch(e){const ta=v.querySelector("#xcode");ta.value=code;ta.select();cp.textContent="Код в поле ниже — скопируйте его"}};
 v.querySelector("#ximp").onclick=()=>{const ta=v.querySelector("#xcode"),out=v.querySelector("#xres");try{if(ta.value.trim().startsWith("NSLOG1:")&&ta.value.trim()===exportCode(v.querySelector("#xexpl").checked)){out.innerHTML=`<div class="fb no">Это код этой же версии — вставьте код из другой.</div>`;return}importCode(ta.value);out.innerHTML=`<div class="fb ok">Результаты объединены.</div>`;setTimeout(render,900)}catch(e){out.innerHTML=`<div class="fb no">Код не распознан. Скопируйте его целиком, он начинается с NSLOG1:</div>`}}}

if(OFFLINE&&"serviceWorker" in navigator&&location.protocol.startsWith("http")){const had=!!navigator.serviceWorker.controller;let rl=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!rl&&!busy()){rl=true;location.reload()}});
 navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update()})}).catch(()=>{})}
readHash();render();

</script>
</body></html>
