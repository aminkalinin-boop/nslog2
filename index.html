ый хочет продать."},{"t":"Современный экономический рост","en":"m odem economic growth","d":"исторически относительно недавний феномен, когда страны впервые добились существенного увеличения реального ВВП на душу населения."},{"t":"Сокращающаяся отрасль","en":"declining industry","d":"отрасль, которая приносит не экономическую прибыль, а убытки и в которой по мере того, как из нее уходят отдельные фирмы, объем производства сокращается."},{"t":"Сокращение пособий в процентном исчислении","en":"benefits-reduction rate","d":"доля (процент) снижения субсидий, выплачиваемых по программе государственной помощи, с ростом размера заработанного дохода."},{"t":"Сокращение предельной отдачи","en":"","d":"см. Закон убывающей отдачи."},{"t":"Соотношение альтернативных издержек","en":"opportunity cost ratio","d":"равенство, показывающее число двух продуктов, которые могут быть произведены из одних и тех же ресурсов; соотношение издержек 1 ед. кукурузы = 3 ед. оливок показывает, что ресурсы, требующиеся для производства 3 ед. оливок, должны быть переданы в производство кукурузы, чтобы получить единицу кукурузы."},{"t":"Социальная защита","en":"Social Security","d":"программа социального страхования, принятая в США, которая финансируется из налогов на заработную плату, взимаемого с работодателей и работников; предназначена для час тичной компенсации потери дохода из-за инвалидно сти, болезни или смерти кормильца."},{"t":"Социально оптимальная цена","en":"socially optimal price","d":"цена продукта, которая позволяет достичь наиболее эффективного распределения ресурсов в экономике и которая равна предельным издержкам на производство продукта."},{"t":"Социальное регулирование","en":"social regulation","d":"регулирование, при котором правительство изучает условия, в которых товары и услуги производятся, их физические свойства и влияние, оказываемое их производством на общество; противоположно отраслевому регулированию."},{"t":"Спекуляция","en":"speculation","d":"действия покупателя или продавца по перепродаже, направленные на получение прибыли."},{"t":"Специализация","en":"specialization","d":"использование индивидом, фирмой, регионом или страной ресурсов для про Глоссарий изводства одного или нескольких видов товаров и услуг."},{"t":"Спрос","en":"demand","d":"кривая, иллюстрирующая, сколько товаров или услуг покупатель (или покупатели) готов приобрести по различным ценам в определенный период времени."},{"t":"Спрос на деньги для совершения сделок","en":"transactions demand for money","d":"количество денег, которым люди хотят располагать для использования в качестве средства обращения (для осуществления платежей) и которое изменяется в прямой связи с изменением номинального ВВП."},{"t":"Спрос на деньги как на активы","en":"asset demand for money","d":"количество денег, которое люди хотят хранить в качестве сбережения и которое изменяется обратно пропорционально процентной ставке."},{"t":"Сравнительное преимущество","en":"comparative advantage","d":"сравнительно более низкие издержки, чем у другого производителя, на производство одного и того же товара."},{"t":"Средневзвешенная вероятность","en":"probability weighted average","d":"каждая из возможных будущих норм доходности от инвестиции, умноженная на соответствующую вероятность (выраженную в десятичном виде) того, что реализуется именно эта возможность."},{"t":"Средние общие издержки","en":"average total costs","d":"общие издержки фирмы, деленные на объем выпуска (количество произведенного продукта); равны сумме средних постоянных и средних переменных издержек."},{"t":"Средние переменные издержки","en":"average variable cost","d":"общий объем переменных издержек фирмы, деленный на объем выпуска (количество произведенного продукта)."},{"t":"Средние постоянные издержки","en":"average fix ed costs","d":"общий объем постоянных издержек фирмы, деленный на объем ее выпуска (на количество произведенной продукции)."},{"t":"Средний доход","en":"average revenue","d":"общий размер выручки от продажи продукции, деленный на количество проданной продукции (или на количество продукции, на которую предъявлен спрос); равен цене, по которой продан продукт, при условии, что вся продукция продана по одной цене."},{"t":"Средний продукт","en":"average product","d":"общий объем выпуска, приходящийся на единицу использованных ресурсов (общий объем продукции, деленный на объем использованных ресурсов)."},{"t":"Средняя ожидаемая норма доходности","en":"average weighted rate of return","d":"средневзвешенная вероятность получения возможной будущей нормы доходности у анализируемой инвестиции."},{"t":"Средняя склонность к потреблению","en":"average propensity to consume","d":"доля (в процентах) остающегося после уплаты налогов располагаемого дохода, которую домохо зяйства расходуют на потребительские товары и услуги; объем потребления, деленный на располагаемый доход."},{"t":"Средняя склонность к сбережению","en":"average propensity to save","d":"доля (в процентах) остающегося после уплаты налогов располагаемого дохода, которую домохозяйства сберегают; объем сбережения, деленный на располагаемый доход."},{"t":"Средняя ставка налогообложения","en":"average tax rate","d":"общая сумма выплачиваемого налога, деленная на общий размер облагаемого налогом дохода (в процентах)."},{"t":"Средство обращения","en":"medium of exchange","d":"средство, которое продавцы обычно принимают, а покупатели обычно отдают в уплату за товары и услуги; деньги, удобное средство обмена товарами и услугами без бартера."},{"t":"Средство сбережения","en":"store of value","d":"активы или ценности, откладываемые для использования в будущем; одна из трех функций денег."},{"t":"Срочный вклад","en":"time deposit","d":"приносящий проценты счет в коммерческом банке или ссудосберегательном учреждении, с которого вкладчик в конце определенного периода времени может изъять средства без потери процентов."},{"t":"Ссудные фонды","en":"loanable funds","d":"деньги, доступные для выдачи кредитов и получения ссуд."},{"t":"Ссудосберегательные ассоциации","en":"savings and loan association, S&L","d":"фирмы, принимающие вклады преимущественно от мелких индивидуальных вкладчиков и выдающие ссуды главным образом отдельным лицам для приобретения домов и машин; в настоящее время мало отличается от коммерческих банков."},{"t":"Стабильный уровень цен","en":"price-level stability","d":"устойчивый уровень цен на протяжении нескольких периодов; нулевой или крайне низкий уровень инфляции; также называется ценовой стабильностью."},{"t":"Ставка заработной платы","en":"wage rate","d":"см. Заработная плата."},{"t":"Ставка процента","en":"interest rate","d":"годовая ставка, по которой выплачивается процент; процентные платежи по ссуде."},{"t":"Стагфляция","en":"stagflation","d":"инфляция, сопровождаемая стагнацией производства и высоким уровнем безработицы в стране; одновременное повышение уровня цен и уровня безработицы."},{"t":"Стандартизированный бюджет","en":"standardized budget","d":"показатель того, каким был бы федеральный бюджет ный дефицит или профицит при существующих налоговых ставках или государственных расходах, если бы экономика действовала весь год на уровне ВВП при полной занятости."},{"t":"Стандартизованный продукт","en":"standardized product","d":"продукт, который покупатель может приобретать у лю бого продавца при условии, что цена на него у всех продавцов одинаковая; продукт, все единицы которого полностью заменяют друг друга и, следовательно, идентичны."},{"t":"Статистическая дискриминация","en":"statistic discrimination","d":"суждение о конкретном человеке на основе средних характеристик группы, к которой принадлежит человек, а не на основе личных свойств."},{"t":"Статичная экономика","en":"static economy","d":"гипотетическая экономика, в которой базовые факторы, такие как, например, предложение ресурсов, технологические знания и вкусы потребителей, не меняются."},{"t":"Стимулирующая функция цены","en":"incentive function of price","d":"стимул продавца увеличить (уменьшить) предложение товара, возникающий под воздействием повышения (снижения) цены этого товара; побуждение покупателей приобретать товар в большем (меньшем) количестве, возникающее в результате повышения (снижения) его цены."},{"t":"Стимулирующая, экспансионистская фискальная политика","en":"expansionary fiscal policy","d":"увеличение расходов органов власти на товары и услуги, уменьшение чистого объема налоговых поступлений или некое сочетание этих двух факторов, способствующих увеличению совокупного спроса и реального выпуска продукции."},{"t":"Стоимость денег","en":"value of money","d":"количество товаров и услуг, которое можно обменять на единицу денег (доллар); покупательная способность денежной единицы; величина, обратная уровню цен."},{"t":"Страна со статусом постоянных нормальных торговых отношений","en":"normal-trade-relations [NTR] status","d":"определение для стран, которым разрешается экспортировать товары и услуги в Соединенные Штаты по минимальным ставкам тарифов, установленных для любой другой страны, которой разрешен экспорт этих товаров в Соединенные Штаты; до последнего времени такие страны назывались странами с режимом наибольшего благоприятствования."},{"t":"Страны-лидеры","en":"leader countries","d":"страны, которые разрабатывают и используют современные технологии, которые затем становятся доступными для стран-последователей."},{"t":"Страны «Большой восьмерки»","en":"G-8 Nations","d":"группа промышленно развитых стран (США, Япония, Германия, Великобритания, Франция, Италия, Россия и Канада), чьи руководители регулярно встречаются для обсужде ния экономических проблем и попытки координации экономической политики."},{"t":"Стратегическая торговая политика","en":"strategic trade policy","d":"использование торговых барьеров для снижения риска для отечественных фирм, особенно если они внедряют новые технологии или продукты."},{"t":"Стратегическое поведение","en":"strategic behavior","d":"экономические действия заинтересованных лиц, учитывающих возможную реакцию остальных участников."},{"t":"Стратегия быстрого последователя","en":"fast-second strategy","d":"подход доминирующей на рынке фирмы, при котором она позволяет другим участникам отрасли брать на себя риск инноваций, а затем быстро становится второй фирмой (последователем), предлагающей любой успешный новый продукт или адаптирует или улучшает новый производственный процесс."},{"t":"Страхование по безработице","en":"unemployment insurance","d":"программа социального страхования, которая в США финансируется из взимаемого в штатах налога на выплачиваемую предпринимателями заработную плату и обеспечивает доход работникам, потерявшим работу и лишенным возможности ее найти."},{"t":"Страхование по старости, по случаю потери кормильца и нетрудоспособности","en":"Old Age, Survivors, and Disability Health Insurance, OASDHI","d":"программа социального обеспечения в США, финансируемая из федерального налога на заработную плату, который выплачивается предпринимателями, работниками и служащими, и предназначенная для возмещения заработков (доходов), теряемых работниками вследствие ухода на пенсию, потери кормильца или трудоспособности."},{"t":"Страхуемый риск","en":"insurable risk","d":"явление (среднюю повторяемость которого можно с достаточной точностью установить), способное привести к потерям; чтобы избежать потерь этого рода, страховые компании предлагают покупать страховые полисы."},{"t":"Структурная безработица","en":"structural unemployment","d":"безработица среди работников, оказавшихся без работы либо вследствие отсутствия у них достаточной квалификации, чтобы получить работу, или потому, что они не могут переехать туда, где они могли бы найти работу."},{"t":"Субсидия","en":"subsidy","d":"выплата правительством, фирмой или домохозяйством денег (или товаров и услуг), в обмен на которые они не получают товары и услуги; когда такая выплата производится правительством, она представляет собой правительственный трансфертный платеж."},{"t":"Субституты","en":"","d":"см. Товары-заменители."},{"t":"Суверенитет потребителя","en":"consumer sovereignty","d":"свободный выбор потребителями видов и количества товаров и услуг, которые производятся из редких ресурсов; стимулирование производителя выпускать определенные товары путем голосования долларом."},{"t":"Судебное предписание","en":"injunction","d":"предписание судебной инстанции, обязывающее лицо или организацию не совершать определенное действие, поскольку такое действие причинит невосполнимый ущерб другому лицу или другим лицам; запретительное предписание."},{"t":"Счет движения капиталов и финансов","en":"capital and financial account","d":"раздел международного платежного баланса страны, в котором учитываются: 1) списание долгов иностранцами иностранцами; 2) приобретение активов в США иностранцами (создающее приток денежного капитала) и приобретение гражданами США активов за рубежом (создающее отток денежного капитала из той страны)."},{"t":"Счет текущих операций","en":"current account","d":"раздел меж дународного платежного баланса страны, в котором фиксируются экспорт и импорт товаров и услуг, чистый доход от инвестиций и чистый объем трансфертных платежей."},{"t":"Счета национального дохода","en":"national income accounting","d":"методы измерения (оценки) общего объема производства и других связанных статистических показателей для страны в целом."},{"t":"Тайное соглашение","en":"","d":"см. Сговор."},{"t":"Таргетирование инфляции","en":"inflation targeting","d":"ежегодно высказываемые заявления о задаваемом целевом диапазоне инфляции на несколько лет в будущем, подкрепляемые соответствующей кредитно-денежной политикой, направленной на достижение этой цели."},{"t":"Тариф","en":"tariff","d":"налог на импортируемый в страну товар."},{"t":"Творческое разрушение","en":"creative destruction","d":"гипотеза, согласно которой создание новых продуктов и методов их производства одновременно разрушает рыночную власть действующих монополий."},{"t":"Текущий счет","en":"checking account","d":"бессрочный вклад или вклад до востребования в коммерческом банке или сберегательном учреждении."},{"t":"Теорема Коуза","en":"Coase theorem","d":"концепция, впервые предложенная Рональдом Коузом (Ronald Coase), согласно которой проблемы побочных эффектов (экстерналий) могут быть решены путем негласных соглашений между заинтересованными сторонами."},{"t":"Теорема ссудных фондов в рамках теории процента","en":"loanable funds theory of interest","d":"концепция, согласно которой равновесную процентную ставку определяют предложение ссудных фондов и спрос на них."},{"t":"Теоретическая экономика","en":"theoretical economics","d":"процесс формулирования экономических теорий и принципов и прикладного их использования."},{"t":"Теория игр","en":"game theory","d":"теория, согласно которой поведение участников стратегических игр, типа, например, покера, шахмат, можно сравнить с поведением независимых компаний (олигополий)."},{"t":"Теория инсайдеров-аутсайдеров","en":"insider-outsider theory","d":"гипотеза, согласно которой номинальная заработная плата проявляет негибкость в отношении снижения, поскольку фирмам известно, что работники («инсайдеры»), сохраняющие свои рабочие места во время спада, могут отказаться работать с работниками, ранее не занятыми на предприятии («аутсайдерами»), которым предложена работа по более низкой ставке, чем действовала до этого, и которые на нее согласились."},{"t":"Теория общественного выбора","en":"public choice theory","d":"экономический анализ процесса принятия коллективных или правительственных решений, политики и демократических процессов."},{"t":"Теория перевернутого U","en":"inverted U theory","d":"теория, согласно которой при прочих равных условиях доля расходов на научно-исследовательские работы в общем объеме продаж растет с ростом уровня концентрации отрасли, достигает наивысшей точки, когда уровень концентрации приближается к 50%, и падает с дальнейшим ростом концентрации."},{"t":"Теория распределения доходов, базирующаяся на предельной производительности","en":"marginal productivity theory of income distribution","d":"концепция, согласно которой распределение доходов справедливо, когда каждая единица каждого ресурса оплачивается денежной суммой, равной предельному вкладу этой единицы ресурсов в доход (выручку) фирмы (в предельный продукт в денежной форме)."},{"t":"Теория рациональных ожиданий","en":"rational expectations theory","d":"гипотеза, согласно которой фирмы и домохозяйства ожидают, что кредитно-денежная и бюджетная политика окажет какое-то определенное влияние на экономику, и, руководствуясь собственной выгодой, предпринимают меры, делающие эту политику неэффективной."},{"t":"Теория реального экономического цикла","en":"real business cycle theory","d":"теория, согласно которой деловой цикл возникает в результате изменений технологии и доступности ресурсов, которые, в свою очередь, влияют на производительность и таким образом увеличивают или сокращают долговременное совокупное предложение."},{"t":"Теория регулирования в интересах общества","en":"public interest theory of regulation","d":"допущение, согласно которому цель регулирования отрасли заключается в защите общества (потребителей) от злоупотребления естественными монополиями своей властью."},{"t":"Теория регулирования с помощью легального картеля","en":"legal cartel theory of regulation","d":"гипотеза о том, что отрасли сами хотят подвергнуться регулированию и стремятся к тому, чтобы правительственные чиновники осуществляли такое регулирование, поскольку тогда они получат право образовывать узаконенные картели."},{"t":"Теория человеческого капитала","en":"theory of human capital","d":"концепция, согласно которой разница в заработной плате является следствием различий в инвестициях в человеческий капитал, а доходы низкооплачиваемых работников повышаются в результате увеличения объема таких инвестиций."},{"t":"Технический прогресс, технологическое преимущество","en":"technological advance","d":"новые и более качественные товары и услуги, новые, более совершенные способы их производства и распределения."},{"t":"Технология","en":"technology","d":"объем знаний и технологий, который можно использовать для производства товаров и услуг из экономических ресурсов."},{"t":"Технология, активизирующая использование капитала","en":"capital-using technology","d":"улучшение технологии, требующее увеличения используемого капитала для производства конкретного количества продукта."},{"t":"Технология, экономящая капитал","en":"capital-saving technology","d":"улучшение техноло гии, позволяющее получать большее количество продукта при использовании прежнего количества капитала (и позволяющее производить прежнее количество продуктов при меньших затратах капитала)."},{"t":"Товар длительного пользования","en":"durable good","d":"потребительский товар с расчетным сроком службы (использования) в течение трех лет или более."},{"t":"Товар кратковременного пользования","en":"nondurable good","d":"потребительский товар со сроком пользования (жизни) менее трех лет."},{"t":"Товар низшей категории","en":"inferior good","d":"товар или услуга, которые потребители покупают в меньших (больших) количествах при постоянных ценах, когда их доходы увеличиваются (уменьшаются)."},{"t":"Товар, предназначенный для личного потребления","en":"private good","d":"товар или услуга, к которым применим принцип исключаемости и которыми частные фирмы снабжают тех, кто готов за них платить."},{"t":"Товарно-материальные запасы, запасы","en":"inventories","d":"произведенные, но еще не проданные товары."},{"t":"Товары-заменители","en":"substitute goods","d":"взаимозаменяемые товары или услуги, которые могут быть использованы один вместо другого. Иными словами, снижение (повышение) цены одного товара или услуги вызывает уменьшение (увеличение) спроса на другой (другую); при росте цены возникает противоположная ситуация."},{"t":"Торговая марка","en":"trademark","d":"правовая защита, дающая создателям продукта исключительное право использовать конкретное торговое название."},{"t":"Торговый баланс","en":"trade balance","d":"объем товарного экспорта страны (или товаров и услуг) за вычетом ее товарного импорта."},{"t":"Торговый блок","en":"trade bloc","d":"группа стран, которые снизили или сняли торговые барьеры относительно членов блока. Примерами могут служить Европейский союз, Североамериканское соглашение о свободной торговле."},{"t":"Точка безубыточности","en":"break-even point","d":"объем продукции, при котором фирма получает нормальную прибыль (общие доходы = общие издержки), но не получает экономической прибыли."},{"t":"Точка пересечения с осью ординат","en":"vertical intercept","d":"точка, в которой прямая пересекает на графике ось ординат."},{"t":"Трагедия общего пользования","en":"Tragedy of the commons","d":"тенденция, проявляющаяся в том, что общественные природные ресурсы используются слишком активно, при этом им не уделяется должного внимания, из-за чего их состояние ухудшается, так как ни у частных лиц, ни у общественных институтов нет стимула ограничи вать использование этих ресурсов, сохранять их чистоту или высокое качество."},{"t":"Трансфертные платежи органов власти","en":"government transfer paym ent","d":"расходование органами власти денег (или товаров и услуг), в обмен на которые оно не получает товары и услуги текущего производства."},{"t":"Трансфертный платеж","en":"transfer payment","d":"выплата органом власти или фирмой домохозяйству или фирме денег (или передача товаров и услуг), взамен которых плательщик непосредственно не получает товары или услуги."},{"t":"Трастовый фонд системы социального обеспечения","en":"social security trust fund","d":"федеральный фонд, в котором накапливаются избыточные налоговые поступления по программе социального обеспечения, полученные за год, чтобы удовлетворить обязательства по социальному обеспечению, которые превосходят налоговые поступления по социальному обеспечению в последующий год."},{"t":"Труд","en":"labor","d":"физические и умственные способности и усилия людей, которые могут быть использованы для производства товаров и услуг."},{"t":"Трудоемкий товар","en":"labor-intensive commodity","d":"продукт, на производство которого затрачивается относительно большое количество труда."},{"t":"УАТ","en":"","d":"см. Налог на добавленную стоимость."},{"t":"Убывающая предельная отдача","en":"diminishing marginal returns","d":"см. Закон убывающей отдачи."},{"t":"Увеличение эффективности благодаря миграции","en":"efficiency gains from migration","d":"повышение объема продукции в результате миграции в стране, куда направляется поток мигрантов, который по объему превышает снижение потока продукции из-за эмиграции людей из своих стран."},{"t":"Удельные (единичные) производственные затраты","en":"perunit production cost","d":"средние производственные затраты при определенном уровне выпуска; общая стоимость затрат факторов производства, деленная на число единиц выпуска."},{"t":"Уклонение от работы","en":"shirking","d":"ситуация, когда работники уменьшают свою полезность или благополучие путем отказа или уклонения от работы."},{"t":"Управление спросом","en":"demand management","d":"использование фискальной и кредитно-денежной политики в целях увеличения или сокращения совокупного спроса."},{"t":"Уравнение обмена","en":"equation of exchange","d":"уравнение M V = PQ, где M — это количество денег в обращении, V — скорость обращения денег в кругообороте доходов, Р — уровень цен, a Q — физический объем произведенных конечных товаров и услуг."},{"t":"Уровень бедности","en":"poverty rate","d":"доля населения с доходом ниже установленного федеральным правительством официального уровня."},{"t":"Уровень безработицы","en":"unemployment rate","d":"доля рабочей силы, не занятая в данный момент."},{"t":"Уровень безработицы при полной занятости","en":"fu/1-employment unemployment rate","d":"уровень безработицы в условиях отсутствия циклической безработицы, уровень безработицы, составляющий, в силу неизбежной фрикционной и структурной безработицы, примерно 4—5% рабочей силы."},{"t":"Уровень вовлеченности в состав рабочей силы","en":"labor-force participation rate","d":"процентная доля трудоспособного населения, которая действительно входит в состав р а бочей силы."},{"t":"Уровень занятости","en":"employment rate","d":"доля (процент) численности рабочей силы, имеющей работу на определенный момент."},{"t":"Уровень цен","en":"price level","d":"средневзвешенная величина цен, уплачиваемых за готовые товары и услуги, произведенные в стране."},{"t":"Уругвайский раунд","en":"Uruguay Round","d":"раунд торговых переговоров, начавшийся в г., закончившийся в г., в ходе которого была создана Всемирная торговая организация, в большей степени либерализована торговля товарами и услугами, обеспечена дополнительная защита интеллектуальной собственности (например, в виде патентов и копирайтов) и достигнута договоренность о сокращении размеров субсидий сельскому хозяйству."},{"t":"Условия торговли","en":"terms of trade","d":"соотношение обмена какого-то количества единиц одного товара на какое-то количество единиц другого товара; цена товара или услуги; количество одного товара или услуги, которое приходится отдать, чтобы приобрести единицу другого товара или услуги."},{"t":"Услуга","en":"service","d":"то, что неосязаемо (невидимо) и в обмен на что потребитель, фирма или орган власти готовы платить."},{"t":"Установление пределов инфляции","en":"inflation targeting","d":"ежегодно высказываемые заявления о задаваемом целе вом диапазоне инфляции на несколько лет в будущем, подкрепляемые соответствующей кредитно-денежной политикой, направленной на достижение этой цели."},{"t":"«Утечка мозгов»","en":"brain drain","d":"эмиграция из страны высокообразованных специалистов и высококвалифицированных работников."},{"t":"«Участвуй или плати»","en":"play or pay","d":"способ расшире ния страхования здоровья, требующий от работодателей или обеспечения страхованием их работников, или выплаты специальных налогов с заработной платы для финансирования страхования работников, не имеющих страховки."},{"t":"Учет чеков","en":"check clearing","d":"процедура перехода средств с чековых счетов тех, кто выписал чек, на чековые счета тех, кто получил чек."},{"t":"Учетная ставка","en":"discount rate","d":"ставка процента, который федеральные резервные банки взимают по ссудам, предоставляемым коммерческими банками и ссудосбере гательным учреждениями."},{"t":"Фактические инвестиции","en":"actual investment","d":"реальный объем инвестиций частных фирм; равен сумме запланированных и незапланированных инвестиций."},{"t":"Фактические нарушения","en":"per se violations","d":"виды сговора, такие как попытки установить цены или поделить рынок, которые представляют собой нарушение антитрестовских законов даже в том случае, если они оказались тщетными."},{"t":"Фактические резервы","en":"actual reserves","d":"сумма депозитов банка в федеральном резервном банке данного региона, а также его кассовая наличность."},{"t":"Фактор предложения (в условиях роста)","en":"supply factor (in growth)","d":"увеличение наличного количества ресурса, повышение его качества или расширение технических знаний, которые создают для экономики возможность производить больший объем товаров и услуг."},{"t":"Фактор спроса (в условиях роста)","en":"demand factor (in growth)","d":"повышение уровня совокупного спроса, обусловливающее экономический рост, возможность которого создает увеличение потенциала экономики."},{"t":"Факторы производства","en":"factors of production","d":"экономические ресурсы, земля, капитал, труд и предпринимательская способность."},{"t":"Факторы эффективности (в условиях роста)","en":"efficiency factors (in growth)","d":"экономический потенциал, позволяющий эффективно комбинировать ресурсы для достижения реально возможного экономического роста при данных затратах факторов предложения."},{"t":"Федеральная комиссия по торговле","en":"Federal Trade Commission, FTC","d":"учрежденная на основе Закона о Федеральной комиссии по торговле от г. комиссия в составе пяти членов, созданная для расследования методов недобросовестной конкуренции со стороны компаний, организации слушаний по жалобам на применение таких методов и направления запретительных предписаний фирмам-нарушителям."},{"t":"Федеральная корпорация страхования депозитов","en":"Federal Deposit Insurance Corporation, FDIC","d":"корпорация, получившая лицензию федерального правительства на страхование депозитных обязательств (до тыс. долл.) коммерческих банков и сберегательных институтов (за ис ключением кредитных союзов, депозиты которых страху ются администрацией Национального кредитного союза)."},{"t":"Федеральная резервная система","en":"Federal Reserve System","d":"ключевой элемент банковской системы США, которая состоит из Совета управляющих и 12 федеральных ре зервных банков."},{"t":"Федеральное правительство","en":"federal government","d":"правительство США, действующее в стране помимо правительств штатов и местных властей."},{"t":"Федеральные резервные банки","en":"Federal Reserve Banks","d":"12 банков, уполномоченных правительством США контролировать денежное предложение и выполнять другие функции. См. Центральный банк, Квазигосударственный банк и Банк банков."},{"t":"Федеральный комитет по операциям на открытом рынке","en":"Federal Open M arket Committee, FOMC","d":"группа из 12 членов, определяющая политику федеральных резервных банков в области закупок и продаж на рынке государственных ценных бумаг."},{"t":"Фермерская проблема","en":"farm problem","d":"технологический прогресс в сочетании с неэластичными ценами и относительно постоянным спросом, в результате чего сельское хозяйство превращается в сокращающуюся отрасль; также тенденция резких колебаний фермерских доходов из года в год."},{"t":"Фиксирование цены","en":"","d":"см. Ценовой сговор."},{"t":"Фиксированный валютный курс","en":"fixed exchange rate","d":"обменный курс валюты, свободное повышение или снижение которого не допускается в связи с изменением спроса и предложения."},{"t":"Финансовые инвестиции","en":"financial investment","d":"покупка финансового актива (такого как акция, облигация или доля взаимного фонда) или реального актива (например, дома, участка земли или предприятий) или создание таких активов в расчете на получение в будущем финансовых преимуществ."},{"t":"Финансовый капитал","en":"financial capitaI","d":"см. Денежный капитал."},{"t":"Фирма","en":"firm","d":"организация, использующая ресурсы для производства товаров или услуг с целью получения прибыли, владеющая и управляющая одним или несколькими предприятиями."},{"t":"Фискальная (финансово-бюджетная) политика","en":"fiscal policy","d":"изменения, вносимые правительством в порядок государственных расходов и налогообложения, направленные на обеспечение полной занятости и производство неинфляционного национального продукта; также называется дискреционной фискальной политикой."},{"t":"Фискальная пошлина (тариф)","en":"revenue tariff","d":"пошлина {тариф), вводимая с целью пополнения доходов (федерального) правительства."},{"t":"Формула со средними значениями","en":"midpoint formula","d":"метод вычисления ценовой эластичности предложения и ценовой эластичности спроса, при котором берутся средние значения двух цен и двух количеств продукции в качестве точек, по которым рассчитываются проценты."},{"t":"Формула эластичности","en":"elasticity formula","d":"см. Ценовая эластичность спроса."},{"t":"Фрикционная безработица","en":"frictional unemployment","d":"безработица, связанная с добровольной сменой работниками места работы и периодами временного увольнения; временная незанятость в периоды перехода работников с одной работы на другую."},{"t":"Функциональное распределение дохода","en":"functional distribution of income","d":"способ распределения национального дохода страны между теми, кто выполняет в экономике различные функции (обеспечивает экономику различными видами ресурсов); разделение национального дохода на заработную плату и жалованье, доход собственников, прибыль корпораций, процент и ренту. Функциональное финансирование {functionalfinance) — использование фискальной политики для обеспечения производства неинфляционного ВВП в условиях полной занятости независимо от воздействия этой политики на государственный долг."},{"t":"Х-неэффективность","en":"X-inefficiency","d":"неспособность произвести любой данный объем продукции при самых низких средних (и совокупных) издержках производства."},{"t":"«Целлофановое дело Du Pont»","en":"Du Pont cellophane case","d":"возбужденное против компании Du Pont дело о нарушении антитрестовского законодательства, по которому Верховный суд США постановил (в г.), что, хотя компания Du Pont обладает монополией на узко ограниченном рынке сбыта целлофана, она не монополизировала более широкий рынок мягких упаковочных материалов, следовательно, невиновна в нарушении закона Шермана."},{"t":"Цена","en":"price","d":"количество денег, уплачиваемое и получаемое за единицу товара, услуги или ресурса."},{"t":"Цена, обеспечивающая справедливую прибыль","en":"fair-return price","d":"цена продукта, которая позволяет производи Глоссарий телю получать нормальную прибыль и которая равна средним общим издержкам производства этого продукта."},{"t":"Ценностное суждение","en":"value judgment","d":"суждение о том, что желательно или нежелательно; мнение о том, что должно быть и чего не должно быть (о том, что правильно или справедливо и что неправильно или несправедливо)."},{"t":"Ценные бумаги, выпущенные правительством США","en":"U.S. securities","d":"краткосрочные казначейские векселя, налоговые сертификаты Казначейства, долгосрочные казначейские обязательства и сберегательные облигации, выпущенные федеральным правительством США для финансирования расходов, превышающих налоговые поступления."},{"t":"Ценовая дискриминация","en":"price discrimination","d":"продажа в один и тот же момент одного продукта разным покупателям по разным ценам, когда разница в ценах для разных покупателей не оправдана разными издержками производства этого продукта."},{"t":"Ценовая поддержка","en":"price support","d":"предписанная правительством минимальная цена, ниже которой продавец товара или услуги не может их предлагать покупателям; установленная законом цена или поддерживаемая минимальная цена."},{"t":"Ценовая эластичность предложения","en":"price elasticity of supply","d":"отношение процентного изменения величины предложения товара или ресурса к процентному изменению его цены, реакция величины предложения товара или ресурса на изменение его цены."},{"t":"Ценовая эластичность спроса","en":"price elasticity of demand","d":"отношение процентного изменения величины спроса на товар или ресурс к процентному изменению его цены. мера реакции величины покупательского спроса на изменение цены товара или ресурса."},{"t":"Ценовое лидерство","en":"price leadership","d":"применяемый фирмами в условиях олигополии неофициальный метод установления цены на производимый ими товар; одна фирма (лидер) первой объявляет изменение цены, а другие (следующие за лидером) фирмы вскоре объявляют идентичные или примерно такие же изменения цены."},{"t":"Ценовой индекс ВВП","en":"GDP price index","d":"ценовой индекс на все товары и услуги, входящие в валовой внутренний продукт; ценовой индекс, используемый для корректировки номинального валового внутреннего продукта и пересчета его в реальный валовой внутренний продукт."},{"t":"Ценовой лидер","en":"price maker","d":"продавец (или покупатель) товара или ресурса, способный воздействовать на его цену путем изменения количества предлагаемого к продаже (покупаемого) товара или ресурса."},{"t":"Ценовой последователь","en":"price taker","d":"продавец (покупатель) товара или ресурса, неспособный воздействовать на его цену путем изменения количества предлагаемого к продаже (покупаемого) товара."},{"t":"Ценовой сговор","en":"price fixing","d":"тайное соглашение между двумя или более фирмами об установлении цены на их продукцию; закон Шермана запретил подобную практику."},{"t":"Централизованное экономическое планирование","en":"central economic planning","d":"определение правительством целей экономической политики и направлений использования ресурсов для достижения этих целей."},{"t":"Центральный банк","en":"Central bank","d":"банк, главной функцией которого является контроль за массой денег в обращении — предложением денег; в США в качестве него выступает Федеральная резервная система."},{"t":"Цеховой профсоюз","en":"craft union","d":"профсоюз, ограничивающий состав своих членов лишь работниками определенной профессии (цеха)."},{"t":"Циклическая асимметричность","en":"cyclical asymmetry","d":"идея, заключающаяся в том, что кредитно-денежная политика может быть более успешной для замедления экспансии и контроля инфляции, чем для оказания помощи экономике, когда она выбирается из жесткого экономического спада."},{"t":"Циклическая безработица","en":"cyclical unemployment","d":"вид безработицы, порождаемой недостаточностью общих расходов (или совокупного спроса)."},{"t":"Циклически сбалансированный бюджет","en":"cyclically balanced budget","d":"равенство правительственных расходов на товары и услуги чистому объему налоговых поступлений в пределах экономического цикла; возникающий в периоды спада Деловой активности дефицит бюджета компенсируется бюджетным избытком в периоды процветания (инфляции)."},{"t":"Циклический дефицит","en":"cyclical deficit","d":"дефицит федерального бюджета, вызванный спадом деловой активности и обусловленным им сокращением налоговых поступлений."},{"t":"Частичный резерв","en":"fractional reserve","d":"резервная норма, составляющая менее 100% депозитных обязательств коммерческого банка или сберегательного учреждения."},{"t":"Частная собственность","en":"private property","d":"право частных лиц и фирм приобретать, владеть, контролировать, использовать, продавать и завещать землю, капитал и другие активы."},{"t":"Частный продукт","en":"","d":"см. Товар, предназначенный для личного потребления."},{"t":"Частный сектор","en":"private sector","d":"совокупность домохозяйств и фирм в стране."},{"t":"Часть программы Medicare, предназначенная для компенсации Затрат пациентов на лекарства","en":"Medicare Part D","d":"вновь введенное (2006) положение в программе M edi care, предоставляющее лицам, имеющим на это право, возможность приобрести у частных страховых компаний с большой скидкой медицинскую страховку, в результате чего расходы этих лиц на оплату приобретаемых по рецепту лекарств существенно снижаются."},{"t":"Чековый депозит (вклад)","en":"checkable deposit","d":"любой вклад в коммерческом банке или сберегательном учреж дении, на который можно выписать чек; включает бессрочные вклады, вклады с правом выписывать чеки на предъявителя."},{"t":"Человеческий капитал","en":"human capital","d":"знания, навыки и умения, благодаря которым человек работает производительно."},{"t":"Четыре фундаментальных вопроса (экономики)","en":"Four Fundamental Questions (of economics)","d":"четыре основных вопроса, на которые каждая экономика должна дать ответ: что производить, как это производить, как разделять весь полученный продукт и как гарантировать экономическую гибкость."},{"t":"Чистая (абсолютная) монополия","en":"pure monopoly","d":"рынок, который отличают следующие черты: одна фирма продает единственный в своем роде продукт; доступ на него закрыт; действующая на нем одна фирма обладает значительным контролем над ценой на продаваемый ею продукт; здесь может действовать, а может и не действовать неценовая конкуренция."},{"t":"Чистая выгода","en":"net benefit","d":"общий выигрыш от какой-то деятельности или политики за вычетом общих издержек на эту деятельность или политику."},{"t":"Чистая прибыль","en":"pure profit","d":"см. Экономическая прибыль."},{"t":"Чистая процентная ставка","en":"pure rate of interest","d":"в основном безрисковая процентная ставка, устанавливается на длительную перспективу, на которую не влияет несовершенство рынка."},{"t":"Чистые налоговые поступления","en":"net taxes","d":"налоговые поступления правительства минус трансфертные платежи органов власти."},{"t":"Чистые трансфертные платежи","en":"net transfers","d":"личные и трансфертные платежи органов власти жителям других стран минус личные и трансфертные платежи органов власти, полученные от жителей других стран."},{"t":"Чистые частные внутренние инвестиции","en":"net private domestic investment","d":"валовые частные внутренние инвестиции минус амортизационные отчисления на основные средства производства; прирост основного капитала страны в течение года."},{"t":"Чистый внутренний продукт","en":"net domestic product","d":"валовой внутренний продукт минус часть годового выпуска, использованного на восстановление основных средств производства, потребленных в процессе производства; предназначается для потребления или увеличения за пасов основных средств производства (капитала)."},{"t":"Чистый инвестиционный доход","en":"net investment income","d":"доход в виде процентов и дивидендов, получаемых гражданами одной страны от граждан других стран, за вычетом процентов и дивидендов, выплачиваемых гражданами данной страны гражданам других стран."},{"t":"Чистый экспорт","en":"net export","d":"экспорт минус импорт."},{"t":"Шоки совокупного предложения","en":"aggregate supply shocks","d":"неожиданные и крупные изменения стоимости ресурсов, смещающие кривую совокупного предложения страны."},{"t":"Шоки спроса","en":"demand shocks","d":"неожиданные изменения спроса."},{"t":"Экономика предложения","en":"supply-side economics","d":"раздел современной макроэкономической теории, использующий понятия «издержки» и «совокупное предложение» при трактовке терминов «инфляция», «безработица» и «экономический рост»."},{"t":"Экономикс, экономическая наука","en":"economics","d":"общественная наука об использовании редких экономических ресурсов с целью максимального удовлетворения неограниченных материальных потребностей общества."},{"t":"Экономическая концентрация","en":"economic concentration","d":"описание или мера уровня монополизации либо конкуренции отрасли. См. Показатель концентрации."},{"t":"Экономическая модель","en":"economic model","d":"упрощенная картина действительности; абстрактное обобщение."},{"t":"Экономическая политика","en":"policy economics","d":"формулирование политики, ставящей своей целью добиться желаемых результатов или воспрепятствовать возникновению нежелательных явлений в экономике."},{"t":"Экономическая прибыль","en":"economic profit","d":"общий доход фирмы за вычетом всех ее экономических зат рат, включая явные и скрытые издержки; синоним терминов «чистая прибыль» и «сверхприбыль»."},{"t":"Экономическая рента","en":"economic rent","d":"цена за использование земли и других естественных ресурсов, предложение которых постоянно (т.е. существует совершенно неэластичное предложение)."},{"t":"Экономическая система","en":"economic system","d":"определенный пакет конкретных мероприятий или координаци Глоссарий онных механизмов для решения проблемы экономии; метод организации экономики; существуют два общих типа организации экономики — рыночная и командная."},{"t":"Экономическая теория","en":"economic theory","d":"выведение экономических принципов из соответствующих фактов экономической действительности; экономический принцип."},{"t":"Экономическая эффективность","en":"economic efficiency","d":"оптимальное соотношение между минимальными затратами ресурсов и производимым в результате их использования объемом товаров или услуг; включает как производственную эффективность, так и эффективность распределения."},{"t":"Экономические издержки","en":"economic cost","d":"затраты, которые должна понести фирма для получения эффекта от ресурсов; часть выручки, которую фирма должна направить на приобретение ресурсов и отвлечь от альтернативных направлений использования; равны объему затрат на другие продукты, которые не могут быть произведены, когда ресурсы отвлечены на выпуск именно данного продукта."},{"t":"Экономические иммигранты","en":"economic immigrants","d":"меж дународные иммигранты, переезжающие в одну страну из другой, чтобы получить экономические преимущества, в частности более привлекательные возможности трудоустройства."},{"t":"Экономические инвестиции","en":"economic investment","d":"см. Инвестиции, инвестирование."},{"t":"Экономические ресурсы","en":"economic resources","d":"земля, труд, капитал и предпринимательская способность, используемые при производстве товаров и услуг, производственных факторов; факторы производства."},{"t":"Экономический анализ","en":"economic analysis","d":"выведение экономических принципов из соответствующих фактов экономической действительности."},{"t":"Экономический закон","en":"economic law","d":"неоднократно проверенный и доказавший свою верность на протяжении длительного времени экономический принцип."},{"t":"Экономический подход","en":"economic perspective","d":"способность индивидов и институтов принимать рациональные или целенаправленные решения, основывающиеся на учете затрат и выхода, которые могут явиться следствием их действий."},{"t":"Экономический принцип","en":"economic principle","d":"обобщение мотивов и практики экономического поведения индивидов и институтов."},{"t":"Экономический рост","en":"economic growth","d":"1) показанное на графике (кривой) увеличение производственных возможностей в результате увеличения объема используемых факторов производства или совершенствования техники и технологии, 2) увеличение либо реального объема продукции (ВВП), либо реального объема продукции на душу населения."},{"t":"Экономический совет при президенте","en":"Council of Economic Advisers, CEA","d":"группа, состоящая из трех человек, которые помогают президенту США в решении экономических вопросов (включая подготовку ежегодного доклада президента по вопросам экономики Конгрессу США)."},{"t":"Экономический спад","en":"recession","d":"период снижения реального ВВП, во время которого происходит сокращение реального дохода и рост безработицы."},{"t":"Экономический тред-юнионизм","en":"business unionism","d":"концепция, согласно которой профсоюз призван ограни чивать свою деятельность такими практическими и краткосрочными задачами, как борьба за повышение заработной платы, сокращение рабочего времени, улучшение условий труда. Экономический (деловой) цикл (business cycle) — повторяющиеся на протяжении ряда лет подъемы и спады уровня экономической активности. Состоит из фазы пика, подъема, спада (рецессии), восстановления."},{"t":"Экономическое регулирование","en":"economic regulation","d":"см. Отраслевое регулирование."},{"t":"Экономия за счет масштабов деятельности; положительный эффект масштаба","en":"economies of scale","d":"сокращение средних общих издержек производства по мере того, как в долгосрочной перспективе фирма увеличивает размеры предприятия (объем продукции); эффект массового производства."},{"t":"Экспансионистская кредитно-денежная политика","en":"expansionary monetary policy","d":"действия Федеральной ре зервной системы, направленные на повышение предложения денег, снижение процентных ставок и увеличение реального ВВП; политика «легких денег»."},{"t":"Экспансия","en":"expansion","d":"часть бизнес-цикла, при котором реальный ВВП, доход и занятость возрастают."},{"t":"Экспорт","en":"exports","d":"товары и услуги, произведенные в одной стране и проданные потребителям в другой стране."},{"t":"Экспортная сделка","en":"export transaction","d":"продажа товаров или услуг, увеличивающая количество иностранных денег на руках у граждан, фирм и правительства данной страны."},{"t":"Экспортные субсидии","en":"export subsidies","d":"правительственные платежи внутренним производителям с целью сни зить цену на ряд продуктов для иностранных покупа телей."},{"t":"Экстерналия","en":"externality","d":"связанные с потреблением или производством товара (услуги) выгоды, полученные какой-либо стороной, или издержки, причиненные какой-либо стороне, кроме покупателя или продавца этого товара (или услуги). См. Положительная экст ерналия, Отрицательная экстерналия."},{"t":"Эластичное предложение","en":"elastic supply","d":"предложение продукта или ресурса, для которого ценовая эластич ность больше единицы, а процентное изменение величины предложения больше процентного изменения цены товара."},{"t":"Эластичность спроса на ресурс","en":"elasticity of resource demand","d":"показатель реакции фирм на изменение цены конкретного ресурса, которым они пользуются; процентные изменения в количестве запрашиваемого ресурса, деленное на процентное изменение его цены."},{"t":"Эластичность спроса по доходу","en":"income elasticity of de mand","d":"отношение процентного изменения спроса на продукт к процентному изменению дохода; отражает влияние изменений в доходах на расходы потребителей."},{"t":"Эластичный спрос","en":"elastic demand","d":"спрос на продукт или ресурс, для которого коэффициент ценовой эластичности больше единицы; процент изменения величины спроса больше процента изменения цены товара."},{"t":"Электронные платежи","en":"electronic payments","d":"покупки, при которых оплата за них перечисляется электронным образом. Примеры: перечисления Fedware, автоматизированная клиринговая палата, платежи через систему PayPal и выплаты через смарт-карты, на которых наличность учитывается в цифровом виде."},{"t":"Эмиграция","en":"emigration","d":"отъезд (исход) резидентов из одной страны в другую страну."},{"t":"Эффект богатства","en":"wealth effect","d":"склонность людей увеличивать свои расходы на потребление, когда стои мость их финансовых и реальных активов растет, и снижать свои расходы на потребление, когда стоимость этих активов снижается."},{"t":"Эффект вытеснения","en":"crowding-out effect","d":"повышение процентных ставок и последующее сокращение планируемого чистого объема инвестиций в экономике, вызванное ростом займов федерального правительства на денежном рынке."},{"t":"Эффект дохода","en":"income effect","d":"воздействие, которое изменение цены продукта оказывает на реальный доход (покупательную способность) потребителя и, соответственно, на количество продукта, которое потребитель купит."},{"t":"Эффект замещения","en":"substitution effect","d":"1) влияние, которое изменение цены потребительского товара оказывает на его относительную дороговизну и, соответственно, на количество товара, которое потребитель готов купить; 2) влияние, которое изменение цены ресурса окажет на количество этого ресурса, используемого фирмой при условии, что фирма не изменит объем своего производства."},{"t":"Эффект импортных закупок","en":"foreign purchases effect","d":"обратная связь между объемом чистого экспорта страны и существующим в ней уровнем цен, а также уровнем цен в других странах."},{"t":"Эффект мультипликатора","en":"multiplier effect","d":"влияние, которое изменение в объеме совокупных расходов или совокупного спроса оказывает на равновесный ВВП (влияние, вызванное изменением в объеме потребления, инвестиции, расходов органов власти на товары и услуги или в объеме чистого экспорта)."},{"t":"Эффект объема производства","en":"output effect","d":"воздействие повышения цены одного ресурса на повышение издержек производства и снижение количества продукции, которое фирма считает наиболее выгодным произвести; его результирующее воздействие — снижение объема других ресурсов и, следовательно, противоположное снижение цены ресурсов (факторов производства)."},{"t":"Эффект особых интересов","en":"special-interest effect","d":"воздействие, выражающееся в отстаивании правительством интересов (целей) небольших групп в ущерб интересам значительно больших групп."},{"t":"Эффект перелива","en":"spillover","d":"связанные с потреблением или производством товара (услуги) выгоды, полученные какой-либо стороной, или издержки, причиненные какой-либо стороне, кроме покупателя или продавца этого товара (или услуги). См. Выгоды перелива, Издержки перелива."},{"t":"Эффект процентной ставки","en":"interest-rate effect","d":"повышение (снижение) уровня цен ведет к повышению (снижению) спроса на деньги, повышает (снижает) процентные ставки и в результате сокращает (увеличивает) общий объем расходов в стране."},{"t":"Эффект реальных наличных средств","en":"real-balances effect","d":"рост (снижение) уровня цен имеет тенденцию снижать (повышать) реальную стоимость (или покупательную способность) финансовых активов с фиксированным денежным выражением, а в результате и сокращать (увеличивать) общий объем расходов в экономике; также называется эффектом богатства."},{"t":"Эффект чистого экспорта","en":"net export effect","d":"концепция, в соответствии с которой влияние изменения кредитно-денежной или фискальной политики будет усиливаться или ослабляться из-за последующего изменения объема чистого экспорта. Это изменение чистого экспорта происходит из-за изменения реальных процентных ставок, которые, в свою очередь, влияют на обменные курсы."},{"t":"Эффективное распределение ресурсов","en":"efficient allocation of resources","d":"распределение ресурсов на производство различных товаров и услуг, которое ведет к максимальному удовлетворению запросов потребителей: производство социально оптимальной потребительской корзины из ограниченных ресурсов."},{"t":"Эффективность производства","en":"productive efficiency","d":"производство товара с наименьшими издержками; использование минимального объема ресурсов для производства данного объема продукции; производство данного объема продукции при минимальных средних общих издержках, при которых предельный продукт на каждый вложенный доллар будет одинаковым для всех ресурсов."},{"t":"Эффективность распределения ресурсов","en":"allocative efficiency","d":"распределение среди фирм и отраслей ресурсов, необходимых для обеспечения производства тех продуктов, в которых больше всего нуждается общество (потребители); производство каждого такого продукта в условиях, когда предельные издержки равны цене или предельной выгоде; объем производства каждого продукта, при котором предельные издержки и цены или предельные выгоды равны и сумма излишка потребителя и излишка производителя является максимальной."},{"t":"Эффективный уровень оплаты труда","en":"efficiency wage","d":"уровень оплаты труда, который позволяет минимизировать расходы на оплату труда на единицу выпуска."},{"t":"Явные издержки","en":"explicit cost","d":"денежные расходы фирмы на приобретение у стороннего поставщика необходимых ресурсов."},{"t":"Протекционистская пошлина","en":"","d":"см. Защитная пошлина."},{"t":"«Протоптанные пути»","en":"beaten paths","d":"пути миграции, которые уже использовали в прошлом члены семьи, родственники, друзья и другие иммигранты."},{"t":"OASDHI","en":"","d":"см. Страхование по старости, по случаю потери кормильца и нетрудоспособности."},{"t":"Экономический (деловой) цикл","en":"business cycle","d":"повторяющиеся подъёмы и спады уровня деловой активности в экономике: пик, спад, дно, оживление (экспансия)."},{"t":"«Изменение для достижения победы»","en":"Change to Win","d":"федерация американских профсоюзов, объединяющая работников сферы услуг и водителей грузовиков; около 6 млн членов."},{"t":"«Постановка личного клейма»","en":"earmark","d":"специальные расходы, включаемые законодателями в более широкие законопроекты для предоставления преимуществ отдельным организациям без обычной процедуры оценки или конкурса."}];
const LECT = {"AFL-CIO":["Крупнейшее объединение профсоюзов США, которое ведёт переговоры с работодателями и лоббирует интересы работников.","В экономике труда показывает роль организованных профсоюзов в формировании заработной платы и условий труда. Российский аналог по функции — Федерация независимых профсоюзов России (ФНПР), участник трёхсторонней комиссии по регулированию социально-трудовых отношений.","Отраслевые соглашения профсоюза с объединением работодателей фиксируют минимальные тарифные ставки в отрасли.","Влияние профсоюзных объединений на динамику заработной платы в отрасли оценивается через условия отраслевых тарифных соглашений."],"M2":["Это «широкие деньги»: наличные и деньги на счетах, плюс сбережения и срочные вклады, которые легко превратить в деньги.","Денежные агрегаты показывают, сколько денег в экономике и насколько они «ликвидны». В России Банк России рассчитывает агрегат М2 как наличные деньги (М0) плюс безналичные средства резидентов в рублях: переводные и другие депозиты.","Если население переводит деньги с текущих счетов на срочные вклады, М1 уменьшается, а М2 почти не меняется.","Динамика денежного агрегата М2 рассматривается в качестве одного из индикаторов монетарных условий развития экономики."],"Абстракция":["Мысленное отбрасывание всего неважного, чтобы увидеть главную закономерность.","Абстракция — базовый метод экономической науки: модели упрощают реальность, выделяя ключевые связи (например, цену и спрос), и отвлекаются от второстепенных факторов. В диссертации метод научной абстракции указывается среди общенаучных методов.","Строя модель спроса на пиломатериалы, исследователь абстрагируется от погоды и моды и оставляет цену и доходы покупателей.","В работе использован метод научной абстракции, позволивший выделить ключевые факторы экономической безопасности организаций ЛПК."],"Авторское право":["Право автора решать, кто и как может копировать и использовать его произведение.","Авторское право защищает результаты интеллектуального труда и создаёт стимулы к их созданию. В России регулируется частью четвёртой Гражданского кодекса РФ; программы для ЭВМ и базы данных охраняются как литературные произведения.","Методика оценки, опубликованная в монографии, охраняется авторским правом как текст, но сама идея методики — нет.","Результаты интеллектуальной деятельности, созданные в ходе исследования, охраняются в соответствии с частью четвёртой Гражданского кодекса РФ."],"Агрегирование":["Сложение многих отдельных данных в один общий показатель.","Агрегирование позволяет перейти от отдельных цен и объёмов к обобщающим показателям: ВВП, ВРП, индексу цен. Обратная сторона — потеря деталей, поэтому уровень агрегирования данных всегда оговаривается в методике.","Объёмы выпуска пиломатериалов, фанеры и бумаги агрегируются в индекс производства по виду деятельности «Обработка древесины».","Для оценки уровня экономической безопасности частные индикаторы агрегированы в интегральный показатель."],"Агробизнес":["Крупный бизнес в сельском хозяйстве и пищевой промышленности.","Агробизнес охватывает всю цепочку: производство, переработку, хранение и сбыт продовольствия. В России в этом контексте говорят об агропромышленном комплексе (АПК) и агрохолдингах; это отдельное направление паспорта 5.2.3 (экономика АПК).","Агрохолдинг, объединяющий свинокомплексы, комбикормовые заводы и мясопереработку, — типичный пример агробизнеса.","Концентрация производства в крупных агроформированиях изменяет структуру регионального продовольственного рынка."],"Аккордный налог":["Налог одной фиксированной суммой, которая не зависит от дохода или объёма производства.","Аккордный налог не меняет стимулов к работе и производству, поэтому в теории считается «нейтральным». На практике чистых аккордных налогов почти нет; близкий пример — фиксированные платежи по патентной системе налогообложения.","Индивидуальный предприниматель на патенте платит фиксированную сумму независимо от фактической выручки (в пределах лимита).","Фиксированные налоговые платежи не оказывают прямого влияния на предельные стимулы к расширению производства."],"Актив":["Всё ценное, что принадлежит фирме или человеку и может быть выражено в деньгах.","Активы — ресурсы, контролируемые организацией и приносящие ей экономические выгоды. В бухгалтерском балансе делятся на внеоборотные (основные средства) и оборотные (запасы, дебиторская задолженность, денежные средства).","Лесовозы, пилорама и запас пиломатериалов на складе — активы лесопромышленного подразделения.","Структура активов организации характеризуется высокой долей внеоборотных активов с высокой степенью износа."],"Активно управляемые фонды":["Инвестиционные фонды, где управляющий сам активно выбирает, какие бумаги покупать и продавать, чтобы обогнать рынок.","Противопоставляются пассивным (индексным) фондам. Исследования показывают, что большинство активных фондов после вычета комиссий не обгоняют рынок стабильно. В России аналоги — ПИФы с активной стратегией.","Фонд акций, управляющий которого меняет состав портфеля каждый месяц, — активно управляемый.","Эффективность активного управления оценивается сопоставлением доходности фонда с доходностью эталонного индекса."],"Активное сальдо платежного баланса":["Ситуация, когда в страну в целом приходит больше валюты, чем уходит.","Положительное сальдо платёжного баланса ведёт к накоплению международных резервов или укреплению национальной валюты. Статистику платёжного баланса России публикует Банк России.","Высокие экспортные доходы от сырья при ограниченном оттоке капитала формируют активное сальдо платёжного баланса.","Активное сальдо платежного баланса обеспечивает прирост международных резервов, что повышает устойчивость национальной экономики к внешним шокам."],"Активное сальдо торгового баланса":["Страна продаёт за границу больше товаров, чем покупает.","Профицит торгового баланса характерен для экспортёров сырья, в том числе России. Его структура важна для экономической безопасности: зависимость от сырьевого экспорта повышает уязвимость к колебаниям цен.","Если экспорт составил 420 млрд долл., а импорт — 280 млрд, активное сальдо равно 140 млрд долл. (цифры условные).","Сохранение активного сальдо торгового баланса за счет сырьевого экспорта не снижает зависимости экономики от внешнеэкономической конъюнктуры."],"Акциз":["Налог, «встроенный» в цену отдельных товаров: алкоголя, табака, топлива.","Акцизы — косвенные налоги на отдельные товары, регулируемые главой 22 Налогового кодекса РФ. Они пополняют бюджет и сдерживают потребление вредных товаров; значительная часть акцизов на топливо зачисляется в дорожные фонды.","Повышение акциза на бензин отражается в розничной цене топлива и в издержках лесовозных перевозок.","Рост ставок акцизов на нефтепродукты повышает транспортную составляющую себестоимости продукции лесозаготовки."],"Акция корпорации":["Ценная бумага, которая даёт право на часть компании, её прибыли и участие в управлении.","Акция удостоверяет долю в уставном капитале акционерного общества (ГК РФ, 39-ФЗ «О рынке ценных бумаг»). Владелец получает дивиденды и право голоса; стоимость акции отражает ожидания инвесторов о будущих доходах компании.","Держатель 1 % акций лесопромышленного холдинга получает 1 % выплачиваемых дивидендов.","Эмиссия акций рассматривается как инструмент привлечения инвестиций для модернизации производственных мощностей."],"Альтернативные издержки":["То, чем приходится пожертвовать, выбирая один вариант вместо лучшего из других.","Альтернативная стоимость — центральное понятие экономики выбора: ресурсы ограничены, поэтому любое решение имеет «цену упущенной возможности». Её учитывают при оценке инвестиционных проектов и использования ресурсов.","Если цех занят выпуском поддонов, упущенная выгода от производства мебели на тех же станках — альтернативные издержки.","При оценке целесообразности проекта учитывались альтернативные издержки использования производственных мощностей учреждения."],"Анализ затрат и результатов":["Сравнение: сколько проект стоит и сколько пользы принесёт, чтобы понять, стоит ли его делать.","Анализ «затраты — выгоды» (cost-benefit analysis) применяется при оценке государственных программ и инвестиционных проектов. Выгоды и затраты приводятся к сопоставимому виду, часто с дисконтированием.","Модернизация сушильной камеры обоснована, если дисконтированная экономия на браке превышает затраты на оборудование.","Экономическая целесообразность мероприятий обоснована на основе сопоставления затрат и ожидаемых результатов их реализации."],"Антитрестовская политика":["Действия государства, чтобы компании не сговаривались и не душили конкуренцию.","В России аналог — антимонопольная политика: регулируется Федеральным законом «О защите конкуренции» (135-ФЗ), реализуется ФАС России. Цель — предотвратить злоупотребление доминирующим положением и картели.","ФАС может оштрафовать поставщиков, согласовавших цены на торгах по госзакупкам.","Антимонопольное регулирование рынка государственных закупок направлено на предотвращение картельных соглашений участников торгов."],"Антитрестовские законы":["Законы, запрещающие сговоры, монополизацию и нечестную конкуренцию.","В США — законы Шермана и Клейтона. В России ту же функцию выполняет антимонопольное законодательство: 135-ФЗ «О защите конкуренции» и статьи КоАП и УК РФ об ответственности за картели.","Соглашение лесопромышленных компаний о разделе рынка по территориям нарушает антимонопольное законодательство.","Антимонопольное законодательство РФ запрещает соглашения хозяйствующих субъектов, ограничивающие конкуренцию."],"Арбитраж":["Покупка подешевле в одном месте и одновременная продажа подороже в другом, чтобы заработать на разнице.","Арбитраж выравнивает цены на одинаковые активы на разных рынках. Он делает рынки эффективнее, так как ценовые различия быстро «съедаются» арбитражёрами.","Если пиловочник в соседнем регионе стабильно дороже с учётом доставки, трейдеры начинают перевозить его туда, пока цены не сблизятся.","Возможности ценового арбитража свидетельствуют о недостаточной интеграции региональных рынков."],"Асимметричная информация":["Одна сторона сделки знает о товаре гораздо больше другой.","Асимметрия информации приводит к неблагоприятному отбору и моральному риску (Дж. Акерлоф, «рынок лимонов»). Отсюда — потребность в сертификации, гарантиях, раскрытии информации и регулировании.","Покупатель пиломатериалов не видит внутренних дефектов древесины, поэтому доверяет сертификату или репутации поставщика.","Асимметрия информации между заказчиком и поставщиком повышает риски недобросовестного исполнения контрактов."],"Аукционы по предоставлению кредитов депозитным организациям с резервируемой ставкой":["Способ, которым центральный банк раздаёт краткосрочные кредиты банкам через аукцион.","Инструмент ФРС периода кризиса 2007–2009 гг. для поддержки ликвидности банков. Российский аналог по сути — аукционы репо и кредитные аукционы Банка России.","Во время кризиса ликвидности банки подают заявки, и центральный банк распределяет кредиты по результатам аукциона.","Инструменты рефинансирования центрального банка обеспечивают поддержание ликвидности банковского сектора в кризисные периоды."],"Базовая процентная ставка":["Ставка, от которой банки «отсчитывают» проценты по своим кредитам для лучших клиентов.","В США — prime rate. В России ориентиром служит ключевая ставка Банка России: банки устанавливают ставки по кредитам с надбавкой к ней.","При ключевой ставке 16 % корпоративный кредит может выдаваться под 18–20 % (цифры условные).","Рост ключевой ставки Банка России повышает стоимость заемного финансирования инвестиционных проектов."],"Базовый год":["Год, с которым сравнивают все остальные годы при расчёте индексов.","Выбор базового года определяет масштаб индексов и сопоставимых цен. Росстат периодически меняет базовый год при переходе на новые методики.","Если базовый 2015 год принят за 100, индекс цен 2024 г. 160 означает рост цен на 60 %.","Стоимостные показатели приведены в сопоставимых ценах базового 2015 г."],"Баланс счета движения капиталов":["Разница между деньгами, пришедшими в страну как инвестиции и займы, и деньгами, ушедшими за рубеж.","Показывает чистый приток или отток капитала. В российской практике Банк России публикует финансовый счёт платёжного баланса и отдельно — чистый ввоз/вывоз капитала частным сектором.","Если нерезиденты вложили в экономику 30 млрд долл., а резиденты вывезли 50 млрд, наблюдается чистый отток капитала 20 млрд.","Устойчивый чистый отток капитала ограничивает инвестиционные ресурсы национальной экономики."],"Баланс счета текущих операций":["Итог внешней торговли страны плюс доходы от инвестиций и переводы.","Текущий счёт — ключевой раздел платёжного баланса. Профицит означает, что страна в целом «зарабатывает» больше, чем тратит за рубежом. Для России характерен профицит благодаря сырьевому экспорту.","Профицит текущего счёта 2022 г. был рекордным из-за высоких цен на энергоносители и сжатия импорта.","Значительный профицит счета текущих операций сформировался преимущественно за счет стоимостного роста сырьевого экспорта."],"Баланс товаров и услуг":["Разница между тем, сколько страна продала за рубеж товаров и услуг и сколько купила.","Сальдо товаров и услуг — часть текущего счёта. Его анализ по товарным группам показывает специализацию экономики и зависимость от импорта.","Экспорт лесоматериалов положительно влияет на баланс товаров, а импорт деревообрабатывающего оборудования — отрицательно.","Анализ баланса товаров и услуг по товарным группам позволяет выявить критическую импортозависимость отраслей."],"Балансовый отчет":["Документ, где на определённую дату показано, что у фирмы есть (активы) и откуда это взялось (обязательства и собственный капитал).","В России — бухгалтерский баланс, основная форма бухгалтерской (финансовой) отчётности (402-ФЗ, ФСБУ 4/2023). По нему рассчитывают показатели ликвидности и финансовой устойчивости.","По балансу учреждения видно, что основные средства составляют 70 % активов, а кредиторская задолженность растёт.","Коэффициенты финансовой устойчивости рассчитаны по данным бухгалтерского баланса за 2019–2024 гг."],"Банк банков":["Банк, в котором держат счета и берут кредиты сами банки.","Эту роль выполняет центральный банк. В России — Банк России: хранит обязательные резервы и корреспондентские счета коммерческих банков, выступает кредитором последней инстанции.","Банк, которому не хватает ликвидности в конце дня, может получить кредит Банка России.","Банк России выступает кредитором последней инстанции для кредитных организаций."],"Банк штата":["Банк в США, получивший лицензию от властей штата, а не федерального правительства.","Особенность «двойной» банковской системы США. В России лицензии всем банкам выдаёт только Банк России; региональные банки — просто банки, работающие преимущественно в одном регионе.","Небольшой региональный банк, обслуживающий предприятия области, — российская аналогия по функции.","Региональные банки играют значимую роль в кредитовании малого бизнеса на территории субъекта."],"Банкноты Федеральной резервной системы":["Обычные доллары США — их выпускает Федеральная резервная система.","Наличные деньги — обязательства центрального банка. В России банкноты и монеты выпускает Банк России (ст. 75 Конституции РФ, 86-ФЗ).","Рублёвая банкнота — обязательство Банка России, как доллар — обязательство ФРС.","Эмиссия наличных денег осуществляется исключительно Банком России."],"Банковские депозиты":["Деньги людей и компаний, лежащие на счетах в банках.","Депозиты — основной источник ресурсов банков для кредитования. В России вклады физических лиц застрахованы Агентством по страхованию вкладов (до установленного лимита).","Выручка учреждения от реализации продукции зачисляется на счёт и становится частью ресурсной базы банка.","Рост банковских депозитов расширяет ресурсную базу кредитования реального сектора."],"Банковские резервы":["Деньги, которые банки держат «про запас» — в кассе и на счетах в центральном банке.","Резервы обеспечивают расчёты и выполнение обязательных нормативов. В России банки депонируют обязательные резервы в Банке России; изменение нормативов — инструмент денежно-кредитной политики.","Если Банк России повышает норматив обязательных резервов, банки могут выдать меньше кредитов.","Изменение нормативов обязательных резервов влияет на кредитный потенциал банковского сектора."],"Банкрот":["Человек или фирма, которые не могут расплатиться по долгам, и суд это признал.","В России процедуры регулируются 127-ФЗ «О несостоятельности (банкротстве)»: наблюдение, финансовое оздоровление, внешнее управление, конкурсное производство, мировое соглашение.","Предприятие с долгом перед поставщиками более 2 млн руб., просроченным более трёх месяцев, может быть признано банкротом по заявлению кредитора.","Предприятие признано несостоятельным (банкротом) решением арбитражного суда."],"Бартер, бартерная торговля":["Обмен товара на товар без денег.","Бартер распространён при нехватке денег и доверия. В России 1990-х бартер и взаимозачёты занимали значительную долю расчётов предприятий, что затрудняло налогообложение и учёт.","Лесозаготовитель отдаёт кругляк лесопилке в обмен на готовые пиломатериалы.","Широкое распространение бартерных операций в 1990-х гг. свидетельствовало о кризисе платежной системы."],"Барьер для вхождения в отрасль":["Всё, что мешает новой фирме прийти на рынок и начать конкурировать.","Барьеры входа: большие стартовые вложения, лицензии, эффект масштаба, контроль над ресурсами. Высокие барьеры поддерживают рыночную власть действующих фирм (это изучает отраслевая экономика).","Для входа в глубокую переработку древесины нужны инвестиции в сотни миллионов рублей — это высокий барьер.","Высокая капиталоемкость производства формирует существенные барьеры входа на рынок глубокой переработки древесины."],"Бегство капитала":["Массовый вывод денег из страны из-за страха потерь.","Бегство капитала лишает экономику инвестиций. Для России это одна из угроз экономической безопасности; инструменты противодействия — валютный контроль, деофшоризация, улучшение инвестиционного климата.","В периоды нестабильности граждане и компании переводят сбережения в зарубежные банки.","Отток капитала рассматривается в качестве одной из угроз экономической безопасности страны."],"Бедность":["Ситуация, когда доходов не хватает на самое необходимое.","В России уровень бедности измеряется долей населения с доходами ниже границы бедности, связанной с величиной прожиточного минимума; показатель публикует Росстат. Снижение бедности — национальная цель развития.","Если среднедушевой доход семьи ниже прожиточного минимума, она учитывается как малоимущая.","Уровень бедности в регионе превышает среднероссийское значение, что свидетельствует о социально-экономической дифференциации."],"Безграничные потребности":["Людям всегда хочется больше, чем они могут получить.","Неограниченность потребностей при ограниченности ресурсов — исходная предпосылка экономики как науки о выборе.","Даже при росте доходов у людей появляются новые потребности: лучшее жильё, образование, путешествия.","Противоречие между ограниченностью ресурсов и безграничностью потребностей обусловливает проблему экономического выбора."],"Безналичные трансфертные платежи":["Помощь от государства не деньгами, а товарами и услугами.","Натуральные трансферты: бесплатная медицина, льготное жильё, продуктовые наборы. В бюджетной статистике учитываются как социальные трансферты в натуральной форме.","Бесплатное питание школьников — трансферт в натуральной форме.","Социальные трансферты в натуральной форме увеличивают реальное потребление домохозяйств."],"Безработица":["Люди хотят и могут работать, но не находят работу.","Росстат измеряет безработицу по методологии МОТ (обследование рабочей силы) и отдельно учитывает зарегистрированную безработицу в службах занятости. Виды: фрикционная, структурная, циклическая.","Уровень безработицы 3 % означает, что 3 % рабочей силы ищут работу и не имеют её.","Уровень безработицы по методологии МОТ в регионе снизился до 3,2 % (данные условные)."],"Безрисковая процентная ставка":["Доходность «без риска» — обычно по краткосрочным государственным облигациям.","Используется как точка отсчёта при оценке инвестиций: доходность любого рискового актива сравнивается с ней. В России в качестве безрисковой ставки берут доходность ОФЗ.","Если ОФЗ дают 12 %, проект с ожидаемой доходностью 11 % при риске неинтересен инвестору.","В качестве безрисковой ставки при расчете ставки дисконтирования принята доходность ОФЗ сопоставимого срока."],"Бета":["Показатель того, насколько акция колеблется вместе с рынком.","Бета из модели CAPM: β = 1 — актив движется как рынок, β > 1 — сильнее рынка, β < 1 — слабее. Используется при расчёте стоимости собственного капитала и ставки дисконтирования.","Акции с β = 1,5 при падении рынка на 10 % в среднем падают на 15 %.","Ставка дисконтирования определена по модели CAPM с учетом коэффициента бета отрасли."],"Богатство":["Всё ценное, что у вас есть и что может приносить доход.","Богатство — запас (на момент времени), доход — поток (за период). Национальное богатство включает основные фонды, землю, природные ресурсы; в диссертациях по экономике природопользования учитывается ценность лесных ресурсов.","Лесной участок — богатство; ежегодная выручка от заготовки на нём — доход.","Лесные ресурсы рассматриваются как элемент национального богатства, формирующий ресурсную базу развития региона."],"Британская тепловая единица":["Английская единица энергии, примерно 1055 джоулей.","Используется в статистике США по энергетике. В российских работах энергию измеряют в джоулях, кВт·ч, тоннах условного топлива (ГОСТ 8.417).","1 BTU ≈ 0,293 Вт·ч.","Показатели энергопотребления приведены в тоннах условного топлива в соответствии с методикой Росстата."],"Будущая стоимость":["Сколько будут стоить сегодняшние деньги в будущем с учётом процентов.","Будущая стоимость рассчитывается по формуле FV = PV × (1 + r)^n. Обратная операция — дисконтирование к текущей стоимости; вместе они основа оценки инвестиций.","100 тыс. руб. под 10 % годовых через 3 года превратятся в 133,1 тыс. руб.","Будущая стоимость денежных потоков рассчитана с учетом сложного процента."],"Бумажные деньги":["Деньги в виде банкнот.","Бумажные деньги — фидуциарные: их ценность основана на доверии и законе, а не на металле. В России банкноты выпускает Банк России.","Рублёвая банкнота 5000 руб. не обеспечена золотом, но обязательна к приёму на территории РФ.","Наличные деньги являются законным платежным средством на территории Российской Федерации."],"Бюджет при полной занятости":["Каким был бы бюджет, если бы экономика работала на полную мощность.","Структурный (циклически скорректированный) баланс бюджета показывает, какая часть дефицита связана с политикой, а не с кризисом. В России схожую роль играет бюджетное правило с базовой ценой нефти.","Дефицит в кризис может быть «циклическим» — при полной занятости бюджет был бы сбалансирован.","Оценка структурного баланса бюджета позволяет отделить эффект экономического цикла от эффекта бюджетной политики."],"Бюджетная прямая":["Линия всех сочетаний двух товаров, которые можно купить на свой доход.","Бюджетное ограничение показывает возможности потребителя при данных доходе и ценах. Наклон линии равен соотношению цен товаров.","При доходе 1000 руб. и ценах 100 и 200 руб. можно купить 10 единиц первого товара или 5 — второго.","Бюджетное ограничение определяет множество доступных потребителю наборов товаров."],"Бюджетный дефицит":["Государство тратит за год больше, чем получает.","В России дефицит бюджета определяется Бюджетным кодексом (ст. 6) как превышение расходов над доходами. Финансируется заимствованиями, средствами ФНБ и остатками.","Если доходы федерального бюджета 30 трлн руб., а расходы 33 трлн, дефицит — 3 трлн руб.","Дефицит федерального бюджета финансировался за счет государственных заимствований и средств Фонда национального благосостояния."],"Бюджетный избыток":["Государство получает за год больше,
