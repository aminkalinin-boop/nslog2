<style>

:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{background:var(--bg)}

.tile{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 10px;font-size:15px;text-align:left}
.tile:hover{border-color:var(--accent)}
.gapline{font:500 19px/1.6 var(--f-display)}
.gapline .blank{display:inline-block;min-width:110px;border-bottom:2px solid var(--accent);color:var(--accent)}
textarea{width:100%;min-height:110px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}

/* quest */

.stars .off{color:var(--line)}
.facts{display:grid;gap:8px}

.rank{display:flex;gap:14px;align-items:center;background:var(--gold-soft);border-radius:var(--r);padding:14px 18px}

/* glossary */

.glist{columns:2 260px;column-gap:24px}

.glist a:hover{color:var(--accent)}

.tdef{font:400 18px/1.55 var(--f-display)}
.lect{display:grid;gap:12px}
.lect .blk{border-left:3px solid var(--accent);padding:4px 0 4px 14px}

.ex{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:6px}

#lbody,#tbody,#fbody,#qz{display:grid;gap:16px}

select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.ptext{font:400 17px/1.75 var(--f-display);background:var(--surface2);border-radius:8px;padding:14px 16px;white-space:pre-wrap}
mark.pm{background:var(--bad-soft);color:var(--ink);text-decoration:underline wavy var(--bad);text-underline-offset:4px;border-radius:3px;padding:0 1px}
mark.pm sup{font:600 10px var(--f-mono);color:var(--bad);margin-left:2px}
.plist{display:grid;gap:8px}

.phist{display:grid;gap:6px}

.pe{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.case .why,.case .term{margin:0}
.online{display:grid;gap:8px;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px}
blockquote.quote{margin:10px 0;padding:10px 14px;border-left:3px solid var(--gold);background:var(--surface);border-radius:0 8px 8px 0;font:400 16px/1.55 var(--f-display);max-width:72ch}

.sync{font:500 11px var(--f-mono);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
// ============ СОДЕРЖАНИЕ ТРЕНАЖЁРА ============
// Случай: b — как пишет новичок, g — как надо, n — «почти правильно» (для тестов), w — почему, t — [термин, определение]
const LESSONS = [
{
 id:"L1", title:"Разговорная речь и сленг", short:"«Цены взлетели» → «наблюдается рост цен»",
 theory:`
<p>Научный текст пишется для экспертного читателя: оппонента, члена диссертационного совета, рецензента журнала. Разговорные слова, сленг и газетные метафоры сообщают ему не факт, а настроение автора. Поэтому в диссертации они воспринимаются как признак непрофессионализма.</p>
<p>Косвенно это следует из п. 10 Положения о присуждении учёных степеней: диссертация должна «обладать внутренним единством» и содержать аргументированные решения. Аргумент строится на терминах и данных, а не на образах.</p>
<h4>Правила урока</h4>
<ul>
<li><b>Глагол-метафору заменяйте процессом.</b> «Взлетели», «рухнули», «просели» → «рост», «сокращение», «снижение» + величина изменения.</li>
<li><b>Бытовое название заменяйте термином.</b> «Фирма прогорела» → «организация признана несостоятельной (банкротом)».</li>
<li><b>Образ заменяйте причинно-следственной связью.</b> «Кризис ударил по…» → «кризисные явления оказали негативное влияние на…».</li>
<li><b>Проверьте, можно ли измерить сказанное.</b> Если да, дайте показатель и период.</li>
</ul>
<div class="pair"><span class="bad">Цены взлетели</span><span class="arrow">→</span><span class="good">Наблюдается существенный рост цен / ускорение инфляционных процессов</span></div>
<div class="pair"><span class="bad">Фирма прогорела</span><span class="arrow">→</span><span class="good">Предприятие признано несостоятельным (банкротом)</span></div>
<div class="pair"><span class="bad">Кризис сильно ударил по…</span><span class="arrow">→</span><span class="good">Кризисные явления оказали негативное влияние на…</span></div>

 id:"L4", title:"«Я» и личные формы", short:"«Я считаю» → «по нашему мнению»",
 theory:`
<p>Местоимение «я» и личные формы в диссертации не используются: «я считаю», «я провёл анализ», «по моему мнению».</p>
<p>Принято «авторское мы» или безличные и пассивные конструкции: «по нашему мнению», «в ходе исследования автором был проведён анализ», «представляется целесообразным».</p>
<h4>Инструменты замены</h4>
<ul>
<li><b>«Авторское мы».</b> По нашему мнению; с нашей точки зрения; нами предложено.</li>
<li><b>«Автор» в 3-м лице.</b> Автором разработана методика; по мнению автора.</li>
<li><b>Безличные конструкции.</b> Представляется целесообразным; следует отметить; необходимо подчеркнуть.</li>
<li><b>Страдательный залог.</b> Проведён анализ; разработана методика; обоснован подход.</li>
<li><b>Объект как подлежащее.</b> «Данные таблицы свидетельствуют…», «Анализ показал…».</li>
</ul>
<p class="note">Не смешивайте формы в одном абзаце: «мы провели анализ, по мнению автора…». Выберите одну основную форму для всей работы.</p>`,

{
 id:"L6", title:"Язык паспорта специальности 5.2.3", short:"Тема, объект, предмет, положения на защиту",
 theory:`
<p>Все ключевые слова в теме, гипотезе и положениях, выносимых на защиту, должны перекликаться с формулировками паспорта специальности.</p>
<p>Паспорт 5.2.3 «Региональная и отраслевая экономика» включает 13 направлений: 1) региональная экономика; 2) экономика промышленности; 3) экономика АПК; 4) экономика сферы услуг; 5) транспорт и логистика; 6) экономика строительства и операций с недвижимостью; 7) экономика инноваций; 8) экономика народонаселения и экономика труда; 9) экономика природопользования и землеустройства; 10) маркетинг; 11) бухгалтерский учёт, аудит и экономическая статистика; 12) стандартизация и управление качеством продукции; 13) экономическая безопасность.</p>
<h4>Ключевые слова введения</h4>
<ul>
<li><b>Тема</b> — отглагольное существительное процесса: совершенствование, развитие, формирование, оценка, обеспечение.</li>
<li><b>Объект</b> — то, что существует в реальности (организации, отрасль, регион). <b>Предмет</b> — отношения, закономерности, механизмы внутри объекта.</li>
<li><b>Задачи</b> — глаголы совершенного вида: проанализировать, систематизировать, обосновать, разработать.</li>
<li><b>Положения на защиту и новизна</b>: «уточнено… отличающееся…», «разработано… позволяющее…».</li>
<li><b>Соответствие паспорту</b> указывается с номерами пунктов.</li>
</ul>`,

 id:"L7", title:"Доказательность и ссылки", short:"«Все знают» → «ряд исследователей [3; 7]»",
 theory:`
<p>Пункт 14 Положения о присуждении учёных степеней обязывает соискателя ссылаться на автора и (или) источник заимствования. Использование чужого материала без ссылки ведёт к снятию диссертации с рассмотрения.</p>
<p>Кроме плагиата, в диссертации встречается и обратная ошибка: утверждения без опоры. Это «все знают», «очевидно», «доказано».</p>
<h4>Правила урока</h4>
<ul>
<li><b>Каждое чужое утверждение — со ссылкой</b> [номер источника, с. страница].</li>
<li><b>Избегайте кванторов всеобщности</b>: «все», «всегда», «никогда». Их опровергает один контрпример.</li>
<li><b>Прогноз формулируйте с условием</b>: «при сохранении текущих тенденций», «при прочих равных условиях».</li>
<li><b>Корреляция — не доказательство</b>: «выявлена связь», а не «доказано, что X вызывает Y».</li>
<li><b>Источник должен быть научным или официальным</b>: нормативный акт, статистика, рецензируемый журнал. Не энциклопедия и не блог.</li>
</ul>`,

 id:"L8", title:"Логические связки", short:"«Короче» → «таким образом»",
 theory:`
<p>Научный текст — цепочка аргументов. Связки показывают отношения между ними: причину, следствие, противопоставление, обобщение. Разговорные связки («короче», «так вот», «а вот») разрушают эту логику.</p>
<h4>Набор связок</h4>
<table class="tbl"><tr><th>Отношение</th><th>Научные связки</th></tr>
<tr><td>Причина</td><td>поскольку; в связи с тем, что; вследствие; ввиду; обусловлено</td></tr>
<tr><td>Следствие</td><td>следовательно; в результате; в связи с этим; это позволяет</td></tr>
<tr><td>Противопоставление</td><td>однако; вместе с тем; в то же время; напротив; тогда как</td></tr>
<tr><td>Добавление</td><td>кроме того; наряду с этим; помимо этого; также</td></tr>
<tr><td>Порядок</td><td>во-первых…; во-вторых…; далее; в заключение</td></tr>
<tr><td>Обобщение</td><td>таким образом; итак; в целом; подводя итог</td></tr>
<tr><td>Ссылка на сказанное</td><td>как было показано в параграфе 1.2; как отмечалось выше</td></tr>
</table>
<p class="note">В тексте допускаются общепринятые сокращения «т. е.», «и т. д.», «и т. п.», «и др.». Сокращения «т. к.», «т. н.», «напр.» пишут полностью.</p>`,

{
 id:"L9", title:"Числа, данные, единицы", short:"Процент или процентный пункт",
 theory:`
<p>Числа — главный аргумент экономиста, и ошибки в них заметнее всего. Оппоненты часто спрашивают о процентах и процентных пунктах, текущих и сопоставимых ценах, корреляции и причинности.</p>
<h4>Правила урока</h4>
<ul>
<li><b>Процентный пункт (п. п.)</b> — разность двух процентных величин. Если уровень безработицы вырос с 4 до 6 %, это рост на 2 п. п. (и на 50 %).</li>
<li><b>«В N раз меньше» / «на 200 % меньше»</b> — частая ошибка. Уменьшение не может превышать 100 %.</li>
<li><b>Стоимостные ряды за несколько лет</b> приводите в сопоставимых ценах (с использованием индекса-дефлятора) или оговаривайте текущие цены.</li>
<li><b>Единицы измерения</b> — по ГОСТ 8.417: м³, а не «кубы»; млн руб., а не «лямы».</li>
<li><b>Каждая таблица и рисунок — с источником</b>: «Источник: составлено автором по данным Росстата [15]».</li>
<li><b>Точность соответствует смыслу</b>: 12,3 %, а не 12,3456789 %.</li>
<li><b>Для межрегиональных сравнений</b> используйте удельные показатели (на душу населения, на 1 занятого), а не абсолютные.</li>
</ul>`,
 cases:[

{id:"style", title:"Научный стиль: признаки и запреты", html:`
<p>Научный стиль — функциональный стиль русского языка для передачи знаний. Его признаки: <b>объективность</b> (факты, а не впечатления), <b>логичность</b> (связанность аргументов), <b>точность</b> (однозначные термины), <b>обобщённость</b> (закономерности, а не частные случаи) и <b>безличность</b> (автор не в центре).</p>
<h4>1. Разговорная речь, сленг и публицистика</h4>
<div class="pair"><span class="bad">Цены взлетели</span><span class="arrow">→</span><span class="good">Наблюдается существенный рост цен / ускорение инфляционных процессов</span></div>
<div class="pair"><span class="bad">Фирма прогорела</span><span class="arrow">→</span><span class="good">Предприятие признано несостоятельным (банкротом)</span></div>

<h4>2. Эмоционально окрашенные слова и оценочные суждения</h4>
<p>«Ужасный результат», «потрясающий успех», «катастрофическое падение» — под запретом. Наука оперирует цифрами и фактами: «снижение показателя на 12 %».</p>
<h4>3. Неустановившиеся жаргонизмы и «американизмы» без расшифровки</h4>
<p>«Профит», «кешбэк», «фаундер» — только если вы исследуете эти феномены и даёте им строгое научное определение. Относительно новый термин («шеринг-экономика», «экосистема бизнеса») вводится с академическим определением или ссылкой на автора, который ввёл его в научный оборот.</p>
<h4>4. Местоимение «я» и личные формы</h4>
<p>«Я считаю», «я провёл анализ», «по моему мнению» — заменяются на «по нашему мнению», «в ходе исследования автором был проведён анализ», «представляется целесообразным».</p>
<h4>Как тренироваться</h4>
<p>Пройдите 10 уроков цикла. В каждом уроке — теория, 10 случаев «новичок → как надо» и тест. После всех уроков откроется итоговый тест цикла. Отдельно отрабатывайте устойчивые обороты в тренажёре и нормативную базу в квесте.</p>`},

 id:"C2L5", title:"Деепричастные обороты", short:"«Проанализировав данные, выручка снизилась»",
 theory:`
<p>Деепричастие обозначает действие того же лица, что и сказуемое. «Проанализировав данные, выручка снизилась» означает, что данные анализировала выручка. Это одна из самых частых ошибок в диссертациях.</p>
<ul>
<li><b>Проверка:</b> кто выполняет действие деепричастия? Этот же субъект должен быть подлежащим.</li>
<li><b>В безличных и пассивных предложениях</b> деепричастие обычно недопустимо: «Проанализировав данные, была выявлена тенденция» — ошибка.</li>
<li><b>Исправления:</b> замена на «в результате анализа», «после анализа»; придаточное «когда были проанализированы…»; активная конструкция с подлежащим.</li>
</ul>`,

 theory:`
<p>Элементы перечня должны быть грамматически однородными: все существительные, или все глаголы, или все словосочетания одного типа.</p>
<ul>
<li><b>Не смешивайте:</b> «анализ, систематизировать, разработка» — все три элемента в одной форме.</li>
<li><b>Двойные союзы:</b> «как… так и», «не только… но и» — после каждой части одинаковая конструкция.</li>
<li><b>Общее слово и перечень</b> согласуются: «три фактора: тарифы, кадры и сбыт».</li>
<li><b>Нумерованный перечень:</b> каждый пункт с одинаковым началом и знаком препинания (строчная буква и «;» либо прописная и «.»).</li>
</ul>`,

 id:"C2L7", title:"Строение абзаца", short:"Тезис → аргумент → данные → вывод",
 theory:`
<p>Абзац научного текста — законченный микроаргумент. Типовая схема:</p>
<ol>
<li><b>Тезис</b> — первое предложение формулирует мысль абзаца.</li>
<li><b>Аргумент</b> — объяснение, почему это так.</li>
<li><b>Данные</b> — цифра, ссылка, пример.</li>
<li><b>Вывод или переход</b> — что из этого следует.</li>
</ol>
<ul>
<li><b>Один абзац — одна мысль.</b> Новая мысль — новый абзац.</li>
<li><b>Длина:</b> обычно 4–8 предложений. Абзац из одного предложения — признак незаконченной мысли.</li>
<li><b>Не начинайте абзац с цифры или цитаты</b> без вводящей фразы.</li>
</ul>
<p class="note">В этом уроке «случаи» — фрагменты абзацев. Смотрите на логику построения.</p>`,

 {b:"В 2024 г. выручка — 480 млн руб., в 2023 г. — 560 млн руб., в 2022 г. — 610 млн руб.",g:"Финансовое положение организации ухудшается. В 2022–2024 гг. выручка сократилась с 610 до 480 млн руб., то есть на 21 %. Это свидетельствует о снижении конкурентоспособности продукции на внутреннем рынке.",n:"В 2022–2024 гг. выручка снижалась: 610, 560, 480 млн руб.",w:"Абзац начинается с цифр без тезиса и заканчивается без вывода. Добавьте тезис в начало и интерпретацию в конец."},
 {b:"Угроз экономической безопасности много. Некоторые учёные их классифицируют. Кадры тоже важны. Выручка падает.",g:"Угрозы экономической безопасности организаций ЛПК УИС можно разделить на внешние и внутренние [3; 7]. К внешним относятся сокращение спроса и рост тарифов, к внутренним — износ основных фондов и дефицит кадров. Такое разделение позволяет обосновать состав индикаторов для мониторинга.",n:"Угроз много. Их классифицируют на внешние и внутренние. Кадры и выручка тоже важны.",w:"Абзац-«каша» из несвязанных мыслей. Одна мысль (классификация) раскрывается последовательно."},
 {b:"«Экономическая безопасность — это состояние…» [4]. Это определение правильное.",g:"В научной литературе экономическая безопасность организации трактуется преимущественно как состояние защищённости её ресурсов от угроз. Так, по определению И. И. Иванова, это «состояние…» [4, с. 12]. Данная трактовка, однако, не учитывает отраслевой специфики.",n:"Иванов определяет экономическую безопасность как «состояние…» [4]. Это определение правильное.",w:"Цитата без вводящей фразы и оценка без аргумента. Правильный абзац вводит цитату, приводит её и оценивает с обоснованием."},
 {b:"Рентабельность снизилась до 1,8 %.",g:"Рентабельность продаж снизилась до 1,8 %, что ниже среднеотраслевого значения (5,6 %). Основной причиной стал опережающий рост себестоимости под влиянием тарифов на энергоресурсы. При сохранении этой тенденции организация может утратить финансовую устойчивость.",n:"Рентабельность снизилась до 1,8 %, это ниже среднего.",w:"Абзац из одного предложения — незаконченная мысль. Нужны база сравнения, причина и следствие."},
 {b:"ЛПК важен для региона. В 2024 г. его доля в ВРП — 12 %. Также в регионе развиты туризм и рыболовство, которые тоже важны. Туризм растёт.",g:"Лесопромышленный комплекс выступает отраслью специализации региона: его доля в ВРП в 2024 г. составила 12 %, что в 5 раз выше среднероссийского уровня. Следовательно, устойчивость региональной экономики в значительной мере зависит от состояния ЛПК.",n:"ЛПК важен для региона — 12 % ВРП. Туризм и рыболовство тоже важны.",w:"Отклонение от темы (туризм) — в отдельный абзац или удалить. Тезис подкреплён сравнением и выводом."},
 {b:"Во второй главе мы рассмотрим методику. Но сначала о кадрах. Кадров не хватает. Методика будет учитывать кадры.",g:"Дефицит квалифицированных кадров — одна из ключевых внутренних угроз для учреждений ЛПК УИС. Укомплектованность инженерными должностями составляет 64 %. Поэтому в разрабатываемую методику (глава 2) включены кадровые индикаторы.",n:"Во второй главе рассмотрим методику, которая учитывает кадры, которых не хватает.",w:"Абзац начинается с анонса и перескакивает между темами. Тезис → данные → вывод со ссылкой на главу."},
 {b:"Как видно из рисунка 2.3.",g:"Динамика заготовки древесины в 2015–2024 гг. приведена на рисунке 2.3. Наибольшее сокращение пришлось на 2022 г. (−19 %), что связано с введением ограничительных мер на экспорт.",n:"Как видно из рисунка 2.3, заготовка сократилась.",w:"Незаконченная фраза. Абзац о рисунке: что изображено → главная закономерность → объяснение."},
 {b:"Предлагаемая методика лучше. Она учитывает пороги. Другие не учитывают. Поэтому она лучше.",g:"В отличие от подходов, представленных в работах [5; 9], предлагаемая методика учитывает пороговые значения для каждой группы индикаторов. Это позволяет не только ранжировать организации, но и выявлять критические отклонения.",n:"Предлагаемая методика учитывает пороги, в отличие от других, поэтому она лучше.",w:"Круговая аргументация («лучше, потому что лучше»). Сравнение с конкретными работами и указание на практическое следствие."},
 {b:"Таким образом. Проблем много и их надо решать.",g:"Таким образом, выявленные угрозы носят системный характер и затрагивают как финансовую, так и кадровую сферу деятельности учреждений. Их нейтрализация требует комплексного подхода, обоснованию которого посвящена третья глава.",n:"Таким образом, проблем много, и их нужно решать комплексно.",w:"Итоговый абзац обобщает конкретное содержание и связывает с дальнейшим текстом."},
 {b:"Лесистость России — 46 %. Карелия — 53 %. Архангельская область — 55 %. Росстат.",g:"Северо-западные регионы отличаются высокой лесистостью. По данным Рослесхоза, в Архангельской области она составляет около 55 %, в Республике Карелия — около 53 % при среднем значении по России около 46 %. Это создаёт ресурсные предпосылки для развития ЛПК.",n:"По данным Росстата, лесистость России — 46 %, Карелии — 53 %, Архангельской области — 55 %.",w:"Перечень цифр без тезиса и вывода. (Цифры условные.)"}
 ]
},
{
 id:"C2L8", title:"Связность текста", short:"Переходы между абзацами и повтор термина",
 theory:`
<p>Связность обеспечивают три инструмента.</p>
<ul>
<li><b>Повтор ключевого термина</b>, а не местоимение «он», «это», когда возможна двусмысленность.</li>
<li><b>Синонимическая замена</b> в пределах допустимого: «организации ЛПК» → «лесопромышленные организации». Но не подменяйте термин неточным синонимом: «экономическая безопасность» ≠ «надёжность».</li>
<li><b>Связки-переходы</b> в начале абзаца: «Наряду с финансовыми угрозами…», «Рассмотрим далее…», «Иная ситуация складывается…».</li>
</ul>
<p>Термин, введённый в начале, используется одинаково до конца работы. Смена «угроза» / «риск» / «опасность» без оговорки — нарушение внутреннего единства (п. 10 Положения).</p>`,
 cases:[
 {b:"В главе 1 используется термин «угроза», в главе 2 — «опасность», в главе 3 — «риск» для одного и того же понятия.",g:"Термин «угроза экономической безопасности» используется единообразно во всех главах; соотношение понятий «угроза» и «риск» разъяснено в параграфе 1.2.",n:"В работе используются синонимы «угроза», «опасность», «риск».",w:"Смена терминов для одного понятия создаёт впечатление, что речь о разных вещах. Это нарушает внутреннее единство работы."},
 {b:"Предприятие заключило договор с покупателем. Он был расторгнут через год.",g:"Предприятие заключило договор с покупателем. Через год договор был расторгнут.",n:"Предприятие заключило договор с покупателем. Через год он его расторг.",w:"«Он» может относиться и к договору, и к покупателю. Повторите термин."},
 {b:"Финансовые угрозы рассмотрены. Кадры.",g:"Наряду с финансовыми угрозами существенное влияние на уровень безопасности оказывают кадровые.",n:"Финансовые угрозы рассмотрены. Теперь о кадрах.",w:"Переход между темами оформляется связкой, которая указывает на отношение (добавление)."},
 {b:"Экономическая безопасность… В следующем абзаце: Надёжность предприятия…",g:"Экономическая безопасность… В следующем абзаце: Уровень экономической безопасности предприятия…",n:"Экономическая безопасность… Устойчивость и надёжность предприятия…",w:"«Надёжность» и «устойчивость» — другие понятия. Подмена термина синонимом нарушает точность."},
 {b:"Это привело к этому, и это стало причиной этого.",g:"Рост тарифов привёл к увеличению себестоимости, что стало причиной снижения рентабельности.",n:"Это привело к росту себестоимости, и это снизило рентабельность.",w:"Цепочка «это… этого» лишает текст смысла при чтении фрагмента. Называйте явления."},
 {b:"Первая глава закончилась. Вторая глава про анализ.",g:"Теоретические положения, обоснованные в первой главе, позволяют перейти к анализу состояния ЛПК УИС.",n:"Перейдём от теории к анализу во второй главе.",w:"Переход между главами связывает итог предыдущей с задачей следующей."},
 {b:"Методика оценки — …. Она … Она … Она …",g:"Методика оценки — …. Её первый этап … На втором этапе методики … Завершающий этап предполагает …",n:"Методика оценки — …. Она … Эта методика … Она …",w:"Монотонный повтор местоимения. Структурирующие слова («первый этап», «на втором этапе») связывают и упорядочивают."},
 {b:"В Карелии доля ЛПК высокая. Архангельская область. Вологодская область тоже.",g:"В Республике Карелия доля ЛПК в отгрузке обрабатывающих производств превышает 30 %. Сопоставимые значения отмечаются в Архангельской и Вологодской областях, что позволяет рассматривать эти регионы как единую группу.",n:"В Карелии доля ЛПК высокая. В Архангельской и Вологодской областях тоже.",w:"Связка «сопоставимые значения отмечаются» и вывод о группировке делают перечень аргументом."},
 {b:"Иванов считает так [4]. Петров считает иначе [7]. Сидоров тоже [9].",g:"В литературе сложились два подхода. Согласно первому (И. И. Иванов [4]), … Сторонники второго подхода (П. П. Петров [7], С. С. Сидоров [9]) полагают, что …",n:"Иванов считает так [4], а Петров и Сидоров — иначе [7; 9].",w:"Обзор мнений группируется по подходам, а не по авторам."},
 {b:"ЦТАО, ЦТАО учреждений, центры, мастерские, производство — в одном тексте о том же.",g:"Центры трудовой адаптации осуждённых (далее — ЦТАО) …; далее по тексту — только «ЦТАО».",n:"Центры трудовой адаптации (ЦТАО), они же производственные мастерские…",w:"Аббревиатура вводится один раз с расшифровкой и далее используется единообразно."}
 ]
},
{
 id:"C2L9", title:"Однозначность", short:"«Данный», «этот», «соответствующий» без адресата",
 theory:`
<p>Научный текст должен пониматься одинаково любым читателем. Главные источники двусмысленности — местоимения без чёткого адресата, слова «соответствующий», «определённый», «ряд», и неясные сравнения.</p>
<ul>
<li><b>«Данный»</b> допустим, если понятно, какой именно. Три «данных» в абзаце — повод назвать объект.</li>
<li><b>«Соответствующие меры», «определённые условия»</b> — какие? Назовите.</li>
<li><b>Сравнение</b> требует обоих членов: «выше» — чем что?</li>
<li><b>«Ряд», «некоторые», «многие»</b> — по возможности замените числом.</li>
</ul>`,
 cases:[
 {b:"Необходимо принять соответствующие меры.",g:"Необходимо диверсифицировать каналы сбыта и снизить зависимость от единственного покупателя.",n:"Необходимо принять необходимые меры по улучшению ситуации.",w:"«Соответствующие меры» — пустое место. Назовите меры."},
 {b:"Рентабельность в ЛПК УИС выше.",g:"Рентабельность продаж в организациях ЛПК УИС выше, чем в среднем по виду деятельности «Обработка древесины» (6,2 % против 5,6 %).",n:"Рентабельность в ЛПК УИС выше средней.",w:"Сравнение без второго члена бессмысленно. Средней — по чему?"},
 {b:"В определённых условиях методика даёт погрешность.",g:"При доле пропущенных данных более 20 % методика даёт погрешность свыше 10 %.",n:"В ряде условий методика даёт некоторую погрешность.",w:"«Определённые условия», «ряд», «некоторая» — неопределённость. Назовите условия и величину."},
 {b:"Ряд авторов считает, что…",g:"Ряд авторов [3; 7; 12] считает, что…",n:"Многие авторы считают, что…",w:"«Ряд» без ссылок непроверяем. Ссылки превращают неопределённость в факт."},
 {b:"Учреждение и предприятие заключили договор, по данному договору оно поставляет…",g:"Учреждение и предприятие заключили договор, по которому учреждение поставляет…",n:"Учреждение и предприятие заключили договор, по которому оно поставляет…",w:"«Оно» может относиться к учреждению и к предприятию. Повторите существительное."},
 {b:"Показатель снизился незначительно.",g:"Показатель снизился на 0,4 п. п.",n:"Показатель снизился в небольшой степени.",w:"«Незначительно» — оценка. Приведите величину, читатель сам оценит."},
 {b:"В последние годы отрасль развивается.",g:"В 2019–2024 гг. индекс производства в обработке древесины составил 108 %.",n:"В течение последних лет отрасль растёт.",w:"«В последние годы» устаревает с каждым годом и непроверяемо. Укажите период и показатель."},
 {b:"Данный подход, в отличие от данного, учитывает данные факторы.",g:"Предлагаемый подход, в отличие от ресурсного [5], учитывает институциональные факторы.",n:"Этот подход, в отличие от того, учитывает эти факторы.",w:"Три указательных слова без адресата. Назовите подходы и факторы."},
 {b:"Большинство учреждений имеют проблемы.",g:"У 23 из 31 обследованного учреждения коэффициент текущей ликвидности ниже нормативного значения.",n:"Большая часть учреждений испытывает финансовые трудности.",w:"«Большинство», «проблемы» — неопределённость. Число и критерий — определённость."},
 {b:"Это оказывает влияние.",g:"Рост тарифов на электроэнергию повышает себестоимость продукции.",n:"Это существенно влияет на себестоимость.",w:"«Это» без адресата и «влияние» без направления. Назовите причину и характер влияния."}
 ]
},
{
 id:"C2L10", title:"Как строить определение", short:"Родовое понятие + видовые отличия",
 theory:`
<p>Классическое научное определение строится по схеме: <b>определяемое = родовое понятие + видовые отличия</b>.</p>
<div class="pair"><span class="good">Экономическая безопасность организации</span><span class="arrow">=</span><span>состояние защищённости (род) её ресурсов и интересов от внутренних и внешних угроз, обеспечивающее устойчивое функционирование и развитие (видовые отличия)</span></div>
<h4>Ошибки определения</h4>
<ul>
<li><b>Тавтология:</b> «безопасность — это когда безопасно».</li>
<li><b>Через отрицание:</b> «безопасность — отсутствие опасности» (допустимо лишь как дополнение).</li>
<li><b>Слишком широкое:</b> «ЛПК — совокупность предприятий» (каких?).</li>
<li><b>Слишком узкое:</b> определение не охватывает все случаи.</li>
<li><b>Метафора вместо определения:</b> «кластер — локомотив развития региона».</li>
<li><b>Через пример:</b> «инвестиции — это, например, покупка станков».</li>
</ul>
<p>Уточняя определение, укажите, чьё определение вы берёте за основу и что в нём меняете.</p>`,
 cases:[
 {b:"Экономическая безопасность — это когда экономика в безопасности.",g:"Экономическая безопасность — состояние защищённости национальной экономики от внешних и внутренних угроз, при котором обеспечиваются экономический суверенитет страны, единство её экономического пространства и условия для реализации стратегических национальных приоритетов.",n:"Экономическая безопасность — это безопасное состояние экономики.",w:"Тавтология: определяемое через само себя. Нужны род (состояние защищённости) и отличия."},

<li><b>Поспешное обобщение:</b> вывод об отрасли по одному предприятию.</li>

<p>Результаты эконометрических расчётов описываются по стандартной схеме: что оценивалось → как → основные коэффициенты → качество модели → интерпретация в единицах измерения.</p>
<ul>
<li><b>Знак и величина коэффициента</b> интерпретируются в единицах: «рост X на 1 п. п. связан с ростом Y на 0,3 п. п.».</li>
<li><b>Значимость:</b> «значим на уровне 5 %», «p &lt; 0,05».</li>
<li><b>Качество модели:</b> R² (доля объяснённой вариации), число наблюдений.</li>
<li><b>Не «доказывает», а «свидетельствует», «согласуется».</b></li>
<li><b>Незначимые коэффициенты</b> не интерпретируются как эффект.</li>
</ul>`,

<ul>
<li><b>Корректное заимствование:</b> цитата в кавычках со ссылкой или пересказ со ссылкой.</li>

<p>Актуальность диссертации — не «тема важна», а описание <b>проблемной ситуации</b>: противоречия между потребностью практики (или теории) и имеющимися средствами её удовлетворения.</p>
<ul>

 theory:`
<p>Обзор у Родионова — цепочка из четырёх звеньев:</p>
<ol>
<li><b>Перечень авторов:</b> «Проблематика (тематика) X получила развитие в работах И. О. Фамилия [1], И. О. Фамилия [2]…» или «X является объектом исследований…».</li>
<li><b>Выделенная работа:</b> «Отдельного внимания заслуживает работа …, где обозначаются (представлены)…».</li>
<li><b>Учёт наработок:</b> «В ходе подготовки работы нами также учитывались результаты…», «Нами также учтены наработки коллег по вопросам…», «Существенными также являются наработки…».</li>
<li><b>Пробел:</b> «Несмотря на значительное внимание, которое уделяется…, проблематика… остается малоизученной и требует существенного развития».</li>
</ol>
<blockquote class="quote">«Несмотря на значительное внимание, которое уделяется вопросам организации труда и производственной деятельности в УИС, проблематика формирования соответствующей государственной политики остается малоизученной и требует существенного развития.»<small>Родионов А. В., 2017</small></blockquote>
<p class="note">Фамилии в примерах условные. В ранних работах он ставил инициалы после фамилии («Николаева А.А.»), в поздних — перед («Т. И. Ларининой»). В диссертации — единообразно, обычно инициалы перед фамилией.</p>`,
 cases:[

 {b:"Особенно интересна статья Николаева.",g:"Отдельного внимания заслуживает работа Н. Н. Николаева [4], где обоснован подход к определению пороговых значений индикаторов безопасности для казенных учреждений.",n:"Отдельного внимания заслуживает работа Н. Н. Николаева [4].",w:"После «отдельного внимания заслуживает работа…» он всегда раскрывает, что в ней сделано: «где…»."},

 {b:"Но тема всё равно не изучена.",g:"Несмотря на значительное внимание, которое уделяется вопросам экономической безопасности в научной литературе, проблематика ее обеспечения в производственном секторе УИС остается малоизученной и требует существенного развития.",n:"Несмотря на внимание к теме, она никем не изучена.",w:"Его формула пробела: «Несмотря на значительное внимание, которое уделяется…, проблематика… остается малоизученной и требует существенного развития». «Никем не изучена» — перегиб."},
 {b:"Есть ещё работы про регионы.",g:"Нами также учтены наработки коллег по вопросам обеспечения экономической безопасности на уровне отдельных регионов и территорий.",n:"Также есть работы про региональную безопасность.",w:"«Наработки коллег» — его слово."},

 {b:"Литобзор: Иванов пишет… Петров пишет… Сидоров пишет…",g:"Литобзор: перечень авторов по направлению → выделенная работа → учтённые наработки → пробел.",n:"Литобзор: пересказ каждой работы по абзацу.",w:"Родионов не пересказывает работы по отдельности — он перечисляет и выделяет одну-две."},

 theory:`
<p>Главное отличие Родионова от «учебного» научного стиля — открытая авторская позиция. Он не просто излагает факты, а после каждого блока даёт оценку.</p>
<table class="tbl"><tr><th>Ход</th><th>Формула</th></tr>
<tr><td>Позиция</td><td>На наш взгляд, …</td></tr>
<tr><td>Важная деталь</td><td>Отметим, что… / Отметим также…</td></tr>
<tr><td>Квалификация явления</td><td>…следует определить как… / следует оценивать как… / следует определить в качестве…</td></tr>
<tr><td>Внимание к аспекту</td><td>Отдельного внимания заслуживает… / Заслуживает внимания…</td></tr>
<tr><td>Учёт фактора</td><td>Следует также учитывать, что… / При этом следует учитывать тот факт, что…</td></tr>
<tr><td>Объективность</td><td>Объективно данный X следует оценивать как…</td></tr>
</table>
<blockquote class="quote">«Отметим, что в приказе не указывалось на конкретные подразделения…, что, на наш взгляд, определяет значительный разрыв содержания приказа № 414 с существовавшими в тот момент реалиями.»<small>Родионов А. В., 2017</small></blockquote>
<p class="note">«На наш взгляд» всегда выделяется запятыми с двух сторон. В оригинальных текстах эта запятая иногда пропущена — не копируйте.</p>`,

 {b:"Я думаю, программа была неэффективной.",g:"На наш взгляд, федеральная целевая программа не оказала существенного влияния на развитие лесопромышленного производства УИС.",n:"На наш взгляд программа была неэффективной.",w:"Позиция вводится «на наш взгляд» с запятой. В почти правильном варианте нет запятой, и оценка слишком общая."},
 {b:"Кстати, в приказе не было сказано про сбыт.",g:"Отметим, что в приказе не определялись подразделения, ответственные за организацию сбыта продукции.",n:"Кстати, отметим, что в приказе не было про сбыт.",w:"«Отметим, что» — его главный способ ввести важную деталь. «Кстати» — разговорно."},
 {b:"Это была хорошая идея, но она не сработала.",g:"Данную инициативу следует оценивать как концептуально обоснованную, однако объективно не обеспеченную необходимыми ресурсами.",n:"Эту инициативу следует оценить, как хорошую, но не сработавшую.",w:"Его квалификация: «следует оценивать как…». Перед «как» здесь запятая не нужна; «хорошая» — не его лексика."},
 {b:"Важно ещё посмотреть на кадры.",g:"Отдельного внимания заслуживает проблематика кадрового обеспечения лесопромышленных подразделений учреждений УИС.",n:"Отдельное внимание надо уделить кадрам.",w:"«Отдельного внимания заслуживает проблематика…» — его формула (2017)."},
 {b:"Ещё надо помнить, что учреждения казённые.",g:"При этом следует учитывать тот факт, что учреждения УИС являются казенными, что существенным образом влияет на особенности их хозяйственной деятельности.",n:"Ещё следует помнить, что учреждения казённые.",w:"Дословная конструкция Родионова: «При этом следует учитывать тот факт, что…, что существенным образом влияет на…»."},
 {b:"Износ оборудования — одна из главных проблем, я считаю.",g:"Высокий уровень износа основных фондов следует определить в качестве одной из наиболее острых угроз экономической безопасности лесопромышленного производства УИС.",n:"Высокий износ, на мой взгляд, одна из главных угроз.",w:"«Следует определить в качестве одной из наиболее острых угроз» — формула из работы с Крутем (2022)."},
 {b:"Объём новаций в приказе был большой.",g:"Объем нормативных новаций, заложенных в данный документ, следует определить как очень высокий.",n:"Объём новаций в приказе, по-моему, был большим.",w:"Он даёт оценку через «следует определить как» — безлично, но с явной позицией."},
 {b:"Интересно, что в 2022 г. экспорт упал сильнее всего.",g:"Примечательно, что наибольшее сокращение экспорта лесоматериалов пришлось на 2022 г.",n:"Интересно отметить, что в 2022 г. экспорт упал сильнее всего.",w:"«Примечательно, что…» — его оборот для яркого факта."},
 {b:"С одной стороны приказ хороший, с другой — невыполнимый.",g:"Приказ следует рассматривать с точки зрения его высокого потенциала в сфере организации труда осужденных. В то же время объективно данный приказ следует оценивать как инициативу, которая не имела существенного влияния на производственный процесс.",n:"Приказ хороший, но в тоже время невыполнимый.",w:"Двухходовая оценка из статьи 2017 г.: потенциал → «в то же время объективно… следует оценивать как…». «В тоже время» слитно — ошибка."},
 {b:"Мне кажется, ГЧП поможет.",g:"На наш взгляд, развитие государственно-частного партнерства имеет существенный потенциал для повышения уровня экономической безопасности лесопромышленного производства УИС.",n:"На наш взгляд, ГЧП, скорее всего, как-то поможет.",w:"«На наш взгляд» + «имеет существенный потенциал для…». Без неуверенного «как-то»."}
 ]
},
{
 id:"R5", title:"Аргумент: факт, следствие, пример", short:"«Фактически…», «Как следствие…», «В качестве примера следует привести…»",
 theory:`
<p>Основная часть у Родионова — цепочки «факт → следствие → квалификация». Он опирается на нормативные акты (с полными реквизитами), статистику (с годом и единицей) и примеры других стран или регионов.</p>
<table class="tbl"><tr><th>Функция</th><th>Связка</th></tr>
<tr><td>Реальное положение дел</td><td>Фактически, …</td></tr>
<tr><td>Следствие</td><td>Как следствие, … / В результате…</td></tr>
<tr><td>Пример</td><td>В качестве примера следует (можно) привести… / В качестве наглядной иллюстрации…</td></tr>
<tr><td>Уточнение</td><td>В данном случае речь идет о… / В частности, речь идет о…</td></tr>
<tr><td>Противопоставление</td><td>При этом… / В то же время… / Однако…</td></tr>
<tr><td>Обобщение</td><td>Таким образом, …</td></tr>
<tr><td>Потенциал</td><td>Такого рода X имеет существенный потенциал…</td></tr>
</table>
<blockquote class="quote">«Как следствие, нефть и другие сырьевые активы начали стремительно дешеветь, достигнув исторических минимумов 2003 г.»<small>Родионов А. В., 2020</small></blockquote>
<p>Перечень факторов он оформляет нумерацией: «негативное влияние с трех сторон: 1. … 2. … 3. …» или «Во-первых… В-пятых…».</p>`,
 cases:[
 {b:"На самом деле колонии конкурируют с частниками.",g:"Фактически, лесопромышленные подразделения учреждений УИС конкурируют на региональных рынках с частными лесозаготовителями, не обладая сопоставимой технической базой.",n:"По сути колонии конкурируют с частниками.",w:"«Фактически, …» — его связка для реального положения дел. «Колонии», «частники» — разговорно."},
 {b:"Из-за этого выручка упала.",g:"Как следствие, выручка от реализации пиломатериалов сократилась на 18 % в 2022 г.",n:"Как следствие, выручка упала.",w:"«Как следствие» + показатель + величина + год. Без цифры — неполно."},
 {b:"Например, Китай.",g:"В качестве примера следует привести Китай, который за 2018 г. увеличил объем экспорта нефтепродуктов на 12 %.",n:"Например, в Китае экспорт растёт.",w:"Его формула примера — «В качестве примера следует привести X, который…» с цифрой."},
 {b:"Речь про газопровод.",g:"В частности, речь идет о газопроводе «Сила Сибири».",n:"Речь про газопровод «Сила Сибири».",w:"«В частности, речь идет о…» — его уточняющая связка."},
 {b:"Приказ 414 (без даты).",g:"приказ МВД России от 7 сентября 1993 г. № 414 «О мерах по совершенствованию внешнеэкономической деятельности…» (далее — приказ № 414)",n:"приказ МВД № 414 1993 года",w:"Нормативный акт он приводит с органом, датой, номером, названием и сокращением «(далее — …)»."},
 {b:"Всё это плохо влияет на три вещи.",g:"Таким образом, сложилась ситуация, при которой лесопромышленное производство УИС начало ощущать негативное влияние с трех сторон: 1. … 2. … 3. …",n:"Таким образом, есть три плохих фактора.",w:"Его прием: «сложилась ситуация, при которой… с трех сторон:» и нумерованный перечень."},
 {b:"ГЧП даст хороший эффект.",g:"Такого рода государственно-частное партнерство имеет существенный потенциал генерации синергетического эффекта.",n:"ГЧП даст очень хороший синергетический эффект.",w:"Дословная фраза Родионова (2024): «Такого рода… имеет существенный потенциал генерации синергетического эффекта»."},
 {b:"Но при этом бюджет вырос.",g:"При этом объем бюджетных ассигнований на обеспечение производственной деятельности учреждений увеличился.",n:"Но при этом бюджет всё-таки вырос.",w:"«При этом» — самое частое начало предложения у Родионова (41 раз). Без «но» и «всё-таки»."},
 {b:"Данные с сайта (без ссылки).",g:"В 2019 г. США вышли на 1 место в мире по добыче нефти с объемом 12,9 млн баррелей в день (далее — б/д) (рис. 1).",n:"США — первые по добыче нефти (данные из интернета).",w:"Цифра встроена в предложение с годом, единицей, сокращением «(далее — …)» и отсылкой к рисунку."},
 {b:"Короче, всё упирается в износ.",g:"Таким образом, проблематику повышения эффективности лесопромышленного производства УИС следует рассматривать в плоскости обновления основных фондов.",n:"Таким образом, короче, всё упирается в износ.",w:"Его обобщение: «Таким образом, проблематику X следует рассматривать в плоскости Y» (2017)."}
 ]
},

 id:"R6", title:"Выводы и предложения", short:"«Таким образом… позволит», «Следует», «Целесообразно»",
 theory:`
<p>Родионов заканчивает статьи программно: перечень направлений и обобщающий абзац о том, что они позволят сделать.</p>
<ul>
<li><b>Перечень направлений:</b> «Во-первых, … В-вторых, …» — каждое направление с обоснованием в 1–3 предложениях.</li>
<li><b>Рекомендательные глаголы:</b> «Следует сформировать…», «Следует обеспечить…», «Целесообразно осуществить…», «Дальнейшую работу следует проводить также в сфере…».</li>
<li><b>Итог:</b> «Таким образом, вышеуказанные… позволят сформировать и реализовать новый подход к…».</li>
<li><b>Продолжение работы:</b> «В связи с этим следует продолжить работу по…».</li>
</ul>
<blockquote class="quote">«Таким образом, вышеуказанные и иные организационно-правовые аспекты привлечения осуждённых к труду позволят сформировать и реализовать новый подход к развитию уголовно-исполнительной политики…»<small>Родионов А. В., 2019</small></blockquote>`,
 cases:[
 {b:"В общем, надо всё улучшать.",g:"Таким образом, реализация предложенных направлений позволит сформировать новый подход к обеспечению экономической безопасности лесопромышленного производства УИС.",n:"Таким образом, всё это нужно улучшать.",w:"Его итог: «Таким образом, … позволит (позволят) сформировать…»."},
 {b:"Надо бы создать систему поддержки.",g:"Следует сформировать систему мониторинга экономической безопасности, учитывающую специфику производственной деятельности казенных учреждений.",n:"Нужно создать систему мониторинга.",w:"«Следует сформировать…, учитывающую специфику…» — его рекомендательная модель (2024)."},
 {b:"Лучше выбрать главные отрасли.",g:"Целесообразно осуществить выбор основных направлений, в которых производственный сектор УИС может занять устойчивые позиции на региональных рынках (например, производство пиломатериалов и изделий из древесины).",n:"Целесообразно выбрать главные отрасли.",w:"Дословная модель (2024): «Целесообразно осуществить выбор основных направлений, в которых… (например, …)»."},
 {b:"Первое — ГЧП. Второе — кадры.",g:"Во-первых, необходима организация государственно-частного партнерства при развитии лесопромышленного производства УИС. … Во-вторых, …",n:"Первое: ГЧП. Второе: кадры.",w:"Перечень направлений «Во-первых… Во-вторых…», каждое — полным предложением с обоснованием."},
 {b:"Работу надо продолжать.",g:"В связи с этим следует продолжить работу по восполнению пробелов в нормативном регулировании производственной деятельности учреждений УИС.",n:"В связи с этим работу нужно продолжать.",w:"Его концовка 2021 г.: «В связи с этим следует продолжить работу по восполнению пробелов…»."},
 {b:"Также надо учить людей.",g:"Дальнейшую работу следует проводить также в сфере подготовки кадров для лесопромышленных подразделений учреждений УИС.",n:"Также следует учить персонал.",w:"«Дальнейшую работу следует проводить также в сфере…» (2024)."},
 {b:"Всё зависит от производства.",g:"Дальнейшее развитие производственного сектора УИС и повышение эффективности его функционирования в значительной мере связано с модернизацией лесопромышленных подразделений.",n:"Всё развитие зависит от производства.",w:"Формула 2021 г.: «Дальнейшее развитие… в значительной мере связано с…»."},
 {b:"Меры помогут бизнесу и государству.",g:"Эти меры, взятые в совокупности, могут создать условия, при которых повысится устойчивость производственного сектора УИС. Однако их успешная реализация требует согласованного участия ФСИН России, органов власти субъектов и бизнес-сообщества.",n:"Эти меры обязательно помогут всем.",w:"Его итоговая пара предложений (2024): «Эти меры, взятые в совокупности, могут…» + оговорка о согласованном участии."},
 {b:"Американский опыт — плохой.",g:"Вышеуказанный зарубежный подход считаем неприемлемым для отечественной практики, поскольку прибыль производства ставится в нем выше цели исправления осужденных.",n:"Американский опыт ужасный и недопустимый.",w:"Жёсткую оценку он даёт через «считаем» + обоснование (2019), без эмоциональных эпитетов."},
 {b:"В заключение: спасибо за внимание.",g:"В заключение: обобщающий абзац «Таким образом…» и направление дальнейших исследований.",n:"В заключение: краткий пересказ всей статьи.",w:"Выводы у Родионова — программа действий, а не пересказ."}
 ]
},

 theory:`
<p>В совместных работах стиль Родионова смещается к регистру соавтора. Это полезно знать: статью в юридический журнал вы будете писать иначе, чем в экономический.</p>

<tr><td>Экономическая безопасность (с Крутем)</td><td>Рубрики статьи, «нами», механизм, принципы, угрозы</td><td>«X определяется нами как системное взаимодействие…»; «Разработанный механизм предполагает…»; «Анализ последних исследований и публикаций по теме»</td></tr>
</table>`,

 {b:"Думаю, запрета в законе нет.",g:"Представляется, что при отсутствии в уголовно-исполнительном законодательстве прямого запрета привлечение осужденных к труду на указанных объектах допустимо.",n:"На наш взгляд, запрета в законе нет, значит, можно.",w:"В правовом регистре — «Представляется, что…» и точная формулировка вывода."},
 {b:"Покажем на графике, как скачут цены.",g:"В качестве наглядной иллюстрации таких процессов следует привести динамику цен на пиловочник на биржевых площадках в 2021–2023 гг. (рис. 1).",n:"Для примера посмотрим на график цен.",w:"Регистр с Седых: «В качестве наглядной иллюстрации таких процессов следует привести…»."},
 {b:"Мы хотим доказать, что долгие договоры лучше.",g:"В статье доказывается целесообразность перехода к долгосрочным договорам поставки продукции лесопромышленных подразделений УИС.",n:"В статье мы доказываем, что долгосрочные договоры лучше.",w:"Регистр с Седых (2023): «В статье доказывается целесообразность перехода…»."},

 цен, мошенничества, монополизации и использования связывающих контрактов."},{"t":"Арбитраж","en":"arbitrage","d":"деятельность по продаже какого-то актива и покупка идентичного или почти идентичного актива, чтобы выиграть на временной разнице цен или норм доходности; практика, выравнивающая цены или нормы дохода на аналогичные финансовые инструменты и тем самым устраняющая дополнительные возможности для получения безрискового финан сового выигрыша."},{"t":"Асимметричная информация","en":"asymmetric information","d":"ситуация на рынке, когда продавец (покупатель) обладает значительно большей информацией о продукте или услуге, чем покупатель (продавец), в результате чего происходит неэффективное перераспределение ресурсов."},{"t":"Аукционы по предоставлению кредитов депозитным организациям с резервируемой ставкой","en":"term auction facility","d":"прием из области кредитно-денежной политики, применяемый Федеральной резервной системой, при котором коммерческие банки анонимно подают заявки на получение кредитов, предоставляемых ФРС; способ увеличения резервов в банковской системе."},{"t":"Базовая процентная ставка","en":"prime interest rate","d":"эталонная процентная ставка, от которой отталкиваются ы банки при выдаче самых разных кредитов юридическим и физическим лицам."},{"t":"Базовый год","en":"base year","d":"год, принимаемый при построении индекса цен за основу для сравнения с ценами, действовавшими в другие годы."},{"t":"Баланс счета движения капиталов","en":"balance on capital account","d":"приток капитала в страну за вычетом вывоза капитала из нее."},{"t":"Баланс счета текущих операций","en":"balance on current account","d":"экспорт товаров и услуг страны за вычетом импорта товаров и услуг плюс чистый инвестиционный доход и плюс сальдо трансфертных платежей за год."},{"t":"Баланс товаров и услуг","en":"balance on goods and services","d":"экспорт товаров и услуг страны за вычетом импорта товаров и услуг за год."},{"t":"Балансовый отчет","en":"balance sheet","d":"сводный отчет об активах, пассивах и чистой стоимости собственного к а питала фирмы или индивида на определенную дату."},{"t":"Банк банков","en":"bankers’ bank","d":"банк, принимающий вклады депозитных институтов США и предоставляющий им ссуды; федеральные резервные банки."},{"t":"Банк штата","en":"state bank","d":"коммерческий банк, получивший разрешение правительства штата на ведение банковских операций."},{"t":"Банкноты Федеральной резервной системы","en":"Federal Reserve Notes","d":"бумажные деньги, выпускаемые федеральными резервными банками."},{"t":"Банковские депозиты","en":"bank deposits","d":"банковские депозиты частных лиц и компаний, которые хранятся в банках (или сберегательных учреждениях) или которые сами банки хранят в федеральных резервных банках."},{"t":"Банковские резервы","en":"bank reserves","d":"депозиты банков и сберегательных учреждений, которые хранятся в федеральных резервных банках, плюс кассовые средства (банковская наличность) банков и сберегательных учреждений."},{"t":"Банкрот","en":"bankrupt","d":"правовая ситуация, при которой отдельный человек или фирма оказывается в ситуации, когда он или она не может своевременно заплатить занятые в прошлом деньги. В этих случаях судья, рассматривающий дело о банкротстве, может предписать этому человеку или фирме ликвидировать (перевести в денеж ные наличные средства) свои активы, чтобы заплатить кредиторам, по крайней мере часть той суммы, которую он/она им должен/должна."},{"t":"Бартер, бартерная торговля","en":"barter","d":"натуральный обмен одного товара или услуги на другой товар или услугу."},{"t":"Барьер для вхождения в отрасль","en":"barrier to entry","d":"любые действия, которые искусственно препятствуют проникновению в отрасль новых фирм."},{"t":"Бегство капитала (материал интернет","en":"","d":"главы) (capital flight) — перевод сбережений из развивающихся стран 965 в промышленно развитые государства, чтобы избежать их экспроприации властями, вывести из-под налогообложения, противодействовать более высоким темпам инфляции или просто получить более высокую доходность при финансовых инвестициях."},{"t":"Бедность","en":"poverty","d":"состояние, при котором основные потребности индивида или семьи превышают имеющиеся средства для их удовлетворения."},{"t":"Безграничные потребности","en":"unlimited wants","d":"неутолимое желание потребителей иметь товары и услуги, которые удовлетворяют их потребности или доставляют по лезность."},{"t":"Безналичные трансфертные платежи","en":"noncash transfe r","d":"трансфертные платежи органов власти в виде товаров и услуг, а не в денежной форме, например по мощь в ведении домашнего хозяйства, получение спе циальности; также называются трансфертами в натуральной форме."},{"t":"Безработица","en":"unemployment","d":"неспособность экономи ки использовать все имеющиеся экономические ресурсы для производства товаров и услуг; неспособность полностью использовать рабочую силу."},{"t":"Безрисковая процентная ставка (risk","en":"","d":"free interest rate) — процентная ставка, получаемая по краткосрочным облигациям правительства США."},{"t":"Бета","en":"beta","d":"относительный показатель недиверсифицируемого риска, измеряющий, как недиверсифицируемый риск конкретного актива или портфеля сопоставим с рыночным портфелем (портфелем, который содержит каждый актив доступный на финансовых рынках)."},{"t":"Бизнес-цикл","en":"","d":"см. Экономический (деловой) цикл."},{"t":"Богатство","en":"wealth","d":"все, что имеет ценность, так как производит доход или может произвести доход. Богатство —это запас, доход —это поток; активы минус обязательства —это чистое богатство."},{"t":"Британская тепловая единица","en":"British Thermal Unit, BTU","d":"количество энергии, которое требуется для повышения температуры 1 фунта воды на 1 градус Фаренгейта."},{"t":"Будущая стоимость","en":"future value","d":"сумма, до которой возрастет текущее количество денег, если процент, на числяемый на первоначальную сумму, со временем бу дет дисконтироваться (см. Сложный процент.)"},{"t":"Бумажные деньги","en":"paper money","d":"отдельные листы особой бумаги, используемые в качестве средства обращения', в США в этом качестве используются банкноты Федеральной резервной системы."},{"t":"Бюджет при полной занятости (full","en":"","d":"employment budget) — соотношение государственных расходов и налоговых поступлений, которые сложилось бы, если бы экономика в течение года функционировала в условиях полной занятости."},{"t":"Бюджетная прямая","en":"budget line","d":"линия, показывающая различные комбинации количеств двух товаров, которые потребитель может купить при данном уровне своего денежного дохода и текущих ценах товаров."},{"t":"Бюджетный дефицит","en":"budget deficit","d":"сумма превышения расходов федерального правительства над его доходами в каждый данный год."},{"t":"Бюджетный избыток","en":"budget surplus","d":"превышение доходов федерального правительства над его расходами."},{"t":"Бюро экономического анализа","en":"Bureau of Economic Analysis, ВЕЛ","d":"агентство министерства торговли США, составляющее отчеты о цифрах национального дохода и продукции."},{"t":"В В П","en":"","d":"см. Валовой внутренний продукт."},{"t":"Валовое предложение","en":"total supply","d":"таблица или кривая предложения товаров или услуг всеми продавцами; также называется рыночным предложением."},{"t":"Валовой внутренний продукт","en":"gross domestic product, GDP","d":"общая рыночная стоимость всех произведенных за год готовых товаров и услуг в США, независимо от источника получения ресурсов, иностранных или внутренних."},{"t":"Валовой внутренний продукт на душу населения","en":"per capita GDP","d":"валовой внутренний продукт (ВВП), приходящийся на каждого гражданина страны; средний размер ВВП, деленный на численность населения."},{"t":"Валовой спрос","en":"total demand","d":"таблица или график спроса, которые могут предъявить все покупатели товаров и услуг; также называется рыночным спросом."},{"t":"Валовые расходы, совокупные расходы","en":"total spending","d":"суммарный объем расходов, которые несут или готовы понести покупатели товаров и услуг; также называются совокупными расходами."},{"t":"Валовые частные внутренние инвестиции","en":"gross private domestic investment","d":"затраты на производство новых средств производства: машин, оборудования, инструментов и зданий, а также на пополнение товарно-материальных запасов."},{"t":"Валюта","en":"currency","d":"бумажные и металлические деньги."},{"t":"Валютная интервенция","en":"currency intervention","d":"покупка и продажа правительством собственной или иностранной валюты для изменения международных обменных курсов."},{"t":"Валютный контроль","en":"foreign exchange control, exchange control","d":"контроль, который может установить правительство над спросом граждан и фирм данной страны на иностранную валюту и над валютными курсами с целью ограничить превышение внешних платежей над поступлениями (устранить дефицит платежного баланса)."},{"t":"Валютный курс","en":"foreign exchange rate","d":"см. Курс обмена валюты."},{"t":"Величина предложения","en":"quantify supplied","d":"количество конкретного товара или услуги, которое продавец (или продавцы) предлагает к продаже по конкретной цене в течение определенного периода."},{"t":"Величина спроса","en":"quantity demanded","d":"количество конкретного товара или услуги, которое покупатель (или покупатели) желает купить по определенной цене в течение определенного периода."},{"t":"Венчурный капитал","en":"venture capital","d":"часть сбережений домохозяйств, используемая для финансирования проектов бизнеса с высоким риском в обмен на долю прибыли, если этот проект окажется успешным."},{"t":"Вертикальная интеграция","en":"vertical integration","d":"группа предприятий, осуществляющих разные стадии производства готового продукта и являющихся собственностью одной фирмы."},{"t":"Вертикальная ось","en":"vertical axis","d":"координата графика или решетки, идущая сверху вниз, на которой откладывается значение одного из параметров."},{"t":"Вертикальное слияние","en":"vertical merger","d":"слияние двух или более фирм, осуществляющих разные стадии производства конечного продукта, в единую структуру."},{"t":"Взаимная поддержка","en":"logrolling","d":"торговля законодателей своими голосами, объединение усилий, чтобы добиться благоприятного для себя решения вопросов об обеспечении общественными товарами и услугами и квазиобщественными товарами."},{"t":"Взаимные","en":"инвестиционные) фонды денежного рынка (money market mutualfunds, MMMF","d":"счета, приносящие процентный доход, который предлагают инвестиционные компании, собирающие средства вкладчиков для приобретения краткосрочных инструментов денежного рынка; вкладчики могут выписывать чеки на суммы не меньше установленной величины."},{"t":"Взаимные фонды","en":"mutualfunds","d":"портфели акций и облигаций, выбираемых и покупаемых компаниями, создавшими взаимные фонды, которые финансируют приобретение этих ценных бумаг, объединяя для этого деньги тысяч отдельных инвесторов в фонд; включают как индексные фонды, так и активно управляемые фонды. Результаты деятельности фонда (прибыль или убытки) передаются отдельным инвесторам, вложившим свои средства в данный фонд."},{"t":"Взаимодополняющие товары","en":"complementary goods","d":"такие товары (или услуги), которые потребляются вместе и для которых существует обратное соотношение: когда цена на один из них падает, спрос на другой растет (и наоборот)."},{"t":"Взаимозависимость","en":"mutual interdependence","d":"ситуация, при которой изменение ценовой стратегии (или какого-либо другого параметра) одной фирмой сказывается на объеме продаж и прибыли другой фирмы (или других фирм); причем любая фирма, производящая такое изменение, может ожидать на нее реакцию со стороны другой фирмы или других фирм. «Вливание» (injection) - дополнительные средства, вли ваемые в поток «доходов — расходов»; инвестиции, за купки товаров и услуг органами власти, чистый экспорт."},{"t":"Внезапные колебания уровня цен","en":"price level surprises","d":"неожиданные изменения уровня цен."},{"t":"Внепроизводственные операции","en":"nonproduction transactions","d":"закупки и продажи любого товара (услуги), не являющегося продуктом текущего производства или услуги."},{"t":"Внерыночные операции","en":"nonmarket transactions","d":"производство товаров и услуг, не включаемых в ВВП, поскольку они не покупаются и не продаются."},{"t":"Внешнеторговый дефицит","en":"trade deficit","d":"превышение товарного (или товаров и услуг) импорта страны над ее товарным (или товаров и услуг) экспортом."},{"t":"Внешние платежи","en":"outpayments","d":"расходование валюты (собственной или иностранной) отдельными лицами, фирмами и правительством одной страны на покупку товаров и услуг в других странах; денежные переводы за границу; помещение инвестиционного дохода в других странах и вывоз капитала."},{"t":"Внешние платежные поступления","en":"inpayments","d":"поступления собственной или иностранной валюты отдельным лицам, фирмам и правительству одной страны из других стран в качестве платы за проданные ими за рубежом товары и услуги, или доходы от инвестиций, различного рода денежных переводов и приток капитала из-за гра ницы."},{"t":"Внешний государственный долг","en":"external public debt","d":"часть общего государственного долга, правами на получение которого владеют граждане, компании и институты из других стран."},{"t":"Внешний долг","en":"external debt","d":"частный или государственный долг иностранным гражданам, фирмам и учреждениям."},{"t":"Внутренний государственный долг","en":"internally held public debt","d":"задолженность государства гражданам, фирмам и учреждениям данной страны, т.е. держателям ценных бумаг правительства данной страны."},{"t":"Внутренняя цена","en":"domestic price","d":"цены на товары или услуги, сложившиеся внутри страны; определяются соотношением спроса и предложения."},{"t":"Вознаграждение труда работников и служащих","en":"compensation to employees","d":"выплачиваемые наемным работни Глоссарий 967 кам заработная плата и жалованье плюс дополнительные выплаты работодателями работникам."},{"t":"Возобновляемые природные ресурсы","en":"renewable natural resources","d":"такие составляющие окружающей среды, как леса, вода в водоемах, флора и фауна, способные снова вырастать или создаваться (восстанавливать себя), если их добывают в умеренных количествах."},{"t":"Возрастающая отдача","en":"increasing returns","d":"увеличение объема продукции фирмы на большую процентную долю, чем процентное повышение исходных ресурсов."},{"t":"Возрастающая предельная отдача","en":"increasing marginal returns","d":"увеличение предельного продукта за счет одного из применяемых ресурсов по мере последовательного введения в производство дополнительных единиц этого ресурса."},{"t":"Война цен","en":"price war","d":"повторяющееся и долговременное снижение цен на продукцию фирм олигополистической отрасли, посредством которого каждая фирма устанавливает цены ниже уровня конкурентов, рассчитывая увеличить объемы своих продаж и доходов за их счет. «Воля к развитию» (will to develop) (материал интернетглавы) — сильное стремление обеспечить экономический рост, которое побуждает заменять старые способы ведения хозяйства новыми."},{"t":"Временная помощь нуждающимся семьям","en":"Temporary Assistance to Needy Families, TANF","d":"программа, финансируемая в основном региональными (штатами) и частично федеральными органами власти в Соединенных Штатах, предусматривающая предоставление финансовой помощи семьям с низкими доходами; ограничивает время получения этого пособия и определяет требования по поиску работы."},{"t":"Временное предпочтение","en":"time preference","d":"склонность людей из-за нетерпения истратить и потребить что-то в настоящем вместо того, чтобы сберечь это в надежде израсходовать и потребить в будущем; по силе это желание у разных людей разное."},{"t":"Всемирная торговая организация","en":"World Trade Organization, WTO","d":"организация, насчитывающая 153 государства-члена (по состоянию на 2008 г.), которая отслеживает выполнение заключенных торговых соглашений, разрешает возникающие по поводу этих соглашений споры и проводит форумы по различным аспектам мировой торговли."},{"t":"Всемирный банк","en":"World bank","d":"банк, который предоставляет (и гарантирует) займы развивающимся странам для увеличения их капитальных активов и обеспечения экономического роста."},{"t":"Встроенный стабилизатор (built","en":"","d":"in stabilizer) —механизм, способствующий увеличению дефицита государственного бюджета (или сокращению его чистых налоговых поступлений) в период рецессии и росту его чистых налоговых поступлений (или сокращению его дефицита) в период инфляции без того, чтобы в это вмешивались регулирующие (экономическую) политику механизмы; одним из таких механизмов является налоговая система."},{"t":"ВТО","en":"","d":"см. Всемирная торговая организация."},{"t":"Выгода перелива","en":"spillover benefit","d":"выгода, получаемая безвозмездно не людьми, участвующими в производстве и потреблении продукта, а третьей стороной (обществом в целом). Например, пчеловод получает выгоду такого рода оттого, что фермер, живущий по соседству, засевает свои поля клевером."},{"t":"Выгоды от торговли","en":"gainsfrom trade","d":"дополнительный выпуск продукции, который получают торгующие стороны от специализации производства и обмена своих товаров и услуг."},{"t":"Выплата государственного долга","en":"retiring the public debt","d":"сокращение размера государственного долга путем выплаты денег владельцам государственных ценных бумаг при наступлении срока их погашения."},{"t":"Выплаты для выравнивания циклических колебаний","en":"countercyclical payments","d":"денежные субсидии, выплачиваемые фермерам, когда рыночная цена на отдельные виды зерновых падает ниже целевых показателей. Размер платежей определяется на основе предыдущих объемов производства; эти деньги фермеры получают независимо от размеров текущего урожая."},{"t":"Выравнивающие различия в оплате труда","en":"compensating differences","d":"различия в размерах заработной платы, которые устанавливаются работникам разных профессий для компенсации неденежных различий в условиях труда."},{"t":"Вычет","en":"deductible","d":"сумма покрытия, которую вносит застрахованное лицо (например, расходы на медицинское обслуживание) до того, как ее начнет выплачивать страховая компания."},{"t":"Г А Т Т","en":"","d":"см. Генеральное соглашение о тарифах и торговле."},{"t":"Генеральное соглашение о тарифах и торговле","en":"General Agreement on Tariff's and Trade, GATT","d":"заключенное в 1947 г. соглашение между 23 государствами, в соответствии с которым каждое из них предоставило другим равный и недискриминационный режим торговли, сократило на основе многосторонних договоренностей тарифы и со временем устранило импортные квоты. Сегодня это соглашение подписало большинство стран мира; теперь называется Всемирной торговой организацией (ВТО)."},{"t":"Гибкие цены","en":"flexible prices","d":"цены продуктов, которые могут свободно повышаться и понижаться при изменении спроса и предложения продукта."},{"t":"Гибкий валютный курс","en":"flexible exchange rate","d":"курс обмена валюты, который определяется спросом и предложе нием иностранных денег на мировом рынке и который может свободно повышаться или понижаться (плавать)."},{"t":"Гиперинфляция","en":"hyperinflation","d":"очень быстрый рост уровня цен."},{"t":"Гипотеза","en":"hypothesis","d":"возможное объяснение причинно-следственной связи, требующее экспериментальной проверки."},{"t":"Гипотеза естественного уровня безработицы","en":"natural rate hypothesis","d":"гипотеза долговременной стабильности экономики при естественном уровне безработицы, уровень безработицы в условиях отсутствия циклической безработицы, когда в экономике производится объем продукции, равный потенциальному; уровень безработицы, при котором фактическая инфляция равна ожидаемой."},{"t":"Гипотеза противодействия администрации (managerial","en":"","d":"opposition hypothesis) — объяснение относительного упадка профсоюзного движения в США возросшим и более агрессивным сопротивлением, оказываемым ему администрацией компаний."},{"t":"Гипотеза структурных изменений (structural","en":"","d":"change hypothesis) — гипотеза, объясняющая относительный спад профсоюзного движения в США структурными изменениями в экономике и в составе рабочей силы."},{"t":"Голосование долларом","en":"dollar votes","d":"«голоса» (в виде расходов), которые фактически отдают потребители и предприниматели за производство различных видов потребительских товаров и товаров производственного назначения, когда они покупают их на рынках соответствующих товаров и ресурсов."},{"t":"Гомогенная олигополия","en":"homogeneous oligopoly","d":"олигополия, в которой фирмы производят стандартизированные товары."},{"t":"Горизонтальное слияние","en":"horizontal merger","d":"слияние в одну структуру двух фирм, производящих и продающих в одном географическом регионе одинаковую продукцию."},{"t":"Государственные закупки","en":"government purchases","d":"денежные платежи органов власти, за которые государство получает товары или услуги текущего производства; расходы всех государств на конечные товары и услуги."},{"t":"Государственный долг","en":"public debt","d":"общий размер задолженности федерального правительства владельцам государственных ценных бумаг, равный сумме прошлых бюджетных дефицитов минус бюджетные доходы (профициты)."},{"t":"Государственный сектор","en":"public sector","d":"часть экономики страны, полностью контролируемая органами власти."},{"t":"Граница потребительского бюджета","en":"budget constraint","d":"предел, который ограничивает способность потребителя приобретать товары и услуги размером его дохода (а также уровнем цен на товары и услуги)."},{"t":"График инвестиций","en":"investment schedule","d":"кривая или график, показывающие объем планируемых фирмами инвестиций при различных уровнях реального ВВП."},{"t":"График потребления","en":"consumption schedule","d":"график, показывающий динамику расходов домохозяйств на потребительские товары при разных уровнях располагаемого дохода (дохода после уплаты налогов)."},{"t":"График сбережений","en":"saving schedule","d":"график, показывающий объем планируемых домохозяйствами сбережений (т.е. средств, не предназначенных для расходов на покупку потребительских товаров) при разных уровнях располагаемого дохода (дохода после уплаты налогов)."},{"t":"График совокупных расходов","en":"aggregate expenditures schedule","d":"график или кривая, показывающие общий объем расходов на производство конечных товаров и услуг при разных уровнях ВВП."},{"t":"График спроса","en":"demand schedule","d":"См. Спрос."},{"t":"Движение за единый налог (single","en":"","d":"tax movement) — политические усилия последователей Генри Джорджа (1839— 1897), призывавшего установить единый налог на стоимость земли и исключить все другие налоги."},{"t":"Движение за справедливую торговлю","en":"fair trade movement","d":"усилия групп людей в странах с высоким доходом, направленные на то, чтобы работники, занимающиеся выращиванием сельскохозяйственных культур в странах с низким доходом, получали достаточно высокую заработную плату и при производстве своих товаров работали в соответствии со стандартами труда; при таком подходе товары этих производителей будут продвигаться потребителям в государствах с высоким доходом под маркой «справедливой торговли»; усилия этих групп направлены на то, чтобы убедить потребителей покупать именно такие товары, а не субституты."},{"t":"Двойное налогообложение","en":"double taxation","d":"обложение налогом как чистого дохода (прибыли) корпораций, так и выплачиваемых из него дивидендов, когда они превра щаются в личный доход домохозяйств."},{"t":"Двусторонняя монополия","en":"bilateral monopoly","d":"рынок, на котором единственному продавцу (монополии) противостоит единственный покупатель (монопсония)."},{"t":"Дебет","en":"debit","d":"запись на бухгалтерском счете, свидетельствующая о том, что стоимость актива (например, иностранной валюты, являющейся собственностью гражданина данной страны) снизилась."},{"t":"Девальвация","en":"devaluation","d":"уменьшение законодательно установленной стоимости валюты."},{"t":"Дезинфляция","en":"disinflation","d":"снижение темпов роста инфляции. 969"},{"t":"Действительная","en":"внутренняя) стоимость (intrinsic value","d":"рыночная стоимость металла в монете."},{"t":"Дело Alcoa","en":"Alcoa case","d":"рассмотренное в 1945 г. в федеральных судах дело фирмы Alcoa, по которому суды постановили, что обладание монопольной властью, независимо от того, насколько рационально эта власть используется, является нарушением антитрестовских законов; суды тем самым отвергли правило разумного подхода, примененное в деле U.S. Steel."},{"t":"Дело Microsoft","en":"Microsoft case","d":"антитрестовский иск от 2002 г., в ходе которого Microsoft была признана виновной в нарушении положений закона Шермана, так как прибегла к ряду незаконных действий, предназначенных для сохранения ее монополии в области информационных систем для персональных компьютеров; в качестве наказания компании было запрещено использовать в своей практике ряд конкретных действий."},{"t":"Дело Standard Oil","en":"Standard Oil case","d":"антитрестовское дело, закончившееся в 1911 г., в котором компания Standard Oil была признана виновной в нарушении закона Шермана, так как незаконно монополизировала нефтяную отрасль. В качестве наказания компания была разделена на несколько конкурирующих друг с другом фирм."},{"t":"Дело U.S. Steel","en":"U.S. Steel case","d":"возбужденное федеральным правительством против корпорации U.S. Steel антитрестовское дело, по которому суд в 1920 г. постановил, что закону противоречат лишь необоснованные ограничения торговли, а размеры фирмы и обладание монопольной властью само по себе не являются нарушением антитрестовских законов."},{"t":"Деловая фирма","en":"business firm","d":"см. Фирма."},{"t":"Демографы","en":"demographers","d":"ученые, изучающие популяции людей и их характеристики."},{"t":"Демпинг","en":"dumping","d":"продажа товаров ниже их себестоимости в другой стране или ниже внутренних цен, установившихся в этой стране."},{"t":"Денежный доход","en":"money income","d":"см. Номинальный доход."},{"t":"Денежный капитал","en":"money capital","d":"имеющиеся в рас поряжении деньги для закупки инвестиционных товаров (капитала)."},{"t":"Денежный мультипликатор","en":"monetary multiplier","d":"увеличение избыточных резервов, на которые банковская система может увеличивать объем чековых депозитов и тем самым расширять предложение денег через предоставление новых займов (или покупку ценных бумаг); численно равен единице, деленной на размер резервных требований."},{"t":"Денежный рынок","en":"money market","d":"рынок, на котором процентную ставку (или уровень процентных ставок) в данной стране определяют спрос на деньги и предложение денег."},{"t":"Деньги","en":"money","d":"любой предмет, который продавцы обычно принимают в обмен на свои товары и услуги."},{"t":"Депозитные учреждения","en":"depository institutions","d":"фирмы, принимающие денежные вклады (деньги) от предприятий и отдельных лиц: коммерческие банки, ссудосберегательные ассоциации, взаимно-сберегательные банки и кредитные союзы."},{"t":"Депозитный счет денежного рынка","en":"money market deposit account, MMDA","d":"счет в банке или сберегательном учреждении, на который начислены проценты и собираются средства вкладчиков для приобретения различных краткосрочных инструментов денежного рынка."},{"t":"Детерминанта валютного курса","en":"exchange rate determinant","d":"любой фактор, помимо курса обмена валют, определяющий спрос и предложение на рынке иностранной валюты."},{"t":"Детерминанты предложения","en":"determinants of supply","d":"факторы, помимо цены, влияющие на предложение товаров или услуг."},{"t":"Детерминанты совокупного предложения","en":"determinants of aggregate supply","d":"такие факторы, как цены производственных ресурсов, производительность и законодательно-правовая среда, способные повлиять на расположение кривой совокупного предложения, если их параметры изменятся."},{"t":"Детерминанты совокупного спроса","en":"determinants of aggregate demand","d":"такие факторы, как потребление, инвестиции, расходы органов власти и чистый экспорт, способные повлиять на расположение кривой совокупного спроса, если их параметры изменятся."},{"t":"Детерминанты спроса","en":"determinants of demand","d":"факторы, помимо цены, влияющие на спрос на товары или услуги."},{"t":"Дефицит международного платежного баланса","en":"international balance of payments deficit","d":"см. Дефицит платежного баланса."},{"t":"Дефицит платежного баланса","en":"balance of payments deficit","d":"пассивное сальдо (отрицательная сумма) баланса счета текущих операций и баланса счета движения капитала за год."},{"t":"Дефицит счета движения капиталов","en":"capital account defi cit","d":"негативное сальдо по балансу счета движения ка питалов."},{"t":"Дефицит счета движения капиталов и финансов","en":"capital and financial account deficit","d":"отрицательная сумма на счете движения капиталов и финансов в международном платежном балансе страны."},{"t":"Дефицит, нехватка","en":"shortage","d":"сумма, на которую объем спроса на продукт превышает объем предложения этого продукта при определенной (ниже равновесной) цене."},{"t":"Дефлирование","en":"deflating","d":"расчет реального валового внутреннего продукта путем уменьшения стоимости ВВП, произведенного в году, когда уровень цен был выше, чем в базовом году."},{"t":"Дефляция","en":"deflation","d":"снижение общего (среднего) уровня цен в экономике страны."},{"t":"Дефолт","en":"default","d":"ситуация, при которой заемщики перестают выплачивать деньги за полученный кредит или после завершения срока действия займа не возвращают первоначальную сумму, которую они получили."},{"t":"Диверсификация","en":"diversification","d":"стратегия инвестиро вания в большое число инвестиций, чтобы сократить общий риск всего инвестиционного портфеля."},{"t":"Диверсифицируемый риск","en":"diversifiable risk","d":"инвестиционный риск, который инвесторы могут снизить, воспользовавшись диверсификацией', также называется идиосинкратическим риском."},{"t":"Дивиденды","en":"dividends","d":"выплаты корпорацией всей или части прибыли владельцам акций (или корпорации)."},{"t":"Дилемма регулирования","en":"dilemma of regulation","d":"проблема, с которой сталкивается регулирующее ведомство, устанавливая монополисту допустимую законом максимальную цену. С одной стороны, если общественно оптимальная цена окажется ниже средних совокупных затрат (то это либо приведет фирму к банкротству, либо потребует ее субсидирования); с другой стороны, цена, обеспечивающая фирме справедливую норму прибыли, не позволяет в полной мере добиваться эффективного распределения ресурсов."},{"t":"Динамичность дохода","en":"income mobility","d":"степень и масштабы, при которых получатели доходов переходят из одной части таблицы распределения доходов в другую через определенное время."},{"t":"Дискреционная фискальная политика","en":"discretionary fiscal policy","d":"осуществляемое Конгрессом США преднамеренное изменение налогов (налоговых ставок) и объема правительственных расходов с целью обеспечения полной занятости, стабильности цен и экономического роста."},{"t":"Дискриминация","en":"discrimination","d":"практика более жесткого обращения с отдельными людьми и группами при найме на работу, ограниченного предоставления доступа к конкретным рабочим местам, обучении и повышении квалификации, продвижении по службе, установлении уровня оплаты или условий труда, несмотря на то, что они имеют равную квалификацию, уровень об разования, трудовые навыки и опыт, как и остальные работники."},{"t":"Дискриминация в выборе профессии","en":"occupational discrimination","d":"произвольные ограничения, преграждающие конкретным группам работников доступ к более желательным для них и более высокооплачиваемым ра
