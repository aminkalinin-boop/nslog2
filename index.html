<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E5E52"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script>window.NSLOG_OFFLINE=true</script></head><body><title>Научный слог 5.2.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
 --bg:#EEF1EF;--surface:#FFFFFF;--surface2:#E4E9E6;--ink:#16211F;--muted:#56645E;--line:#CAD4CF;
 --accent:#0E5E52;--accent-ink:#FFFFFF;--accent-soft:#D6E9E4;--gold:#8E6210;--gold-soft:#F3E7CD;
 --bad:#A8322A;--bad-soft:#F7E3E0;--good:#1F6B3C;--good-soft:#DEEFE4;
 --f-display:"Literata",Georgia,"Times New Roman",serif;--f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
 --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 color-scheme:dark;--bg:#0F1513;--surface:#161E1B;--surface2:#1F2925;--ink:#E3EAE7;--muted:#94A39D;--line:#2D3934;
 --accent:#5CC2AC;--accent-ink:#0B1412;--accent-soft:#173430;--gold:#D9A941;--gold-soft:#33291A;
 --bad:#EB7B70;--bad-soft:#3A201D;--good:#72CE92;--good-soft:#173021;}}
:root[data-theme="dark"]{
 color-scheme:dark;--bg:#0F1513;--surface:#161E1B;--surface2:#1F2925;--ink:#E3EAE7;--muted:#94A39D;--line:#2D3934;
 --accent:#5CC2AC;--accent-ink:#0B1412;--accent-soft:#173430;--gold:#D9A941;--gold-soft:#33291A;
 --bad:#EB7B70;--bad-soft:#3A201D;--good:#72CE92;--good-soft:#173021;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.6 var(--f-body);margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,40px)} h2{font-size:26px} h3{font-size:19px}
h4{font:600 13px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.mono{font-family:var(--f-mono)} .num{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font:700 21px/1.1 var(--f-display)}
.brand span{font:500 11px var(--f-mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);padding:8px 10px;border-radius:8px;font-weight:500}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav small{font:500 11px var(--f-mono);color:var(--muted)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
main{padding-inline:clamp(16px,4vw,48px);padding-block:28px 80px;min-width:0}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@media (max-width:900px){
 .shell{grid-template-columns:1fr}
 .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:column;gap:10px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
 .nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
 .nav a{white-space:nowrap;padding:6px 10px;font-size:14px}
 .nav small,.side .foot{display:none}
 .brand{flex-direction:row;align-items:baseline;gap:10px;padding:0}
}

/* common */
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:17px;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-mono);padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--gold-soft);color:var(--gold)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--gold);padding:6px 12px;background:var(--gold-soft);border-radius:0 6px 6px 0}
.prose p{margin:0 0 12px;max-width:68ch}
.prose ol{margin:0 0 12px;padding-left:22px;max-width:68ch}
.prose ul{margin:0 0 12px;padding-left:20px;max-width:68ch}
.prose li{margin-bottom:6px}
.tbl{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0 14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tblwrap{overflow-x:auto}

/* red pen motif */
.bad{color:var(--ink);text-decoration:underline wavy var(--bad);text-decoration-thickness:1.5px;text-underline-offset:4px}
.good{color:var(--accent);font-weight:500}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.5fr);gap:12px;align-items:start;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:8px 0}
.pair .arrow{font-family:var(--f-mono);color:var(--muted)}
@media (max-width:560px){.pair{grid-template-columns:1fr}.pair .arrow{display:none}}

/* hero */
.hero{display:grid;gap:14px}
.demo{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.demo .l{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.demo .bad,.demo .good{font:500 clamp(17px,2.4vw,21px)/1.4 var(--f-display)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font:600 24px var(--f-display)}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* lesson grid */
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.lgrid{grid-template-columns:1fr}}
.ltile{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ltile:hover{border-color:var(--accent)}
.ltile .n{font:600 22px var(--f-display);color:var(--accent);text-align:center}
.ltile b{display:block;font-weight:600}
.ltile .s{font-size:13px;color:var(--muted);margin:2px 0 8px}
.final{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:16px 18px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* case card */
.case{display:grid;gap:14px}
.case .side-l{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.case .nov{background:var(--bad-soft);border-radius:8px;padding:14px 16px}
.case .nov .side-l{color:var(--bad)}
.case .pro{background:var(--good-soft);border-radius:8px;padding:14px 16px}
.case .pro .side-l{color:var(--good)}
.case .txt{font:500 18px/1.45 var(--f-display);margin-top:4px}
.why{font-size:14px;color:var(--ink)}
.term{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px;background:var(--surface)}
.term b{color:var(--accent)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 12px var(--f-mono)}
.dots button.seen{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.dots button.cur{border-color:var(--accent);outline:1px solid var(--accent)}

/* quiz */
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.q{font:500 19px/1.4 var(--f-display)}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;line-height:1.45}
.opt .k{font:500 12px/22px var(--f-mono);color:var(--muted);text-align:center;border:1px solid var(--line);border-radius:5px;height:22px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:8px;padding:12px 14px;font-size:14px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.score{display:flex;align-items:baseline;gap:10px}
.score b{font:700 52px/1 var(--f-display);color:var(--accent)}
.hist{display:flex;gap:6px;flex-wrap:wrap}

/* turns */
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px}
.cats button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:8px}
.tiles.ans{border:1px dashed var(--line);background:var(--surface)}
.tile{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:6px 10px;font-size:15px;text-align:left}
.tile:hover{border-color:var(--accent)}
.gapline{font:500 19px/1.6 var(--f-display)}
.gapline .blank{display:inline-block;min-width:110px;border-bottom:2px solid var(--accent);color:var(--accent)}
textarea{width:100%;min-height:110px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}

/* quest */
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.path{grid-template-columns:repeat(2,minmax(0,1fr))}}
.station{text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.station:hover{border-color:var(--accent)}
.seal{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 20px var(--f-display);border:2px solid var(--accent);color:var(--accent)}
.station.done .seal{background:var(--accent);color:var(--accent-ink)}
.stars{font-size:16px;letter-spacing:2px;color:var(--gold)}
.stars .off{color:var(--line)}
.facts{display:grid;gap:8px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14.5px}
.rank{display:flex;gap:14px;align-items:center;background:var(--gold-soft);border-radius:var(--r);padding:14px 18px}
.rank b{font:600 20px var(--f-display);color:var(--gold)}

/* glossary */
.letters{display:flex;flex-wrap:wrap;gap:4px}
.letters button{border:1px solid var(--line);background:var(--surface);min-width:32px;height:32px;border-radius:6px;font:500 13px var(--f-mono)}
.letters button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.glist{columns:2 260px;column-gap:24px}
.glist a{display:block;break-inside:avoid;padding:5px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.glist a:hover{color:var(--accent)}
.glist a small{color:var(--muted);font-size:12px}
.glist a.les{color:var(--accent)}
.tdef{font:400 18px/1.55 var(--f-display)}
.lect{display:grid;gap:12px}
.lect .blk{border-left:3px solid var(--accent);padding:4px 0 4px 14px}
.lect .blk h4{margin-top:0}
.ex{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.seeref{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);padding:10px 14px;border-radius:8px}
#lbody,#tbody,#fbody,#qz{display:grid;gap:16px}
.case #ans{display:grid;gap:12px}
.cycs{display:grid;gap:10px}
.cyc{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cyc:hover{border-color:var(--accent)}
.cyc .cn{font:700 30px/1 var(--f-display);color:var(--accent);text-align:center;padding-top:4px}
.cyc .cb{display:grid;gap:6px}
.cyc .cb b{font:600 18px var(--f-display)}
.cyc .cb span{font-size:13.5px;color:var(--muted)}
.cyc .cb span.chip{font-size:12px}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:100%}
.ptext{font:400 17px/1.75 var(--f-display);background:var(--surface2);border-radius:8px;padding:14px 16px;white-space:pre-wrap}
mark.pm{background:var(--bad-soft);color:var(--ink);text-decoration:underline wavy var(--bad);text-underline-offset:4px;border-radius:3px;padding:0 1px}
mark.pm sup{font:600 10px var(--f-mono);color:var(--bad);margin-left:2px}
.plist{display:grid;gap:8px}
.pi{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.pn{font:600 13px/24px var(--f-mono);color:var(--bad);text-align:center;border:1px solid var(--bad);border-radius:50%;width:24px;height:24px}
.prew{font:400 17px/1.7 var(--f-display);background:var(--good-soft);border-radius:8px;padding:14px 16px;white-space:pre-wrap}
.phist{display:grid;gap:6px}
.ph{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center;font-size:14px;border-bottom:1px solid var(--line);padding:6px 0}
.pe{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.ph{grid-template-columns:auto 1fr}.pe{grid-column:1/-1}}
.case .why,.case .term{margin:0}
.online{display:grid;gap:8px;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px}
blockquote.quote{margin:10px 0;padding:10px 14px;border-left:3px solid var(--gold);background:var(--surface);border-radius:0 8px 8px 0;font:400 16px/1.55 var(--f-display);max-width:72ch}
blockquote.quote small{display:block;margin-top:6px;font:500 12px var(--f-mono);color:var(--muted)}
.formula{font:500 15px/1.5 var(--f-display);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:8px 12px}
.stylebox{border:1px solid var(--gold);border-radius:8px;padding:12px 14px;background:var(--gold-soft)}
.cyc.sty{border-color:var(--gold)}.cyc.sty .cn{color:var(--gold)}
.moves{display:grid;gap:12px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.sync{font:500 11px var(--f-mono);color:var(--muted)}

/* v4: grouped nav, tabbar, crumbs, hubs, glossary */
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav{gap:14px}
.ng{display:flex;flex-direction:column;gap:2px}
.ngl{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 10px 4px}
.nav a{justify-content:flex-start}
.nav a span{flex:1}
.tabbar{display:none}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:-8px}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.crumbs b{font-weight:500;color:var(--ink)}
.phead{display:grid;gap:8px}.phead h1{margin:0}
.h2s{font:600 20px/1.2 var(--f-display);margin:0 0 12px}
.cont{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:18px 20px;box-shadow:0 1px 0 var(--accent-soft)}
.cont .cl{display:grid;gap:6px;flex:1;min-width:240px}
.cont .cl b{font:600 18px/1.3 var(--f-display)}
.cont .cl>span{color:var(--muted);font-size:14px}
.btn.big{padding:13px 22px;font-size:16px}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.ghost{background:transparent}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.steps li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:4px}
.steps li::before{content:counter(s);font:600 13px var(--f-mono);color:var(--accent-ink);background:var(--accent);width:24px;height:24px;border-radius:99px;display:grid;place-items:center}
.steps span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.steps{grid-template-columns:1fr}}
.hubs{display:grid;gap:10px}
.hubs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.hubs.two{grid-template-columns:1fr}}
.hub{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.hub:hover{border-color:var(--accent)}
.hub .hi{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.hub .hi .ic{width:22px;height:22px}
.hub .ht{flex:1;display:grid;gap:2px;min-width:0}
.hub .ht span{font-size:13px;color:var(--muted)}
.hub .ha{color:var(--muted);font-family:var(--f-mono)}
.gtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gtools input{flex:1;min-width:220px;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer}

<p>Научный текст пишется для экспертного читателя: оппонента, члена диссертационного совета, рецензента журнала. Разговорные слова, сленг и газетные метафоры сообщают ему не факт, а настроение автора. Поэтому в диссертации они воспринимаются как признак непрофессионализма.</p>
<p>Косвенно это следует из п. 10 Положения о присуждении учёных степеней: диссертация должна «обладать внутренним единством» и содержать аргументированные решения. Аргумент строится на терминах и данных, а не на образах.</p>
<h4>Правила урока</h4>

<li><b>Глагол-метафору заменяйте процессом.</b> «Взлетели», «рухнули», «просели» → «рост», «сокращение», «снижение» + величина изменения.</li>
<li><b>Бытовое название заменяйте термином.</b> «Фирма прогорела» → «организация признана несостоятельной (банкротом)».</li>
<li><b>Образ заменяйте причинно-следственной связью.</b> «Кризис ударил по…» → «кризисные явления оказали негативное влияние на…».</li>

<p>Наука оперирует фактами и цифрами. Слова «ужасный», «потрясающий», «катастрофический» передают отношение автора, но не информацию. Оппонент задаст вопрос: «По сравнению с чем катастрофический?» — и ответа в тексте не окажется.</p>
<h4>Правила урока</h4>

<li><b>Замените оценку измерением.</b> Вместо «катастрофическое падение» — «снижение показателя на 12 %».</li>

<li><b>Используйте пороговые значения.</b> В исследованиях экономической безопасности (п. 13.5 паспорта 5.2.3) оценка «критический уровень» допустима, если указано пороговое значение и его источник.</li>

 theory:`
<p>Местоимение «я» и личные формы в диссертации не используются: «я считаю», «я провёл анализ», «по моему мнению».</p>
<p>Принято «авторское мы» или безличные и пассивные конструкции: «по нашему мнению», «в ходе исследования автором был проведён анализ», «представляется целесообразным».</p>
<h4>Инструменты замены</h4>
<ul>
<li><b>«Авторское мы».</b> По нашему мнению; с нашей точки зрения; нами предложено.</li>
<li><b>«Автор» в 3-м лице.</b> Автором разработана методика; по мнению автора.</li>
<li><b>Безличные конструкции.</b> Представляется целесообразным; следует отметить; необходимо подчеркнуть.</li>
<li><b>Страдательный залог.</b> Проведён анализ; разработана методика; обоснован подход.</li>
<li><b>Объект как подлежащее.</b> «Данные таблицы свидетельствуют…», «Анализ показал…».</li>
</ul>
<p class="note">Не смешивайте формы в одном абзаце: «мы провели анализ, по мнению автора…». Выберите одну основную форму для всей работы.</p>`,

 theory:`
<p>Пункт 14 Положения о присуждении учёных степеней обязывает соискателя ссылаться на автора и (или) источник заимствования. Использование чужого материала без ссылки ведёт к снятию диссертации с рассмотрения.</p>
<p>Кроме плагиата, в диссертации встречается и обратная ошибка: утверждения без опоры. Это «все знают», «очевидно», «доказано».</p>
<h4>Правила урока</h4>
<ul>
<li><b>Каждое чужое утверждение — со ссылкой</b> [номер источника, с. страница].</li>
<li><b>Избегайте кванторов всеобщности</b>: «все», «всегда», «никогда». Их опровергает один контрпример.</li>
<li><b>Прогноз формулируйте с условием</b>: «при сохранении текущих тенденций», «при прочих равных условиях».</li>
<li><b>Корреляция — не доказательство</b>: «выявлена связь», а не «доказано, что X вызывает Y».</li>
<li><b>Источник должен быть научным или официальным</b>: нормативный акт, статистика, рецензируемый журнал. Не энциклопедия и не блог.</li>
</ul>`,

 id:"L8", title:"Логические связки", short:"«Короче» → «таким образом»",

<p>Научный текст — цепочка аргументов. Связки показывают отношения между ними: причину, следствие, противопоставление, обобщение. Разговорные связки («короче», «так вот», «а вот») разрушают эту логику.</p>
<h4>Набор связок</h4>
<table class="tbl"><tr><th>Отношение</th><th>Научные связки</th></tr>
<tr><td>Причина</td><td>поскольку; в связи с тем, что; вследствие; ввиду; обусловлено</td></tr>
<tr><td>Следствие</td><td>следовательно; в результате; в связи с этим; это позволяет</td></tr>

{id:"style", title:"Научный стиль: признаки и запреты", html:`
<p>Научный стиль — функциональный стиль русского языка для передачи знаний. Его признаки: <b>объективность</b> (факты, а не впечатления), <b>логичность</b> (связанность аргументов), <b>точность</b> (однозначные термины), <b>обобщённость</b> (закономерности, а не частные случаи) и <b>безличность</b> (автор не в центре).</p>
<h4>1. Разговорная речь, сленг и публицистика</h4>
<div class="pair"><span class="bad">Цены взлетели</span><span class="arrow">→</span><span class="good">Наблюдается существенный рост цен / ускорение инфляционных процессов</span></div>
<div class="pair"><span class="bad">Фирма прогорела</span><span class="arrow">→</span><span class="good">Предприятие признано несостоятельным (банкротом)</span></div>
<div class="pair"><span class="bad">Кризис сильно ударил по…</span><span class="arrow">→</span><span class="good">Кризисные явления оказали негативное влияние на…</span></div>
<h4>2. Эмоционально окрашенные слова и оценочные суждения</h4>
<p>«Ужасный результат», «потрясающий успех», «катастрофическое падение» — под запретом. Наука оперирует цифрами и фактами: «снижение показателя на 12 %».</p>
<h4>3. Неустановившиеся жаргонизмы и «американизмы» без расшифровки</h4>
<p>«Профит», «кешбэк», «фаундер» — только если вы исследуете эти феномены и даёте им строгое научное определение. Относительно новый термин («шеринг-экономика», «экосистема бизнеса») вводится с академическим определением или ссылкой на автора, который ввёл его в научный оборот.</p>
<h4>4. Местоимение «я» и личные формы</h4>
<p>«Я считаю», «я провёл анализ», «по моему мнению» — заменяются на «по нашему мнению», «в ходе исследования автором был проведён анализ», «представляется целесообразным».</p>

  "<b>Экономическая безопасность (разд. 13)</b>: теория и методология, типология угроз, критерии и пороговые значения (13.5), методы и инструменты повышения безопасности (13.12), противодействие коррупции и мошенничеству (13.13), управление рисками (13.14).",

{
 id:"C2L1", title:"Порядок слов: известное → новое", short:"Новая информация — в конце предложения",
 theory:`
<p>В русском научном тексте предложение строится от известного (темы) к новому (реме). Новая информация — цифра, вывод, термин — ставится в конец, где на неё падает логическое ударение.</p>
<ul>
<li><b>Начинайте с того, о чём уже шла речь</b>, заканчивайте тем, что сообщаете впервые.</li>
<li><b>Результат — в конец:</b> «Рентабельность продаж за период снизилась до 1,8 %», а не «До 1,8 % снизилась за период рентабельность».</li>
<li><b>Обстоятельство времени и места</b> обычно выносится в начало: «В 2024 г. в Архангельской области…».</li>
<li><b>Цепочка предложений:</b> рема предыдущего становится темой следующего. Так текст «течёт».</li>
</ul>`,

{
 id:"C2L2", title:"Длина предложения", short:"Дробим «простыни», соединяем «рубленые» фразы",
 theory:`
<p>Оптимальная длина научного предложения — 15–30 слов. Длиннее: читатель теряет подлежащее. Короче и подряд: текст звучит как конспект.</p>
<ul>
<li><b>Одно предложение — одна мысль</b> плюс её уточнение.</li>
<li><b>Больше двух придаточных</b> — сигнал разбить предложение.</li>
<li><b>Цепочку коротких фраз</b> на одну тему объединяйте союзами и причастными оборотами.</li>
<li><b>Проверка вслух:</b> если на одном дыхании не прочитать, предложение слишком длинное.</li>
</ul>`,
 cases:[
 {b:"Анализ показал, что организации ЛПК, которые расположены в регионах, где отсутствуют предприятия глубокой переработки, которые могли бы покупать низкосортную древесину, вынуждены экспортировать её, что снижает выручку, которая могла бы быть выше.",g:"Анализ показал, что в регионах без предприятий глубокой переработки организации ЛПК вынуждены экспортировать низкосортную древесину. Это снижает их выручку.",n:"Анализ показал, что организации ЛПК, которые расположены в регионах без переработки, которая могла бы покупать древесину, её экспортируют, что снижает выручку.",w:"Пять придаточных подряд. Разбейте на два предложения и уберите «который» там, где хватает предлога."},
 {b:"Выручка упала. Прибыль тоже упала. Рентабельность снизилась. Это плохо.",g:"Снижение выручки сопровождалось сокращением прибыли, вследствие чего рентабельность продаж уменьшилась.",n:"Выручка и прибыль упали, рентабельность снизилась, и это плохо.",w:"Рубленые фразы не показывают связи. Объединённое предложение называет причинно-следственную цепочку. «Это плохо» — оценка без содержания."},
 {b:"Угроза. Зависимость от одного покупателя. 70 % выручки.",g:"Угрозой экономической безопасности выступает зависимость от одного покупателя, на долю которого приходится 70 % выручки.",n:"Угроза — зависимость от одного покупателя (70 % выручки).",w:"Номинативные фрагменты допустимы в таблицах и презентациях, но не в тексте диссертации."},
 {b:"В работе рассмотрены теоретические основы экономической безопасности, проанализировано состояние ЛПК УИС, выявлены угрозы, разработана система индикаторов, предложена методика, апробированная на примере трёх учреждений, результаты которой показали, что уровень безопасности снижается, что требует мер, которые описаны в третьей главе.",g:"В работе рассмотрены теоретические основы экономической безопасности, проанализировано состояние ЛПК УИС и выявлены угрозы. На этой основе разработаны система индикаторов и методика оценки, апробированная на примере трёх учреждений. Меры по повышению уровня безопасности предложены в третьей главе.",n:"В работе рассмотрены основы, проанализировано состояние ЛПК УИС, выявлены угрозы, разработаны индикаторы и методика, результаты которой показали снижение, что требует мер.",w:"Перечень из семи действий с хвостом придаточных. Группируйте по этапам: теория и анализ → разработка → меры."},

 id:"C2L5", title:"Деепричастные обороты", short:"«Проанализировав данные, выручка снизилась»",
 theory:`
<p>Деепричастие обозначает действие того же лица, что и сказуемое. «Проанализировав данные, выручка снизилась» означает, что данные анализировала выручка. Это одна из самых частых ошибок в диссертациях.</p>
<ul>
<li><b>Проверка:</b> кто выполняет действие деепричастия? Этот же субъект должен быть подлежащим.</li>
<li><b>В безличных и пассивных предложениях</b> деепричастие обычно недопустимо: «Проанализировав данные, была выявлена тенденция» — ошибка.</li>
<li><b>Исправления:</b> замена на «в результате анализа», «после анализа»; придаточное «когда были проанализированы…»; активная конструкция с подлежащим.</li>
</ul>`,
 cases:[

 id:"C2L6", title:"Параллелизм и перечни", short:"Однородные члены — в одной форме",
 theory:`
<p>Элементы перечня должны быть грамматически однородными: все существительные, или все глаголы, или все словосочетания одного типа.</p>
<ul>
<li><b>Не смешивайте:</b> «анализ, систематизировать, разработка» — все три элемента в одной форме.</li>
<li><b>Двойные союзы:</b> «как… так и», «не только… но и» — после каждой части одинаковая конструкция.</li>
<li><b>Общее слово и перечень</b> согласуются: «три фактора: тарифы, кадры и сбыт».</li>
<li><b>Нумерованный перечень:</b> каждый пункт с одинаковым началом и знаком препинания (строчная буква и «;» либо прописная и «.»).</li>

 id:"C2L7", title:"Строение абзаца", short:"Тезис → аргумент → данные → вывод",
 theory:`
<p>Абзац научного текста — законченный микроаргумент. Типовая схема:</p>
<ol>
<li><b>Тезис</b> — первое предложение формулирует мысль абзаца.</li>
<li><b>Аргумент</b> — объяснение, почему это так.</li>
<li><b>Данные</b> — цифра, ссылка, пример.</li>
<li><b>Вывод или переход</b> — что из этого следует.</li>
</ol>
<ul>
<li><b>Один абзац — одна мысль.</b> Новая мысль — новый абзац.</li>
<li><b>Длина:</b> обычно 4–8 предложений. Абзац из одного предложения — признак незаконченной мысли.</li>
<li><b>Не начинайте абзац с цифры или цитаты</b> без вводящей фразы.</li>
</ul>
<p class="note">В этом уроке «случаи» — фрагменты абзацев. Смотрите на логику построения.</p>`,
 cases:[
 {b:"В 2024 г. выручка — 480 млн руб., в 2023 г. — 560 млн руб., в 2022 г. — 610 млн руб.",g:"Финансовое положение организации ухудшается. В 2022–2024 гг. выручка сократилась с 610 до 480 млн руб., то есть на 21 %. Это свидетельствует о снижении конкурентоспособности продукции на внутреннем рынке.",n:"В 2022–2024 гг. выручка снижалась: 610, 560, 480 млн руб.",w:"Абзац начинается с цифр без тезиса и заканчивается без вывода. Добавьте тезис в начало и интерпретацию в конец."},
 {b:"Угроз экономической безопасности много. Некоторые учёные их классифицируют. Кадры тоже важны. Выручка падает.",g:"Угрозы экономической безопасности организаций ЛПК УИС можно разделить на внешние и внутренние [3; 7]. К внешним относятся сокращение спроса и рост тарифов, к внутренним — износ основных фондов и дефицит кадров. Такое разделение позволяет обосновать состав индикаторов для мониторинга.",n:"Угроз много. Их классифицируют на внешние и внутренние. Кадры и выручка тоже важны.",w:"Абзац-«каша» из несвязанных мыслей. Одна мысль (классификация) раскрывается последовательно."},
 {b:"«Экономическая безопасность — это состояние…» [4]. Это определение правильное.",g:"В научной литературе экономическая безопасность организации трактуется преимущественно как состояние защищённости её ресурсов от угроз. Так, по определению И. И. Иванова, это «состояние…» [4, с. 12]. Данная трактовка, однако, не учитывает отраслевой специфики.",n:"Иванов определяет экономическую безопасность как «состояние…» [4]. Это определение правильное.",w:"Цитата без вводящей фразы и оценка без аргумента. Правильный абзац вводит цитату, приводит её и оценивает с обоснованием."},
 {b:"Рентабельность снизилась до 1,8 %.",g:"Рентабельность продаж снизилась до 1,8 %, что ниже среднеотраслевого значения (5,6 %). Основной причиной стал опережающий рост себестоимости под влиянием тарифов на энергоресурсы. При сохранении этой тенденции организация может утратить финансовую устойчивость.",n:"Рентабельность снизилась до 1,8 %, это ниже среднего.",w:"Абзац из одного предложения — незаконченная мысль. Нужны база сравнения, причина и следствие."},
 {b:"ЛПК важен для региона. В 2024 г. его доля в ВРП — 12 %. Также в регионе развиты туризм и рыболовство, которые тоже важны. Туризм растёт.",g:"Лесопромышленный комплекс выступает отраслью специализации региона: его доля в ВРП в 2024 г. составила 12 %, что в 5 раз выше среднероссийского уровня. Следовательно, устойчивость региональной экономики в значительной мере зависит от состояния ЛПК.",n:"ЛПК важен для региона — 12 % ВРП. Туризм и рыболовство тоже важны.",w:"Отклонение от темы (туризм) — в отдельный абзац или удалить. Тезис подкреплён сравнением и выводом."},
 {b:"Во второй главе мы рассмотрим методику. Но сначала о кадрах. Кадров не хватает. Методика будет учитывать кадры.",g:"Дефицит квалифицированных кадров — одна из ключевых внутренних угроз для учреждений ЛПК УИС. Укомплектованность инженерными должностями составляет 64 %. Поэтому в разрабатываемую методику (глава 2) включены кадровые индикаторы.",n:"Во второй главе рассмотрим методику, которая учитывает кадры, которых не хватает.",w:"Абзац начинается с анонса и перескакивает между темами. Тезис → данные → вывод со ссылкой на главу."},
 {b:"Как видно из рисунка 2.3.",g:"Динамика заготовки древесины в 2015–2024 гг. приведена на рисунке 2.3. Наибольшее сокращение пришлось на 2022 г. (−19 %), что связано с введением ограничительных мер на экспорт.",n:"Как видно из рисунка 2.3, заготовка сократилась.",w:"Незаконченная фраза. Абзац о рисунке: что изображено → главная закономерность → объяснение."},
 {b:"Предлагаемая методика лучше. Она учитывает пороги. Другие не учитывают. Поэтому она лучше.",g:"В отличие от подходов, представленных в работах [5; 9], предлагаемая методика учитывает пороговые значения для каждой группы индикаторов. Это позволяет не только ранжировать организации, но и выявлять критические отклонения.",n:"Предлагаемая методика учитывает пороги, в отличие от других, поэтому она лучше.",w:"Круговая аргументация («лучше, потому что лучше»). Сравнение с конкретными работами и указание на практическое следствие."},
 {b:"Таким образом. Проблем много и их надо решать.",g:"Таким образом, выявленные угрозы носят системный характер и затрагивают как финансовую, так и кадровую сферу деятельности учреждений. Их нейтрализация требует комплексного подхода, обоснованию которого посвящена третья глава.",n:"Таким образом, проблем много, и их нужно решать комплексно.",w:"Итоговый абзац обобщает конкретное содержание и связывает с дальнейшим текстом."},
 {b:"Лесистость России — 46 %. Карелия — 53 %. Архангельская область — 55 %. Росстат.",g:"Северо-западные регионы отличаются высокой лесистостью. По данным Рослесхоза, в Архангельской области она составляет около 55 %, в Республике Карелия — около 53 % при среднем значении по России около 46 %. Это создаёт ресурсные предпосылки для развития ЛПК.",n:"По данным Росстата, лесистость России — 46 %, Карелии — 53 %, Архангельской области — 55 %.",w:"Перечень цифр без тезиса и вывода. (Цифры условные.)"}

{
 id:"C2L8", title:"Связность текста", short:"Переходы между абзацами и повтор термина",
 theory:`
<p>Связность обеспечивают три инструмента.</p>
<ul>
<li><b>Повтор ключевого термина</b>, а не местоимение «он», «это», когда возможна двусмысленность.</li>
<li><b>Синонимическая замена</b> в пределах допустимого: «организации ЛПК» → «лесопромышленные организации». Но не подменяйте термин неточным синонимом: «экономическая безопасность» ≠ «надёжность».</li>
<li><b>Связки-переходы</b> в начале абзаца: «Наряду с финансовыми угрозами…», «Рассмотрим далее…», «Иная ситуация складывается…».</li>
</ul>
<p>Термин, введённый в начале, используется одинаково до конца работы. Смена «угроза» / «риск» / «опасность» без оговорки — нарушение внутреннего единства (п. 10 Положения).</p>`,
 cases:[
 {b:"В главе 1 используется термин «угроза», в главе 2 — «опасность», в главе 3 — «риск» для одного и того же понятия.",g:"Термин «угроза экономической безопасности» используется единообразно во всех главах; соотношение понятий «угроза» и «риск» разъяснено в параграфе 1.2.",n:"В работе используются синонимы «угроза», «опасность», «риск».",w:"Смена терминов для одного понятия создаёт впечатление, что речь о разных вещах. Это нарушает внутреннее единство работы."},
 {b:"Предприятие заключило договор с покупателем. Он был расторгнут через год.",g:"Предприятие заключило договор с покупателем. Через год договор был расторгнут.",n:"Предприятие заключило договор с покупателем. Через год он его расторг.",w:"«Он» может относиться и к договору, и к покупателю. Повторите термин."},
 {b:"Финансовые угрозы рассмотрены. Кадры.",g:"Наряду с финансовыми угрозами существенное влияние на уровень безопасности оказывают кадровые.",n:"Финансовые угрозы рассмотрены. Теперь о кадрах.",w:"Переход между темами оформляется связкой, которая указывает на отношение (добавление)."},
 {b:"Экономическая безопасность… В следующем абзаце: Надёжность предприятия…",g:"Экономическая безопасность… В следующем абзаце: Уровень экономической безопасности предприятия…",n:"Экономическая безопасность… Устойчивость и надёжность предприятия…",w:"«Надёжность» и «устойчивость» — другие понятия. Подмена термина синонимом нарушает точность."},
 {b:"Это привело к этому, и это стало причиной этого.",g:"Рост тарифов привёл к увеличению себестоимости, что стало причиной снижения рентабельности.",n:"Это привело к росту себестоимости, и это снизило рентабельность.",w:"Цепочка «это… этого» лишает текст смысла при чтении фрагмента. Называйте явления."},
 {b:"Первая глава закончилась. Вторая глава про анализ.",g:"Теоретические положения, обоснованные в первой главе, позволяют перейти к анализу состояния ЛПК УИС.",n:"Перейдём от теории к анализу во второй главе.",w:"Переход между главами связывает итог предыдущей с задачей следующей."},
 {b:"Методика оценки — …. Она … Она … Она …",g:"Методика оценки — …. Её первый этап … На втором этапе методики … Завершающий этап предполагает …",n:"Методика оценки — …. Она … Эта методика … Она …",w:"Монотонный повтор местоимения. Структурирующие слова («первый этап», «на втором этапе») связывают и упорядочивают."},
 {b:"В Карелии доля ЛПК высокая. Архангельская область. Вологодская область тоже.",g:"В Республике Карелия доля ЛПК в отгрузке обрабатывающих производств превышает 30 %. Сопоставимые значения отмечаются в Архангельской и Вологодской областях, что позволяет рассматривать эти регионы как единую группу.",n:"В Карелии доля ЛПК высокая. В Архангельской и Вологодской областях тоже.",w:"Связка «сопоставимые значения отмечаются» и вывод о группировке делают перечень аргументом."},
 {b:"Иванов считает так [4]. Петров считает иначе [7]. Сидоров тоже [9].",g:"В литературе сложились два подхода. Согласно первому (И. И. Иванов [4]), … Сторонники второго подхода (П. П. Петров [7], С. С. Сидоров [9]) полагают, что …",n:"Иванов считает так [4], а Петров и Сидоров — иначе [7; 9].",w:"Обзор мнений группируется по подходам, а не по авторам."},
 {b:"ЦТАО, ЦТАО учреждений, центры, мастерские, производство — в одном тексте о том же.",g:"Центры трудовой адаптации осуждённых (далее — ЦТАО) …; далее по тексту — только «ЦТАО».",n:"Центры трудовой адаптации (ЦТАО), они же производственные мастерские…",w:"Аббревиатура вводится один раз с расшифровкой и далее используется единообразно."}
 ]
},
{
 id:"C2L9", title:"Однозначность", short:"«Данный», «этот», «соответствующий» без адресата",
 theory:`
<p>Научный текст должен пониматься одинаково любым читателем. Главные источники двусмысленности — местоимения без чёткого адресата, слова «соответствующий», «определённый», «ряд», и неясные сравнения.</p>
<ul>
<li><b>«Данный»</b> допустим, если понятно, какой именно. Три «данных» в абзаце — повод назвать объект.</li>
<li><b>«Соответствующие меры», «определённые условия»</b> — какие? Назовите.</li>
<li><b>Сравнение</b> требует обоих членов: «выше» — чем что?</li>
<li><b>«Ряд», «некоторые», «многие»</b> — по возможности замените числом.</li>
</ul>`,
 cases:[
 {b:"Необходимо принять соответствующие меры.",g:"Необходимо диверсифицировать каналы сбыта и снизить зависимость от единственного покупателя.",n:"Необходимо принять необходимые меры по улучшению ситуации.",w:"«Соответствующие меры» — пустое место. Назовите меры."},

 theory:`
<p>Введение статьи — «воронка»: от общей проблемы к конкретному пробелу в знаниях и цели статьи.</p>
<ol>
<li><b>Контекст:</b> почему тема важна (данные, нормативные документы).</li>
<li><b>Что известно:</b> кратко о том, что сделано до вас.</li>
<li><b>Пробел:</b> что не изучено или решено неудовлетворительно.</li>
<li><b>Цель статьи</b> и, по возможности, её вклад.</li>
</ol>
<ul>
<li><b>Не начинайте с истории человечества:</b> «С древнейших времён лес играл важную роль…».</li>
<li><b>Актуальность обосновывайте данными и документами</b>, а не словами «в настоящее время актуально».</li>
</ul>`,

 id:"C3L5", title:"Обзор литературы", short:"Синтез подходов, а не пересказ по авторам",
 theory:`
<p>Главная ошибка начинающих — пересказ работ по очереди: «Иванов пишет… Петров пишет… Сидоров пишет…». Хороший обзор группирует работы по подходам, сравнивает их и подводит к пробелу.</p>
<ul>
<li><b>Группируйте:</b> «В литературе сложились три подхода к…».</li>
<li><b>Сравнивайте:</b> в чём сходство, в чём различия, что упущено.</li>
<li><b>Держите фокус:</b> только работы, относящиеся к вашей проблеме.</li>
<li><b>Свежесть:</b> значительная часть источников — за последние 5–7 лет, плюс классические работы.</li>
<li><b>Итог обзора</b> — сформулированный пробел, который закрывает ваша статья.</li>
</ul>`,

<li><b>Цель</b> — одна, через результат.</li>

{
 id:"C3L7", title:"Материалы и методы", short:"Воспроизводимость: данные, период, выборка, расчёт",
 theory:`
<p>Раздел о методах пишется так, чтобы другой исследователь мог повторить расчёт.</p>
<ul>
<li><b>Данные:</b> источник, период, единица наблюдения, объём выборки.</li>
<li><b>Критерии отбора:</b> почему именно эти регионы, организации, годы.</li>

<p>Научная полемика — нормальная часть исследования. Её правила:</p>

<li><b>Критикуется позиция, а не человек.</b> «Подход не учитывает…», а не «автор не понимает…».</li>
<li><b>Критика аргументирована:</b> что именно не так и почему.</li>
<li><b>Смягчающие конструкции:</b> «представляется дискуссионным», «вызывает сомнение», «нельзя в полной мере согласиться».</li>
<li><b>Сначала — что ценно</b> в критикуемой позиции, затем — ограничение.</li>
<li><b>Предложите альтернативу</b>, если критикуете.</li>
</ul>`,

<li><b>Незначимые коэффициенты</b> не интерпретируются как эффект.</li>
</ul>`,

<p>Проверка на заимствования (например, «Антиплагиат») — обязательная процедура. Но система ищет совпадения, а совет оценивает корректность. Замена слов синонимами без ссылки — тоже некорректное заимствование, даже если «оригинальность» высокая.</p>
<ul>
<li><b>Корректное заимствование:</b> цитата в кавычках со ссылкой или пересказ со ссылкой.</li>
<li><b>Самоцитирование:</b> свои опубликованные тексты тоже цитируются со ссылкой на свою статью (п. 14 Положения требует указывать это).</li>
<li><b>Рерайт</b> (замена слов, перестановка) — остаётся заимствованием идей и структуры.</li>
<li><b>Нормативные акты, определения из ГОСТов</b> — совпадения допустимы, если есть кавычки или ссылка.</li>
<li><b>Не пытайтесь обмануть систему</b> заменой букв или скрытым текстом — это выявляется и ведёт к снятию работы.</li>
</ul>`,
 cases:[
 {b:"Абзац из чужой статьи, в котором заменены синонимы, без ссылки.",g:"Пересказ идеи своими словами со ссылкой [7], с собственной оценкой.",n:"Абзац с заменой синонимов и ссылкой [7] в конце.",w:"Рерайт без ссылки — заимствование. Даже со ссылкой лучше пересказ, а не синонимизация."},

<ul>
<li><b>Формула:</b> [значимость объекта — данными] + [изменившиеся условия / вызов] + [противоречие: что нужно, но не решено] → [необходимость исследования].</li>
<li><b>Опора на документы стратегического планирования:</b> Стратегия экономической безопасности, отраслевые стратегии, ведомственные концепции.</li>

<li><b>Не начинайте с</b> «В современных условиях…» — это ничего не сообщает.</li>
</ul>`,

<li><b>Масштаб страны.</b> «Наша страна», «отечественная экономика», «народное хозяйство», «в стратегической перспективе». Частная проблема встраивается в национальную.</li>
</ul>
<h4>3. Лексика</h4>
<p><b>Проблематика / тематика</b> (вместо «проблема», «тема»); <b>существенный, значительный</b> (2,59); <b>в сфере, в рамках</b> (1,7 и 1,43); <b>в значительной мере</b>; <b>потенциал</b> («имеет существенный потенциал»); <b>процессы</b> («процессы организации труда»); <b>производственный сектор УИС</b>; <b>механизм, нейтрализация угроз, императивы</b> (в работах с Крутем).</p>
<h4>4. Синтаксис</h4>
<ul>
<li>Предложения средней длины (медиана 19 слов). В сольных работах короче, чем в правовых со Скибой.</li>
<li>Много скобок-уточнений (11,5 на 1000 слов): «(далее — УИС)», «(вплоть до сегодняшнего дня)», «(в том числе…)», «(прим. автора)».</li>
<li>Цифра встраивается в предложение с датой и единицей: «на 12 % до 69 млн т», «с 46,7 % в 2006 г. до 36 % в 2019 г.».</li>
</ul>
<h4>5. Регистры соавторства</h4>
<table class="tbl"><tr><th>С кем</th><th>Что меняется</th></tr>
<tr><td>Скиба А. П. (право)</td><td>Длинные предложения (29 слов, 18 % — более 40), «представляется», «указанный», нормотворческие предложения: «целесообразно ч. 1 ст. … УИК РФ дополнить…», перечни через «;», «во-первых».</td></tr>
<tr><td>Седых В. А. (экономика УИС, продовольствие)</td><td>Экономическая практика: госзакупки, агроконтракты, рынки. «В качестве наглядной иллюстрации следует привести…», «В статье доказывается целесообразность…», много двоеточий и перечней.</td></tr>
<tr><td>Круть А. А. (экономическая безопасность)</td><td>Структура с рубриками («Введение — Анализ последних исследований и публикаций по теме — Материалы и методы — Результаты исследования и их обсуждение — Выводы»), «нами», «определяется нами как…», «механизм» (2,75), «угрозы», «нейтрализация».</td></tr></table>
<h4>6. Что не копировать</h4>
<p>У любого автора есть рабочие привычки. Перенимайте каркас и голос, но не эти детали — на них укажет нормоконтроль или оппонент:</p>
<ul>
<li><b>«В тоже время» слитно</b> — встречается 14 раз, но это орфографическая ошибка. Правильно «в то же время».</li>
<li><b>«Очевидно, что…» перед спорным тезисом.</b> В статье доктора наук это звучит уверенно, в диссертации соискателя — повод для вопроса «почему очевидно?». Ставьте после данных.</li>
<li><b>Пунктуация при вводных:</b> «на наш взгляд» выделяется запятыми с двух сторон; «оценить, как» — лишняя запятая.</li>
<li><b>Публицистические эпитеты</b> («агрессивные действия», «тотальные деструктивные последствия») в диссертации лучше смягчать.</li>
<li><b>«Данный» в каждом предложении</b> (4,6 на 1000 слов) — чередуйте с «рассматриваемый», «указанный», «этот».</li>
</ul>`;

 {b:"Много писали про ГЧП в УИС.",g:"Существенными также являются наработки по тематике развития государственно-частного партнерства в производственном секторе УИС, представленные в работах … [6; 7].",n:"Существенными являются работы про ГЧП.",w:"Звено «Существенными также являются наработки по тематике…, представленные в работах…»."},

{
 id:"R4", title:"Голос автора", short:"«На наш взгляд», «Отметим, что», «следует определить как»",
 theory:`
<p>Главное отличие Родионова от «учебного» научного стиля — открытая авторская позиция. Он не просто излагает факты, а после каждого блока даёт оценку.</p>
<table class="tbl"><tr><th>Ход</th><th>Формула</th></tr>
<tr><td>Позиция</td><td>На наш взгляд, …</td></tr>
<tr><td>Важная деталь</td><td>Отметим, что… / Отметим также…</td></tr>
<tr><td>Квалификация явления</td><td>…следует определить как… / следует оценивать как… / следует определить в качестве…</td></tr>
<tr><td>Внимание к аспекту</td><td>Отдельного внимания заслуживает… / Заслуживает внимания…</td></tr>
<tr><td>Учёт фактора</td><td>Следует также учитывать, что… / При этом следует учитывать тот факт, что…</td></tr>
<tr><td>Объективность</td><td>Объективно данный X следует оценивать как…</td></tr>
</table>
<blockquote class="quote">«Отметим, что в приказе не указывалось на конкретные подразделения…, что, на наш взгляд, определяет значительный разрыв содержания приказа № 414 с существовавшими в тот момент реалиями.»<small>Родионов А. В., 2017</small></blockquote>
<p class="note">«На наш взгляд» всегда выделяется запятыми с двух сторон. В оригинальных текстах эта запятая иногда пропущена — не копируйте.</p>`,
 cases:[
 {b:"Я думаю, программа была неэффективной.",g:"На наш взгляд, федеральная целевая программа не оказала существенного влияния на развитие лесопромышленного производства УИС.",n:"На наш взгляд программа была неэффективной.",w:"Позиция вводится «на наш взгляд» с запятой. В почти правильном варианте нет запятой, и оценка слишком общая."},
 {b:"Кстати, в приказе не было сказано про сбыт.",g:"Отметим, что в приказе не определялись подразделения, ответственные за организацию сбыта продукции.",n:"Кстати, отметим, что в приказе не было про сбыт.",w:"«Отметим, что» — его главный способ ввести важную деталь. «Кстати» — разговорно."},
 {b:"Это была хорошая идея, но она не сработала.",g:"Данную инициативу следует оценивать как концептуально обоснованную, однако объективно не обеспеченную необходимыми ресурсами.",n:"Эту инициативу следует оценить, как хорошую, но не сработавшую.",w:"Его квалификация: «следует оценивать как…». Перед «как» здесь запятая не нужна; «хорошая» — не его лексика."},
 {b:"Важно ещё посмотреть на кадры.",g:"Отдельного внимания заслуживает проблематика кадрового обеспечения лесопромышленных подразделений учреждений УИС.",n:"Отдельное внимание надо уделить кадрам.",w:"«Отдельного внимания заслуживает проблематика…» — его формула (2017)."},
 {b:"Ещё надо помнить, что учреждения казённые.",g:"При этом следует учитывать тот факт, что учреждения УИС являются казенными, что существенным образом влияет на особенности их хозяйственной деятельности.",n:"Ещё следует помнить, что учреждения казённые.",w:"Дословная конструкция Родионова: «При этом следует учитывать тот факт, что…, что существенным образом влияет на…»."},
 {b:"Износ оборудования — одна из главных проблем, я считаю.",g:"Высокий уровень износа основных фондов следует определить в качестве одной из наиболее острых угроз экономической безопасности лесопромышленного производства УИС.",n:"Высокий износ, на мой взгляд, одна из главных угроз.",w:"«Следует определить в качестве одной из наиболее острых угроз» — формула из работы с Крутем (2022)."},
 {b:"Объём новаций в приказе был большой.",g:"Объем нормативных новаций, заложенных в данный документ, следует определить как очень высокий.",n:"Объём новаций в приказе, по-моему, был большим.",w:"Он даёт оценку через «следует определить как» — безлично, но с явной позицией."},
 {b:"Интересно, что в 2022 г. экспорт упал сильнее всего.",g:"Примечательно, что наибольшее сокращение экспорта лесоматериалов пришлось на 2022 г.",n:"Интересно отметить, что в 2022 г. экспорт упал сильнее всего.",w:"«Примечательно, что…» — его оборот для яркого факта."},
 {b:"С одной стороны приказ хороший, с другой — невыполнимый.",g:"Приказ следует рассматривать с точки зрения его высокого потенциала в сфере организации труда осужденных. В то же время объективно данный приказ следует оценивать как инициативу, которая не имела существенного влияния на производственный процесс.",n:"Приказ хороший, но в тоже время невыполнимый.",w:"Двухходовая оценка из статьи 2017 г.: потенциал → «в то же время объективно… следует оценивать как…». «В тоже время» слитно — ошибка."},
 {b:"Мне кажется, ГЧП поможет.",g:"На наш взгляд, развитие государственно-частного партнерства имеет существенный потенциал для повышения уровня экономической безопасности лесопромышленного производства УИС.",n:"На наш взгляд, ГЧП, скорее всего, как-то поможет.",w:"«На наш взгляд» + «имеет существенный потенциал для…». Без неуверенного «как-то»."}
 ]
},
{
 id:"R5", title:"Аргумент: факт, следствие, пример", short:"«Фактически…», «Как следствие…», «В качестве примера следует привести…»",
 theory:`
<p>Основная часть у Родионова — цепочки «факт → следствие → квалификация». Он опирается на нормативные акты (с полными реквизитами), статистику (с годом и единицей) и примеры других стран или регионов.</p>
<table class="tbl"><tr><th>Функция</th><th>Связка</th></tr>
<tr><td>Реальное положение дел</td><td>Фактически, …</td></tr>
<tr><td>Следствие</td><td>Как следствие, … / В результате…</td></tr>
<tr><td>Пример</td><td>В качестве примера следует (можно) привести… / В качестве наглядной иллюстрации…</td></tr>
<tr><td>Уточнение</td><td>В данном случае речь идет о… / В частности, речь идет о…</td></tr>
<tr><td>Противопоставление</td><td>При этом… / В то же время… / Однако…</td></tr>
<tr><td>Обобщение</td><td>Таким образом, …</td></tr>
<tr><td>Потенциал</td><td>Такого рода X имеет существенный потенциал…</td></tr>
</table>
<blockquote class="quote">«Как следствие, нефть и другие сырьевые активы начали стремительно дешеветь, достигнув исторических минимумов 2003 г.»<small>Родионов А. В., 2020</small></blockquote>
<p>Перечень факторов он оформляет нумерацией: «негативное влияние с трех сторон: 1. … 2. … 3. …» или «Во-первых… В-пятых…».</p>`,
 cases:[
 {b:"На самом деле колонии конкурируют с частниками.",g:"Фактически, лесопромышленные подразделения учреждений УИС конкурируют на региональных рынках с частными лесозаготовителями, не обладая сопоставимой технической базой.",n:"По сути колонии конкурируют с частниками.",w:"«Фактически, …» — его связка для реального положения дел. «Колонии», «частники» — разговорно."},
 {b:"Из-за этого выручка упала.",g:"Как следствие, выручка от реализации пиломатериалов сократилась на 18 % в 2022 г.",n:"Как следствие, выручка упала.",w:"«Как следствие» + показатель + величина + год. Без цифры — неполно."},
 {b:"Например, Китай.",g:"В качестве примера следует привести Китай, который за 2018 г. увеличил объем экспорта нефтепродуктов на 12 %.",n:"Например, в Китае экспорт растёт.",w:"Его формула примера — «В качестве примера следует привести X, который…» с цифрой."},
 {b:"Речь про газопровод.",g:"В частности, речь идет о газопроводе «Сила Сибири».",n:"Речь про газопровод «Сила Сибири».",w:"«В частности, речь идет о…» — его уточняющая связка."},
 {b:"Приказ 414 (без даты).",g:"приказ МВД России от 7 сентября 1993 г. № 414 «О мерах по совершенствованию внешнеэкономической деятельности…» (далее — приказ № 414)",n:"приказ МВД № 414 1993 года",w:"Нормативный акт он приводит с органом, датой, номером, названием и сокращением «(далее — …)»."},
 {b:"Всё это плохо влияет на три вещи.",g:"Таким образом, сложилась ситуация, при которой лесопромышленное производство УИС начало ощущать негативное влияние с трех сторон: 1. … 2. … 3. …",n:"Таким образом, есть три плохих фактора.",w:"Его прием: «сложилась ситуация, при которой… с трех сторон:» и нумерованный перечень."},
 {b:"ГЧП даст хороший эффект.",g:"Такого рода государственно-частное партнерство имеет существенный потенциал генерации синергетического эффекта.",n:"ГЧП даст очень хороший синергетический эффект.",w:"Дословная фраза Родионова (2024): «Такого рода… имеет существенный потенциал генерации синергетического эффекта»."},
 {b:"Но при этом бюджет вырос.",g:"При этом объем бюджетных ассигнований на обеспечение производственной деятельности учреждений увеличился.",n:"Но при этом бюджет всё-таки вырос.",w:"«При этом» — самое частое начало предложения у Родионова (41 раз). Без «но» и «всё-таки»."},
 {b:"Данные с сайта (без ссылки).",g:"В 2019 г. США вышли на 1 место в мире по добыче нефти с объемом 12,9 млн баррелей в день (далее — б/д) (рис. 1).",n:"США — первые по добыче нефти (данные из интернета).",w:"Цифра встроена в предложение с годом, единицей, сокращением «(далее — …)» и отсылкой к рисунку."},
 {b:"Короче, всё упирается в износ.",g:"Таким образом, проблематику повышения эффективности лесопромышленного производства УИС следует рассматривать в плоскости обновления основных фондов.",n:"Таким образом, короче, всё упирается в износ.",w:"Его обобщение: «Таким образом, проблематику X следует рассматривать в плоскости Y» (2017)."}
 ]
},
{
 id:"R6", title:"Выводы и предложения", short:"«Таким образом… позволит», «Следует», «Целесообразно»",
 theory:`
<p>Родионов заканчивает статьи программно: перечень направлений и обобщающий абзац о том, что они позволят сделать.</p>
<ul>
<li><b>Перечень направлений:</b> «Во-первых, … В-вторых, …» — каждое направление с обоснованием в 1–3 предложениях.</li>
<li><b>Рекомендательные глаголы:</b> «Следует сформировать…», «Следует обеспечить…», «Целесообразно осуществить…», «Дальнейшую работу следует проводить также в сфере…».</li>
<li><b>Итог:</b> «Таким образом, вышеуказанные… позволят сформировать и реализовать новый подход к…».</li>
<li><b>Продолжение работы:</b> «В связи с этим следует продолжить работу по…».</li>
</ul>
<blockquote class="quote">«Таким образом, вышеуказанные и иные организационно-правовые аспекты привлечения осуждённых к труду позволят сформировать и реализовать новый подход к развитию уголовно-исполнительной политики…»<small>Родионов А. В., 2019</small></blockquote>`,
 cases:[
 {b:"В общем, надо всё улучшать.",g:"Таким образом, реализация предложенных направлений позволит сформировать новый подход к обеспечению экономической безопасности лесопромышленного производства УИС.",n:"Таким образом, всё это нужно улучшать.",w:"Его итог: «Таким образом, … позволит (позволят) сформировать…»."},
 {b:"Надо бы создать систему поддержки.",g:"Следует сформировать систему мониторинга экономической безопасности, учитывающую специфику производственной деятельности казенных учреждений.",n:"Нужно создать систему мониторинга.",w:"«Следует сформировать…, учитывающую специфику…» — его рекомендательная модель (2024)."},
 {b:"Лучше выбрать главные отрасли.",g:"Целесообразно осуществить выбор основных направлений, в которых производственный сектор УИС может занять устойчивые позиции на региональных рынках (например, производство пиломатериалов и изделий из древесины).",n:"Целесообразно выбрать главные отрасли.",w:"Дословная модель (2024): «Целесообразно осуществить выбор основных направлений, в которых… (например, …)»."},
 {b:"Первое — ГЧП. Второе — кадры.",g:"Во-первых, необходима организация государственно-частного партнерства при развитии лесопромышленного производства УИС. … Во-вторых, …",n:"Первое: ГЧП. Второе: кадры.",w:"Перечень направлений «Во-первых… Во-вторых…», каждое — полным предложением с обоснованием."},
 {b:"Работу надо продолжать.",g:"В связи с этим следует продолжить работу по восполнению пробелов в нормативном регулировании производственной деятельности учреждений УИС.",n:"В связи с этим работу нужно продолжать.",w:"Его концовка 2021 г.: «В связи с этим следует продолжить работу по восполнению пробелов…»."},
 {b:"Также надо учить людей.",g:"Дальнейшую работу следует проводить также в сфере подготовки кадров для лесопромышленных подразделений учреждений УИС.",n:"Также следует учить персонал.",w:"«Дальнейшую работу следует проводить также в сфере…» (2024)."},

const GLOSS = [{"t":"AFL-CIO","en":"","d":"Американская федерация труда и Конгресс производственных профсоюзов (США)."},{"t":"COLA","en":"","d":"см. Надбавка, учитывающая изменение прожиточного минимума."},{"t":"M2","en":"","d":"более широкое определение предложения денег, равно M1 плюс нечековые сберегательные депозиты (включая депозитные счета денежного рынка), небольшие срочные вклады на сумму менее тыс, долл. и остатки на счетах взаимных фондов денежного рынка."},{"t":"NLRB","en":"","d":"см. Национальное управление по трудовым отношениям."},{"t":"TANF","en":"","d":"см. Временная помощь нуждающимся семьям."},{"t":"WTO","en":"","d":"см. Всемирная торговая организация."},{"t":"Абсолютная монополия","en":"","d":"см. Чистая (абсолютная) монополия."},{"t":"Абстракция","en":"abstraction","d":"исключение из экономического анализа не относящихся к делу или неэкономических фактов, чтобы в конечном счете выделить только экономические принципы."},{"t":"Авторское право","en":"copyright","d":"законодательная защита разработчиков, издателей книг, создателей компьютерных программ и музыкальных произведений от несанкционированного копирования их работ."},{"t":"Агрегирование","en":"aggregation","d":"соединение отдельных единиц или данных в единый показатель или число. Например, все цены конкретных товаров и услуг образуют общий уровень цен, а все единицы продукции агрегируются в реальный валовой внутренний продукт."},{"t":"Агробизнес","en":"agribusiness","d":"части сельского хозяйства и производства продуктов питания, в которых доминирующую роль играют крупные корпорации."},{"t":"Аккордный налог","en":"lump-sum tax","d":"налог, который представляет собой единую сумму (например, подоходный налог, уплачиваемый государству) при любом уровне ВВП."},{"t":"Актив","en":"asset","d":"все, что имеет денежную стоимость и является собственностью фирмы или отдельного лица."},{"t":"Активно управляемые фонды","en":"actively managed funds","d":"взаимные фонды, менеджеры портфелей которых постоянно покупают и продают активы в попытке добиться более высокой доходности по сравнению с выбранной бенчмаркинговой нормой доходности аналогичных портфелей."},{"t":"Активное сальдо платежного баланса","en":"balance of payments surplus","d":"активное сальдо (положительная сумма) баланса счета текущих операций и баланса счета движения капиталов."},{"t":"Активное сальдо торгового баланса","en":"trade surplus","d":"превышение товарного (или товаров и услуг) экспорта страны над ее товарным (или товаров и услуг) импортом."},{"t":"Акциз","en":"excise tax","d":"налог, взимаемый с производителей конкретного товара или с покупателей определенного количества этого товара."},{"t":"Акция корпорации","en":"stock","d":"доля собственности в корпорации."},{"t":"Альтернативные издержки","en":"opportunity costs","d":"количество других продуктов, от которого приходится отказаться (пожертвовать), чтобы получить единицу любого данного продукта."},{"t":"Амортизация","en":"depreciation","d":"см. Потребление основного капитала."},{"t":"Анализ затрат и результатов","en":"cost-benefit analysis","d":"сопоставление предельных издержек проекта или программы, планируемой для реализации органам власти, с предельными выгодами, которые будут получены, чтобы решить, целесообразно ли использовать ресурсы на выполнение этого проекта или программы и если да, то в каких масштабах."},{"t":"Антитрестовская политика","en":"antitrust policy","d":"применение антитрестовских законов для развития конкуренции и достижения экономической эффективности."},{"t":"Антитрестовские законы","en":"antitrust laws","d":"законы (включая закон Шермана и закон Клейтона), запрещающие деятельность, направленную против конкуренции в бизнесе, например запрет установления фиксированных цен, мошенничества, монополизации и использования связывающих контрактов."},{"t":"Арбитраж","en":"arbitrage","d":"деятельность по продаже какого-то актива и покупка идентичного или почти идентичного актива, чтобы выиграть на временной разнице цен или норм доходности; практика, выравнивающая цены или нормы дохода на аналогичные финансовые инструменты и тем самым устраняющая дополнительные возможности для получения безрискового финансового выигрыша."},{"t":"Асимметричная информация","en":"asymmetric information","d":"ситуация на рынке, когда продавец (покупатель) обладает значительно большей информацией о продукте или услуге, чем покупатель (продавец), в результате чего происходит неэффективное перераспределение ресурсов."},{"t":"Аукционы по предоставлению кредитов депозитным организациям с резервируемой ставкой","en":"term auction facility","d":"прием из области кредитно-денежной политики, применяемый Федеральной резервной системой, при котором коммерческие банки анонимно подают заявки на получение кредитов, предоставляемых ФРС; способ увеличения резервов в банковской системе."},{"t":"Базовая процентная ставка","en":"prime interest rate","d":"эталонная процентная ставка, от которой отталкиваются банки при выдаче самых разных кредитов юридическим и физическим лицам."},{"t":"Базовый год","en":"base year","d":"год, принимаемый при построении индекса цен за основу для сравнения с ценами, действовавшими в другие годы."},{"t":"Баланс счета движения капиталов","en":"balance on capital account","d":"приток капитала в страну за вычетом вывоза капитала из нее."},{"t":"Баланс счета текущих операций","en":"balance on current account","d":"экспорт товаров и услуг страны за вычетом импорта товаров и услуг плюс чистый инвестиционный доход и плюс сальдо трансфертных платежей за год."},{"t":"Баланс товаров и услуг","en":"balance on goods and services","d":"экспорт товаров и услуг страны за вычетом импорта товаров и услуг за год."},{"t":"Балансовый отчет","en":"balance sheet","d":"сводный отчет об активах, пассивах и чистой стоимости собственного капитала фирмы или индивида на определенную дату."},{"t":"Банк банков","en":"bankers’ bank","d":"банк, принимающий вклады депозитных институтов США и предоставляющий им ссуды; федеральные резервные банки."},{"t":"Банк штата","en":"state bank","d":"коммерческий банк, получивший разрешение правительства штата на ведение банковских операций."},{"t":"Банкноты Федеральной резервной системы","en":"Federal Reserve Notes","d":"бумажные деньги, выпускаемые федеральными резервными банками."},{"t":"Банковские депозиты","en":"bank deposits","d":"банковские депозиты частных лиц и компаний, которые хранятся в банках (или сберегательных учреждениях) или которые сами банки хранят в федеральных резервных банках."},{"t":"Банковские резервы","en":"bank reserves","d":"депозиты банков и сберегательных учреждений, которые хранятся в федеральных резервных банках, плюс кассовые средства (банковская наличность) банков и сберегательных учреждений."},{"t":"Банкрот","en":"bankrupt","d":"правовая ситуация, при которой отдельный человек или фирма оказывается в ситуации, когда он или она не может своевременно заплатить занятые в прошлом деньги. В этих случаях судья, рассматривающий дело о банкротстве, может предписать этому человеку или фирме ликвидировать (перевести в денеж ные наличные средства) свои активы, чтобы заплатить кредиторам, по крайней мере часть той суммы, которую он/она им должен/должна."},{"t":"Бартер, бартерная торговля","en":"barter","d":"натуральный обмен одного товара или услуги на другой товар или услугу."},{"t":"Барьер для вхождения в отрасль","en":"barrier to entry","d":"любые действия, которые искусственно препятствуют проникновению в отрасль новых фирм."},{"t":"Бегство капитала","en":"capital flight","d":"перевод сбережений из развивающихся стран в промышленно развитые государства, чтобы избежать их экспроприации властями, вывести из-под налогообложения, противодействовать более высоким темпам инфляции или просто получить более высокую доходность при финансовых инвестициях."},{"t":"Бедность","en":"poverty","d":"состояние, при котором основные потребности индивида или семьи превышают имеющиеся средства для их удовлетворения."},{"t":"Безграничные потребности","en":"unlimited wants","d":"неутолимое желание потребителей иметь товары и услуги, которые удовлетворяют их потребности или доставляют по лезность."},{"t":"Безналичные трансфертные платежи","en":"noncash transfer","d":"трансфертные платежи органов власти в виде товаров и услуг, а не в денежной форме, например по мощь в ведении домашнего хозяйства, получение спе циальности; также называются трансфертами в натуральной форме."},{"t":"Безработица","en":"unemployment","d":"неспособность экономи ки использовать все имеющиеся экономические ресурсы для производства товаров и услуг; неспособность полностью использовать рабочую силу."},{"t":"Безрисковая процентная ставка","en":"risk-free interest rate","d":"процентная ставка, получаемая по краткосрочным облигациям правительства США."},{"t":"Бета","en":"beta","d":"относительный показатель недиверсифицируемого риска, измеряющий, как недиверсифицируемый риск конкретного актива или портфеля сопоставим с рыночным портфелем (портфелем, который содержит каждый актив доступный на финансовых рынках)."},{"t":"Бизнес-цикл","en":"","d":"см. Экономический (деловой) цикл."},{"t":"Богатство","en":"wealth","d":"все, что имеет ценность, так как производит доход или может произвести доход. Богатство — это запас, доход — это поток; активы минус обязательства — это чистое богатство."},{"t":"Британская тепловая единица","en":"British Thermal Unit, BTU","d":"количество энергии, которое требуется для повышения температуры 1 фунта воды на 1 градус Фаренгейта."},{"t":"Будущая стоимость","en":"future value","d":"сумма, до которой возрастет текущее количество денег, если процент, на числяемый на первоначальную сумму, со временем будет дисконтироваться (см. Сложный процент.)"},{"t":"Бумажные деньги","en":"paper money","d":"отдельные листы особой бумаги, используемые в качестве средства обращения; в США в этом качестве используются банкноты Федеральной резервной системы."},{"t":"Бюджет при полной занятости","en":"full-employment budget","d":"соотношение государственных расходов и налоговых поступлений, которые сложилось бы, если бы экономика в течение года функционировала в условиях полной занятости."},{"t":"Бюджетная прямая","en":"budget line","d":"линия, показывающая различные комбинации количеств двух товаров, которые потребитель может купить при данном уровне своего денежного дохода и текущих ценах товаров."},{"t":"Бюджетный дефицит","en":"budget deficit","d":"сумма превышения расходов федерального правительства над его доходами в каждый данный год."},{"t":"Бюджетный избыток","en":"budget surplus","d":"превышение доходов федерального правительства над его расходами."},{"t":"Бюро экономического анализа","en":"Bureau of Economic Analysis, ВЕЛ","d":"агентство министерства торговли США, составляющее отчеты о цифрах национального дохода и продукции."},{"t":"ВВП","en":"","d":"см. Валовой внутренний продукт."},{"t":"Валовое предложение","en":"total supply","d":"таблица или кривая предложения товаров или услуг всеми продавцами; также называется рыночным предложением."},{"t":"Валовой внутренний продукт","en":"gross domestic product, GDP","d":"общая рыночная стоимость всех произведенных за год готовых товаров и услуг в США, независимо от источника получения ресурсов, иностранных или внутренних."},{"t":"Валовой внутренний продукт на душу населения","en":"per capita GDP","d":"валовой внутренний продукт (ВВП), приходящийся на каждого гражданина страны; средний размер ВВП, деленный на численность населения."},{"t":"Валовой спрос","en":"total demand","d":"таблица или график спроса, которые могут предъявить все покупатели товаров и услуг; также называется рыночным спросом."},{"t":"Валовые расходы, совокупные расходы","en":"total spending","d":"суммарный объем расходов, которые несут или готовы понести покупатели товаров и услуг; также называются совокупными расходами."},{"t":"Валовые частные внутренние инвестиции","en":"gross private domestic investment","d":"затраты на производство новых средств производства: машин, оборудования, инструментов и зданий, а также на пополнение товарно-материальных запасов."},{"t":"Валюта","en":"currency","d":"бумажные и металлические деньги."},{"t":"Валютная интервенция","en":"currency intervention","d":"покупка и продажа правительством собственной или иностранной валюты для изменения международных обменных курсов."},{"t":"Валютный контроль","en":"foreign exchange control, exchange control","d":"контроль, который может установить правительство над спросом граждан и фирм данной страны на иностранную валюту и над валютными курсами с целью ограничить превышение внешних платежей над поступлениями (устранить дефицит платежного баланса)."},{"t":"Валютный курс","en":"foreign exchange rate","d":"см. Курс обмена валюты."},{"t":"Величина предложения","en":"quantity supplied","d":"количество конкретного товара или услуги, которое продавец (или продавцы) предлагает к продаже по конкретной цене в течение определенного периода."},{"t":"Величина спроса","en":"quantity demanded","d":"количество конкретного товара или услуги, которое покупатель (или покупатели) желает купить по определенной цене в течение определенного периода."},{"t":"Венчурный капитал","en":"venture capital","d":"часть сбережений домохозяйств, используемая для финансирования проектов бизнеса с высоким риском в обмен на долю прибыли, если этот проект окажется успешным."},{"t":"Вертикальная интеграция","en":"vertical integration","d":"группа предприятий, осуществляющих разные стадии производства готового продукта и являющихся собственностью одной фирмы."},{"t":"Вертикальная ось","en":"vertical axis","d":"координата графика или решетки, идущая сверху вниз, на которой откладывается значение одного из параметров."},{"t":"Вертикальное слияние","en":"vertical merger","d":"слияние двух или более фирм, осуществляющих разные стадии производства конечного продукта, в единую структуру."},{"t":"Взаимная поддержка","en":"logrolling","d":"торговля законодателей своими голосами, объединение усилий, чтобы добиться благоприятного для себя решения вопросов об обеспечении общественными товарами и услугами и квазиобщественными товарами."},{"t":"Взаимные (инвестиционные) фонды денежного рынка","en":"money market mutual funds, MMMF","d":"счета, приносящие процентный доход, который предлагают инвестиционные компании, собирающие средства вкладчиков для приобретения краткосрочных инструментов денежного рынка; вкладчики могут выписывать чеки на суммы не меньше установленной величины."},{"t":"Взаимные фонды","en":"mutual funds","d":"портфели акций и облигаций, выбираемых и покупаемых компаниями, создавшими взаимные фонды, которые финансируют приобретение этих ценных бумаг, объединяя для этого деньги тысяч отдельных инвесторов в фонд; включают как индексные фонды, так и активно управляемые фонды. Результаты деятельности фонда (прибыль или убытки) передаются отдельным инвесторам, вложившим свои средства в данный фонд."},{"t":"Взаимодополняющие товары","en":"complementary goods","d":"такие товары (или услуги), которые потребляются вместе и для которых существует обратное соотношение: когда цена на один из них падает, спрос на другой растет (и наоборот)."},{"t":"Взаимозависимость","en":"mutual interdependence","d":"ситуация, при которой изменение ценовой стратегии (или какого-либо другого параметра) одной фирмой сказывается на объеме продаж и прибыли другой фирмы (или других фирм); причем любая фирма, производящая такое изменение, может ожидать на нее реакцию со стороны другой фирмы или других фирм. «Вливание» (injection) - дополнительные средства, вли ваемые в поток «доходов — расходов»; инвестиции, закупки товаров и услуг органами власти, чистый экспорт."},{"t":"Внезапные колебания уровня цен","en":"price level surprises","d":"неожиданные изменения уровня цен."},{"t":"Внепроизводственные операции","en":"nonproduction transactions","d":"закупки и продажи любого товара (услуги), не являющегося продуктом текущего производства или услуги."},{"t":"Внерыночные операции","en":"nonmarket transactions","d":"производство товаров и услуг, не включаемых в ВВП, поскольку они не покупаются и не продаются."},{"t":"Внешнеторговый дефицит","en":"trade deficit","d":"превышение товарного (или товаров и услуг) импорта страны над ее товарным (или товаров и услуг) экспортом."},{"t":"Внешние платежи","en":"outpayments","d":"расходование валюты (собственной или иностранной) отдельными лицами, фирмами и правительством одной страны на покупку товаров и услуг в других странах; денежные переводы за границу; помещение инвестиционного дохода в других странах и вывоз капитала."},{"t":"Внешние платежные поступления","en":"inpayments","d":"поступления собственной или иностранной валюты отдельным лицам, фирмам и правительству одной страны из других стран в качестве платы за проданные ими за рубежом товары и услуги, или доходы от инвестиций, различного рода денежных переводов и приток капитала из-за гра ницы."},{"t":"Внешний государственный долг","en":"external public debt","d":"часть общего государственного долга, правами на получение которого владеют граждане, компании и институты из других стран."},{"t":"Внешний долг","en":"external debt","d":"частный или государственный долг иностранным гражданам, фирмам и учреждениям."},{"t":"Внутренний государственный долг","en":"internally held public debt","d":"задолженность государства гражданам, фирмам и учреждениям данной страны, т.е. держателям ценных бумаг правительства данной страны."},{"t":"Внутренняя цена","en":"domestic price","d":"цены на товары или услуги, сложившиеся внутри страны; определяются соотношением спроса и предложения."},{"t":"Вознаграждение труда работников и служащих","en":"compensation to employees","d":"выплачиваемые наемным работни Глоссарий кам заработная плата и жалованье плюс дополнительные выплаты работодателями работникам."},{"t":"Возобновляемые природные ресурсы","en":"renewable natural resources","d":"такие составляющие окружающей среды, как леса, вода в водоемах, флора и фауна, способные снова вырастать или созд
