в предельный продукт в денежной форме)."},{"t":"Теория рациональных ожиданий","en":"rational expectations theory","d":"гипотеза, согласно которой фирмы и домохозяйства ожидают, что кредитно-денежная и бюджетная политика окажет какое-то определенное влияние на экономику, и, руководствуясь собственной выгодой, предпринимают меры, делающие эту политику неэффективной."},{"t":"Теория реального экономического цикла","en":"real business cycle theory","d":"теория, согласно которой деловой цикл возни кает в результате изменений технологии и доступности ресурсов, которые, в свою очередь, влияют на производительность и таким образом увеличивают или сокращают долговременное совокупное предложение."},{"t":"Теория регулирования в интересах общества","en":"public interest theory of regulation","d":"допущение, согласно которому цель регулирования отрасли заключается в защите общества (потребителей) от злоупотребления естественными монополиями своей властью."},{"t":"Теория регулирования с помощью легального картеля","en":"legal cartel theory of regulation","d":"гипотеза о том, что отрасли сами хотят подвергнуться регулированию и стремятся к тому, чтобы правительственные чиновники осуществляли такое регулирование, поскольку тогда они получат право образовывать узаконенные картели."},{"t":"Теория человеческого Kanumajta","en":"theory of human capital","d":"концепция, согласно которой разница в заработной плате является следствием различий в инвестициях в че ловеческий капитал, а доходы низкооплачиваемых работников повышаются в результате увеличения объема таких инвестиций."},{"t":"Технический прогресс, технологическое преимущество","en":"technological advance","d":"новые и более качественные товары и услуги, новые, более совершенные способы их производства и распределения."},{"t":"Технология","en":"technology","d":"объем знаний и технологий, который можно использовать для производства товаров и услуг из экономических ресурсов."},{"t":"Технология, активизирующая использование капитала","en":"capital-using technology","d":"улучшение технологии, требующее увеличения используемого капитала для производства конкретного количества продукта."},{"t":"Технология, экономящая капитал (материал интернетглавы)","en":"capital-saving technology","d":"улучшение техноло гии, позволяющее получать большее количество про дукта при использовании прежнего количества капитала (и позволяющее производить прежнее количество продуктов при меньших затратах капитала)."},{"t":"Товар длительного пользования","en":"durable good","d":"потребительский товар с расчетным сроком службы (использования) в течение трех лет или более."},{"t":"Товар кратковременного пользования","en":"nondurable good","d":"потребительский товар со сроком пользования (жизни) менее трех лет."},{"t":"Товар низшей категории","en":"inferior good","d":"товар или услуга, которые потребители покупают в меньших (больших) количествах при постоянных ценах, когда их доходы увеличиваются (уменьшаются)."},{"t":"Товар, предназначенный для личного потребления","en":"private good","d":"товар или услуга, к которым применим принцип исключаемости и которыми частные фирмы снабжают тех, кто готов за них платить."},{"t":"Товарно","en":"","d":"материальные запасы, запасы (inventories) — произведенные, но еще не проданные товары."},{"t":"Товары","en":"","d":"заменители (substitute goods) — взаимозаменяемые товары или услуги, которые могут быть использованы один вместо другого. Иными словами, снижение (повышение) цены одного товара или услуги вызывает уменьшение (увеличение) спроса на другой (другую); при росте цены возникает противоположная ситуация."},{"t":"Торговая марка","en":"trademark","d":"правовая защита, дающая создателям продукта исключительное право использовать конкретное торговое название."},{"t":"Торговый баланс","en":"trade balance","d":"объем товарного экспорта страны (или товаров и услуг) за вычетом ее товарного импорта."},{"t":"Торговый блок","en":"trade bloc","d":"группа стран, которые снизили или сняли торговые барьеры относительно членов блока. Примерами могут служить Европейский союз, Североамериканское соглашение о свободной торговле."},{"t":"Точка безубыточности (break","en":"","d":"even point) — объем продукции, при котором фирма получает нормальную прибыль (общие доходы = общие издержки), но не получает экономической прибыли."},{"t":"Точка пересечения с осью ординат","en":"vertical intercept","d":"точка, в которой прямая пересекает на графике ось ординат."},{"t":"Трагедия общего пользования","en":"Tragedy of the commons","d":"тенденция, проявляющаяся в том, что общественные природные ресурсы используются слишком активно, при этом им не уделяется должного внимания, из-за чего их состояние ухудшается, так как ни у частных лиц, ни у общественных институтов нет стимула ограничи вать использование этих ресурсов, сохранять их чистоту или высокое качество."},{"t":"Трансфертные платежи органов власти","en":"government transfer paym ent","d":"расходование органами власти денег (или товаров и услуг), в обмен на которые оно не получает товары и услуги текущего производства."},{"t":"Трансфертный платеж","en":"transfer payment","d":"выплата органом власти или фирмой домохозяйству или фирме денег (или передача товаров и услуг), взамен которых плательщик непосредственно не получает товары или услуги."},{"t":"Трастовый фонд системы социального обеспечения","en":"social security trust fund","d":"федеральный фонд, в котором накапливаются избыточные налоговые поступления по программе социального обеспечения, полученные за год, чтобы удовлетворить обязательства по социальному обеспечению, которые превосходят налоговые поступления по социальному обеспечению в последующий год."},{"t":"Труд","en":"labor","d":"физические и умственные способности и усилия людей, которые могут быть использованы для производства товаров и услуг."},{"t":"Трудоемкий товар (labor","en":"","d":"intensive commodity) — продукт, на производство которого затрачивается относительно большое количество труда."},{"t":"УАТ","en":"","d":"см. Налог на добавленную стоимость."},{"t":"Убывающая предельная отдача","en":"diminishing marginal returns","d":"см. Закон убывающей отдачи."},{"t":"Увеличение эффективности благодаря миграции","en":"efficiency gains from migration","d":"повышение объема продукции в результате миграции в стране, куда направляется поток мигрантов, который по объему превышает снижение потока продукции из-за эмиграции людей из своих стран."},{"t":"Удельные (единичные) производственные затраты","en":"perunit production cost","d":"средние производственные затраты 1003 при определенном уровне выпуска; общая стоимость затрат факторов производства, деленная на число единиц выпуска."},{"t":"Уклонение от работы","en":"shirking","d":"ситуация, когда работники уменьшают свою полезность или благополучие путем отказа или уклонения от работы."},{"t":"Управление спросом","en":"demand management","d":"использование фискальной и кредитно-денежной политики в целях увеличения или сокращения совокупного спроса."},{"t":"Уравнение обмена","en":"equation of exchange","d":"уравнение M V = PQ, где M — это количество денег в обращении, V — скорость обращения денег в кругообороте доходов, Р —уровень цен, a Q — физический объем произведенных конечных товаров и услуг."},{"t":"Уровень бедности","en":"poverty rate","d":"доля населения с доходом ниже установленного федеральным правительством официального уровня."},{"t":"Уровень безработицы","en":"unemployment rate","d":"доля рабочей силы, не занятая в данный момент."},{"t":"Уровень безработицы при полной занятости (fu/1","en":"","d":"employment unemployment rate) —уровень безработицы в условиях отсутствия циклической безработицы, уровень безработицы, составляющий, в силу неизбежной фрикционной и структурной безработицы, примерно 4—5% рабочей силы."},{"t":"Уровень вовлеченности в состав рабочей силы","en":"labor-force participation rate","d":"процентная доля трудоспособного населения, которая действительно входит в состав р а бочей силы."},{"t":"Уровень занятости","en":"employment rate","d":"доля (процент) численности рабочей силы, имеющей работу на определенный момент."},{"t":"Уровень цен","en":"price level","d":"средневзвешенная величина цен, уплачиваемых за готовые товары и услуги, произведенные в стране."},{"t":"Уругвайский раунд","en":"Uruguay Round","d":"раунд торговых переговоров, начавшийся в 1995 г., закончившийся в 2005 г., в ходе которого была создана Всемирная торговая организация, в большей степени либерализована торговля товарами и услугами, обеспечена дополнительная защита интеллектуальной собственности (например, в виде патентов и копирайтов) и достигнута договоренность о сокращении размеров субсидий сельскому хозяйству."},{"t":"Условия торговли","en":"terms of trade","d":"соотношение обмена какого-то количества единиц одного товара на какое-то количество единиц другого товара; цена товара или услуги; количество одного товара или услуги, которое приходится отдать, чтобы приобрести единицу другого товара или услуги."},{"t":"Услуга","en":"service","d":"то, что неосязаемо (невидимо) и в обмен на что потребитель, фирма или орган власти готовы платить."},{"t":"Установление пределов инфляции","en":"inflation targeting","d":"ежегодно высказываемые заявления о задаваемом целе вом диапазоне инфляции на несколько лет в будущем, подкрепляемые соответствующей кредитно-денежной политикой, направленной на достижение этой цели."},{"t":"«Утечка мозгов»","en":"brain drain","d":"эмиграция из страны высокообразованных специалистов и высококвалифицированных работников."},{"t":"«Участвуй или плати»","en":"play or pay","d":"способ расшире ния страхования здоровья, требующий от работодате лей или обеспечения страхованием их работников, или выплаты специальных налогов с заработной платы для финансирования страхования работников, не имеющих страховки."},{"t":"Учет чеков","en":"check clearing","d":"процедура перехода средств с чековых счетов тех, кто выписал чек, на чековые счета тех, кто получил чек."},{"t":"Учетная ставка","en":"discount rate","d":"ставка процента, кото рый федеральные резервные банки взимают по ссудам, предоставляемым коммерческими банками и ссудосбере гательным учреждениями."},{"t":"Фактические инвестиции","en":"actual investment","d":"реальный объем инвестиций частных фирм ; равен сумме запланированных и незапланированных инвестиций."},{"t":"Фактические нарушения","en":"per se violations","d":"виды сговора, такие как попытки установить цены или поделить рынок, которые представляют собой нарушение антитрестовских законов даже в том случае, если они оказались тщетными."},{"t":"Фактические резервы","en":"actual reserves","d":"сумма депозитов банка в федеральном резервном банке данного региона, а также его кассовая наличность."},{"t":"Фактор предложения","en":"в условиях роста) (supply factor (in growth)","d":"увеличение наличного количества ресурса, повышение его качества или расширение технических знаний, которые создают для экономики возможность производить больший объем товаров и услуг."},{"t":"Фактор спроса","en":"в условиях роста) (demand factor (in growth)","d":"повышение уровня совокупного спроса, обусловливающее экономический рост, возможность которого создает увеличение потенциала экономики."},{"t":"Факторы производства","en":"factors of production","d":"экономические ресурсы, земля, капитал, труд и предпринимательская способность."},{"t":"Факторы эффективности","en":"в условиях роста) (efficiency factors (in growth)","d":"экономический потенциал, позволяющий эффективно комбинировать ресурсы для достижения реально возможного экономического роста при данных затратах факторов предложения."},{"t":"Федеральная комиссия по торговле","en":"Federal Trade Commission, FTC","d":"учрежденная на основе Закона о Федеральной комиссии по торговле от 1914 г. комиссия в составе пяти членов, созданная для расследования методов недобросовестной конкуренции со стороны компаний, организации слушаний по жалобам на применение таких методов и направления запретительных предписаний фирмам-нарушителям."},{"t":"Федеральная корпорация страхования депозитов","en":"Federal Deposit Insurance Corporation, FDIC","d":"корпорация, полу чившая лицензию федерального правительства на стра хование депозитных обязательств (до 100 тыс. долл.) коммерческих банков и сберегательных институтов (за ис ключением кредитных союзов, депозиты которых страху ются администрацией Национального кредитного союза)."},{"t":"Федеральная резервная система","en":"Federal Reserve System","d":"ключевой элемент банковской системы США, которая состоит из Совета управляющих и 12 федеральных ре зервных банков."},{"t":"Федеральное правительство","en":"federal government","d":"пра вительство США, действующее в стране помимо пра вительств штатов и местных властей."},{"t":"Федеральные резервные банки","en":"Federal Reserve Banks","d":"12 банков, уполномоченных правительством США контролировать денежное предложение и выполнять другие функции. См. Центральный банк, Квазигосударственный банк и Банк банков."},{"t":"Федеральный комитет по операциям на открытом рынке","en":"Federal Open M arket Committee, FOMC","d":"группа из 12 членов, определяющая политику федеральных резервных банков в области закупок и продаж на рынке государственных ценных бумаг."},{"t":"Фермерская проблема","en":"farm problem","d":"технологический прогресс в сочетании с неэластичными ценами и относительно постоянным спросом, в результате чего сельское хозяйство превращается в сокращающуюся отрасль; также тенденция резких колебаний фермерских доходов из года в год."},{"t":"Фиксирование цены","en":"","d":"см. Ценовой сговор."},{"t":"Фиксированный валютный курс","en":"fixed exchange rate","d":"обменный курс валюты, свободное повышение или снижение которого не допускается в связи с изменением спроса и предложения."},{"t":"Финансовые инвестиции","en":"financial investment","d":"покупка финансового актива (такого как акция, облигация или доля взаимного фонда) или реального актива (например, дома, участка земли или предприятий) или создание таких активов в расчете на получение в будущем финансовых преимуществ."},{"t":"Финансовый капитал","en":"financial capitaI","d":"см. Денежный капитал."},{"t":"Фирма","en":"firm","d":"организация, использующая ресурсы для производства товаров или услуг с целью получения прибыли, владеющая и управляющая одним или несколькими предприятиями."},{"t":"Фискальная (финансово","en":"","d":"бюджетная) политика (fiscal policy) — изменения, вносимые правительством в порядок государственных расходов и налогообложения, направленные на обеспечение полной занятости и производство неинфляционного национального продукта; также называется дискреционной фискальной политикой."},{"t":"Фискальная пошлина","en":"тариф) (revenue tariff","d":"пошлина {тариф), вводимая с целью пополнения доходов (федерального) правительства."},{"t":"Формула со средними значениями {midpoint formula)","en":"","d":"метод вычисления ценовой эластичности предложения и ценовой эластичности спроса , при котором берутся средние значения двух цен и двух количеств продукции в качестве точек, по которым рассчитываются проценты."},{"t":"Формула эластичности {elasticity formula)","en":"","d":"см. Ценовая эластичность спроса."},{"t":"Фрикционная безработица","en":"frictional unemployment","d":"безработица, связанная с добровольной сменой работниками места работы и периодами временного увольнения; временная незанятость в периоды перехода работников с одной работы на другую."},{"t":"Функциональное распределение дохода","en":"functional distribution of income","d":"способ распределения национального дохода страны между теми, кто выполняет в экономике различные функции (обеспечивает экономику различными видами ресурсов); разделение национального дохода на заработную плату и жалованье, доход собственников, прибыль корпораций, процент и ренту. Функциональное финансирование {functionalfinance) —использование фискальной политики для обеспечения производства неинфляционного ВВП в условиях полной занятости независимо от воздействия этой политики на государственный долг."},{"t":"Х-неэффективность","en":"X-inefficiency","d":"неспособность произвести любой данный объем продукции при самых низких средних (и совокупных) издержках производства."},{"t":"«Целлофановое дело Du Pont»","en":"Du Pont cellophane case","d":"возбужденное против компании Du Pont дело о нарушении антитрестовского законодательства, по которому Верховный суд США постановил (в 1956 г.), что, хотя компания Du Pont обладает монополией на узко ограниченном рынке сбыта целлофана, она не монополизировала более широкий рынок мягких упаковочных материалов, следовательно, невиновна в нарушении закона Шермана."},{"t":"Цена {price)","en":"","d":"количество денег, уплачиваемое и получаемое за единицу товара, услуги или ресурса."},{"t":"Цена, обеспечивающая справедливую прибыль (fair","en":"","d":"return price) — цена продукта, которая позволяет производи Глоссарий 1005 телю получать нормальную прибыль и которая равна средним общим издержкам производства этого продукта."},{"t":"Ценностное суждение {value judgment)","en":"","d":"суждение о том, что желательно или нежелательно; мнение о том, что должно быть и чего не должно быть (о том, что правильно или справедливо и что неправильно или несправедливо)."},{"t":"Ценные бумаги, выпущенные правительством США","en":"U.S. securities","d":"краткосрочные казначейские векселя, налоговые сертификаты Казначейства, долгосрочные казначейские обязательства и сберегательные облигации, выпущенные федеральным правительством США для финансирования расходов, превышающих налоговые поступления."},{"t":"Ценовая дискриминация","en":"price discrimination","d":"продажа в один и тот же момент одного продукта разным покупателям по разным ценам, когда разница в ценах для разных покупателей не оправдана разными издержками производства этого продукта."},{"t":"Ценовая поддержка","en":"price support","d":"предписанная правительством минимальная цена, ниже которой продавец товара или услуги не может их предлагать покупателям; установленная законом цена или поддерживаемая минимальная цена."},{"t":"Ценовая эластичность предложения","en":"price elasticity of supply","d":"отношение процентного изменения величины предложения товара или ресурса к процентному изменению его цены, реакция величины предложения товара или ресурса на изменение его цены."},{"t":"Ценовая эластичность спроса","en":"price elasticity of demand","d":"отношение процентного изменения величины спроса на товар или ресурс к процентному изменению его цены. мера реакции величины покупательского спроса на изменение цены товара или ресурса."},{"t":"Ценовое лидерство","en":"price leadership","d":"применяемый фирмами в условиях олигополии неофициальный метод установления цены на производимый ими товар; одна фирма (лидер) первой объявляет изменение цены, а другие (следующие за лидером) фирмы вскоре объявляют идентичные или примерно такие же изменения цены."},{"t":"Ценовой индекс ВВП","en":"GDP price index","d":"ценовой индекс на все товары и услуги, входящие в валовой внутренний продукт; ценовой индекс, используемый для корректировки номинального валового внутреннего продукта и пересчета его в реальный валовой внутренний продукт."},{"t":"Ценовой лидер","en":"price maker","d":"продавец (или покупатель) товара или ресурса, способный воздействовать на его цену путем изменения количества предлагаемого к продаже (покупаемого) товара или ресурса."},{"t":"Ценовой последователь","en":"price taker","d":"продавец (покупатель) товара или ресурса, неспособный воздействовать на его цену путем изменения количества предлагаемого к продаже (покупаемого) товара."},{"t":"Ценовой сговор","en":"price fixing","d":"тайное соглашение между двумя или более фирмами об установлении цены на их продукцию; закон Шермана запретил подобную практику."},{"t":"Централизованное экономическое планирование","en":"central economic planning","d":"определение правительством целей экономической политики и направлений использования ресурсов для достижения этих целей."},{"t":"Центральный банк","en":"Central bank","d":"банк, главной функцией которого является контроль за массой денег в обращении —предложением денег ; в США в качестве него выступает Федеральная резервная система."},{"t":"Цеховой профсоюз","en":"craft union","d":"профсоюз, ограничивающий состав своих членов лишь работниками определенной профессии (цеха)."},{"t":"Циклическая асимметричность","en":"cyclical asymmetry","d":"идея, заключающаяся в том, что кредитно-денежная политика может быть более успешной для замедления экспансии и контроля инфляции, чем для оказания помощи экономике, когда она выбирается из жесткого экономического спада."},{"t":"Циклическая безработица","en":"cyclical unemployment","d":"вид безработицы, порождаемой недостаточностью общих расходов (или совокупного спроса)."},{"t":"Циклически сбалансированный бюджет","en":"cyclically balanced budget","d":"равенство правительственных расходов на товары и услуги чистому объему налоговых поступлений в пределах экономического цикла ; возникающий в периоды спада Деловой активности дефицит бюджета компенсируется бюджетным избытком в периоды процветания (инфляции)."},{"t":"Циклический дефицит","en":"cyclical deficit","d":"дефицит федерального бюджета, вызванный спадом деловой активности и обусловленным им сокращением налоговых поступлений."},{"t":"Частичный резерв","en":"fractional reserve","d":"резервная норма, составляющая менее 100% депозитных обязательств коммерческого банка или сберегательного учреждения."},{"t":"Частная собственность","en":"private property","d":"право частных лиц и фирм приобретать, владеть, контролировать, использовать, продавать и завещать землю, капитал и другие активы."},{"t":"Частный продукт","en":"","d":"см. Товар, предназначенный для личного потребления."},{"t":"Частный сектор","en":"private sector","d":"совокупность домохозяйств и фирм в стране."},{"t":"Часть программы Medicare, предназначенная для компенсации Затрат пациентов на лекарства","en":"Medicare Part D","d":"вновь введенное (2006) положение в программе M edi care, предоставляющее лицам, имеющим на это право, возможность приобрести у частных страховых компаний с большой скидкой медицинскую страховку, в результате чего расходы этих лиц на оплату приобретаемых по рецепту лекарств существенно снижаются."},{"t":"Чековый депозит","en":"вклад) (checkable deposit","d":"любой вклад в коммерческом банке или сберегательном учреж дении, на который можно выписать чек; включает бессрочные вклады, вклады с правом выписывать чеки на предъявителя."},{"t":"Человеческий капитал","en":"human capita!","d":"знания, навыки и умения, благодаря которым человек работает производительно."},{"t":"Четыре фундаментальных вопроса","en":"экономике) (Four Fundamental Questions (of economics)","d":"четыре основных вопроса, на которые каждая экономика должна дать ответ: что производить, как это производить, как разделять весь полученный продукт и как гарантировать экономическую гибкость."},{"t":"Чистая","en":"абсолютная) монополия (pure monopoly","d":"рынок, который отличают следующие черты: одна фирма продает единственный в своем роде продукт; доступ на него закрыт; действующая на нем одна фирма обладает значительным контролем над ценой на продаваемый ею продукт; здесь может действовать, а может и не действовать неценовая конкуренция."},{"t":"Чистая выгода","en":"net benefit","d":"общий выигрыш от какой-то деятельности или политики за вычетом общих издержек на эту деятельность или политику."},{"t":"Чистая прибыль","en":"pure profit","d":"см. Экономическая прибыль."},{"t":"Чистая процентная ставка","en":"pure rate of interest","d":"в основном безрисковая процентная ставка, устанавливается на длительную перспективу, на которую не влияет несовершенство рынка."},{"t":"Чистые налоговые поступления","en":"net taxes","d":"налоговые поступления правительства минус трансфертные платежи органов власти."},{"t":"Чистые трансфертные платежи","en":"net transfers","d":"личные и трансфертные платежи органов власти жителям других стран минус личные и трансфертные платежи органов власти, полученные от жителей других стран."},{"t":"Чистые частные внутренние инвестиции","en":"net private domestic investment","d":"валовые частные внутренние инвестиции минус амортизационные отчисления на основные средства производства; прирост основного капитала страны в течение года."},{"t":"Чистый внутренний продукт","en":"net domestic product","d":"ва ловой внутренний продукт минус часть годового выпуска, использованного на восстановление основных средств производства, потребленных в процессе производства; предназначается для потребления или увеличения за пасов основных средств производства (капитала)."},{"t":"Чистый инвестиционный доход","en":"net investment income","d":"доход в виде процентов и дивидендов, получаемых гражданами одной страны от граждан других стран, за вычетом процентов и дивидендов, выплачиваемых гражданами данной страны гражданам других стран."},{"t":"Чистый экспорт","en":"net export","d":"экспорт минус импорт."},{"t":"Шоки совокупного предложения","en":"aggregate supply shocks","d":"неожиданные и крупные изменения стоимости ресурсов, смещающие кривую совокупного предложения страны."},{"t":"Шоки спроса","en":"demand shocks","d":"неожиданные изменения спроса."},{"t":"Экономика предложения (supply","en":"","d":"side economics) — раздел современной макроэкономической теории, использующий понятия «издержки» и «совокупное предложение» при трактовке терминов «инфляция», «безработица» и «экономический рост»."},{"t":"Экономикс, экономическая наука","en":"economics","d":"общественная наука об использовании редких экономических ресурсов с целью максимального удовлетворения неограниченных материальных потребностей общества."},{"t":"Экономическая концентрация","en":"economic concentration","d":"описание или мера уровня монополизации либо конкуренции отрасли. См. Показатель концентрации."},{"t":"Экономическая модель","en":"economic model","d":"упрощенная картина действительности; абстрактное обобщение."},{"t":"Экономическая политика","en":"policy economics","d":"формулирование политики, ставящей своей целью добиться желаемых результатов или воспрепятствовать возникновению нежелательных явлений в экономике."},{"t":"Экономическая прибыль","en":"economic profit","d":"общий доход фирмы за вычетом всех ее экономических зат рат, включая явные и скрытые издержки ; синоним терминов «чистая прибыль» и «сверхприбыль»."},{"t":"Экономическая рента","en":"economic rent","d":"цена за использование земли и других естественных ресурсов, предложение которых постоянно (т.е. существует совершенно неэластичное предложение)."},{"t":"Экономическая система","en":"economic system","d":"определенный пакет конкретных мероприятий или координаци Глоссарий 1007 онных механизмов для решения проблемы экономии; метод организации экономики; существуют два общих типа организации экономики —рыночная и командная."},{"t":"Экономическая теория","en":"economic theory","d":"выведение экономических принципов из соответствующих фактов экономической действительности; экономический принцип."},{"t":"Экономическая эффективность","en":"economic efficiency","d":"оптимальное соотношение между минимальными затратами ресурсов и производимым в результате их использования объемом товаров или услуг; включает как производственную эффективность, так и эффективность распределения."},{"t":"Экономические издержки","en":"economic cost","d":"затраты, которые должна понести фирма для получения эффекта от ресурсов ; часть выручки, которую фирма должна направить на приобретение ресурсов и отвлечь от альтернативных направлений использования; равны объему затрат на другие продукты, которые не могут быть про изведены, когда ресурсы отвлечены на выпуск именно данного продукта."},{"t":"Экономические иммигранты","en":"economic immigrants","d":"меж дународные иммигранты, переезжающие в одну страну из другой, чтобы получить экономические преимущества, в частности более привлекательные возможности трудоустройства."},{"t":"Экономические инвестиции","en":"economic investment","d":"см. Инвестиции."},{"t":"Экономические ресурсы","en":"economic resources","d":"земля, труд, капитал и предпринимательская способность, используемые при производстве товаров и услуг, производственных факторов; факторы производства."},{"t":"Экономический анализ","en":"economic analysis","d":"выведение экономических принципов из соответствующих фактов экономической действительности."},{"t":"Экономический закон","en":"economic law","d":"неоднократно проверенный и доказавший свою верность на протяжении длительного времени экономический принцип."},{"t":"Экономический подход","en":"economic perspective","d":"способность индивидов и институтов принимать рациональные или целенаправленные решения, основывающиеся на учете затрат и выхода, которые могут явиться следствием их действий."},{"t":"Экономический принцип","en":"economic principle","d":"обобщение мотивов и практики экономического поведения индивидов и институтов."},{"t":"Экономический рост","en":"economic growth","d":"1) показанное на графике (кривой) увеличение производственных возможностей в результате увеличения объема используемых факторов производства или совершенствования техники и технологии', 2) увеличение либо реального объема продукции (ВВП), либо реального объема продукции на душу населения."},{"t":"Экономический совет при президенте","en":"Council of Economic Advisers, CEA","d":"группа, состоящая из трех человек, которые помогают президенту США в решении экономических вопросов (включая подготовку ежегодного доклада президента по вопросам экономики Конгрессу США)."},{"t":"Экономический спад","en":"recession","d":"период снижения реального ВВП, во время которого происходит сокращение реального дохода и рост безработицы."},{"t":"Экономический тред-юнионизм","en":"business unionism","d":"кон цепция, согласно которой профсоюз призван ограни чивать свою деятельность такими практическими и краткосрочными задачами, как борьба за повышение заработной платы, сокращение рабочего времени, улучшение условий труда. Экономический (деловой) цикл (business cycle) —повторяющиеся на протяжении ряда лет подъемы и спады уровня экономической активности. Состоит из фазы пика, подъема, спада (рецессии), восстановления."},{"t":"Экономическое регулирование","en":"economic regulation","d":"см. Отраслевое регулирование."},{"t":"Экономия за счет масштабов деятельности; положительный эффект масштаба","en":"economies of scale","d":"сокращение средних общих издержек производства по мере того, как в долгосрочной перспективе фирма увеличивает размеры предприятия (объем продукции); эффект массового производства."},{"t":"Экспансионистская кредитно","en":"","d":"денежная политика (expansionary monetary policy) — действия Федеральной ре зервной системы, направленные на повышение предложения денег, снижение процентных ставок и увеличение реального ВВП; политика «легких денег»."},{"t":"Экспансия","en":"expansion","d":"часть бизнес-цикла, при котором реальный ВВП, доход и занятость возрастают."},{"t":"Экспорт","en":"exports","d":"товары и услуги, произведенные в одной стране и проданные потребителям в другой стране."},{"t":"Экспортная сделка","en":"export transaction","d":"продажа товаров или услуг, увеличивающая количество иностранных денег на руках у граждан, фирм и правительства данной страны."},{"t":"Экспортные субсидии","en":"export subsidies","d":"правительствен ные платежи внутренним производителям с целью сни зить цену на ряд продуктов для иностранных покупа телей."},{"t":"Экстерналия","en":"externality","d":"связанные с потреблением или производством товара (услуги) выгоды, полученные какой-либо стороной, или издержки, причиненные какой-либо стороне, кроме покупателя или продавца этого товара (или услуги). См. Положительная экст ерналия, Отрицательная экстерналия."},{"t":"Эластичное предложение","en":"elastic supply","d":"предложение продукта или ресурса, для которого ценовая эластич ность больше единицы, а процентное изменение величины предложения больше процентного изменения цены товара."},{"t":"Эластичность спроса на ресурс","en":"elasticity of resource demand","d":"показатель реакции фирм на изменение цены конкретного ресурса, которым они пользуются; процентные изменения в количестве запрашиваемого ресурса, деленное на процентное изменение его цены."},{"t":"Эластичность спроса по доходу","en":"income elasticity of de mand","d":"отношение процентного изменения спроса на продукт к процентному изменению дохода; отражает влияние изменений в доходах на расходы потребителей."},{"t":"Эластичный спрос","en":"elastic demand","d":"спрос на продукт или ресурс, для которого коэффициент ценовой эластичности больше единицы; процент изменения величины спроса больше процента изменения цены товара."},{"t":"Электронные платежи","en":"electronic payments","d":"покупки, при которых оплата за них перечисляется электронным образом. Примеры: перечисления Fedware, автоматизированная клиринговая палата, платежи через систему PayPal и выплаты через смарт-карты, на которых наличность учитывается в цифровом виде."},{"t":"Эмиграция","en":"emigration","d":"отъезд (исход) резидентов из одной страны в другую страну."},{"t":"Эти потоки сопровождаются перемещением денег в обратном направлении","en":"","d":"от фирм к домохозяйствам и от домохозяйств к фирмам."},{"t":"Эффект богатства","en":"wealth effect","d":"склонность людей увеличивать свои расходы на потребление, когда стои мость их финансовых и реальных активов растет, и снижать свои расходы на потребление, когда стоимость этих активов снижается."},{"t":"Эффект вытеснения (crowding","en":"","d":"out effect) — повышение процентных ставок и последующее сокращение планируемого чистого объема инвестиций в экономике, вызванное ростом займов федерального правительства на денежном рынке."},{"t":"Эффект дохода","en":"income effect","d":"воздействие, которое изменение цены продукта оказывает на реальный доход (покупательную способность) потребителя и, соответственно, на количество продукта, которое потребитель купит."},{"t":"Эффект замещения","en":"substitution effect","d":"1) влияние, ко торое изменение цены потребительского товара ока зывает на его относительную дороговизну и, соответ ственно, на количество товара, которое потребитель готов купить; 2) влияние, которое изменение цены ресурса окажет на количество этого ресурса, используемого фирмой при условии, что фирма не изменит объем своего производства."},{"t":"Эффект импортных закупок","en":"foreign purchases effect","d":"обратная связь между объемом чистого экспорта страны и существующим в ней уровнем цен, а также уровнем цен в других странах."},{"t":"Эффект мультипликатора","en":"multiplier effect","d":"влияние, которое изменение в объеме совокупных расходов или совокупного спроса оказывает на равновесный ВВП (влияние, вызванное изменением в объеме потребления, инвестиции, расходов органов власти на товары и услуги или в объеме чистого экспорта)."},{"t":"Эффект объема производства","en":"output effect","d":"воздействие повышения цены одного ресурса на повышение издержек производства и снижение количества продукции, которое фирма считает наиболее выгодным произвести; его результирующее воздействие — снижение объема других ресурсов и, следовательно, противоположное снижение цены ресурсов (факторов производства)."},{"t":"Эффект особых интересов (special","en":"","d":"interest effect) — воздействие, выражающееся в отстаивании правительством интересов (целей) небольших групп в ущерб интересам значительно больших групп."},{"t":"Эффект перелива","en":"spillover","d":"связанные с потреблением или производством товара (услуги) выгоды, полученные какой-либо стороной, или издержки, причиненные какой-либо стороне, кроме покупателя или продавца этого товара (или услуги). См. Выгоды перелива, И здержки перелива."},{"t":"Эффект процентной ставки (interest","en":"","d":"rate effect) — повышение (снижение) уровня цен ведет к повышению (снижению) спроса на деньги, повышает (снижает) процентные ставки и в результате сокращает (увеличивает) общий объем расходов в стране."},{"t":"Эффект реальных наличных средств (real","en":"","d":"balances effect) — рост (снижение) уровня цен имеет тенденцию снижать (повышать) реальную стоимость (или покупательную способность) финансовых активов с фиксированным денежным выражением, а в результате и сокращать (увеличивать) общий объем расходов в экономике; также называется эффектом богатства."},{"t":"Эффект чистого экспорта","en":"net export effect","d":"концепция, в соответствии с которой влияние изменения кредитно-денежной или фискальной политики будет усиливаться или ослабляться из-за последующего изменения объема чистого экспорта. Это изменение чистого экспорта происходит из-за изменения реальных процентных ставок, которые, в свою очередь, влияют на обменные курсы."},{"t":"Эффективное распределение ресурсов","en":"efficient allocation of resources","d":"распределение ресурсов на производство 1009 различных товаров и услуг, которое ведет к максимальному удовлетворению запросов потребителей: производство социально оптимальной потребительской корзины из ограниченных ресурсов."},{"t":"Эффективность производства","en":"productive efficiency","d":"производство товара с наименьшими издержками; использование минимального объема ресурсов для производства данного объема продукции; производство данного объема продукции при минимальных средних общих издержках, при которых предельный продукт на каждый вложенный доллар будет одинаковым для всех ресурсов."},{"t":"Эффективность распределения ресурсов","en":"allocative efficiency","d":"распределение среди фирм и отраслей ресурсов, необходимых для обеспечения производства тех продуктов, в которых больше всего нуждается общество (потребители); производство каждого такого продукта в условиях, когда предельные издержки равны цене или предельной выгоде; объем производства каждого продукта, при котором предельные издержки и цены или предельные выгоды равны и сумма излишка потребителя и излишка производителя является максимальной."},{"t":"Эффективный уровень оплаты труда","en":"efficiency wage","d":"уровень оплаты труда, который позволяет минимизировать расходы на оплату труда на единицу выпуска."},{"t":"Явные издержки","en":"explicit cost","d":"денежные расходы фирмы на приобретение у стороннего поставщика необходимых ресурсов."}];
</script>
<script>
// ---------- utils ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(s,n)=>n?Math.round(s/n*100):0;
const today=()=>new Date().toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit"});
const PASS=70;

// ---------- cycles ----------
const CYCLES=[{id:"C1",title:"Лексика и стиль",sub:"Разговорность, эмоции, жаргон, «я», термины законов и паспорта 5.2.3",lessons:LESSONS},CYCLE2,CYCLE3,CYCLE4,CYCLE5];
CYCLES.forEach((c,ci)=>{c.n=ci+1;c.lessons.forEach((l,i)=>{l.cyc=c.id;l.idx=i})});
const ALL_LESSONS=CYCLES.flatMap(c=>c.lessons);
STYLE_CYCLE.n="Р";STYLE_CYCLE.lessons.forEach((l,i)=>{l.cyc="R";l.idx=i});
const LBY=Object.fromEntries(ALL_LESSONS.concat(STYLE_CYCLE.lessons).map(l=>[l.id,l]));
const CBY=Object.fromEntries(CYCLES.concat([STYLE_CYCLE]).map(c=>[c.id,c]));
const clab=c=>c.id==="R"?"Стиль руководителя":"Цикл "+c.n;
const chref=c=>c.id==="R"?"#style":"#cycle-"+c.id;
const OFFLINE=!!window.NSLOG_OFFLINE;
const ONLINE_URL="https://claude.ai/artifact/1DfDQh4pNQfS6HyiidSjXp";
const TOTAL_L=ALL_LESSONS.length;

// ---------- progress / storage ----------
const LSK="nslog523-progress";
const blank=()=>({lessons:{},cycles:{},quest:{},turns:{ok:0,tries:0},seen:{},terms:{},para:[],moves:{}});
let P=blank();
try{const s=localStorage.getItem(LSK);if(s)P=Object.assign(P,JSON.parse(s))}catch(e){}
function migrate(){P.cycles=P.cycles||{};if(P.cycle){P.cycles.C1=mergeRec(P.cycles.C1,P.cycle);delete P.cycle}P.para=P.para||[];P.turns=P.turns||{ok:0,tries:0};P.moves=P.moves||{}}
let dbRef=null, db=null;
function saveLocal(){try{localStorage.setItem(LSK,JSON.stringify(P))}catch(e){}}
let saveT=null;
function save(){saveLocal();clearTimeout(saveT);saveT=setTimeout(()=>{if(dbRef)dbRef.set({p:JSON.stringify(P),at:Date.now()}).then(()=>syncNote("Результаты сохранены в аккаунте")).catch(()=>syncNote("Сохранено в браузере"))},600)}
function syncNote(t){const el=$("#sync");if(el)el.innerHTML='<span class="sync">'+esc(t)+'</span>'}
function mergeRec(a,b){if(!a)return b||null;if(!b)return a;const h=[...(a.hist||[]),...(b.hist||[])];const seen=new Set();const hist=h.filter(x=>{const k=x.s+"/"+x.n+"/"+x.d+"/"+(x.ts||"");if(seen.has(k))return false;seen.add(k);return true}).sort((x,y)=>(x.ts||0)-(y.ts||0)).slice(-20);
 return{best:Math.max(a.best||0,b.best||0),att:Math.max(a.att||0,b.att||0,hist.length),last:hist.length?hist[hist.length-1].s:a.last,n:a.n||b.n,hist}}
function merge(r){try{const o=JSON.parse(r);if(o.cycle){o.cycles=o.cycles||{};o.cycles.C1=mergeRec(o.cycles.C1,o.cycle)}
 for(const k in o.lessons||{})P.lessons[k]=mergeRec(P.lessons[k],o.lessons[k]);
 for(const k in o.cycles||{})P.cycles[k]=mergeRec(P.cycles[k],o.cycles[k]);
 for(const k in o.quest||{})P.quest[k]=Math.max(P.quest[k]||0,o.quest[k]);
 if(o.turns){P.turns.ok=Math.max(P.turns.ok||0,o.turns.ok||0);P.turns.tries=Math.max(P.turns.tries||0,o.turns.tries||0)}

 el.innerHTML=`<p class="lead" style="font-size:15px">Восемь ходов статьи в манере руководителя. Напишите свой вариант на своей теме, сравните с образцом${OFFLINE?"":" или проверьте с Claude"}.</p>
 <div class="moves">${STYLE_MOVES.map((m,i)=>`<div class="card move" data-m="${m.id}" style="display:grid;gap:10px">
  <div class="row" style="justify-content:space-between"><b>${i+1}. ${esc(m.t)}</b>${P.moves[m.id]?`<span class="chip ok">сделано</span>`:""}</div>
  <div class="formula">${esc(m.f)}</div>
  <label for="mv-${m.id}" style="font-size:14px;color:var(--muted)">${esc(m.task)}</label>
  <textarea id="mv-${m.id}" style="min-height:90px">${esc(drafts[m.id]||"")}</textarea>
  <div class="row"><button class="btn" data-a="model">Показать образец</button><button class="btn pri" data-a="check">Проверить с Claude</button></div>
  <div class="mres"></div></div>`).join("")}</div>`;
 el.querySelectorAll(".move").forEach(card=>{const m=STYLE_MOVES.find(x=>x.id===card.dataset.m);const ta=card.querySelector("textarea"),out=card.querySelector(".mres");
  ta.oninput=()=>{drafts[m.id]=ta.value;try{localStorage.setItem("nslog523-moves",JSON.stringify(drafts))}catch(e){}};
  card.querySelector('[data-a="model"]').onclick=()=>{out.innerHTML=`<div class="prew">${esc(m.model)}</div><div class="sync" style="margin-top:6px">Образец на теме экономической безопасности ЛПК УИС; фамилии и цифры в квадратных скобках — места для ваших данных.</div>`;if(ta.value.trim().length>20&&!P.moves[m.id]){P.moves[m.id]=1;save()}};
  const cb=card.querySelector('[data-a="check"]');
  cb.onclick=async()=>{const txt=ta.value.trim();if(txt.length<20){out.innerHTML=`<div class="fb no">Сначала напишите свой вариант (хотя бы одно предложение).</div>`;return}
   const s=await getSample();if(!s){if(OFFLINE){out.innerHTML=onlineBox("style",txt,"Проверка работает через Claude")+`<div class="prew" style="margin-top:8px">${esc(m.model)}</div>`;wireOnline(out,txt);return}out.innerHTML=`<div class="fb no">Проверка с Claude недоступна в этом окне. Откройте образец для сравнения.</div>`;return}
   cb.disabled=true;out.innerHTML=`<span class="spin"></span> Claude сравнивает с манерой руководителя…`;
   try{const r=await s.json(`Ты — опытный научный редактор. Аспирант учится писать в манере своего научного руководителя. Профиль стиля руководителя:
${STYLE_PROFILE}

Ход статьи: «${m.t}». Формула руководителя: ${m.f}
Образец на теме аспиранта: «${m.model}»
Вариант аспиранта: «${txt}»

Оцени, насколько вариант передаёт манеру руководителя и соответствует нормам научного стиля. Не требуй совпадения с образцом и условных цифр. Не хвали за ошибки из списка «НЕ копировать».
Ответь строго JSON: {"score": целое 0-10, "verdict": "одно предложение", "hits": ["какие приёмы руководителя удались, до 3"], "fix": ["что изменить, до 4"], "improved": "вариант аспиранта, доработанный в манере руководителя"}`,{modelTier:"quick"});
    out.innerHTML=`<div class="card" style="display:grid;gap:8px;background:var(--surface2);border:0"><div class="score"><b class="num" style="font-size:34px">${esc(r.score)}/10</b><span>${esc(r.verdict||"")}</span></div>
     ${(r.hits||[]).length?`<div><h4 style="margin-top:0">Удалось</h4><ul style="margin:0;padding-left:18px">${r.hits.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
     ${(r.fix||[]).length?`<div><h4 style="margin-top:0">Доработать</h4><ul style="margin:0;padding-left:18px">${r.fix.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
     ${r.improved?`<div><h4 style="margin-top:0">В манере руководителя</h4><div class="prew">${esc(r.improved)}</div></div>`:""}</div>`;
    P.moves[m.id]=Math.max(P.moves[m.id]||0,+r.score||1);save();
   }catch(e){out.innerHTML=`<div class="fb no">${sampleErr(e)}</div>`}
   cb.disabled=false}})}

// ---------- перенос результатов ----------
function exportCode(withExpl){const o={v:1,p:P};if(withExpl)o.e=EXPL;const j=JSON.stringify(o);return"NSLOG1:"+btoa(unescape(encodeURIComponent(j)))}
function importCode(code){code=code.trim();if(!code.startsWith("NSLOG1:"))throw new Error("format");const o=JSON.parse(decodeURIComponent(escape(atob(code.slice(7)))));
 merge(JSON.stringify(o.p));migrate();if(o.e){Object.assign(EXPL,o.e);try{localStorage.setItem("nslog523-expl",JSON.stringify(EXPL))}catch(e){}}save();return o}
function transferHtml(){return`<h4>Перенос результатов между версиями</h4>
 <div class="card" style="display:grid;gap:10px">
 <p style="margin:0;font-size:14.5px">${OFFLINE?"Офлайн-версия хранит результаты только на этом устройстве. Чтобы объединить их с онлайн-версией, скопируйте код и вставьте его в онлайн-версии в разделе «Мои результаты» (и наоборот).":"Онлайн-версия синхронизирует результаты с аккаунтом. Чтобы перенести их в офлайн-версию на телефоне, скопируйте код и вставьте его там в разделе «Мои результаты» (и наоборот)."} Результаты объединяются: лучшие баллы и все попытки сохраняются.</p>
 <label class="row" style="gap:8px;font-size:14px"><input type="checkbox" id="xexpl" checked> Включить лекции по терминам (${Object.keys(EXPL).length})</label>
 <div class="row"><button class="btn pri" id="xcopy">Скопировать код результатов</button></div>
 <textarea id="xcode" placeholder="Вставьте сюда код из другой версии (начинается с NSLOG1:)" style="min-height:70px;font-family:var(--f-mono);font-size:12px"></textarea>
 <div class="row"><button class="btn" id="ximp">Объединить с этими результатами</button></div><div id="xres"></div></div>`}
function wireTransfer(v){const cp=v.querySelector("#xcopy");cp.onclick=async()=>{const code=exportCode(v.querySelector("#xexpl").checked);try{await navigator.clipboard.writeText(code);cp.textContent="Код скопирован"}catch(e){const ta=v.querySelector("#xcode");ta.value=code;ta.select();cp.textContent="Код в поле ниже — скопируйте его"}};
 v.querySelector("#ximp").onclick=()=>{const ta=v.querySelector("#xcode"),out=v.querySelector("#xres");try{if(ta.value.trim().startsWith("NSLOG1:")&&ta.value.trim()===exportCode(v.querySelector("#xexpl").checked)){out.innerHTML=`<div class="fb no">Это код этой же версии — вставьте код из другой.</div>`;return}importCode(ta.value);out.innerHTML=`<div class="fb ok">Результаты объединены.</div>`;setTimeout(render,900)}catch(e){out.innerHTML=`<div class="fb no">Код не распознан. Скопируйте его целиком, он начинается с NSLOG1:</div>`}}}

if(OFFLINE&&"serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
readHash();render();

</script>
