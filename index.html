чем тратит.","Профицит бюджета по БК РФ — превышение доходов над расходами. В России профицит часто формировался за счёт высоких нефтегазовых доходов и направлялся в резервные фонды.","При высоких ценах на нефть сверхдоходы по бюджетному правилу направляются в ФНБ.","Профицит федерального бюджета сформирован преимущественно за счет нефтегазовых доходов."],"Бюро экономического анализа":["Ведомство США, которое считает ВВП и национальные счета.","В России аналогичные функции выполняет Федеральная служба государственной статистики (Росстат).","ВВП России рассчитывает Росстат, США — Бюро экономического анализа.","Информационную базу исследования составили данные Федеральной службы государственной статистики."],"Валовое предложение":["Сколько товара все продавцы вместе готовы продать при разных ценах.","Рыночное предложение — сумма индивидуальных предложений. Растёт с ростом цены (закон предложения); сдвигается при изменении издержек, технологий, числа продавцов.","При росте цены пиломатериалов лесопилки региона готовы суммарно поставить больше продукции.","Рыночное предложение пиломатериалов в регионе определяется производственными мощностями и ценовой конъюнктурой."],"Валовой внутренний продукт":["Стоимость всего, что произведено в стране за год для конечного использования.","ВВП — главный показатель размера экономики. В России рассчитывает Росстат тремя методами: производственным, по расходам и по доходам. На уровне регионов — ВРП.","Если ВВП в сопоставимых ценах вырос на 3,6 %, экономика выросла в реальном выражении на 3,6 %.","Индекс физического объема ВВП Российской Федерации в 2023 г. составил 103,6 % (данные условные)."],"Валовой внутренний продукт на душу населения":["ВВП, делённый на население, — средний уровень производства на человека.","Используется для межстрановых и межрегиональных сравнений уровня развития; для корректности берут паритет покупательной способности (ППС). Регионы сравнивают по ВРП на душу населения.","Регион с ВРП 500 млрд руб. и населением 1 млн человек имеет душевой ВРП 500 тыс. руб.","Для межрегиональных сопоставлений использован показатель ВРП на душу населения."],"Валовой спрос":["Сколько товара все покупатели вместе хотят купить при разных ценах.","Рыночный спрос — сумма индивидуальных спросов; убывает с ростом цены (закон спроса). Сдвигается при изменении доходов, цен других товаров, ожиданий.","При снижении цен на пиломатериалы строительные компании увеличивают закупки.","Рыночный спрос на продукцию деревообработки определяется динамикой жилищного строительства."],"Валовые расходы, совокупные расходы":["Все деньги, которые покупатели тратят на товары и услуги в экономике.","Совокупные расходы = потребление + инвестиции + госзакупки + чистый экспорт (C + I + G + Xn). Их изменение влияет на выпуск и занятость (кейнсианский подход).","Снижение инвестиций при прочих равных уменьшает совокупные расходы и ВВП.","Сокращение совокупных расходов обусловило снижение деловой активности в экономике."],"Валовые частные внутренние инвестиции":["Вложения бизнеса в новые машины, здания и запасы.","В российской статистике близкий показатель — инвестиции в основной капитал (Росстат) и валовое накопление основного капитала в СНС. Определяют будущий рост производства.","Покупка лесопилкой нового оборудования — валовые частные инвестиции.","Инвестиции в основной капитал в обработке древесины сократились на 12 % в сопоставимых ценах (данные условные)."],"Валюта":["Деньги — бумажные и металлические; также название денежной единицы страны.","Валюта может означать национальную денежную единицу (рубль) или иностранные деньги. Валютное регулирование в России — 173-ФЗ «О валютном регулировании и валютном контроле».","Экспортёр лесоматериалов получает выручку в юанях — иностранной валюте.","Экспортная выручка поступает преимущественно в валютах дружественных государств."],"Валютная интервенция":["Центральный банк покупает или продаёт валюту, чтобы повлиять на курс.","Интервенции сглаживают колебания курса. Банк России проводит операции на валютном рынке в рамках бюджетного правила (покупка или продажа валюты Минфином).","Продажа валюты из резервов увеличивает её предложение и поддерживает курс рубля.","Операции на валютном рынке в рамках бюджетного правила снижают влияние нефтяных цен на курс рубля."],"Валютный контроль":["Ограничения государства на покупку и продажу иностранной валюты.","Валютный контроль защищает платёжный баланс и курс. В России регулируется 173-ФЗ; с 2022 г. применялись меры обязательной продажи части экспортной выручки и ограничения на вывод капитала.","Требование продать часть экспортной выручки на внутреннем рынке — мера валютного контроля.","Меры валютного контроля направлены на снижение волатильности курса национальной валюты."],"Величина предложения":["Сколько товара продавец готов продать по конкретной цене.","Величина предложения — точка на кривой предложения. Меняется при изменении цены (движение по кривой), в отличие от предложения, которое сдвигается под влиянием других факторов.","При цене 15 тыс. руб. за кубометр лесопилка готова продать 200 м³, при 18 тыс. — 260 м³.","Рост цены на продукцию обусловил увеличение величины предложения при неизменной технологической базе."],"Величина спроса":["Сколько товара покупатель хочет купить по конкретной цене.","Величина спроса — точка на кривой спроса; меняется при изменении цены товара (движение вдоль кривой). Изменение доходов, вкусов, цен других товаров сдвигает всю кривую спроса.","При цене 12 тыс. руб. за м³ строительная фирма закупает 100 м³ бруса, при 10 тыс. — 130 м³.","Снижение цены обусловило рост величины спроса при неизменных неценовых факторах."],"Венчурный капитал":["Деньги инвесторов, вложенные в рискованные новые проекты и стартапы в обмен на долю в бизнесе.","Венчурное финансирование поддерживает инновации на ранних стадиях. В России действуют государственные институты развития (РВК, Фонд содействия инновациям, региональные венчурные фонды); это пункт 7.15 паспорта 5.2.3.","Венчурный фонд вкладывает 50 млн руб. в разработчика технологии переработки древесных отходов за 30 % компании.","Венчурные механизмы рассматриваются как инструмент финансирования инновационных проектов в лесопромышленном комплексе."],"Вертикальная интеграция":["Одна компания контролирует сразу несколько этапов производства — от сырья до готового товара.","Вертикальная интеграция снижает трансакционные издержки и риски поставок, но может ограничивать конкуренцию. Для ЛПК типичны холдинги «заготовка — лесопиление — плиты — целлюлоза».","Холдинг владеет лесными участками, лесопилкой и заводом плит — вертикально интегрированная структура.","Вертикальная интеграция лесопромышленных компаний обеспечивает устойчивость сырьевого снабжения перерабатывающих производств."],"Вертикальная ось":["Ось Y на графике — вертикальная линия, по которой откладывается значение показателя.","В экономических графиках по вертикали обычно откладывают цену или зависимую переменную. В научном тексте оси подписываются с единицами измерения.","На графике спроса цена откладывается по вертикальной оси, количество — по горизонтальной.","По вертикальной оси отложен объем заготовки древесины, млн м³."],"Вертикальное слияние":["Объединение фирм, которые работают на разных этапах одной производственной цепочки.","Вертикальное слияние — способ вертикальной интеграции. Контролируется антимонопольным органом (ФАС России), если может ограничить доступ конкурентов к сырью или рынкам сбыта.","Покупка лесопильным заводом лесозаготовительной компании — вертикальное слияние.","Сделки вертикального слияния подлежат антимонопольному контролю при превышении пороговых значений активов."],"Взаимная поддержка":["Депутаты договариваются голосовать за законопроекты друг друга.","Логроллинг — понятие теории общественного выбора: обмен голосами может приводить к принятию решений, выгодных узким группам, и неэффективному расходованию бюджета.","Депутат поддерживает чужую программу в обмен на поддержку финансирования дороги в своём округе.","Практика взаимной поддержки законодателей может приводить к неэффективному распределению бюджетных ассигнований."],"Взаимные (инвестиционные) фонды денежного рынка":["Фонды, вкладывающие деньги в очень надёжные краткосрочные инструменты; почти как вклад с процентами.","Фонды денежного рынка держат краткосрочные государственные бумаги и депозиты. В России аналоги — биржевые фонды денежного рынка, привязанные к ставке RUONIA.","Компания держит свободный остаток в фонде денежного рынка и получает доход, близкий к ключевой ставке.","Фонды денежного рынка используются организациями для краткосрочного размещения временно свободных средств."],"Взаимные фонды":["Общий портфель ценных бумаг, куда много инвесторов складывают деньги, а управляет им профессионал.","В России — паевые инвестиционные фонды (ПИФы) и биржевые фонды, регулируемые 156-ФЗ «Об инвестиционных фондах».","Покупая пай фонда облигаций, инвестор получает долю в диверсифицированном портфеле.","Паевые инвестиционные фонды выступают механизмом трансформации сбережений населения в инвестиции."],"Взаимодополняющие товары":["Товары, которые используют вместе: если один дорожает, спрос на другой падает.","Комплементы имеют отрицательную перекрёстную эластичность спроса. Учитываются при анализе рынков сопряжённой продукции.","Рост цен на новое жильё снижает спрос и на пиломатериалы, и на столярные изделия для отделки.","Спрос на продукцию деревообработки находится в зависимости от спроса на взаимодополняющие строительные материалы."],"Взаимозависимость":["Решения одной фирмы сильно влияют на другие, и все это учитывают.","Взаимозависимость — ключевое свойство олигополии: фирмы вынуждены предугадывать реакцию конкурентов (теория игр).","Если один из трёх крупных производителей плит снизит цену, двое других, скорее всего, ответят тем же.","Взаимозависимость крупных производителей определяет олигополистический характер регионального рынка."],"Внезапные колебания уровня цен":["Цены выросли или упали неожиданно для людей и фирм.","Неожиданные изменения уровня цен влияют на реальный выпуск в краткосрочном периоде: фирмы и работники принимают решения на основе ошибочных ожиданий.","Если инфляция оказалась 9 % вместо ожидаемых 4 %, реальные доходы по долгосрочным договорам падают.","Непредвиденный рост уровня цен снизил реальную стоимость фиксированных контрактных платежей."],"Внепроизводственные операции":["Покупки, которые не создают новый продукт: перепродажа, покупка ценных бумаг, переводы.","Такие операции не включаются в ВВП, чтобы избежать двойного счёта: считается только стоимость текущего производства.","Продажа подержанного лесовоза не увеличивает ВВП текущего года.","Операции с ранее произведенными активами не учитываются при расчете валового внутреннего продукта."],"Внерыночные операции":["Работа и продукты, которые не продаются за деньги, поэтому не попадают в ВВП.","Домашний труд, волонтёрство, натуральное хозяйство не учитываются в ВВП. В России значим вклад личных подсобных хозяйств, который Росстат частично досчитывает.","Картофель, выращенный на даче для своей семьи, — внерыночное производство.","Неучет внерыночного производства занижает оценку реального уровня потребления сельского населения."],"Внешнеторговый дефицит":["Страна покупает за рубежом больше товаров, чем продаёт.","Дефицит торгового баланса финансируется притоком капитала или резервами. Устойчивый дефицит может вести к ослаблению национальной валюты.","Если импорт 300 млрд долл., а экспорт 250 млрд, дефицит — 50 млрд долл.","Хронический дефицит торгового баланса повышает зависимость страны от внешнего финансирования."],"Внешние платежи":["Деньги, которые уходят из страны: оплата импорта, выплаты иностранцам.","Внешние платежи — расходная сторона платёжного баланса; формируют спрос на иностранную валюту.","Оплата импортного оборудования для лесопилки в юанях — внешний платёж.","Рост внешних платежей по импорту оборудования увеличивает спрос на иностранную валюту."],"Внешние платежные поступления":["Деньги, которые приходят в страну из-за рубежа: оплата экспорта, инвестиции.","Внешние поступления формируют предложение иностранной валюты на внутреннем рынке.","Выручка экспортёра пиломатериалов из Китая — внешнее платёжное поступление.","Экспортная выручка формирует предложение иностранной валюты на внутреннем рынке."],"Внешний государственный долг":["Долг государства перед иностранцами.","Внешний государственный долг — часть госдолга перед нерезидентами. В России его объём относительно невелик, что рассматривается как фактор финансовой устойчивости; учёт ведёт Минфин России.","Покупка иностранным фондом облигаций федерального займа увеличивает внешний госдолг.","Низкий уровень внешнего государственного долга рассматривается в качестве фактора экономической безопасности."],"Внешний долг":["Все долги страны (государства и компаний) перед иностранцами.","Внешний долг включает долг государства, банков и компаний перед нерезидентами. Статистику публикует Банк России; высокая долговая нагрузка — угроза при ограничении доступа к рынкам капитала.","Кредит, взятый лесопромышленным холдингом в зарубежном банке, увеличивает внешний долг страны.","Внешний долг корпоративного сектора создает риски рефинансирования в условиях ограничительных мер."],"Внутренний государственный долг":["Долг государства перед своими гражданами и компаниями.","Внутренний госдолг формируется выпуском облигаций (в России — ОФЗ). Проценты по нему перераспределяют доходы внутри страны, но не уходят за рубеж.","Банки покупают ОФЗ — государство занимает у внутреннего рынка.","Финансирование дефицита бюджета осуществляется преимущественно за счет внутренних заимствований."],"Внутренняя цена":["Цена товара внутри страны.","Внутренняя цена формируется спросом и предложением на национальном рынке; отличается от мировой из-за пошлин, транспортных расходов, ограничений торговли.","После ограничения экспорта внутренние цены на пиломатериалы снизились относительно экспортных.","Разрыв между внутренними и экспортными ценами отражает влияние ограничений внешней торговли."],"Вознаграждение труда работников и служащих":["Всё, что работодатель платит работникам: зарплата, премии и взносы за них.","В СНС — «оплата труда наёмных работников», компонент ВВП по доходам. Включает начисленную зарплату и социальные взносы работодателей.","Если фонд оплаты труда 100 млн руб., а взносы 30 млн, оплата труда наёмных работников — 130 млн руб.","Доля оплаты труда наемных работников в структуре ВРП снизилась."],"Возобновляемые природные ресурсы":["Природные богатства, которые восстанавливаются: лес, вода, рыба.","Возобновляемость ограничена: лес восстанавливается десятилетиями. Отсюда принцип неистощительного лесопользования и расчётная лесосека (Лесной кодекс РФ). Это направление 9 паспорта 5.2.3.","Если заготовка превышает прирост, возобновляемый ресурс начинает истощаться.","Лесные ресурсы относятся к возобновляемым, однако их воспроизводство требует значительного временного лага."],"Возрастающая отдача":["Производство растёт быстрее, чем затраты на него.","Возрастающая отдача от масштаба снижает средние издержки при расширении производства; обосновывает концентрацию производства.","Если удвоение мощностей лесопильного завода увеличивает выпуск в 2,3 раза — отдача возрастающая.","Возрастающая отдача от масштаба обусловливает конкурентные преимущества крупных производств."],"Возрастающая предельная отдача":["Каждый следующий работник (или станок) даёт больше продукции, чем предыдущий.","Характерна для начальных стадий: специализация и разделение труда повышают предельный продукт. Затем сменяется убывающей отдачей.","Второй работник на пилораме позволяет наладить непрерывный поток, и выпуск растёт сильнее, чем от первого.","На начальных этапах расширения производства наблюдается возрастающая предельная отдача переменного ресурса."],"Война цен":["Фирмы по очереди снижают цены, чтобы отбить покупателей друг у друга.","Ценовая война в олигополии снижает прибыль всех участников и может вытеснить слабых. Часто заканчивается молчаливым соглашением или уходом фирм.","Два крупных поставщика поддонов снижают цены на торгах ниже себестоимости.","Ценовая конкуренция на рынке государственных закупок приводит к снижению рентабельности поставщиков."],"Временная помощь нуждающимся семьям":["Американская программа временных пособий бедным семьям с детьми.","Пример адресной социальной помощи с условием трудоустройства. В России аналог — социальный контракт и пособия малоимущим семьям.","Социальный контракт в России — помощь в обмен на обязательство найти работу или начать своё дело.","Адресная социальная помощь рассматривается как инструмент снижения уровня бедности."],"Временное предпочтение":["Людям больше нравится получить что-то сейчас, чем потом.","Временное предпочтение объясняет существование процента: за отказ от текущего потребления требуется вознаграждение. Лежит в основе дисконтирования.","Большинство предпочтёт 100 тыс. руб. сегодня, а не через год.","Временное предпочтение экономических агентов обусловливает необходимость дисконтирования будущих денежных потоков."],"Всемирная торговая организация":["Международная организация, которая устанавливает правила торговли между странами.","ВТО регулирует тарифы и торговые споры. Россия вступила в ВТО в 2012 г.; ограничительные меры 2022 г. поставили под вопрос применение ряда её норм.","Экспортные пошлины на лесоматериалы Россия согласовывала в рамках обязательств при вступлении в ВТО.","Обязательства в рамках ВТО определяют допустимые параметры таможенно-тарифного регулирования."],"Всемирный банк":["Международный банк, который выдаёт кредиты развивающимся странам на развитие.","Группа Всемирного банка финансирует инфраструктуру и реформы, публикует рейтинги и аналитику. Используется как источник межстрановых данных.","Данные Всемирного банка применяются для сравнения ВВП на душу населения разных стран.","Для межстрановых сопоставлений использованы данные Всемирного банка."],"Встроенный стабилизатор":["Механизм, который сам смягчает спады и подъёмы без решений правительства.","Прогрессивные налоги и пособия по безработице автоматически уменьшают колебания спроса. В России роль стабилизатора выполняет и бюджетное правило.","В кризис налоговые поступления падают, а выплаты пособий растут — это поддерживает спрос.","Автоматические стабилизаторы снижают амплитуду колебаний деловой активности."],"Выгода перелива":["Польза, которую получает кто-то, кто не платил за товар.","Положительный внешний эффект (экстерналия). Рынок производит таких благ меньше оптимального, поэтому их поддерживает государство.","Лесовосстановление улучшает экологию для всех жителей региона, а не только для арендатора.","Положительные внешние эффекты лесовосстановления обосновывают государственную поддержку данной деятельности."],"Выгоды от торговли":["Выигрыш, который получают страны, специализируясь и торгуя друг с другом.","Основан на сравнительном преимуществе (Д. Рикардо): каждый производит то, в чём относительно эффективнее, и общий выпуск растёт.","Регион с большими лесными ресурсами специализируется на древесине, а закупает оборудование у промышленных регионов.","Специализация регионов в соответствии со сравнительными преимуществами обеспечивает выгоды от межрегиональной торговли."],"Выплата государственного долга":["Государство возвращает долг держателям облигаций.","Погашение госдолга уменьшает его объём; финансируется профицитом бюджета или новыми заимствованиями (рефинансирование).","Минфин погашает выпуск ОФЗ при наступлении срока.","Погашение государственного долга осуществляется за счет новых заимствований и остатков средств бюджета."],"Выплаты для выравнивания циклических колебаний":["Выплаты фермерам, когда рыночные цены падают ниже установленного уровня.","Инструмент аграрной поддержки в США. В России — субсидии и компенсации в рамках госпрограммы развития сельского хозяйства (п. 3.10 паспорта 5.2.3).","При падении цен на зерно государство компенсирует часть потерь производителям.","Меры государственной поддержки сельхозпроизводителей направлены на снижение влияния ценовой волатильности."],"Выравнивающие различия в оплате труда":["Больше платят за тяжёлую, опасную или неприятную работу.","Компенсирующие различия уравновешивают привлекательность профессий. В России — районные коэффициенты и северные надбавки, доплаты за вредные условия.","Вальщик леса на Крайнем Севере получает больше, чем оператор в городе, за счёт северных надбавок.","Районные коэффициенты и северные надбавки компенсируют неблагоприятные условия труда."],"Вычет":["Часть убытка, которую застрахованный оплачивает сам.","Франшиза в страховании снижает моральный риск и стоимость полиса.","При франшизе 50 тыс. руб. и ущербе 200 тыс. страховщик выплатит 150 тыс.","Использование франшизы снижает стоимость страхования имущественных рисков."],"Генеральное соглашение о тарифах и торговле":["Международное соглашение 1947 г. о снижении таможенных пошлин; предшественник ВТО.","ГАТТ заложило принципы недискриминации в торговле; в 1995 г. на его основе создана ВТО.","Раунды переговоров ГАТТ последовательно снижали средние таможенные тарифы.","Принципы ГАТТ составили основу современной системы регулирования международной торговли."],"Гибкие цены":["Цены, которые свободно меняются вслед за спросом и предложением.","Гибкость цен определяет, как быстро рынок приходит к равновесию. В краткосрочном периоде многие цены «жёсткие» (контракты, регулирование).","Биржевые цены на пиловочник гибкие, а тарифы на электроэнергию — регулируемые.","Гибкость цен на сырьевых рынках обусловливает высокую волатильность выручки экспортеров."],"Гибкий валютный курс":["Курс валюты, который определяется рынком, а не государством.","В России с 2014 г. — режим плавающего курса рубля; Банк России не устанавливает курс, но может проводить операции на рынке.","При падении экспортной выручки рубль ослабевает, что частично компенсирует экспортёрам потери.","Режим плавающего валютного курса выступает амортизатором внешних шоков."],"Гиперинфляция":["Цены растут очень быстро — на десятки процентов в месяц.","Гиперинфляция разрушает сбережения и денежное обращение. Россия пережила очень высокую инфляцию в 1992 г. (цены выросли более чем в 25 раз за год).","При гиперинфляции предприятия переходят на бартер и расчёты в иностранной валюте.","Высокая инфляция начала 1990-х гг. обусловила массовый переход к бартерным расчетам."],"Гипотеза":["Предположение, которое нужно проверить.","Научная гипотеза — проверяемое утверждение о связи явлений. В диссертации формулируется во введении и проверяется в эмпирической части.","Гипотеза: чем выше концентрация сбыта, тем ниже уровень экономической безопасности.","Выдвинута гипотеза, согласно которой уровень экономической безопасности определяется устойчивостью каналов сбыта."],"Гипотеза естественного уровня безработицы":["Идея, что в долгосрочном периоде безработица возвращается к «естественному» уровню, как бы ни стимулировали экономику.","Гипотеза М. Фридмена и Э. Фелпса: попытки удерживать безработицу ниже естественного уровня ведут лишь к ускорению инфляции.","Стимулирование спроса снижает безработицу временно, а затем растут только цены.","Согласно гипотезе естественного уровня безработицы, монетарные стимулы не влияют на занятость в долгосрочном периоде."],"Гипотеза противодействия администрации":["Объяснение упадка профсоюзов в США противодействием менеджмента.","Работодатели активно препятствуют созданию профсоюзов, что снижает их численность. Относится к экономике труда.","Консультанты работодателя проводят кампании против вступления в профсоюз.","Снижение уровня профсоюзного членства объясняется в том числе противодействием администрации."],"Гипотеза структурных изменений":["Объяснение упадка профсоюзов сменой структуры экономики: меньше промышленности, больше услуг.","Профсоюзы традиционно сильны в промышленности; рост сферы услуг и малого бизнеса снижает их охват.","Переход работников из заводов в торговлю уменьшает долю членов профсоюзов.","Структурные изменения занятости обусловили снижение роли профсоюзов."],"Голосование долларом":["Покупатели «голосуют» рублём, решая, что будет производиться.","Суверенитет потребителя: спрос определяет, какие товары выгодно производить. Иллюстрирует роль рынка в распределении ресурсов.","Рост спроса на деревянные дома привлекает ресурсы в домостроение.","Потребительский спрос определяет направления распределения ресурсов в рыночной экономике."],"Гомогенная олигополия":["Олигополия, где несколько фирм производят одинаковый товар.","При однородном продукте фирмы конкурируют ценой и объёмами; характерно для сырья и полуфабрикатов.","Рынок целлюлозы с несколькими крупными производителями — однородная олигополия.","Рынок стандартизированной продукции лесопереработки характеризуется признаками однородной олигополии."],"Горизонтальное слияние":["Объединение конкурентов, производящих одно и то же.","Горизонтальное слияние увеличивает долю рынка и может ограничить конкуренцию; подлежит контролю ФАС России.","Слияние двух лесопильных заводов одного региона — горизонтальное.","Горизонтальные слияния повышают уровень концентрации регионального рынка."],"Государственные закупки":["Покупка государством товаров и услуг.","В СНС — расходы на конечное потребление органов госуправления. В России закупки регулируются 44-ФЗ и 223-ФЗ. Для учреждений УИС госзаказ — ключевой канал сбыта.","Закупка обмундирования для ведомства — государственная закупка.","Государственные закупки выступают основным каналом сбыта продукции центров трудовой адаптации осужденных."],"Государственный долг":["Сколько государство должно по своим займам.","Государственный долг РФ включает внутренний (ОФЗ) и внешний долг. Отношение госдолга к ВВП — индикатор экономической безопасности с пороговым значением.","Госдолг 20 % ВВП считается умеренным уровнем.","Отношение государственного долга к ВВП не превышает порогового значения."],"Государственный сектор":["Часть экономики, которой владеет или управляет государство.","Включает органы власти, государственные учреждения и предприятия. Учреждения УИС — казённые учреждения госсектора, что ограничивает их хозяйственную самостоятельность.","Центр трудовой адаптации осуждённых — подразделение казённого учреждения, то есть госсектора.","Учреждения уголовно-исполнительной системы функционируют в организационно-правовой форме казенных учреждений государственного сектора."],"Граница потребительского бюджета":["Предел покупок, который задают доход и цены.","Бюджетное ограничение — основа модели выбора потребителя: все доступные наборы товаров лежат на бюджетной линии или под ней.","При доходе 60 тыс. руб. нельзя купить набор стоимостью 70 тыс.","Бюджетное ограничение определяет границы потребительского выбора."],"График инвестиций":["Сколько фирмы хотят инвестировать при разных процентных ставках.","Спрос на инвестиции убывает с ростом ставки: дорогие кредиты делают проекты невыгодными.","При ставке 20 % предприятие откладывает модернизацию, которую провело бы при 10 %.","Рост процентных ставок сокращает объем планируемых инвестиций."],"График потребления":["Сколько домохозяйства тратят на потребление при разных доходах.","Функция потребления: с ростом дохода потребление растёт, но медленнее (предельная склонность к потреблению меньше 1).","Если доход семьи растёт на 10 тыс. руб., расходы увеличиваются примерно на 7–8 тыс.","Функция потребления характеризует зависимость потребительских расходов от располагаемого дохода."],"График сбережений":["Сколько домохозяйства откладывают при разных доходах.","Функция сбережений: доля сбережений растёт с доходом. Сбережения — источник инвестиций в экономике.","Семьи с высоким доходом сберегают большую долю.","Норма сбережений домохозяйств определяет потенциал внутреннего инвестирования."],"График совокупных расходов":["Сколько всего тратят в экономике при разных уровнях производства.","Совокупные расходы C + I + G + Xn; их пересечение с линией 45° определяет равновесный ВВП в кейнсианской модели.","Если расходы меньше выпуска, запасы растут, и производство сокращается.","Равновесный уровень выпуска определяется равенством совокупных расходов и совокупного производства."],"Движение за единый налог":["Идея XIX века: заменить все налоги одним налогом на землю.","Генри Джордж считал земельную ренту незаработанным доходом. Идея повлияла на современные подходы к налогу на землю и природную ренту.","Налог на рентный доход от лесных участков — наследник этой идеи.","Концепция изъятия природной ренты находит отражение в системе платежей за использование лесов."],"Движение за справедливую торговлю":["Движение за то, чтобы производители из бедных стран получали справедливую цену.","Fair trade — добровольная сертификация с гарантией минимальной цены и стандартов труда.","Кофе с маркировкой Fair Trade дороже, но фермер получает гарантированную цену.","Сертификация продукции по социальным стандартам повышает ее конкурентоспособность на отдельных рынках."],"Двойное налогообложение":["Один и тот же доход облагается налогом дважды.","Классический пример — прибыль корпорации и дивиденды акционеров. Между странами устраняется соглашениями об избежании двойного налогообложения.","Прибыль облагается налогом на прибыль, а выплаченные из неё дивиденды — НДФЛ.","Соглашения об избежании двойного налогообложения снижают налоговую нагрузку при трансграничных операциях."],"Двусторонняя монополия":["Один продавец против одного покупателя.","Цена определяется переговорами сторон. Характерна для отношений монопольного поставщика и единственного заказчика.","Единственный лесопильный завод в посёлке и единственный профсоюз работников ведут переговоры о зарплате.","В условиях двусторонней монополии цена определяется переговорной силой сторон."],"Дебет":["Запись в учёте, увеличивающая актив или расход.","В двойной записи каждая операция отражается по дебету одного и кредиту другого счёта. В платёжном балансе дебет — отток валюты.","Оплата импортного оборудования отражается по дебету счёта текущих операций.","Операции по импорту отражаются по дебету счета текущих операций платежного баланса."],"Девальвация":["Официальное снижение стоимости национальной валюты.","Девальвация удешевляет экспорт и удорожает импорт. В режиме плавающего курса говорят об ослаблении (обесценении) валюты.","Ослабление рубля повышает рублёвую выручку экспортёров лесоматериалов.","Ослабление национальной валюты повысило ценовую конкурентоспособность экспортной продукции."],"Дезинфляция":["Инфляция замедляется, но цены продолжают расти.","Дезинфляция — снижение темпа роста цен (например, с 12 до 6 %). Не путать с дефляцией — падением цен.","Если инфляция снизилась с 11,9 до 7,4 %, это дезинфляция.","Жесткая денежно-кредитная политика обеспечила дезинфляцию."],"Действительная (внутренняя) стоимость":["Стоимость металла, из которого сделана монета.","Для современных денег внутренняя стоимость ниже номинала: ценность денег основана на доверии, а не на металле.","Себестоимость металла в монете 10 руб. значительно меньше 10 руб.","Современные деньги являются фидуциарными: их номинальная стоимость превышает внутреннюю."],"Дело Alcoa":["Антимонопольное дело 1945 г. в США: компания Alcoa признана монополистом.","Суд постановил, что доминирование (90 % рынка алюминия) само по себе может нарушать закон. Пример подхода «структуры рынка».","Похожий подход в России — признание доминирующего положения при доле рынка свыше 50 % (135-ФЗ).","Доминирующим признается положение хозяйствующего субъекта с долей на рынке свыше 50 %."],"Дело Microsoft":["Антимонопольное дело против Microsoft за злоупотребление доминированием.","Microsoft обвинили в навязывании браузера вместе с Windows. Классический пример регулирования цифровых монополий.","ФАС России рассматривала дела против крупных цифровых платформ за навязывание приложений.","Злоупотребление доминирующим положением на цифровых рынках выступает объектом антимонопольного контроля."],"Дело Standard Oil":["Дело 1911 г., по которому нефтяная монополия Рокфеллера разделена на части.","Первый крупный пример принудительного разделения монополии по закону Шермана.","Standard Oil была разделена на 34 компании.","Принудительное разделение монополии рассматривается как крайняя мера антимонопольного регулирования."],"Дело U.S. Steel":["Дело 1920 г.: суд решил, что сам по себе крупный размер компании не является нарушением.","Сформулировано «правило разумного подхода»: наказуемы действия, ограничивающие конкуренцию, а не размер.","Российская практика тоже оценивает поведение доминирующей фирмы, а не только её долю.","Антимонопольное регулирование ориентировано на пресечение злоупотреблений, а не на размер компании как таковой."],"Демографы":["Учёные, изучающие население: рождаемость, смертность, миграцию.","Демография — основа экономики народонаселения (направление 8 паспорта 5.2.3). Данные — переписи и текущий учёт Росстата.","Демографы прогнозируют сокращение численности трудоспособного населения северных регионов.","Демографические прогнозы свидетельствуют о сокращении трудовых ресурсов региона."],"Демпинг":["Продажа товара за рубежом дешевле, чем дома или себе в убыток.","Демпинг может вытеснить конкурентов. Страны вводят антидемпинговые пошлины; в ЕАЭС их устанавливает Евразийская экономическая комиссия.","Если фанера продаётся за рубежом ниже внутренней цены, импортёры могут добиваться антидемпинговой пошлины.","Введение антидемпинговых пошлин ограничивает доступ продукции на зарубежные рынки."],"Денежный капитал":["Деньги, которые можно направить на покупку оборудования и зданий.","Денежный капитал отличается от физического (реального) капитала — станков и зданий. Инвестирование превращает первый во второй.","Кредит банка — денежный капитал, купленная на него пилорама — физический капитал.","Привлеченный денежный капитал направлен на обновление основных фондов."],"Денежный мультипликатор":["Во сколько раз банки могут «размножить» деньги через кредиты на каждый рубль резервов.","Мультипликатор ≈ 1 / норма резервирования. Кредит, выданный одним банком, становится депозитом в другом и снова частично выдаётся в кредит.","При норме резервирования 10 % каждый рубль избыточных резервов теоретически может дать до 10 руб. новых денег.","Денежный мультипликатор характеризует способность банковской системы расширять денежную массу."],"Денежный рынок":["Рынок, где встречаются спрос на деньги и их предложение и складывается процентная ставка.","Ставки денежного рынка ориентируются на ключевую ставку Банка России; индикатор — ставка RUONIA.","Когда Банк России повышает ключевую ставку, растут ставки по межбанковским кредитам.","Условия на денежном рынке определяют стоимость краткосрочного финансирования организаций."],"Деньги":["То, что все принимают в оплату.","Функции денег: мера стоимости, средство обращения, средство сбережения, средство платежа. Денежная единица России — рубль (ст. 75 Конституции РФ).","Выручка, зарплата, налоги — всё измеряется и платится в рублях.","Деньги выполняют функции меры стоимости, средства обращения и средства накопления."],"Депозитные учреждения":["Организации, принимающие вклады: банки, кредитные кооперативы.","В России вклады принимают банки с лицензией Банка России; вклады граждан застрахованы АСВ.","Сбербанк и региональные банки — депозитные учреждения.","Кредитные организации аккумулируют временно свободные средства населения и организаций."],"Депозитный счет денежного рынка":["Банковский счёт с процентами, похожий на фонд денежного рынка.","Американский продукт; в России функционально близки накопительные счета с плавающей ставкой.","Накопительный счёт позволяет снимать деньги в любой момент и получать проценты.","Накопительные счета выступают инструментом краткосрочного размещения средств."],"Детерминанта валютного курса":["Факторы, от которых зависит курс валюты, кроме самого курса.","Курс определяют цены на экспорт (для России — нефть и газ), процентные ставки, инфляция, движение капитала, ожидания.","Рост цен на нефть увеличивает предложение валюты и укрепляет рубль.","Курс рубля в значительной мере определяется конъюнктурой сырьевых рынков."],"Детерминанты предложения":["Всё, кроме цены, что влияет на то, сколько товара готовы продать.","Детерминанты предложения: цены ресурсов, технологии, налоги и субсидии, ожидания, число продавцов. Их изменение сдвигает кривую предложения.","Рост цен на дизельное топливо сокращает предложение лесозаготовителей при той же цене древесины.","Рост тарифов на энергоресурсы сократил предложение продукции при неизменной рыночной цене."],"Детерминанты совокупного предложения":["Факторы, от которых зависит совокупное предложение в экономике.","Цены ресурсов, производительность, институциональная среда. Их изменение сдвигает кривую совокупного предложения.","Санкционные ограничения на импорт оборудования снижают совокупное предложение.","Ограничения на импорт технологий выступают фактором сокращения совокупного предложения."],"Детерминанты совокупного спроса":["Факторы, от которых зависит совокупный спрос: потребление, инвестиции, госрасходы, экспорт.","Совокупный спрос определяется компонентами C + I + G + Xn и сдвигается при изменении доходов, ставок, курса, бюджетной политики.","Рост госрасходов на оборону увеличивает совокупный спрос.","Увеличение государственных расходов выступило фактором роста совокупного спроса."],"Детерминанты спроса":["Всё, кроме цены, что влияет на спрос: доходы, вкусы, цены других товаров.","Детерминанты спроса сдвигают кривую спроса. Для деревообработки ключевой фактор — объёмы жилищного строительства.","Льготная ипотека увеличивает спрос на пиломатериалы.","Спрос на продукцию лесопиления определяется динамикой жилищного строительства и условиями ипотечного кредитования."],"Дефицит платежного баланса":["Страна в целом тратит валюты больше, чем получает.","Дефицит платёжного баланса покрывается резервами или займами; при длительном дефиците слабеет валюта.","Если отток капитала превышает профицит текущего счёта, резервы сокращаются.","Дефицит платежного баланса покрывается за счет международных резервов."],"Дефицит счета движения капиталов":["Из страны уходит больше капитала, чем приходит.","Дефицит капитального счёта означает чистый отток средств за рубеж.","Российские компании вкладывают за рубежом больше, чем иностранцы в России.","Отрицательное сальдо финансового счета свидетельствует о чистом оттоке капитала."],"Дефицит счета движения капиталов и финансов":["Отрицательный итог по движению капитала и финансовых активов.","В современной методике платёжного баланса — финансовый счёт. Отрицательное сальдо — чистый отток средств.","Покупка резидентами иностранных активов превышает покупку нерезидентами российских.","Сальдо финансового счета отражает масштабы трансграничного движения капитала."],"Дефицит, нехватка":["Товара не хватает: хотят купить больше, чем продаётся.","Дефицит возникает, когда цена ниже равновесной (например, при регулировании цен). Рыночная реакция — рост цены.","При фиксированной цене на древесину ниже рыночной покупатели не могут купить нужный объём.","Установление цен ниже равновесного уровня приводит к возникновению товарного дефицита."],"Дефлирование":["Пересчёт показателей в цены базового года, чтобы убрать влияние инфляции.","Реальный показатель = номинальный / индекс-дефлятор. В России дефляторы ВВП и ВРП публикует Росстат.","Если выручка выросла на 20 %, а цены на 15 %, реальный рост ≈ 4,3 %.","Стоимостные показатели дефлированы с использованием индексов цен производителей."],"Дефляция":["Цены в целом снижаются.","Дефляция опасна для экономики: откладываются покупки, растёт реальная долговая нагрузка. Не путать с дезинфляцией.","Если индекс цен за год 98 %, в экономике дефляция 2 %.","Сезонная дефляция на рынке продовольствия характерна для периода сбора урожая."],"Дефолт":["Должник не платит по долгу в срок.","Дефолт — неисполнение обязательств по кредиту или облигациям. Россия пережила дефолт по ГКО в августе 1998 г.","Если компания не выплатила купон по облигациям, наступает технический дефолт.","Дефолт по государственным обязательствам 1998 г. обусловил глубокий финансовый кризис."],"Диверсификация":["Не класть все яйца в одну корзину.","Диверсификация — распределение вложений, видов деятельности или каналов сбыта для снижения риска. Для учреждений УИС — снижение зависимости от одного покупателя.","Учреждение продаёт продукцию нескольким заказчикам вместо одного — риск падения выручки ниже.","Диверсификация каналов сбыта снижает зависимость организации от отдельных контрагентов."],"Диверсифицируемый риск":["Риск, который можно снизить, вкладываясь во многие разные активы.","Специфический риск отдельной компании «гасится» в широком портфеле; остаётся рыночный (недиверсифицируемый) риск.","Банкротство одной компании мало влияет на портфель из 50 акций.","Специфический риск снижается посредством диверсификации инвестиционного портфеля."],"Дивиденды":["Часть прибыли, которую компания платит владельцам акций.","Дивиденды распределяются по решению собрания акционеров; облагаются НДФЛ. Для госкомпаний в России установлен ориентир — не менее 50 % чистой прибыли по МСФО.","Госкомпания направила 50 % чистой прибыли на дивиденды, пополнив бюджет.","Дивиденды государственных компаний выступают источником неналоговых доходов бюджета."],"Дилемма регулирования":["Регулятор не может одновременно сделать цену монополии и низкой, и прибыльной для неё.","Цена на уровне предельных издержек может принести монополии убытки; цена на уровне средних — ниже эффективности. Характерно для тарифного регулирования.","Регулирование тарифов на тепло решает дилемму через «экономически обоснованный тариф».","Государственное тарифное регулирование естественных монополий сталкивается с дилеммой эффективности и безубыточности."],"Динамичность дохода":["Насколько люди переходят из бедных в богатые группы и обратно со временем.","Мобильность доходов — показатель справедливости и возможностей в обществе; измеряется по панельным данным.","Молодой специалист со временем переходит из низшей группы доходов в среднюю.","Низкая мобильность доходов закрепляет межрегиональную дифференциацию."],"Дискреционная фискальная политика":["Правительство специально меняет налоги и расходы, чтобы влиять на экономику.","Дискреционная политика — сознательные решения (в России — изменения закона о бюджете, антикризисные пакеты), в отличие от автоматических стабилизаторов.","Антикризисный пакет 2020 г. с поддержкой МСП — дискреционная фискальная политика.","Дискреционные меры фискальной политики направлены на поддержку деловой активности в кризисный период."],"Дискриминация":["Несправедливое отношение к людям из-за пола, возраста, происхождения и т. п.","В экономике труда дискриминация снижает эффективность использования человеческого капитала. В России запрещена Трудовым кодексом (ст. 3).","Отказ в приёме на работу по возрасту при равной квалификации — дискриминация.","Дискриминация на рынке труда снижает эффективность использования трудовых ресурсов."],"Дискриминация в выборе профессии":["Людей определённых групп не пускают в некоторые профессии.","Профессиональная сегрегация приводит к «перенаселённости» доступных профессий и снижению заработков в них.","Ограничение доступа женщин к части профессий исторически сужало их выбор.","Профессиональная сегрегация снижает доходы отдельных групп работников."],"Дискриминация в оплате труда":["Платят меньше за ту же работу из-за принадлежности к группе.","Дискриминация в оплате труда запрещена ст. 132 ТК РФ; измеряется необъяснённым разрывом в заработках.","Разрыв в зарплатах при одинаковых должности и квалификации может указывать на дискриминацию.","Необъясненная разница в оплате труда рассматривается как индикатор дискриминации."],"Дискриминация в сфере человеческого капитала":["Людям из некоторых групп труднее получить образование и навыки.","Ограничение доступа к образованию снижает будущую производительность и доходы, воспроизводя неравенство.","Низкое качество школ в бедных районах снижает шансы их выпускников.","Неравный доступ к образованию воспроизводит социально-экономическое неравенство."],"Дискриминация при найме на работу":["При найме предпочитают одни группы людей другим.","Приводит к более высокой безработице в дискриминируемых группах. Для осуждённых и бывших осуждённых — барьер ресоциализации.","Работодатели неохотно нанимают освободившихся из мест лишения свободы.","Барьеры трудоустройства лиц, освободившихся из мест лишения свободы, затрудняют их ресоциализацию."],"Дифференциация заработной платы":["Разница в зарплате между работниками, профессиями или регионами.","Объясняется квалификацией, условиями труда, спросом и предложением, регионом. В России значительна межрегиональная и межотраслевая дифференциация.","Средняя зарплата в добыче нефти в несколько раз выше, чем в обработке древесины.","Дифференциация заработной платы по видам экономической деятельности остается значительной."],"Дифференциация продукта":["Фирма делает свой товар непохожим на товары конкурентов.","Дифференциация (качество, дизайн, бренд, сервис) даёт фирме некоторую рыночную власть и снижает ценовую конкуренцию.","Производитель мебели из массива выделяется ручной работой и гарантией.","Дифференциация продукции позволяет производителю снизить зависимость от ценовой конкуренции."],"Дифференцированная олигополия":["Олигополия, где несколько фирм делают похожие, но разные товары.","Конкуренция идёт не только ценой, но и качеством, рекламой, брендом.","Рынок легковых автомобилей — дифференцированная олигополия.","Конкуренция на рынке дифференцированной олигополии ведется преимущественно неценовыми методами."],"Дифференцированный товар":["Товар, который покупатели считают отличающимся от аналогов.","Отличия могут быть реальными (качество) или восприятием (бренд). Даёт возможность назначать цену выше конкурентов.","Сертифицированная FSC древесина ценится выше обычной на ряде рынков.","Дифференцированная продукция обладает более низкой ценовой эластичностью спроса."],"Диффузия":["Распространение новшества, когда его начинают копировать многие.","Диффузия инноваций — этап после внедрения; определяет, как быстро технология меняет отрасль.","Харвестеры сначала купили крупные компании, затем их переняли средние лесозаготовители.","Скорость диффузии инноваций в лесозаготовке определяется доступностью финансирования."],"Добавленная стоимость":["Сколько стоимости фирма «добавила» к купленным материалам.","Добавленная стоимость = выручка − стоимость покупных материалов и услуг. Сумма добавленных стоимостей даёт ВВП; глубокая переработка древесины повышает добавленную стоимость.","Из кругляка на 5 тыс. руб. делают пиломатериалы на 12 тыс. — добавлено 7 тыс. руб.","Увеличение глубины переработки древесины обеспечивает рост добавленной стоимости в регионе."],"Добавочное пособие малоимущим":["Американская федеральная программа пособий малоимущим пожилым и инвалидам.","Пример адресной социальной поддержки. В России — социальные пенсии и региональные доплаты до прожиточного минимума.","Социальная доплата к пенсии до прожиточного минимума — российская аналогия.","Адресные социальные выплаты направлены на поддержку доходов малообеспеченных категорий граждан."],"Добровольные экспортные ограничения":["Страна «добровольно» ограничивает свой экспорт под давлением импортёра.","Форма скрытого протекционизма. ВТО ограничивает такие соглашения.","Экспортёр соглашается поставлять не более определённого объёма, чтобы избежать пошлин.","Добровольные экспортные ограничения являются инструментом неявного протекционизма."],"Долговременное конкурентное равновесие":["Долгосрочное состояние, когда фирмы на конкурентном рынке не получают сверхприбыли.","Цена = минимальные средние издержки: новые фирмы входят при прибыли, выходят при убытках.","При высокой прибыльности лесопиления в регионе появляются новые пилорамы, пока цена не снизится.","В долгосрочном периоде конкурентный рынок стремится к равновесию при нулевой экономической прибыли."],"Долговременный тренд":["Долгая тенденция изменения показателя за многие годы.","Тренд отделяют от сезонных и циклических колебаний; выявляется методами анализа временных рядов.","Производство бумаги в стране 20 лет растёт, несмотря на отдельные спады.","Выявлен долговременный тренд сокращения объемов заготовки древесины."],"Долгосрочный период":["Срок, достаточный, чтобы изменить все факторы производства, включая мощности.","В долгосрочном периоде все издержки переменные: можно строить заводы, входить и выходить из отрасли.","Строительство нового деревообрабатывающего комбината — решение долгосрочного периода.","В долгосрочном периоде организация может изменять масштаб производственных мощностей."],"Долгосрочная вертикальная кривая Филлипса":["В долгосрочной перспективе инфляция не снижает безработицу — кривая Филлипса вертикальна.","После адаптации ожиданий безработица возвращается к естественному уровню при любой инфляции.","Постоянно высокая инфляция не обеспечивает постоянно низкой безработицы.","В долгосрочном периоде связь между инфляцией и безработицей отсутствует."],"Долгосрочная фермерская проблема":["Сельское хозяйство сокращается относительно всей экономики, фермерам сложно.","Рост производительности при слабом росте спроса ведёт к оттоку ресурсов из аграрного сектора; обоснование аграрной политики.","Доля занятых в сельском хозяйстве России снижается десятилетиями.","Сокращение занятости в сельском хозяйстве обусловлено ростом производительности труда и низкой эластичностью спроса."],"Доминирующая стратегия":["Вариант действий, который лучше других при любых действиях соперников.","Понятие теории игр; если у игрока есть доминирующая стратегия, его поведение легко предсказать.","В «дилемме заключённого» признание — доминирующая стратегия каждого.","Наличие доминирующей стратегии упрощает прогнозирование поведения участников рынка."],"Домохозяйство":["Семья или человек, живущие вместе и ведущие общий бюджет.","Домохозяйства — основные потребители и поставщики труда. Росстат проводит выборочное обследование бюджетов домашних хозяйств.","Семья из трёх человек с общим бюджетом — одно домохозяйство.","Доходы и расходы домохозяйств оценены по данным выборочного обследования Росстата."],"Дополнительные выплаты":["Льготы от работодателя помимо зарплаты: страховка, питание, путёвки.","Социальный пакет повышает привлекательность работы. В УИС — форменное обмундирование, жильё, льготы по службе.","ДМС и компенсация проезда — дополнительные выплаты.","Социальный пакет выступает инструментом удержания квалифицированных кадров."],"Дополнительные платежи":["Платежи владельцам ресурсов сверх необходимого, чтобы их удержать.","Экономическая рента: доход сверх альтернативной стоимости. Может изыматься налогом без изменения предложения.","Доход владельца уникального лесного участка выше того, что нужно для его использования.","Рентный доход может изыматься без снижения предложения ресурса."],"Дополняющие ресурсы":["Ресурсы, которые работают вместе: больше одного — нужно больше другого.","Если ресурсы дополняют друг друга, удешевление одного увеличивает спрос на другой.","Покупка второго харвестера требует дополнительного оператора.","Взаимодополняемость труда и техники определяет потребность в квалифицированных операторах."],"Допущение «при прочих равных условиях»":["Считаем, что всё, кроме изучаемого фактора, не меняется.","Ceteris paribus — стандартное допущение экономического анализа; позволяет выделить влияние одного фактора.","При прочих равных рост цены снижает величину спроса.","При прочих равных условиях рост тарифов повышает себестоимость продукции."],"Достоверная угроза":["Угроза, в исполнение которой соперник верит, потому что её выгодно выполнить.","В теории игр только правдоподобные угрозы влияют на поведение. Используется при анализе входа на рынок.","Крупная фирма, способная быстро снизить цены, отпугивает новых конкурентов.","Правдоподобная угроза ценовой войны сдерживает вход новых участников на рынок."],"Дохийский раунд":["Раунд переговоров ВТО, начатый в 2001 г. и так и не завершённый.","Касался аграрных субсидий и доступа развивающихся стран к рынкам; показывает трудности многосторонней либерализации.","Разногласия по аграрным субсидиям заблокировали Дохийский раунд.","Незавершенность Дохийского раунда отражает кризис многосторонней торговой системы."],"Доход":["Деньги, которые получает человек или фирма за период.","Доход — поток (за период), в отличие от богатства (запаса). Росстат публикует реальные располагаемые денежные доходы населения.","Зарплата за месяц — доход, а накопленные сбережения — богатство.","Реальные располагаемые денежные доходы населения снизились на 2 % (данные условные)."],"Доход в виде процентов":["Доход от того, что вы дали деньги в долг: проценты.","Процентный доход — плата за использование капитала. Облагается налогом (НДФЛ по вкладам сверх необлагаемого порога).","Проценты по банковскому вкладу — процентный доход.","Процентный доход формирует часть доходов домохозяйств от собственности."],"Доход на душу населения":["Средний доход на одного жителя.","Используется для сравнения уровня жизни регионов и стран. Росстат публикует среднедушевые денежные доходы населения по субъектам.","Среднедушевой доход в Москве значительно выше среднего по России.","Среднедушевые денежные доходы населения региона ниже среднероссийского уровня."],"Доход собственника":["Доход владельцев небольших несамостоятельных фирм: ИП, фермеров.","Смешанный доход — часть ВВП по доходам, включающая оплату труда и прибыль самозанятого.","Прибыль индивидуального предпринимателя-столяра — доход собственника.","Смешанный доход индивидуальных предпринимателей учитывается в составе ВВП по источникам доходов."],"Доходный метод определения ВВП":["Расчёт ВВП как суммы всех доходов: зарплат, прибылей, налогов.","Один из трёх методов расчёта ВВП (распределительный). Росстат публикует ВВП по источникам доходов.","ВВП = оплата труда + валовая прибыль + чистые налоги на производство.","Структура ВВП по источникам доходов характеризует распределение созданной стоимости."],"Евро":["Общая валюта ряда стран Евросоюза.","Введён в 1999 г. (наличные — с 2002 г.); монетарную политику проводит ЕЦБ. Сейчас используется 20 странами.","Экспорт российской фанеры в ЕС до 2022 г. оплачивался преимущественно в евро.","Доля расчетов в евро во внешней торговле России существенно сократилась."],"Европейский союз":["Союз европейских государств с общим рынком.","ЕС — таможенный союз и единый рынок. До 2022 г. — крупнейший торговый партнёр России, в том числе по лесоматериалам.","После введения ограничений экспорт лесоматериалов из России в ЕС резко сократился.","Прекращение поставок на рынки Европейского союза обусловило переориентацию экспорта лесоматериалов."],"Единица учета":["Единица, в которой измеряют цены и сравнивают стоимость.","Функция денег как меры стоимости. В России единица учёта — рубль; бухгалтерский учёт ведётся в рублях (402-ФЗ).","Стоимость всех активов в балансе выражена в рублях.","Бухгалтерский учет ведется в валюте Российской Федерации."],"Единичная эластичность":["Изменение цены на 1 % меняет спрос ровно на 1 %.","При единичной эластичности выручка не меняется при изменении цены.","Цена снизилась на 10 %, продажи выросли на 10 % — выручка прежняя.","Спрос характеризуется единичной эластичностью: изменение цены не влияет на выручку."],"Естественная монополия":["Отрасль, где одной фирме выгоднее обслуживать весь рынок, чем нескольким.","Высокие постоянные издержки делают конкуренцию неэффективной. В России регулируется 147-ФЗ «О естественных монополиях»: транспортировка газа, электросети, железнодорожные перевозки.","Две параллельные электросети в одном городе экономически бессмысленны.","Деятельность субъектов естественных монополий подлежит государственному тарифному регулированию."],"Естественный уровень безработицы":["Уровень безработицы, который остаётся даже при нормальной работе экономики.","Включает фрикционную и структурную безработицу; ниже его безработицу нельзя удержать без ускорения инфляции.","Если естественный уровень 4,5 %, а фактический 3 %, рынок труда «перегрет».","Фактический уровень безработицы опустился ниже оценок естественного уровня."],"Жалованье":["Плата за работу.","Заработная плата — цена труда; в России регулируется ТК РФ (МРОТ, сроки выплаты). В статистике — среднемесячная номинальная начисленная заработная плата.","Оклад работника плюс премия — заработная плата.","Среднемесячная номинальная начисленная заработная плата в отрасли ниже среднерегиональной."],"Забастовка":["Работники коллективно прекращают работу, требуя улучшений.","Забастовка — способ разрешения коллективного трудового спора (ТК РФ, гл. 61). Для ряда служб, включая УИС, запрещена.","Работники предприятия прекращают работу, требуя индексации зарплаты.","Право на забастовку ограничено для сотрудников правоохранительных органов."],"Зависимая переменная":["Переменная, которая меняется из-за другой.","В регрессии — объясняемая переменная (Y). Независимые переменные (X) — факторы.","Выручка (Y) зависит от цены и объёма продаж (X).","В качестве зависимой переменной принят интегральный показатель экономической безопасности."],"Закон возрастающих альтернативных издержек":["Чем больше производишь одного товара, тем больше приходится жертвовать другим.","Ресурсы неоднородны, поэтому граница производственных возможностей выгнута. Альтернативные издержки растут.","Перевод всё новых участков под заготовку требует всё более дорогой логистики.","Закон возрастающих альтернативных издержек обусловливает выпуклую форму границы производственных возможностей."],"Закон Клейтона":["Американский антимонопольный закон 1914 г., дополнивший закон Шермана.","Запрещает ценовую дискриминацию, связывающие контракты, слияния, ограничивающие конкуренцию.","Российский аналог положений — нормы 135-ФЗ о контроле экономической концентрации.","Контроль экономической концентрации направлен на предотвращение монополизации рынков."],"Закон о гражданских правах 1964 г.":["Закон США, запрещающий дискриминацию, в том числе при найме.","Ключевой акт против дискриминации на рынке труда США.","Российский аналог — ст. 3 ТК РФ о запрете дискриминации в сфере труда.","Запрет дискриминации в сфере труда закреплен статьей 3 Трудового кодекса РФ."],"Закон о занятости 1946 г.":["Закон США 1946 г., обязавший государство поддерживать занятость и рост.","Закрепил ответственность правительства за макроэкономическую стабилизацию; создал Совет экономических консультантов.","В России цели занятости закреплены в законе «О занятости населения в РФ».","Государственная политика занятости направлена на обеспечение полной и продуктивной занятости населения."],"Закон о личной ответственности":["Закон США 1996 г., реформировавший социальную помощь и ограничивший сроки пособий.","Заменил безусловные пособия программами с требованием работы (workfare).","Российская параллель — социальный контракт с обязательствами получателя.","Переход к условной социальной помощи стимулирует трудовую активность получателей."],"Закон о помощи в профессиональной адаптации":["Закон США о помощи работникам, потерявшим работу из-за импорта.","Компенсирует издержки свободной торговли: переобучение, пособия.","Работникам закрывшегося из-за импорта завода оплачивается переобучение.","Программы переобучения высвобождаемых работников снижают социальные издержки структурных изменений."],"Закон о праве на труд":["Законы ряда штатов США: нельзя обязать работника вступать в профсоюз.","Ослабляют профсоюзы; в экономике труда изучается их влияние на зарплаты и занятость.","В таких штатах работник сам решает, платить ли профсоюзные взносы.","Законодательство о свободе профсоюзного членства влияет на переговорную силу работников."],"Закон о продуктах питания, сохранении ресурсов и энергии от 2008 г.":["Американский закон 2008 г. о поддержке фермеров, продовольствия и энергетики.","Определял субсидии, программы продовольственной помощи и поддержку биотоплива. Пример комплексного аграрного законодательства.","Российская параллель — Государственная программа развития сельского хозяйства и регулирования рынков сельхозпродукции.","Государственная аграрная политика реализуется посредством программно-целевого подхода."],"Закон о свободе фермерской деятельности":["Закон США 1996 г., отменивший жёсткие квоты и привязку субсидий к посевам.","Переход от регулирования производства к прямым выплатам фермерам.","Фермер сам решает, что сеять, а поддержка не зависит от выбранной культуры.","Отказ от производственных квот повысил гибкость аграрного производства."],"Закон о соглашениях о взаимной торговле 1934 г.":["Закон США 1934 г., разрешивший президенту снижать пошлины в обмен на встречные уступки.","Начало политики двусторонней либерализации торговли после провала протекционизма.","Страны снижают пошлины друг для друга по принципу взаимности.","Принцип взаимности лежит в основе двусторонних торговых соглашений."],"Закон о тарифах Смута":["Закон США 1930 г., резко повысивший ввозные пошлины.","Спровоцировал ответные меры других стран и углубил Великую депрессию; классический пример вреда протекционизма.","Ответные пошлины партнёров сократили американский экспорт.","Опыт закона Смута — Хоули иллюстрирует риски эскалации торговых войн."],"Закон о Федеральной комиссии по торговле":["Закон США 1914 г., создавший Федеральную торговую комиссию.","Комиссия борется с недобросовестной конкуренцией и монополизацией. Российский аналог функций — ФАС России.","ФТК может запретить вводящую в заблуждение рекламу.","Функции по контролю недобросовестной конкуренции в России возложены на ФАС России."],"Закон Оукена":["Рост безработицы на 1 п. п. связан с потерей примерно 2 % ВВП.","Эмпирическая закономерность А. Оукена о связи безработицы и разрыва выпуска. Коэффициент различается по странам.","Если безработица на 2 п. п. выше естественной, ВВП отстаёт от потенциала примерно на 4 %.","Оценка коэффициента Оукена позволяет определить потери выпуска от роста безработицы."],"Закон предложения":["Чем выше цена, тем больше товара готовы продать.","Закон предложения: при прочих равных величина предложения растёт с ценой, так как выпуск становится выгоднее.","При росте цены на пиломатериалы лесопилки увеличивают загрузку.","В соответствии с законом предложения рост цен стимулировал увеличение выпуска."],"Закон Селлера":["Закон США 1950 г., запретивший слияния через покупку активов, ограничивающие конкуренцию.","Закрыл лазейку в законе Клейтона; усилил контроль слияний.","Покупка всех активов конкурента также подлежит проверке.","Контроль сделок экономической концентрации распространяется на приобретение активов."],"Закон спроса":["Чем выше цена, тем меньше товара покупают.","Закон спроса: при прочих равных величина спроса убывает с ростом цены.","При подорожании пиломатериалов на 20 % строительные фирмы сокращают закупки.","Рост цен обусловил снижение величины спроса в соответствии с законом спроса."],"Закон Сэя":["Идея, что производство само создаёт спрос, поэтому кризисов перепроизводства не бывает.","Отвергнута Дж. М. Кейнсом: при недостатке совокупного спроса возможны спады и безработица.","Великая депрессия показала, что товары могут не находить покупателя.","Кейнсианская критика закона Сэя обосновала необходимость стимулирования совокупного спроса."],"Закон убывающей отдачи":["Если добавлять работников к одному станку, каждый следующий даёт всё меньше прибавки.","Закон убывающей отдачи действует в краткосрочном периоде при фиксированных факторах; объясняет рост предельных издержек.","Пятый рабочий у одной пилорамы добавляет меньше продукции, чем второй.","Действие закона убывающей отдачи ограничивает эффективность увеличения численности персонала при неизменной технической базе."],"Закон убывающей предельной полезности":["Каждая следующая единица товара радует меньше предыдущей.","Основа теории потребительского выбора и убывающей кривой спроса.","Первый стакан воды в жару ценен, пятый — почти нет.","Убывание предельной полезности объясняет отрицательный наклон кривой спроса."],"Закон Уилера":["Закон США 1938 г., запретивший обманную рекламу и недобросовестные действия.","Расширил полномочия ФТК на защиту потребителей. В России — 38-ФЗ «О рекламе».","Реклама «лучший в мире» без доказательств может быть признана недобросовестной.","Защита потребителей от недобросовестной рекламы обеспечивается законодательством о рекламе."],"Закон Шермана":["Первый антимонопольный закон США (1890 г.), запретивший картели и монополизацию.","Основа антитрестовского законодательства; нарушения — уголовные преступления.","Сговор о ценах между конкурентами — нарушение закона Шермана.","Запрет картельных соглашений является базовым принципом антимонопольного регулирования."],"Законное средство платежа":["Деньги, которые по закону обязаны принимать в оплату.","В России законное средство платежа — рубль, банкноты и монеты Банка России (ст. 75 Конституции, 86-ФЗ).","Магазин обязан принять оплату рублями.","Рубль является единственным законным средством платежа на территории Российской Федерации."],"Закрытая экономика":["Страна, которая не торгует с другими странами.","Модельная абстракция для упрощения анализа; реальные экономики открыты. Санкции частично «закрывают» экономику.","В учебной модели без экспорта и импорта ВВП = C + I + G.","Модель закрытой экономики используется для упрощения анализа внутренних макроэкономических связей."],"Запланированные инвестиции":["Сколько фирмы собираются инвестировать.","Запланированные инвестиции могут отличаться от фактических из-за непредвиденных изменений запасов.","Завод планировал купить оборудование, но из-за роста ставок отложил покупку.","Фактические инвестиции отклонились от запланированных вследствие роста стоимости заемных средств."],"Запретительное предписание":["Приказ прекратить незаконные действия.","Аналог в России — предписание ФАС о прекращении нарушения антимонопольного законодательства.","ФАС выдаёт предписание прекратить навязывание невыгодных условий договора.","Антимонопольный орган выдал предписание о прекращении нарушения."],"Заработная плата":["Цена труда за единицу времени.","Ставка заработной платы определяется спросом и предложением труда, институтами (МРОТ, коллективные договоры).","Часовая ставка 300 руб. — ставка заработной платы.","Ставка заработной платы формируется под влиянием регионального рынка труда."],"Заработок":["Сколько заработал работник: ставка, умноженная на отработанное время.","Заработок зависит от ставки и количества часов; в статистике — начисленная заработная плата.","300 руб. в час × 160 часов = 48 тыс. руб. за месяц.","Заработок осужденных определяется выполнением норм выработки и установленными расценками."],"Затратный метод определения ВВП":["Расчёт ВВП как суммы всех расходов: потребление, инвестиции, госзакупки, чистый экспорт.","Метод конечного использования; Росстат публикует ВВП по использованию.","ВВП = C + I + G + (экспорт − импорт).","Структура ВВП по использованию свидетельствует о росте доли государственного потребления."],"Затраты «на меню», или на переоценку":["Фирмам дорого часто менять цены: печатать ценники, переписывать прайсы.","Издержки меню объясняют жёсткость цен и то, почему спрос влияет на выпуск в краткосрочном периоде.","Производитель сохраняет прайс-лист на квартал, даже если спрос упал.","Издержки изменения цен обусловливают их краткосрочную жесткость."],"Защитная медицина":["Врачи назначают лишние обследования, чтобы защититься от исков.","Увеличивает расходы на здравоохранение без улучшения результатов; пример влияния правовой среды на экономику.","Дополнительное МРТ «на всякий случай» — защитная медицина.","Правовые риски обусловливают рост непроизводительных расходов в здравоохранении."],"Защитная пошлина":["Пошлина, чтобы защитить своих производителей от импорта.","Протекционистская мера: повышает цену импорта и поддерживает отечественных производителей, но удорожает товар для потребителей.","Пошлина на импортную мебель поддерживает отечественных мебельщиков.","Защитные пошлины выступают инструментом политики импортозамещения."],"Земельная реформа":["Перераспределение прав на землю для более эффективного использования.","Земельные реформы — основа аграрного развития. В России — реформа 1990-х и Земельный кодекс РФ 2001 г.","Приватизация земли колхозов в 1990-х — пример земельной реформы.","Земельная реформа 1990-х гг. изменила структуру собственности в аграрном секторе."],"Землеемкий товар":["Товар, для производства которого нужно много земли.","Страны с большими земельными ресурсами имеют сравнительное преимущество в таких товарах (теория Хекшера — Олина).","Лесоматериалы и зерно — землеёмкие товары, в которых Россия имеет преимущество.","Обеспеченность земельными и лесными ресурсами формирует сравнительные преимущества России."],"Земля":["Все природные ресурсы: земля, лес, вода, полезные ископаемые.","«Земля» как фактор производства включает все природные ресурсы; доход от неё — рента.","Лесной фонд региона — фактор производства «земля».","Природные ресурсы рассматриваются как фактор производства, формирующий рентный доход."],"Золотой стандарт":["Система, где деньги обменивались на золото по фиксированной цене.","Обеспечивала стабильность курсов, но ограничивала денежную политику. Окончательно отменена в 1971 г.","При золотом стандарте рубль 1897 г. был привязан к золоту.","Отказ от золотого стандарта расширил возможности денежно-кредитной политики."],"Игра с нулевой суммой":["Выигрыш одного — ровно проигрыш другого.","Игра с нулевой суммой: общий «пирог» не растёт. Многие рыночные сделки, напротив, выгодны обеим сторонам.","Спор о разделе фиксированной премии — игра с нулевой суммой.","Модель игры с нулевой суммой не отражает взаимовыгодного характера рыночного обмена."],"Игра с одновременно осуществляемыми ходами":["Игроки принимают решения одновременно, не зная выбора другого.","Моделируется матрицей выигрышей; решение — равновесие Нэша.","Два поставщика одновременно подают ценовые заявки на торги.","Поведение участников торгов описывается моделью игры с одновременными ходами."],"Игра с отрицательной суммой":["Все участники в сумме теряют.","Пример — ценовые и торговые войны, где проигрывают все стороны.","Взаимные пошлины двух стран сокращают торговлю обеих.","Эскалация торговых ограничений носит характер игры с отрицательной суммой."],"Игра с положительной суммой":["Все участники в сумме выигрывают.","Добровольный обмен и сотрудничество (например, ГЧП) создают дополнительную ценность.","Учреждение предоставляет площади, частный партнёр — технологии, выигрывают оба.","Государственно-частное партнерство рассматривается как игра с положительной суммой."],"Игра с последовательно осуществляемыми ходами":["Игроки ходят по очереди, видя действия друг друга.","Моделируется деревом игры; учитывает правдоподобность угроз.","Крупная фирма решает, снижать ли цены, после входа на рынок новичка.","Взаимодействие участников рынка описывается моделью игры с последовательными ходами."],"Избыточная производственная мощность":["Мощности, которые простаивают.","Избыточные мощности снижают эффективность и повышают удельные издержки. Для ЦТАО — следствие нехватки заказов.","Пилорама загружена на 40 % из-за недостатка заказов.","Низкий уровень загрузки производственных мощностей повышает удельные постоянные издержки."],"Избыточные резервы":["Резервы банка сверх обязательных.","Избыточные резервы банк может использовать для кредитования; их объём влияет на денежную массу.","Если обязательные резервы 10 млрд, а фактические 12 млрд, избыточные — 2 млрд.","Наличие избыточных резервов расширяет кредитный потенциал банков."],"Издержки добычи":["Затраты на добычу ресурса и подготовку его к продаже.","Для лесозаготовки — рубка, трелёвка, вывозка; зависят от удалённости и транспортной доступности участков.","Удалённые лесные участки без дорог имеют высокие издержки заготовки.","Высокие издержки заготовки в удаленных районах снижают экономическую доступность лесных ресурсов."],"Издержки использования":["Потеря будущей выгоды от того, что невозобновляемый ресурс добыт сейчас.","Учитывается при оптимизации темпов добычи: добытое сегодня нельзя продать завтра по более высокой цене.","Добывая нефть сейчас, компания жертвует возможной будущей выручкой.","Учет издержек использования обосновывает оптимальный темп освоения невозобновляемых ресурсов."],"Издержки на рабочую силу в единице продукции":["Затраты на оплату труда в расчёте на единицу продукции.","Показатель конкурентоспособности: растёт, если зарплаты опережают производительность.","Зарплата выросла на 15 %, производительность на 5 % — удельные затраты на труд выросли.","Опережающий рост оплаты труда над производительностью повышает удельные издержки на рабочую силу."],"Издержки перелива":["Издержки, которые несут посторонние люди, а не производитель и покупатель.","Отрицательная экстерналия: загрязнение, шум. Корректируется налогами, нормативами, платой за негативное воздействие.","Загрязнение реки стоками целлюлозного комбината — издержки перелива.","Отрицательные внешние эффекты производства компенсируются платой за негативное воздействие на окружающую среду."],"Излишек":["Товара предлагается больше, чем хотят купить.","Излишек возникает при цене выше равновесной; ведёт к накоплению запасов и снижению цен.","При минимальной цене выше рыночной на складах копится нераспроданная продукция.","Превышение предложения над спросом привело к росту товарных запасов."],"Излишек счета движения капиталов и финансов":["Чистый приток капитала в страну.","Положительное сальдо финансового счёта означает, что иностранцы вложили в страну больше, чем резиденты вывезли.","Приток прямых инвестиций превышает вывоз капитала.","Положительное сальдо финансового счета свидетельствует о чистом притоке капитала."],"Изменение запрашиваемого количества":["Изменение покупок из-за изменения цены самого товара.","Движение вдоль кривой спроса, в отличие от сдвига кривой.","Снижение цены на брус увеличило его продажи — изменение величины спроса.","Изменение величины спроса обусловлено изменением цены продукции."],"Измене
